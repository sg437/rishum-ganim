<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e7c86">
<title>מערכת רישום וקליטת תלמידות</title>
<style>
:root{
  --bg:#e9f1f1;--surface:#fff;--surface-2:#f3f9f8;--ink:#10242b;--ink-soft:#3d555c;
  --muted:#6a8087;--border:#d8e6e5;--accent:#0e7c86;--accent-strong:#0a5f68;--accent-soft:#d6eceb;
  --brass:#9c6f2c;--good:#2c7a52;--good-soft:#d7ecdf;--warn:#a15b12;--warn-soft:#f6e6d2;
  --bad:#a5342b;--bad-soft:#f5dcd9;
  --shadow:0 1px 2px rgba(16,36,43,.06),0 10px 30px rgba(16,36,43,.08);--radius:14px}
@media(prefers-color-scheme:dark){:root{--bg:#081317;--surface:#0f2129;--surface-2:#16303a;--ink:#e9f4f4;
  --ink-soft:#b2c8cc;--muted:#7d979d;--border:#22404a;--accent:#3bb2bd;--accent-strong:#5cc9d3;--accent-soft:#10333c;
  --brass:#cc9c56;--good:#54b888;--good-soft:#123527;--warn:#d9a25a;--warn-soft:#3a2c15;
  --bad:#e07b6f;--bad-soft:#3a1c18;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4)}}
:root[data-theme="light"]{--bg:#e9f1f1;--surface:#fff;--surface-2:#f3f9f8;--ink:#10242b;--ink-soft:#3d555c;--muted:#6a8087;--border:#d8e6e5;--accent:#0e7c86;--accent-strong:#0a5f68;--accent-soft:#d6eceb;--good:#2c7a52;--good-soft:#d7ecdf;--warn:#a15b12;--warn-soft:#f6e6d2;--bad:#a5342b;--bad-soft:#f5dcd9}
:root[data-theme="dark"]{--bg:#081317;--surface:#0f2129;--surface-2:#16303a;--ink:#e9f4f4;--ink-soft:#b2c8cc;--muted:#7d979d;--border:#22404a;--accent:#3bb2bd;--accent-strong:#5cc9d3;--accent-soft:#10333c;--good:#54b888;--good-soft:#123527;--warn:#d9a25a;--warn-soft:#3a2c15;--bad:#e07b6f;--bad-soft:#3a1c18}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;line-height:1.55;
  font-family:"Assistant","Heebo","Segoe UI","Arial Hebrew",system-ui,sans-serif;font-size:15px}
h1,h2,h3{margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;font-weight:700}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--border);
  border-radius:9px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
label{font-size:.82rem;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:4px}
a{color:var(--accent)}

/* header */
header.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);
  box-shadow:var(--shadow)}
.top-inner{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.12rem}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1.2rem}
.top-spacer{flex:1}
.year-pick{display:flex;align-items:center;gap:6px;background:var(--accent-soft);padding:5px 10px;border-radius:999px;font-weight:800;color:var(--accent-strong)}
.year-pick select{width:auto;background:transparent;border:0;font-weight:800;color:var(--accent-strong);padding:2px 4px}
.icon-btn{background:var(--surface-2);border:1px solid var(--border);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:1.05rem}

/* nav */
nav.tabs{max-width:1200px;margin:0 auto;padding:8px 16px 0;display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{background:transparent;color:var(--ink-soft);padding:9px 15px;border-radius:10px 10px 0 0;border:1px solid transparent;border-bottom:0;font-weight:700}
nav.tabs button.active{background:var(--surface);color:var(--accent-strong);border-color:var(--border);box-shadow:0 -2px 0 var(--accent) inset}
nav.tabs .count{background:var(--accent-soft);color:var(--accent-strong);border-radius:999px;padding:0 7px;font-size:.75rem;margin-inline-start:6px}

main{max-width:1200px;margin:0 auto;padding:18px 16px 80px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
.panel h2{font-size:1.15rem;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:.86rem;margin-bottom:14px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}

.btn{background:var(--accent);color:#fff;padding:9px 16px}
.btn:hover{background:var(--accent-strong)}
.btn.ghost{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent-strong)}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:#fff}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar .field{min-width:130px}
.toolbar .field.grow{flex:1;min-width:180px}
.toolbar .field label{margin-bottom:3px}

/* table */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:720px}
th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--surface-2);font-weight:800;color:var(--ink-soft);position:sticky;top:0}
tbody tr:hover{background:var(--surface-2)}
td.actions{white-space:nowrap}
.empty{padding:34px;text-align:center;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:800}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.dot-list{display:flex;gap:3px}
.doc-dot{width:16px;height:16px;border-radius:50%;font-size:10px;display:grid;place-items:center;font-weight:800}
.doc-dot.on{background:var(--good);color:#fff}
.doc-dot.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:linear-gradient(200deg,var(--surface-2),var(--surface));border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.stat .k{font-size:.78rem;color:var(--muted);font-weight:700}
.stat .v{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:.9rem;color:var(--muted);font-weight:700}
.stat.hero{background:radial-gradient(120% 140% at 88% -20%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 60%),linear-gradient(200deg,var(--surface-2),var(--surface))}

.bar{height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,18,22,.55);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:24px 14px;overflow:auto}
.overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);width:min(760px,100%);padding:20px 22px}
.modal h3{font-size:1.2rem;margin-bottom:14px}
.modal .foot{display:flex;gap:10px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
fieldset{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:0 0 12px}
legend{font-weight:800;color:var(--accent-strong);padding:0 6px;font-size:.9rem}
.check{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;cursor:pointer}
.check input{width:auto;margin:0}
.checks{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(max-width:640px){.checks{grid-template-columns:1fr}}
.hidden{display:none!important}
body.locked nav.tabs,body.locked .year-pick,body.locked #themeBtn,body.locked #lockBtn{display:none!important}
.login-card{max-width:420px;margin:6vh auto}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}
.note{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn);
  border-radius:10px;padding:9px 12px;font-size:.84rem;font-weight:600}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:12px;font-weight:700;box-shadow:var(--shadow);z-index:90;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(50%) translateY(-4px)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}

@media print{
  header.top,nav.tabs,.toolbar,.no-print{display:none!important}
  body{background:#fff}
  main{padding:0}
  .panel{box-shadow:none;border:0}
  th{position:static}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand"><span class="logo">🎒</span> מערכת רישום וקליטת תלמידות</div>
    <div class="top-spacer"></div>
    <div class="year-pick">שנה: <select id="yearSelect"></select></div>
    <button class="icon-btn" id="lockBtn" title="נעילה" style="display:none">🔒</button>
    <button class="icon-btn" id="themeBtn" title="מצב תצוגה">🌓</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="view"></main>

<!-- modal host -->
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ============================================================
   מערכת רישום וקליטת תלמידות — גרסה מתארחת (Firebase)
   נתונים בענן (Firestore) + התחברות (Firebase Auth) → סנכרון בין מכשירים.
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         doc, setDoc, deleteDoc, onSnapshot, collection }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ===== הגדרות Firebase — הדבק/י כאן את 6 המפתחות מהפרויקט שלך (ראה SETUP.md) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBRIWtqtPXxd-W0WR3nB-iGn0Qn9ml-Q8I",
  authDomain: "rishum-ganim-fad40.firebaseapp.com",
  projectId: "rishum-ganim-fad40",
  storageBucket: "rishum-ganim-fad40.firebasestorage.app",
  messagingSenderId: "695537337833",
  appId: "1:695537337833:web:8f1e46f6d6b4c8e5a37778"
};
const CONFIG_READY = !JSON.stringify(firebaseConfig).includes("YOUR_");

/* ===== מזהה Google לחיבור Drive (ראה SETUP.md — שלב Drive). אינו סוד — מיועד לקוד ציבורי ===== */
const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com";
const DRIVE_READY = !GOOGLE_CLIENT_ID.includes("YOUR_");
const PERIODS = ["א","ב","ג","סופי"]; // מועדי רישום
const EDU_TYPES = ["רגיל",'ח"מ']; // סוג חינוך: רגיל / חינוך מיוחד
const DEFAULT_YEARS = ['תשפ"ה','תשפ"ו','תשפ"ז','תשפ"ח'];

/* ---------- מודל נתונים ---------- */
function blankDB(){
  return {
    activeYear: 'תשפ"ז',
    years: DEFAULT_YEARS.slice(),
    students: [],       // ראה makeStudent
    gans: [],           // ראה makeGan
    management: [],      // {id, dept, name, role, phone}
    municipality: {},    // { [year]: [ '123456789', ... ] }  ת"ז מרשימת העירייה
    historical: {},      // { [year]: {periodA,periodB,periodC,final} } סיכומי שנים קודמות
    settings: { gansTarget: 29 } // יעד מספר גנים (ניתן לשינוי)
  };
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

let app=null, auth=null, db=null, currentUser=null;
let DB = blankDB();
let dataUnsub=null;
const knownStudentDocs = new Set(); // מזהי מסמכי students_<שנה> הקיימים בענן
function safeYearId(y){ return "students_"+String(y).replace(/[^0-9A-Za-z֐-׿]/g,"_"); }

/* שמירה לענן — דחייה קצרה לאיגוד שינויים, ושמירה על שינויים מקומיים שטרם נכתבו */
let _saveTimer=null, savePending=false, cloudDocs=new Map();
function save(){ if(!db) return; savePending=true; clearTimeout(_saveTimer); _saveTimer=setTimeout(runPush, 250); }
async function runPush(){
  try{ await pushAll(); }
  catch(e){ console.error(e); toast("שגיאת שמירה לענן — בדוק/י חיבור"); }
  finally{
    savePending=false;
    rebuildDB(cloudDocs); // הצג את המצב המעודכן (כולל שינויים מרחוק שהגיעו בזמן השמירה)
    if($("#overlay").classList.contains("show")) pendingRender=true; else route();
  }
}
async function pushAll(){
  if(!db) return;
  // לוכדים תמונת מצב לפני כל await — כדי שרענון-רקע לא ידרוס את מה שאנחנו כותבים
  const meta={ activeYear:DB.activeYear, years:DB.years.slice(), municipality:DB.municipality, historical:DB.historical, settings:DB.settings };
  const gans=DB.gans.slice(), management=DB.management.slice();
  const byYear={}; DB.students.forEach(s=>{ (byYear[s.year]=byYear[s.year]||[]).push(s); });
  await setDoc(doc(db,"app","meta"), meta);
  await setDoc(doc(db,"app","gans"), { gans });
  await setDoc(doc(db,"app","management"), { management });
  const wantIds=new Set();
  for(const y of Object.keys(byYear)){ const id=safeYearId(y); wantIds.add(id); knownStudentDocs.add(id); await setDoc(doc(db,"app",id), { year:y, students:byYear[y] }); }
  for(const id of [...knownStudentDocs]){ if(!wantIds.has(id)){ try{ await deleteDoc(doc(db,"app",id)); }catch(e){} knownStudentDocs.delete(id); } }
}
/* בנייה מחדש של DB מתוך מסמכי הענן */
function rebuildDB(docsMap){
  const meta=docsMap.get("meta")||{};
  DB.years = (meta.years&&meta.years.length)? meta.years : DEFAULT_YEARS.slice();
  DB.activeYear = meta.activeYear && DB.years.includes(meta.activeYear) ? meta.activeYear : DB.years[0];
  DB.municipality = meta.municipality||{};
  DB.historical = meta.historical||{};
  DB.settings = meta.settings||{ gansTarget:29 };
  DB.gans = (docsMap.get("gans")||{}).gans||[];
  DB.management = (docsMap.get("management")||{}).management||[];
  const studs=[];
  for(const [id,val] of docsMap){ if(id.startsWith("students_") && val && Array.isArray(val.students)) studs.push(...val.students); }
  DB.students = studs;
}

/* ---------- כלי עזר ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
function ganById(id){ return DB.gans.find(g=>g.id===id); }
function ganName(id){ const g=ganById(id); return g? (g.teacherName? g.teacherName : ("גן "+ (g.ganSymbol||g.internalSymbol||""))) : "—"; }
function studentsOfYear(y=DB.activeYear){ return DB.students.filter(s=>s.year===y); }
function digits(s){ return String(s||"").replace(/\D/g,""); }
function eduLabel(x){ return x && x.education ? x.education : "רגיל"; } // ברירת מחדל: חינוך רגיל
function eduBadge(x){ const e=eduLabel(x); return e==='ח"מ'?'<span class="pill warn">ח"מ</span>':'<span class="pill neutral">רגיל</span>'; }

/* ---------- תבניות רשומות ---------- */
function makeStudent(){ return {
  id:uid(), year:DB.activeYear, tz:"", firstName:"", lastName:"", dob:"",
  motherName:"", fatherName:"", phone:"", mobile:"", street:"", building:"", city:"",
  ganId:"", age:"", period:"א", education:"רגיל",
  registeredByUs:true, absorbedMunicipality:false, finished:false,
  docs:{ nispach:false, idCopy:false, takanon:false },
  special:{ divorced:false, approvalFather:false, approvalMother:false,
            outOfCity:false, paymentArrangement:false,
            retention:false, retentionDoc:false },
  driveFolder:"", driveFolderId:"", notes:"", createdAt:new Date().toISOString()
};}
function makeGan(){ return {
  id:uid(), internalSymbol:"", ganSymbol:"", teacherName:"", age:"", education:"רגיל",
  address:"", street:"", zone:"", phoneGan:"", phoneHome:"",
  teacherMobile:"", assistantName:"", assistantMobile:"",
  capacity:"", active:true, docsNote:"", createdAt:new Date().toISOString()
};}

/* ============================================================
   ניווט / טאבים
   ============================================================ */
const TABS = [
  {id:"students",  label:"תלמידות"},
  {id:"gans",      label:"גנים"},
  {id:"reports",   label:"דוחות ואחוזים"},
  {id:"municipality", label:"עירייה"},
  {id:"export",    label:"ייצוא"},
  {id:"management",label:"הנהלה"},
  {id:"settings",  label:"הגדרות"}
];
let active = "students";

function renderTabs(){
  const counts = { students: studentsOfYear().filter(s=>!s.finished).length, gans: DB.gans.filter(g=>g.active).length };
  $("#tabs").innerHTML = TABS.map(t=>{
    const c = counts[t.id]!=null ? `<span class="count">${counts[t.id]}</span>` : "";
    return `<button data-tab="${t.id}" class="${t.id===active?'active':''}">${t.label}${c}</button>`;
  }).join("");
}
function renderYearSelect(){
  $("#yearSelect").innerHTML = DB.years.map(y=>`<option ${y===DB.activeYear?'selected':''}>${esc(y)}</option>`).join("");
}

function route(){
  renderTabs(); renderYearSelect();
  const lb=$("#lockBtn"); if(lb) lb.style.display=currentUser?"grid":"none";
  const v = $("#view");
  ({students:viewStudents, gans:viewGans, reports:viewReports, municipality:viewMunicipality,
    export:viewExport, management:viewManagement, settings:viewSettings}[active]||viewStudents)(v);
}

/* ============================================================
   התחברות (Firebase Auth) + סנכרון נתונים (Firestore)
   ============================================================ */
let pendingRender=false;
function firebaseErrHe(code){
  const m={
    "auth/invalid-email":"כתובת אימייל לא תקינה",
    "auth/user-not-found":"משתמש לא נמצא",
    "auth/wrong-password":"סיסמה שגויה",
    "auth/invalid-credential":"אימייל או סיסמה שגויים",
    "auth/missing-password":"יש להזין סיסמה",
    "auth/too-many-requests":"יותר מדי ניסיונות — נסה/י שוב מאוחר יותר",
    "auth/network-request-failed":"בעיית רשת — בדוק/י חיבור לאינטרנט"
  };
  return m[code]||("שגיאה בהתחברות ("+code+")");
}
function startDataSync(){
  if(dataUnsub) return;
  document.body.classList.remove("locked");
  cloudDocs=new Map();
  dataUnsub = onSnapshot(collection(db,"app"), snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type==="removed"){ cloudDocs.delete(ch.doc.id); knownStudentDocs.delete(ch.doc.id); }
      else { cloudDocs.set(ch.doc.id, ch.doc.data()); if(ch.doc.id.startsWith("students_")) knownStudentDocs.add(ch.doc.id); }
    });
    if(savePending) return; // בזמן שמירה מקומית — אל תדרוס שינויים שטרם נכתבו
    rebuildDB(cloudDocs);
    if(!cloudDocs.has("meta")) save(); // איתחול ראשוני חד-פעמי (יצירת מסמך meta)
    if($("#overlay").classList.contains("show")){ pendingRender=true; }
    else route();
  }, err=>{ console.error(err); toast("שגיאת גישה לנתונים — ודא/י הרשאות (Firestore rules)"); });
}
function stopDataSync(){ if(dataUnsub){ dataUnsub(); dataUnsub=null; } knownStudentDocs.clear(); cloudDocs=new Map(); DB=blankDB(); }

function boot(){

  if(!CONFIG_READY){ renderSetupNeeded(); return; }
  try{
    app=initializeApp(firebaseConfig);
    auth=getAuth(app);
    try{ db=initializeFirestore(app,{ localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
    catch(e){ db=initializeFirestore(app,{}); }
  }catch(e){ console.error(e); renderSetupNeeded(String(e.message||e)); return; }

    currentUser=user;

/* ============================================================
   חיבור Google Drive — תיקייה לכל ילדה + העלאת מסמכים (scope מצומצם: drive.file)
   ============================================================ */
const DRIVE_SCOPE="https://www.googleapis.com/auth/drive.file";
let _gisReady=null, _tokenClient=null, _driveToken=null, _driveTokenExp=0;
function driveConnected(){ try{ return !!localStorage.getItem("rg-drive-on"); }catch(e){ return false; } }
function loadGIS(){
  if(_gisReady) return _gisReady;
  _gisReady=new Promise((res,rej)=>{
    if(window.google && google.accounts && google.accounts.oauth2) return res();
    const s=document.createElement("script"); s.src="https://accounts.google.com/gsi/client"; s.async=true; s.defer=true;
    s.onload=()=>res(); s.onerror=()=>rej(new Error("GIS load failed")); document.head.appendChild(s);
  });
  return _gisReady;
}
async function driveToken(interactive){
  if(!DRIVE_READY) throw new Error("drive-not-configured");
  if(_driveToken && Date.now()<_driveTokenExp-60000) return _driveToken;
  await loadGIS();
  if(!_tokenClient) _tokenClient=google.accounts.oauth2.initTokenClient({ client_id:GOOGLE_CLIENT_ID, scope:DRIVE_SCOPE, callback:()=>{} });
  return await new Promise((resolve,reject)=>{
    _tokenClient.callback=(resp)=>{ if(resp && resp.access_token){ _driveToken=resp.access_token; _driveTokenExp=Date.now()+((resp.expires_in||3600)*1000); try{ localStorage.setItem("rg-drive-on","1"); }catch(e){} resolve(_driveToken); } else reject(resp||new Error("no-token")); };
    try{ _tokenClient.requestAccessToken({ prompt: interactive?"consent":"" }); }catch(e){ reject(e); }
  });
}
function driveDisconnect(){ try{ if(_driveToken && window.google) google.accounts.oauth2.revoke(_driveToken,()=>{}); }catch(e){} _driveToken=null; _driveTokenExp=0; try{ localStorage.removeItem("rg-drive-on"); }catch(e){} }
async function driveFetch(url, opts={}, interactive=false){
  let token=await driveToken(interactive);
  let headers=Object.assign({}, opts.headers, { Authorization:"Bearer "+token });
  let r=await fetch(url, Object.assign({}, opts, {headers}));
  if(r.status===401){ _driveToken=null; token=await driveToken(true); headers=Object.assign({}, opts.headers, { Authorization:"Bearer "+token }); r=await fetch(url, Object.assign({}, opts, {headers})); }
  if(!r.ok) throw new Error("Drive "+r.status+": "+(await r.text()).slice(0,150));
  return r;
}
async function driveMkFolder(name, parentId){
  const meta={ name:String(name||"תיקייה"), mimeType:"application/vnd.google-apps.folder" }; if(parentId) meta.parents=[parentId];
  const r=await driveFetch("https://www.googleapis.com/drive/v3/files?fields=id,webViewLink",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(meta) });
  return r.json();
}
async function driveUploadFile(file, parentId){
  const meta={ name:file.name }; if(parentId) meta.parents=[parentId];
  const form=new FormData();
  form.append("metadata", new Blob([JSON.stringify(meta)],{type:"application/json"}));
  form.append("file", file);
  const r=await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink",{ method:"POST", body:form });
  return r.json();
}
async function driveListFolder(parentId){
  const q=encodeURIComponent("'"+parentId+"' in parents and trashed=false");
  const r=await driveFetch("https://www.googleapis.com/drive/v3/files?q="+q+"&fields=files(id,name,webViewLink,mimeType)&orderBy=folder,name");
  return (await r.json()).files||[];
}
async function driveEnsureRoot(){
  DB.settings.drive=DB.settings.drive||{};
  if(DB.settings.drive.rootId) return DB.settings.drive.rootId;
  const f=await driveMkFolder("מערכת רישום — מסמכי תלמידות", null);
  DB.settings.drive.rootId=f.id; DB.settings.drive.rootLink=f.webViewLink; DB.settings.drive.years=DB.settings.drive.years||{}; save();
  return f.id;
}
async function driveEnsureYear(year){
  const root=await driveEnsureRoot();
  DB.settings.drive.years=DB.settings.drive.years||{};
  if(DB.settings.drive.years[year]) return DB.settings.drive.years[year];
  const f=await driveMkFolder(String(year), root);
  DB.settings.drive.years[year]=f.id; save();
  return f.id;
}
async function driveEnsureChildFolder(student){
  if(student.driveFolderId) return student.driveFolderId;
  const yf=await driveEnsureYear(student.year);
  const name=([student.lastName,student.firstName].filter(Boolean).join(" ")+(student.tz?(" · "+student.tz):"")) || ("ילדה "+student.id);
  const f=await driveMkFolder(name, yf);
  student.driveFolderId=f.id; student.driveFolder=f.webViewLink;
  const i=DB.students.findIndex(x=>x.id===student.id); if(i>=0){ DB.students[i].driveFolderId=f.id; DB.students[i].driveFolder=f.webViewLink; }
  save();
  return f.id;
}
function driveErrHe(e){
  const m=String((e&&e.message)||e||"");
  if(m.includes("drive-not-configured")) return "חיבור הדרייב לא הוגדר (ראה SETUP.md)";
  if(m.includes("access_denied")||m.includes("interaction")||m.includes("popup")||m.includes("no-token")) return "החיבור לדרייב בוטל או נדחה";
  if(m.includes("Drive 40")) return "שגיאת הרשאה בדרייב — התחבר/י מחדש עם אותו חשבון Google";
  return "שגיאת דרייב — נסה/י שוב, או חבר/י מחדש בהגדרות";
}
function renderDriveBox(){
  const box=$("#drive-box"); if(!box) return;
  if(!DRIVE_READY){ box.innerHTML=`<div class="note">חיבור הדרייב עדיין לא הוגדר. יש להשלים את שלב ה-Google Drive ב-SETUP.md (הפעלת Drive API ומזהה OAuth) ולהזין מזהה.</div>`; return; }
  const on=driveConnected(); const d=DB.settings.drive||{};
  box.innerHTML=`

  $("#drive-connect").onclick=async ()=>{ try{ await driveToken(true); toast("חובר ל-Google Drive"); renderDriveBox(); }catch(e){ toast(driveErrHe(e)); } };
  const dc=$("#drive-disc"); if(dc) dc.onclick=()=>{ driveDisconnect(); toast("נותק מ-Drive"); renderDriveBox(); };

function filteredStudents(){
  const f=stuFilter, q=f.q.trim();
  return studentsOfYear().filter(s=>{
    if(!f.showFinished && s.finished) return false;
    if(q){ const hay=(s.firstName+" "+s.lastName+" "+s.tz).toLowerCase(); if(!hay.includes(q.toLowerCase())) return false; }
    if(f.gan && s.ganId!==f.gan) return false;
    if(f.age && String(s.age)!==String(f.age)) return false;
    if(f.city && s.city!==f.city) return false;
    if(f.period && s.period!==f.period) return false;
    if(f.edu && eduLabel(s)!==f.edu) return false;
    if(f.muni==='yes' && !s.absorbedMunicipality) return false;
    if(f.muni==='no' && s.absorbedMunicipality) return false;
    return true;
  }).sort((a,b)=>(a.lastName||"").localeCompare(b.lastName||"","he")|| (a.firstName||"").localeCompare(b.firstName||"","he"));
}

function docDots(s){
  const d=s.docs;
  const mk=(on,t)=>`<span class="doc-dot ${on?'on':'off'}" title="${t}">${on?'✓':'·'}</span>`;
  return `<span class="dot-list">${mk(d.nispach,'נספח')}${mk(d.idCopy,'צילום ת"ז')}${mk(d.takanon,'תקנון')}</span>`;
}
function specialBadges(s){
  const b=[]; const sp=s.special;
  if(sp.divorced) b.push('<span class="pill warn">גרושים</span>');
  if(sp.outOfCity) b.push('<span class="pill warn">ילדת חוץ</span>');
  if(sp.retention) b.push('<span class="pill warn">השארות</span>');
  return b.join(" ");
}

/* ============================================================
   ייבוא מרוכז של תלמידות מקובץ (CSV / הדבקה מאקסל)
   ============================================================ */
/* עמודות שהמערכת יודעת לזהות בקובץ (כותרות בעברית, ללא תלות ברווחים/מרכאות) */
const IMPORT_HEADER_MAP = {
  "שםמשפחה":"lastName","משפחה":"lastName",
  "שםפרטי":"firstName","פרטי":"firstName","שם":"firstName","שםהילד":"firstName","שםהילדה":"firstName","שםהתלמידה":"firstName",
  "תז":"tz","תעודתזהות":"tz","מספרזהות":"tz","זהות":"tz","מסזהות":"tz",
  "תאריךלידה":"dob","תלידה":"dob","תאריך":"dob","לידה":"dob",
  "שםהאם":"motherName","אם":"motherName","אמא":"motherName","שםאם":"motherName","שםהאמא":"motherName","שםאמא":"motherName",
  "שםהאב":"fatherName","אב":"fatherName","אבא":"fatherName","שםאב":"fatherName","שםהאבא":"fatherName","שםאבא":"fatherName",
  "טלפון":"phone","טלפוןבית":"phone","טל":"phone","טלפוןבבית":"phone",
  "נייד":"mobile","טלפוןנייד":"mobile","סלולרי":"mobile","פלאפון":"mobile","נייד2":"mobile",
  "רחוב":"street","כתובת":"street",
  "בניין":"building","מספרבית":"building","בית":"building","מסבית":"building","מספרבניין":"building",
  "עיר":"city","יישוב":"city","ישוב":"city",
  "גן":"gan","שםהגן":"gan","גננת":"gan","שםגננת":"gan","שיבוץ":"gan","גןמשובצת":"gan",
  "גיל":"age",
  "מועד":"period","מועדרישום":"period",
  "חינוך":"education","סוגחינוך":"education",
  "הערות":"notes","הערה":"notes",
  "קלוטבעירייה":"absorbed","קלוט":"absorbed",
  "נרשמהעלידינו":"regByUs","נרשמה":"regByUs"
};
function normHeader(h){ return String(h||"").replace(/["'.׳״]/g,"").replace(/\s+/g,"").trim(); }
function truthyCell(v){ return /^(כן|yes|true|1|✓|v|קלוט|נרשמה|כ)$/i.test(String(v??"").trim()); }
function normEduVal(v){ const t=String(v??"").replace(/\s/g,""); if(!t) return "רגיל"; return /(מיוחד|חינוךמיוחד|ח"?מ|חמ|special)/i.test(t)?'ח"מ':"רגיל"; }
function normPeriodVal(v){ const t=String(v??"").trim(); return PERIODS.includes(t)?t:"א"; }
function normDateVal(v){
  const t=String(v??"").trim(); if(!t) return "";
  let m=t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if(m){ let d=m[1],mo=m[2],y=m[3]; if(y.length===2)y="20"+y; return `${y.padStart(4,"0")}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`; }
  m=t.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/);
  if(m){ return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`; }
  return t;
}
/* פענוח CSV/הדבקה — תומך בפסיקים או טאבים, מרכאות, ותאים רב-שורתיים */
function parseTable(text){
  text=String(text||"").replace(/^﻿/,"");
  const firstLine=text.split(/\r?\n/)[0]||"";
  const delim=(firstLine.split("\t").length > firstLine.split(",").length) ? "\t" : ",";
  const rows=[]; let row=[], cur="", inq=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(inq){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inq=false; } else cur+=ch; }
    else { if(ch==='"' && cur===""){ inq=true; } /* מרכאה נחשבת ציטוט רק בתחילת תא */
      else if(ch===delim){ row.push(cur); cur=""; }
      else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(ch==='\r'){ /* מטופל ע"י \n */ }
      else cur+=ch; }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
/* התאמת שם/סמל גן מהקובץ לגן קיים במערכת */
function matchGanText(text){
  const t=String(text||"").trim(); if(!t) return "";
  const nz=x=>String(x||"").trim();
  const g = DB.gans.find(g=>nz(g.teacherName)===t)
        || DB.gans.find(g=>nz(g.ganSymbol)===t)
        || DB.gans.find(g=>nz(g.internalSymbol)===t)
        || DB.gans.find(g=>nz(g.teacherName) && (t.includes(nz(g.teacherName)) || nz(g.teacherName).includes(t)));
  return g? g.id : "";
}
/* בניית רשומות מהטבלה שנקראה */
function buildImportRows(rows, opts){
  if(!rows.length) return { list:[], mapped:[] };
  const header=rows[0].map(normHeader);
  const idx={}; header.forEach((h,i)=>{ const k=IMPORT_HEADER_MAP[h]; if(k && idx[k]==null) idx[k]=i; });
  const mapped=Object.keys(idx); // אילו שדות זוהו
  const existing=new Set(studentsOfYear().map(s=>digits(s.tz)).filter(Boolean));
  const seen=new Set();
  const list=[];
  for(let r=1;r<rows.length;r++){
    const cells=rows[r];
    const g=key=> idx[key]!=null ? String(cells[idx[key]]??"").trim() : "";
    const st=makeStudent();
    st.lastName=g("lastName"); st.firstName=g("firstName"); st.tz=digits(g("tz"));
    st.dob=normDateVal(g("dob")); st.motherName=g("motherName"); st.fatherName=g("fatherName");
    st.phone=g("phone"); st.mobile=g("mobile");
    st.street=g("street"); st.building=g("building"); st.city=g("city");
    st.age=g("age").replace(/[^\d]/g,""); st.period=normPeriodVal(g("period")); st.education=normEduVal(g("education"));
    st.notes=g("notes");
    const ganText=g("gan"); st.ganId=matchGanText(ganText);
    st.absorbedMunicipality = idx.absorbed!=null ? truthyCell(g("absorbed")) : !!opts.absorbed;
    st.registeredByUs        = idx.regByUs!=null ? truthyCell(g("regByUs"))  : !!opts.reg;
    if(!st.firstName && !st.lastName && !st.tz) continue; // שורה ריקה
    const dup = st.tz && (existing.has(st.tz) || seen.has(st.tz));
    if(st.tz) seen.add(st.tz);
    list.push({ st, ganText, ganMatched:!!st.ganId, dup });
  }
  return { list, mapped };
}
function importTemplateCSV(){
  const headers=["שם משפחה","שם פרטי",'ת"ז',"תאריך לידה","שם האם","שם האב","טלפון","נייד","רחוב","בניין","עיר","גן","גיל","מועד","חינוך","קלוט בעירייה","הערות"];
  const example=["ישראלי","שרה","123456789","2021-09-01","רבקה","יעקב","03-1234567","050-1234567","הרב קוק","12","ירושלים","הגננת מרים","3","א","רגיל","כן",""];
  const csv=[headers.join(","), example.map(csvCell).join(",")].join("\r\n");
  downloadBlob(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}), `תבנית-ייבוא-תלמידות.csv`);
}

        <div class="stat"><div class="k">שורות בקובץ</div><div class="v">${state.list.length}</div></div>
        <div class="stat"><div class="k">גן לא זוהה</div><div class="v">${ganMiss.length}</div></div>
      </div>

      ${ganMiss.length?`<div class="note" style="margin-bottom:8px">גנים מהקובץ שלא הותאמו לגן קיים (התיק ייפתח ללא שיבוץ): ${[...new Set(ganMiss.map(x=>x.ganText))].slice(0,12).map(esc).join(", ")}</div>`:""}
      <div class="table-wrap"><table><thead><tr>
        <th>שם משפחה</th><th>שם פרטי</th><th>ת"ז</th><th>טלפון</th><th>עיר</th><th>גן</th><th>גיל</th><th>מועד</th><th>חינוך</th><th>קלוט</th><th>סטטוס</th></tr></thead><tbody>
        ${show.map(x=>`<tr style="${x.dup&&skipdup?'opacity:.5':''}">
          <td>${esc(x.st.lastName)||'—'}</td><td>${esc(x.st.firstName)||'—'}</td><td>${esc(x.st.tz)||'—'}</td>
          <td>${esc(x.st.mobile||x.st.phone)||'—'}</td><td>${esc(x.st.city)||'—'}</td>
          <td>${x.st.ganId?esc(ganName(x.st.ganId)):(x.ganText?('<span class="pill warn">'+esc(x.ganText)+' ⚠</span>'):'—')}</td>
          <td>${esc(x.st.age)||'—'}</td><td><span class="pill neutral">${esc(x.st.period)}</span></td><td>${eduBadge(x.st)}</td>
          <td>${x.st.absorbedMunicipality?'<span class="pill ok">קלוט</span>':'<span class="pill no">לא</span>'}</td>
          <td>${x.dup?'<span class="pill warn">כפול</span>':'<span class="pill ok">חדש</span>'}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="hint">${state.list.length>25?`מוצגות 25 מתוך ${state.list.length} שורות. `:''}לחצ/י "ייבא תלמידות" לפתיחת התיקים.</div>`;
    $("#imp-do").disabled = newCnt===0;
  };

  $("#imp-do").onclick=()=>{
    const skipdup=opts().skipdup;
    const toAdd=state.list.filter(x=>!(skipdup&&x.dup)).map(x=>x.st);
    if(!toAdd.length){ toast("אין תלמידות חדשות לייבוא"); return; }
    toAdd.forEach(st=>DB.students.push(st));
    save(); closeModal(); route(); toast(`יובאו ${toAdd.length} תלמידות לשנת ${DB.activeYear}`);
  };
}

    </div>

  </fieldset>
  <fieldset><legend>מסמכים והפעלה</legend>

                 .sort((a,b)=>b.n-a.n);

    </div>
    <div class="hint">"סופי" = רישום שסומן כמועד הסופי. עד פתיחת השנה סופרים לפי א׳/ב׳/ג׳.</div>

  <div class="panel">
    <h2>התפלגות לפי גן · אחוז מכלל הרישום</h2>

      ${perGan.map(x=>{const pct=total?x.n/total*100:0;return `<tr>

        <td><div class="bar"><i style="width:${x.n/maxGan*100}%"></i></div></td></tr>`;}).join("")}

    <h2>בחירה לפי אזורים</h2>

  <div class="panel">

function renderZonePick(host, list){
  const zones=[...new Set(DB.gans.filter(g=>g.active&&g.zone).map(g=>g.zone))].sort((a,b)=>a.localeCompare(b,"he"));
  if(!zones.length){ host.innerHTML=`<div class="note">כדי להשתמש באזורים — מלא/י שדה "אזור בעיר" בכרטיס הגן.</div>`; return; }
  host.innerHTML=`<div class="checks" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">
    ${zones.map(z=>`<label class="check"><input type="checkbox" class="zone-cb" value="${esc(z)}"> ${esc(z)}</label>`).join("")}
  </div><div id="zoneResult" style="margin-top:12px"></div>`;
  const recalc=()=>{
    const sel=[...host.querySelectorAll(".zone-cb:checked")].map(c=>c.value);
    const res=$("#zoneResult");
    if(!sel.length){ res.innerHTML=`<div class="hint">בחר/י אזור אחד או יותר.</div>`; return; }
    const gansIn=DB.gans.filter(g=>g.active&&sel.includes(g.zone));
    const ids=new Set(gansIn.map(g=>g.id));
    const n=list.filter(s=>ids.has(s.ganId)).length;
    res.innerHTML=`<div class="stats"><div class="stat hero"><div class="k">תלמידות באזורים שנבחרו (${sel.map(esc).join(", ")})</div><div class="v">${n}<small> · ${gansIn.length} גנים</small></div></div></div>`;
  };
  host.querySelectorAll(".zone-cb").forEach(c=>c.onchange=recalc); recalc();
}

function renderProjection(host){
  const prevYears=DB.years.filter(y=>y!==DB.activeYear);
  const curA = studentsOfYear().filter(s=>s.period==='א' && !s.finished).length;
  host.innerHTML=`
    <div class="row">
      <div class="field" style="min-width:180px"><label>שנת בסיס להשוואה</label>
        <select id="pj-year">${prevYears.map(y=>`<option>${esc(y)}</option>`).join("")||'<option value="">— אין —</option>'}</select></div>
      <div class="field" style="min-width:150px"><label>מועד א׳ (שנה קודמת)</label><input id="pj-prevA" inputmode="numeric" placeholder="מספר"></div>
      <div class="field" style="min-width:150px"><label>סופי (שנה קודמת)</label><input id="pj-prevFinal" inputmode="numeric" placeholder="מספר"></div>
      <div class="field" style="min-width:150px"><label>מועד א׳ (השנה)</label><input id="pj-curA" value="${curA}"></div>
    </div>
    <div class="hint">אם יש נתונים היסטוריים שמורים (טאב הגדרות) — הם ימולאו אוטומטית לפי בחירת השנה.</div>
    <div id="pj-out" style="margin-top:12px"></div>`;
  const fill=()=>{ const y=$("#pj-year").value; const h=DB.historical[y];
    if(h){ if(h.periodA!=null)$("#pj-prevA").value=h.periodA; if(h.final!=null)$("#pj-prevFinal").value=h.final; } calc(); };
  const calc=()=>{
    const pa=+$("#pj-prevA").value, pf=+$("#pj-prevFinal").value, ca=+$("#pj-curA").value;
    const out=$("#pj-out");
    if(!(pa>0)||!(pf>0)||!(ca>=0)){ out.innerHTML=`<div class="hint">מלא/י את שלושת המספרים לקבלת תחזית.</div>`; return; }
    const ratio=pf/pa, proj=Math.round(ca*ratio), growth=Math.round((ratio-1)*100);
    out.innerHTML=`<div class="stats">
      <div class="stat"><div class="k">יחס גדילה (שנה קודמת)</div><div class="v">×${ratio.toFixed(2)}<small> (${growth>=0?'+':''}${growth}%)</small></div></div>
      <div class="stat hero"><div class="k">תחזית סופי להשנה</div><div class="v">${proj}<small> תלמידות (הערכה)</small></div></div>
      <div class="stat"><div class="k">מבוסס על מועד א׳ נוכחי</div><div class="v">${ca}</div></div>
    </div><div class="hint">תחזית בהשערה בלבד, לפי מגמת השנה שנבחרה.</div>`;
  };
  $("#pj-year").onchange=fill; ["pj-prevA","pj-prevFinal","pj-curA"].forEach(id=>$("#"+id).oninput=calc); fill();
}

function viewMunicipality(root){
  const stored = DB.municipality[DB.activeYear]||[];
  root.innerHTML=`
  <div class="panel">
    <h2>רשימת העירייה · שנת ${esc(DB.activeYear)}</h2>
    <div class="sub">הדבק/י או העלה/י את רשימת תעודות הזהות שקיבלת מהעירייה. המערכת תבצע התאמה (VLOOKUP) לפי ת"ז ותסמן כל תלמידה כ"קלוט בעירייה".</div>
    <div class="grid g2">
      <div>
        <label>הדבקת ת"ז (שורה לכל אחת, או מופרד בפסיקים)</label>
        <textarea id="muni-text" rows="8" placeholder="123456789&#10;987654321&#10;…">${stored.join("\n")}</textarea>
        <div class="row" style="margin-top:8px">
          <button class="btn" id="muni-run">🔗 בצע התאמה וסמן</button>
          <label class="btn ghost sm" style="display:inline-flex;align-items:center;gap:6px">📄 טעינת קובץ CSV<input type="file" id="muni-file" accept=".csv,.txt" hidden></label>
        </div>
      </div>
      <div id="muni-result"><div class="hint">התוצאה תופיע כאן לאחר ההתאמה.</div></div>
    </div>
  </div>`;
  $("#muni-file").onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ const nums=(r.result.match(/\d{5,}/g)||[]); $("#muni-text").value=[...new Set(nums)].join("\n"); toast(nums.length+" מספרים נטענו מהקובץ"); }; r.readAsText(f,"utf-8"); };
  $("#muni-run").onclick=()=>{
    const nums=[...new Set(($("#muni-text").value.match(/\d{5,}/g)||[]))];
    DB.municipality[DB.activeYear]=nums;
    const set=new Set(nums);
    let matched=0, already=0;
    const rows=studentsOfYear();
    rows.forEach(s=>{ if(s.tz && set.has(digits(s.tz))){ if(!s.absorbedMunicipality)matched++; else already++; s.absorbedMunicipality=true; } });
    save();
    const inSystem=new Set(rows.map(s=>digits(s.tz)).filter(Boolean));
    const notFound=nums.filter(n=>!inSystem.has(n));
    $("#muni-result").innerHTML=`
      <div class="stats">
        <div class="stat hero"><div class="k">סומנו כקלוטות עכשיו</div><div class="v">${matched}</div></div>
        <div class="stat"><div class="k">כבר היו מסומנות</div><div class="v">${already}</div></div>
        <div class="stat"><div class="k">ברשימת העירייה</div><div class="v">${nums.length}</div></div>
        <div class="stat"><div class="k">בעירייה ולא במערכת</div><div class="v">${notFound.length}</div></div>
      </div>
      ${notFound.length?`<div class="note" style="margin-top:10px">${notFound.length} ת"ז מופיעות ברשימת העירייה אך אינן במערכת (ייתכן שטרם נרשמו אצלנו):<br>${notFound.slice(0,40).map(esc).join(", ")}${notFound.length>40?' …':''}</div>`:''}`;
    toast("ההתאמה בוצעה");
  };
}

const EXPORT_FIELDS = [
  ["lastName","שם משפחה",s=>s.lastName],
  ["firstName","שם פרטי",s=>s.firstName],
  ["tz",'ת"ז',s=>s.tz],
  ["dob","תאריך לידה",s=>s.dob],
  ["motherName","שם האם",s=>s.motherName],
  ["fatherName","שם האב",s=>s.fatherName],
  ["phone","טלפון",s=>s.phone],
  ["mobile","נייד",s=>s.mobile],
  ["street","רחוב",s=>s.street],
  ["building","בניין",s=>s.building],
  ["city","עיר",s=>s.city],
  ["gan","גן",s=>ganName(s.ganId)],
  ["age","גיל",s=>s.age],
  ["period","מועד",s=>s.period],
  ["education","חינוך",s=>eduLabel(s)],
  ["nispach","נספח",s=>s.docs.nispach?"✓":""],
  ["idCopy",'צילום ת"ז',s=>s.docs.idCopy?"✓":""],
  ["takanon","תקנון",s=>s.docs.takanon?"✓":""],
  ["registeredByUs","נרשמה על ידינו",s=>s.registeredByUs?"כן":"לא"],
  ["absorbedMunicipality","קלוט בעירייה",s=>s.absorbedMunicipality?"כן":"לא"],
  ["divorced","גרושים",s=>s.special.divorced?"✓":""],
  ["outOfCity","ילדת חוץ",s=>s.special.outOfCity?"✓":""],
  ["retention","השארות",s=>s.special.retention?"✓":""],
  ["notes","הערות",s=>s.notes]
];
const EXPORT_DEFAULT = ["lastName","firstName","tz","dob","motherName","fatherName","street","building","city","gan","age","period","education","nispach","idCopy","takanon","registeredByUs","absorbedMunicipality","divorced","outOfCity","retention"];
let exportSel = null; // Set של מפתחות שנבחרו — נשמר בין רינדורים

function viewExport(root){
  if(!exportSel) exportSel = new Set(EXPORT_DEFAULT);
  const gans=DB.gans.slice().sort((a,b)=>(a.teacherName||"").localeCompare(b.teacherName||"","he"));
  root.innerHTML=`
  <div class="panel">
    <h2>ייצוא רשימות</h2>
    <div class="sub">בחר/י סינון, בחר/י אילו שדות לכלול, וייצא/י לאקסל (CSV שנפתח באקסל עם עברית תקינה) או ל-PDF (הדפסה → שמירה כ-PDF).</div>
    <div class="toolbar">
      <div class="field"><label>גן</label><select id="x-gan"><option value="">כל הגנים</option>${gans.map(g=>`<option value="${g.id}">${esc(ganName(g.id))}</option>`).join("")}</select></div>
      <div class="field"><label>גיל</label><select id="x-age"><option value="">הכל</option>${[2,3,4,5,6].map(a=>`<option>${a}</option>`).join("")}</select></div>
      <div class="field"><label>מועד</label><select id="x-period"><option value="">הכל</option>${PERIODS.map(p=>`<option>${p}</option>`).join("")}</select></div>
      <div class="field"><label>חינוך</label><select id="x-edu"><option value="">הכל</option>${EDU_TYPES.map(t=>`<option>${esc(t)}</option>`).join("")}</select></div>
      <div class="field"><label>קלוט בעירייה</label><select id="x-muni"><option value="">הכל</option><option value="yes">רק קלוטות</option><option value="no">רק לא קלוטות</option></select></div>
      <div class="field"><label>כולל שסיימו</label><select id="x-fin"><option value="no">לא</option><option value="yes">כן</option></select></div>
    </div>
    <fieldset><legend>שדות לייצוא</legend>
      <div class="row" style="margin-bottom:8px">
        <button class="btn ghost sm" id="x-all" type="button">סמן הכל</button>
        <button class="btn ghost sm" id="x-none" type="button">נקה הכל</button>
        <button class="btn ghost sm" id="x-def" type="button">ברירת מחדל</button>
      </div>
      <div class="checks" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
        ${EXPORT_FIELDS.map(f=>`<label class="check"><input type="checkbox" class="x-col" value="${f[0]}" ${exportSel.has(f[0])?'checked':''}> ${esc(f[1])}</label>`).join("")}
      </div>
    </fieldset>
    <div class="row">
      <button class="btn" id="x-preview">🔎 תצוגה מקדימה</button>
      <button class="btn ghost" id="x-csv">⬇️ ייצוא לאקסל (CSV)</button>
      <button class="btn ghost" id="x-pdf">🖨️ ייצוא ל-PDF / הדפסה</button>
    </div>
    <div id="x-out" style="margin-top:14px"></div>
  </div>`;
  const gather=()=>{
    const gv=$("#x-gan").value, av=$("#x-age").value, pv=$("#x-period").value, ev=$("#x-edu").value, mv=$("#x-muni").value, fv=$("#x-fin").value;
    return studentsOfYear().filter(s=>{
      if(fv!=='yes' && s.finished) return false;
      if(gv && s.ganId!==gv) return false;
      if(av && String(s.age)!==av) return false;
      if(pv && s.period!==pv) return false;
      if(ev && eduLabel(s)!==ev) return false;
      if(mv==='yes' && !s.absorbedMunicipality) return false;
      if(mv==='no' && s.absorbedMunicipality) return false;
      return true;
    }).sort((a,b)=>(a.lastName||"").localeCompare(b.lastName||"","he"));
  };
  const cols=()=> EXPORT_FIELDS.filter(f=>exportSel.has(f[0]));
  const preview=()=>{
    const rows=gather(); const C=cols();
    const out=$("#x-out");
    if(!C.length){ out.innerHTML=`<div class="note">בחר/י לפחות שדה אחד לייצוא.</div>`; return rows; }
    if(!rows.length){ out.innerHTML=`<div class="empty">אין תלמידות התואמות לסינון.</div>`; return rows; }
    out.innerHTML=`<div class="table-wrap"><table><thead><tr>${C.map(c=>`<th>${esc(c[1])}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(s=>`<tr>${C.map(c=>`<td>${esc(c[2](s)??"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="hint">${rows.length} שורות · ${C.length} עמודות.</div>`;
    return rows;
  };
  const rerenderCols=()=>{ root.querySelectorAll(".x-col").forEach(cb=>cb.checked=exportSel.has(cb.value)); preview(); };
  root.querySelectorAll(".x-col").forEach(cb=> cb.onchange=()=>{ if(cb.checked)exportSel.add(cb.value); else exportSel.delete(cb.value); preview(); });
  $("#x-all").onclick=()=>{ exportSel=new Set(EXPORT_FIELDS.map(f=>f[0])); rerenderCols(); };
  $("#x-none").onclick=()=>{ exportSel=new Set(); rerenderCols(); };
  $("#x-def").onclick=()=>{ exportSel=new Set(EXPORT_DEFAULT); rerenderCols(); };
  $("#x-preview").onclick=preview;
  $("#x-csv").onclick=()=>{
    const rows=gather(); const C=cols();
    if(!C.length){ toast("בחר/י לפחות שדה אחד"); return; }
    if(!rows.length){ toast("אין נתונים לייצוא"); return; }
    const csv=[C.map(c=>c[1]).join(",")].concat(rows.map(s=>C.map(c=>csvCell(c[2](s))).join(","))).join("\r\n");
    const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
    downloadBlob(blob, `תלמידות_${DB.activeYear}.csv`); toast("קובץ אקסל נוצר");
  };
  $("#x-pdf").onclick=()=>{ const rows=preview(); if(!rows.length){ toast("אין נתונים"); return; } setTimeout(()=>window.print(),120); };
  preview();
}
function csvCell(v){ v=String(v??""); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function downloadBlob(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }

/* ============================================================
   טאב הנהלה
   ============================================================ */
function viewManagement(root){
  root.innerHTML=`
  <div class="panel">
    <div class="section-title">
      <div><h2>טלפוני ההנהלה הראשית</h2><div class="sub">אנשי קשר לפי אגפים. ניתן לעדכן בהמשך.</div></div>
      <button class="btn" id="addM">➕ הוספת איש קשר</button>
    </div>
    <div id="mTable"></div>
  </div>`;
  $("#addM").onclick=()=>openMgmt({id:uid(),dept:"",name:"",role:"",phone:""});
  renderMgmt();
}
function renderMgmt(){
  const host=$("#mTable");
  if(!DB.management.length){ host.innerHTML=`<div class="empty">אין אנשי קשר עדיין.</div>`; return; }
  const byDept={}; DB.management.forEach(m=>{(byDept[m.dept||"כללי"]=byDept[m.dept||"כללי"]||[]).push(m);});
  host.innerHTML=Object.keys(byDept).sort((a,b)=>a.localeCompare(b,"he")).map(d=>`
    <h3 style="margin:14px 0 8px;color:var(--accent-strong)">${esc(d)}</h3>
    <div class="table-wrap"><table><thead><tr><th>שם</th><th>תפקיד</th><th>טלפון</th><th></th></tr></thead><tbody>
      ${byDept[d].map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.role)||'—'}</td>
        <td>${m.phone?`<a href="tel:${esc(m.phone)}">${esc(m.phone)}</a>`:'—'}</td>
        <td class="actions"><button class="btn ghost sm" data-em="${m.id}">עריכה</button></td></tr>`).join("")}
    </tbody></table></div>`).join("");
  host.querySelectorAll("[data-em]").forEach(b=>b.onclick=()=>openMgmt(JSON.parse(JSON.stringify(DB.management.find(x=>x.id===b.dataset.em)))));
}
function openMgmt(m){
  const isNew=!DB.management.some(x=>x.id===m.id);
  modal(`<h3>${isNew?'איש קשר חדש':'עריכת איש קשר'}</h3>
    <div class="grid g2">
      <div><label>אגף / מחלקה</label><input id="m-dept" value="${esc(m.dept)}" placeholder="לדוגמה: רישום, כספים, פיקוח"></div>
      <div><label>שם</label><input id="m-name" value="${esc(m.name)}"></div>
      <div><label>תפקיד</label><input id="m-role" value="${esc(m.role)}"></div>
      <div><label>טלפון</label><input id="m-phone" value="${esc(m.phone)}" inputmode="tel"></div>
    </div>
    <div class="foot"><button class="btn" id="saveM">💾 שמירה</button><button class="btn ghost" id="cancelM">ביטול</button>
      ${!isNew?'<button class="btn danger" id="delM" style="margin-inline-start:auto">מחיקה</button>':''}</div>`);
  $("#saveM").onclick=()=>{ const val=id=>$("#"+id).value.trim();
    const data={id:m.id,dept:val("m-dept"),name:val("m-name"),role:val("m-role"),phone:val("m-phone")};
    if(!data.name){ toast("יש להזין שם"); return; }
    const i=DB.management.findIndex(x=>x.id===m.id); if(i>=0)DB.management[i]=data; else DB.management.push(data);
    save(); closeModal(); route(); toast("נשמר"); };
  $("#cancelM").onclick=closeModal;
  if(!isNew)$("#delM").onclick=()=>{ if(confirm("למחוק?")){ DB.management=DB.management.filter(x=>x.id!==m.id); save(); closeModal(); route(); } };
}

/* ============================================================
   טאב הגדרות — שנים, מעבר גיל, נתונים היסטוריים, מספר גנים, גיבוי
   ============================================================ */
function viewSettings(root){
  root.innerHTML=`
  <div class="panel">
    <h2>שנים</h2>
    <div class="sub">כל שנה מנוהלת בנפרד (תשפ"ז, תשפ"ח, וכו'). הבחירה בראש המסך קובעת על איזו שנה עובדים.</div>
    <div id="years-box"></div>
    <div class="row" style="margin-top:10px">
      <div class="field" style="min-width:160px"><label>הוספת שנה</label><input id="new-year" placeholder='לדוגמה: תשפ"ט'></div>
      <button class="btn" id="addYear" style="align-self:end">הוסף שנה</button>
    </div>
  </div>

  <div class="panel">
    <h2>מעבר שנה — קידום גיל</h2>
    <div class="sub">בתחילת שנה חדשה: מעתיקים את התלמידות משנה קודמת, מקדמים גיל (3→4), ומאפסים מסמכים — כך שכל המסמכים עולים מחדש. אפשר לבחור מאיזו שנה ולאיזו.</div>
    <div class="row">
      <div class="field" style="min-width:150px"><label>משנה</label><select id="pr-from">${DB.years.map(y=>`<option>${esc(y)}</option>`).join("")}</select></div>
      <div class="field" style="min-width:150px"><label>לשנה</label><select id="pr-to">${DB.years.map(y=>`<option ${y===DB.activeYear?'selected':''}>${esc(y)}</option>`).join("")}</select></div>
      <label class="check" style="align-self:end"><input type="checkbox" id="pr-age" checked> קדם גיל ב-1</label>
      <label class="check" style="align-self:end"><input type="checkbox" id="pr-skip5" checked> אל תעביר גיל 5 (מסיימות) — פרט לילדות השארות</label>
      <button class="btn" id="doPromote" style="align-self:end">בצע קידום</button>
    </div>
    <div class="note" style="margin-top:8px">התלמידות המקודמות ייכנסו לשנת היעד עם מסמכים לא מסומנים (עולים מחדש). ילדות בגיל 5 (מסיימות) לא יועברו — למעט ילדות המסומנות "השארות", שיועברו ללא קידום גיל. ניתן אח"כ רק לבחור שנה ולבדוק אם בוצע רישום.</div>
  </div>

  <div class="panel">
    <h2>נתונים היסטוריים (שנים קודמות)</h2>
    <div class="sub">הזנת הסיכומים הסופיים של שנים קודמות — לפני שהתוכנה עבדה. משמשים למחשבון האחוזים. משנת ההפעלה ואילך הכל מסונכרן אוטומטית.</div>
    <div id="hist-box"></div>
  </div>

  <div class="panel">
    <h2>יעד מספר גנים</h2>
    <div class="sub">משמש לחישוב הממוצע לגן בדשבורד. לדוגמה מתלבטים להוריד מ-29 ל-28.</div>
    <div class="row">
      <div class="field" style="min-width:150px"><label>מספר גנים ליעד</label><input id="gt" inputmode="numeric" value="${esc(DB.settings.gansTarget)}"></div>
      <button class="btn" id="saveGT" style="align-self:end">שמור</button>
      <div class="hint" style="align-self:end">גנים פעילים כרגע במערכת: ${DB.gans.filter(g=>g.active).length}</div>
    </div>
  </div>

  <div class="panel">
    <h2>חשבון והתחברות</h2>
    <div class="sub">המערכת מאובטחת בכניסה עם אימייל וסיסמה (Firebase). הנתונים נשמרים בענן ומסונכרנים בין כל המכשירים.</div>
    <div id="auth-box"></div>
  </div>

  <div class="panel">
    <h2>חיבור Google Drive</h2>
    <div class="sub">חיבור (פר-מכשיר) המאפשר יצירת תיקייה אוטומטית לכל ילדה והעלאת מסמכים ישירות מהתיק אל הדרייב.</div>
    <div id="drive-box"></div>
  </div>

  <div class="panel">
    <h2>גיבוי ושחזור</h2>
    <div class="sub">הנתונים נשמרים בענן ומסונכרנים אוטומטית. אפשר לייצא גיבוי JSON, ולשחזר קובץ גיבוי — כולל גיבוי מהגרסה הישנה בטלפון (כך מעבירים את הנתונים שהוזנו שם אל הענן).</div>
    <div class="row">
      <button class="btn ghost" id="exportAll">⬇️ ייצוא גיבוי (JSON)</button>
      <label class="btn ghost" style="display:inline-flex;align-items:center;gap:6px">⬆️ שחזור מגיבוי<input type="file" id="importAll" accept=".json" hidden></label>
    </div>
  </div>`;

  renderAuthBox();
  renderDriveBox();

  // years
  const yb=$("#years-box");
  yb.innerHTML=`<div class="row" style="gap:8px">${DB.years.map(y=>`<span class="pill ${y===DB.activeYear?'ok':'neutral'}" style="padding:6px 12px">${esc(y)} ${DB.years.length>1?`<button class="btn ghost sm" data-dely="${esc(y)}" style="padding:0 6px;margin-inline-start:6px">✕</button>`:''}</span>`).join("")}</div>`;
  yb.querySelectorAll("[data-dely]").forEach(b=>b.onclick=()=>{ const y=b.dataset.dely;
    if(studentsOfYear(y).length && !confirm(`בשנת ${y} יש תלמידות. למחוק את השנה ואת התלמידות שבה?`)) return;
    DB.years=DB.years.filter(x=>x!==y); DB.students=DB.students.filter(s=>s.year!==y);
    if(DB.activeYear===y)DB.activeYear=DB.years[0]; save(); route(); });
  $("#addYear").onclick=()=>{ const y=$("#new-year").value.trim(); if(!y)return; if(DB.years.includes(y)){toast("שנה קיימת");return;} DB.years.push(y); save(); route(); toast("נוספה שנה"); };

  $("#doPromote").onclick=()=>{
    const from=$("#pr-from").value, to=$("#pr-to").value, bump=$("#pr-age").checked, skip5=$("#pr-skip5").checked;
    if(from===to){ toast("בחר/י שנת מקור ושנת יעד שונות"); return; }
    const src=DB.students.filter(s=>s.year===from);
    if(!src.length){ toast("אין תלמידות בשנת המקור"); return; }
    const existing=new Set(DB.students.filter(s=>s.year===to).map(s=>digits(s.tz)).filter(Boolean));
    let added=0, skipped5=0;
    src.forEach(s=>{ if(s.tz && existing.has(digits(s.tz))) return; // כבר קיימת ביעד
      const isRetention = !!(s.special && s.special.retention);
      // אל תעביר ילדות בגיל 5 (מסיימות), למעט המסומנות בהשארות
      if(skip5 && String(s.age)==='5' && !isRetention){ skipped5++; return; }
      const n=JSON.parse(JSON.stringify(s));
      n.id=uid(); n.year=to; n.finished=false; n.period="א"; n.absorbedMunicipality=false;
      // ילדת השארות נשארת באותו גיל (חוזרת על השנה); אחרת מקדמים גיל ב-1
      if(bump && s.age && !isRetention) n.age=String(+s.age+1);
      n.docs={nispach:false,idCopy:false,takanon:false};
      n.special.approvalFather=n.special.approvalMother=n.special.paymentArrangement=n.special.retentionDoc=false;
      n.driveFolder=""; n.createdAt=new Date().toISOString();
      DB.students.push(n); added++; });
    save(); route(); toast(`קודמו ${added} תלמידות לשנת ${to}${skipped5?` · דולגו ${skipped5} בגיל 5`:''}`);
  };

  // historical
  const hb=$("#hist-box");
  const histFinal=h=>(+h.periodA||0)+(+h.periodB||0)+(+h.periodC||0); // סופי = סכום א׳+ב׳+ג׳
  const drawHist=()=>{
    hb.innerHTML=`<div class="table-wrap"><table><thead><tr><th>שנה</th><th>מועד א׳</th><th>מועד ב׳</th><th>מועד ג׳</th><th>סופי (סיכום)</th><th></th></tr></thead><tbody>
      ${DB.years.map(y=>{const h=DB.historical[y]||{};return `<tr>
        <td><b>${esc(y)}</b></td>
        <td><input class="hist-p" data-h="${esc(y)}|periodA" value="${esc(h.periodA??"")}" inputmode="numeric" style="width:80px"></td>
        <td><input class="hist-p" data-h="${esc(y)}|periodB" value="${esc(h.periodB??"")}" inputmode="numeric" style="width:80px"></td>
        <td><input class="hist-p" data-h="${esc(y)}|periodC" value="${esc(h.periodC??"")}" inputmode="numeric" style="width:80px"></td>
        <td><input data-final value="${histFinal(h)||""}" style="width:80px;font-weight:800;background:var(--surface)" readonly title="סכום מועדים א׳+ב׳+ג׳ (מחושב אוטומטית)"></td>
        <td class="actions"><button class="btn ghost sm" data-livey="${esc(y)}">מלא מנתוני המערכת</button></td></tr>`;}).join("")}
    </tbody></table></div><div class="hint">עמודת "סופי" מחושבת אוטומטית כסכום מועדים א׳+ב׳+ג׳. ערכים ריקים לא נשמרים. "מלא מנתוני המערכת" ממלא לפי הרישום בפועל של אותה שנה.</div>`;
    hb.querySelectorAll("input.hist-p").forEach(inp=> inp.oninput=inp.onchange=()=>{
      const [y,k]=inp.dataset.h.split("|"); DB.historical[y]=DB.historical[y]||{};
      const v=inp.value.trim(); if(v==="") delete DB.historical[y][k]; else DB.historical[y][k]=+v;
      const h=DB.historical[y]; const f=histFinal(h);
      const cell=inp.closest("tr").querySelector("[data-final]"); if(cell) cell.value=f||"";
      if(f>0) h.final=f; else delete h.final; save(); });
    hb.querySelectorAll("[data-livey]").forEach(b=>b.onclick=()=>{ const y=b.dataset.livey;
      const ys=DB.students.filter(s=>s.year===y);
      const pa=ys.filter(s=>s.period==='א').length, pb=ys.filter(s=>s.period==='ב').length, pc=ys.filter(s=>s.period==='ג').length;
      DB.historical[y]={ periodA:pa, periodB:pb, periodC:pc, final:pa+pb+pc };
      save(); drawHist(); toast("מולא מנתוני המערכת"); });
  };
  drawHist();

  $("#saveGT").onclick=()=>{ const v=+$("#gt").value; if(v>0){DB.settings.gansTarget=v;save();toast("נשמר");} };

  $("#exportAll").onclick=()=>{ downloadBlob(new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}), `גיבוי-רישום-${new Date().toISOString().slice(0,10)}.json`); };
  $("#importAll").onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.students){throw 0;} if(confirm("שחזור יחליף את כל הנתונים הקיימים. להמשיך?")){ DB=Object.assign(blankDB(),d); save(); route(); toast("שוחזר בהצלחה"); } }catch(_){ toast("קובץ לא תקין"); } };
    r.readAsText(f,"utf-8"); };
}

/* ============================================================
   מודל / כללי
   ============================================================ */
function modal(html){ $("#modal").innerHTML=html; $("#overlay").classList.add("show"); document.body.style.overflow="hidden"; }
function closeModal(){ $("#overlay").classList.remove("show"); document.body.style.overflow=""; if(pendingRender){ pendingRender=false; route(); } }
$("#overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

$("#tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b){ active=b.dataset.tab; route(); window.scrollTo(0,0); } });
$("#yearSelect").addEventListener("change",e=>{ DB.activeYear=e.target.value; save(); route(); });

/* theme */
(function(){ const KEY="rg-theme"; const saved=localStorage.getItem(KEY); if(saved)document.documentElement.dataset.theme=saved;
  $("#themeBtn").onclick=()=>{ const cur=document.documentElement.dataset.theme|| (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
    const next=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=next; localStorage.setItem(KEY,next); }; })();

boot();
</script>
</body>
