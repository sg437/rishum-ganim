  <div class="panel">
    <h2>מינימום לפתיחת צהרון</h2>
    <div class="sub">מספר התלמידות המינימלי בקבוצה כדי לפתוח צהרון. בלשונית "שיבוץ" → "צהרונים" כל גן שמתחת למספר הזה יסומן באדום, ומעליו בירוק.</div>
    <div class="row">
      <div class="field" style="min-width:150px"><label>מינימום לצהרון</label><input id="tzmin" inputmode="numeric" value="${esc(DB.settings.tzaharonMin||"")}" placeholder="למשל 15" ${dis}></div>
      <button class="btn" id="saveTzMin" style="align-self:end" ${dis}>שמור</button>
    </div>
  </div>

  <div class="panel">
    <h2>גילי הילדים (רשימת תלמידים)</h2>
    <div class="sub">הגילים שמופיעים לבחירה בתיק תלמידה ובסינון רשימת התלמידים. אפשר להוסיף, לערוך (שינוי הטקסט בשדה ויציאה) או למחוק.${admin?'':' עריכה למנהלי מערכת בלבד.'}</div>
    <div id="ages-box"></div>
    ${admin?`<div class="row" style="margin-top:10px">
      <div class="field" style="min-width:140px"><label>הוספת גיל</label><input id="new-age" placeholder="למשל 7"></div>
      <button class="btn" id="addAge" style="align-self:end">הוסף</button>
      <button class="btn ghost" id="resetAges" style="align-self:end">איפוס לברירת מחדל</button>
    </div>`:""}
  </div>

  <div class="panel">
    <h2>תפקידי צוות</h2>
    <div class="sub">התפקידים שמופיעים לבחירה בכרטיס איש/אשת צוות, בסינון הצוות ובייבוא. לכל תפקיד אפשר לקבוע <b>שיוך חינוך</b> (רגיל / מיוחד / שניהם) — ובשיבוץ יוצגו רק תפקידים המתאימים לחינוך הגן — וכן <b>צבע</b> ייחודי. אפשר להוסיף, לערוך או למחוק.${admin?'':' עריכה למנהלי מערכת בלבד.'}</div>
    <div id="roles-box"></div>
    ${admin?`<div class="row" style="margin-top:10px">
      <div class="field grow"><label>הוספת תפקיד</label><input id="new-role" placeholder="למשל: מטפלת"></div>
      <button class="btn" id="addRole" style="align-self:end">הוסף</button>
      <button class="btn ghost" id="resetRoles" style="align-self:end">איפוס לברירת מחדל</button>
    </div>`:""}
  </div>

  <div class="panel">
    <h2>קמפוסים</h2>
    <div class="sub">רשימת הקמפוסים לבחירה בכרטיס הגן. הקמפוס של כל תלמידה נקבע <b>אוטומטית לפי הגן שלה</b> — כך שלא יופיעו ערכים שלא הוגדרו. כאן מגדירים, עורכים או מוחקים קמפוסים.${admin?'':' עריכה למנהלי מערכת בלבד.'}</div>
    <div id="campus-box"></div>
    ${admin?`<div class="row" style="margin-top:10px">
      <div class="field grow"><label>הוספת קמפוס</label><input id="new-campus" placeholder="למשל: קמפוס מרכז"></div>
      <button class="btn" id="addCampus" style="align-self:end">הוסף</button>
      <button class="btn ghost" id="syncCampus" style="align-self:end" title="עדכון הקמפוס אצל כל התלמידות לפי הגן שלהן — מנקה ערכים ישנים">🔄 עדכן אצל התלמידות לפי הגן</button>
    </div>`:""}
  </div>

  <div class="panel">
    <h2>מנהלי מערכת</h2>
    <div class="sub">רק כתובות אימייל שברשימה זו יכולות לשנות את הגדרות המערכת (מיתוג, שנים, מעבר שנה, נתונים היסטוריים, יעד גנים, גילי ילדים ותפקידי צוות). אם הרשימה ריקה — כל משתמש מחובר יכול (עד שמוסיפים מנהל ראשון).</div>
    <div id="admins-box"></div>
    ${admin?`<div class="row" style="margin-top:10px">
      <div class="field grow"><label>הוספת מנהל (אימייל)</label><input id="new-admin" type="email" inputmode="email" placeholder="name@example.com"></div>
      <button class="btn" id="addAdmin" style="align-self:end">הוסף מנהל</button>
    </div>`:""}
  </div>

  ${admin?`<div class="panel">
    <h2>💡 פניות והצעות שיפור</h2>
    <div class="sub">הודעות שנשלחו דרך "יצירת קשר / הצעה" בתפריט. אפשר להגדיר כתובת מייל שאליה ייפתחו הפניות.</div>
    <div class="row" style="margin-top:8px;max-width:460px">
      <div class="field grow"><label>כתובת מייל לפניות</label><input id="contact-email" type="email" inputmode="email" value="${esc((DB.settings&&DB.settings.contactEmail)||"")}" placeholder="ברירת מחדל: המנהל הראשון"></div>
      <button class="btn ghost" id="contact-email-save" style="align-self:end">שמירה</button>
    </div>
    <div id="feedback-box" style="margin-top:12px"></div>
  </div>`:""}

  <div class="panel">
    <h2>חשבון והתחברות</h2>
    <div class="sub">המערכת מאובטחת בכניסה עם חשבון Google מורשה בלבד (Firebase). הנתונים נשמרים בענן ומסונכרנים בין כל המכשירים.</div>
    <div id="auth-box"></div>
  </div>

  ${admin?`<div class="panel">
    <h2>ניהול משתמשים</h2>
    <div class="sub">הכניסה למערכת היא עם חשבון <b>Google בלבד</b>. כאן מאשרים כתובות Google שיוכלו להיכנס, קובעים <b>שם</b> לכל משתמש, ומגדירים <b>מה מותר לו/ה לערוך</b>: חינוך רגיל, חינוך מיוחד, או צפייה בלבד. רק כתובת שמופיעה ברשימה כאן (או מנהל מערכת) תוכל להיכנס.</div>
    <div class="row" style="margin-top:10px">
      <div class="field" style="min-width:150px"><label>שם (לא חובה)</label><input id="nu-name" autocomplete="off" placeholder="שם מלא"></div>
      <div class="field grow" style="min-width:220px"><label>אימייל Google של המשתמש</label><input id="nu-email" type="email" inputmode="email" autocomplete="off" placeholder="name@gmail.com"></div>
      <button class="btn" id="nu-add" style="align-self:end">➕ אשר משתמש</button>
    </div>
    <div id="nu-msg" class="note" style="display:none;margin-top:10px"></div>
    <div id="users-box" style="margin-top:14px"></div>
  </div>`:""}
  `;

  renderAuthBox();
  renderInstallBox();

  // ניהול משתמשים (למנהל בלבד) — אישור כתובות Google מורשות (allowedEmails)
  if(admin){
    const usersBox=$("#users-box");
    const nuMsg=$("#nu-msg");
    const showNuMsg=(text, ok)=>{ if(!nuMsg)return; nuMsg.style.display="block"; nuMsg.textContent=text;
      nuMsg.style.background = ok? "var(--good-soft)":"var(--bad-soft)";
      nuMsg.style.color = ok? "var(--good)":"var(--bad)";
      nuMsg.style.borderColor = ok? "var(--good)":"var(--bad)"; };
    const fmtWhen=v=>{ if(!v)return "—"; const d=new Date(v); return isNaN(d)? "—" : d.toLocaleDateString("he-IL"); };
    const meEmail=(currentUser&&currentUser.email||"").toLowerCase();
    const isEmail=s=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
    const renderUsers=()=>{
      const s=DB.settings||{};
      const adminSet=new Set((s.admins||[]).map(x=>String(x).toLowerCase()));
      const allowedSet=new Set((s.allowedEmails||[]).map(x=>String(x).toLowerCase()));
      const activity=s.userActivity||{};
      const names=s.userNames||{};
      const scopes=s.editScopes||{};
      const all=new Set([...adminSet, ...allowedSet, ...Object.keys(activity).map(e=>String(e).toLowerCase())]);
      const rows=[...all].sort();
      if(!rows.length){ usersBox.innerHTML=`<div class="hint">עדיין אין משתמשים מורשים. הוסף/י כתובת Google למעלה.</div>`; return; }
      const badge=em=> adminSet.has(em) ? '<span class="pill ok">מנהל</span>'
                     : allowedSet.has(em) ? '<span class="pill neutral">מורשה</span>'
                     : '<span class="pill neutral" title="נכנס/ה בעבר וטרם אושר/ה במפורש ברשימה">ערך/ה בעבר</span>';
      const scopeCell=(em,isAdm)=>{
        if(isAdm) return '<span class="hint">עריכה מלאה</span>';
        const cur=(scopes[em]==='ח"מ'||scopes[em]==='רגיל'||scopes[em]==='צופה')?scopes[em]:"";
        const opt=(v,l)=>`<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(l)}</option>`;
        return `<select class="nu-scope" data-em="${esc(em)}" style="min-width:170px">${
          opt("","עריכה מלאה (רגיל + מיוחד)")+opt("רגיל","רק חינוך רגיל")+opt('ח"מ',"רק חינוך מיוחד")+opt("צופה","צופה בלבד (ללא עריכה)")
        }</select>`;
      };
      usersBox.innerHTML=`<div class="table-wrap"><table style="min-width:760px"><thead><tr>
        <th>אימייל</th><th>שם</th><th>סטטוס</th><th>הרשאת עריכה</th><th>עריכה אחרונה</th><th style="text-align:end">פעולות</th></tr></thead><tbody>${
        rows.map(em=>{
          const isMe=em===meEmail, isAdm=adminSet.has(em), isAllowed=allowedSet.has(em);
          const actions = isAdm
            ? '<span class="hint">מנהל — מנוהל למטה</span>'
            : (isAllowed
                ? `<button class="btn danger sm" data-rm="${esc(em)}" ${isMe?'disabled title="אי אפשר להסיר את עצמך"':''}>✕ הסר הרשאה</button>`
                : `<button class="btn ghost sm" data-add="${esc(em)}">➕ אשר לרשימה</button>`);
          return `<tr>
            <td dir="ltr" style="text-align:right">${esc(em)}${isMe?' <span class="pill neutral">זה אני</span>':''}</td>
            <td><input class="nu-nm" data-em="${esc(em)}" value="${esc(names[em]||"")}" placeholder="—" autocomplete="off" style="min-width:120px"></td>
            <td>${badge(em)}</td>
            <td>${scopeCell(em,isAdm)}</td>
            <td>${fmtWhen(activity[em])}</td>
            <td style="text-align:end;white-space:nowrap">${actions}</td></tr>`;
        }).join("")}</tbody></table></div>`;
      usersBox.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{
        const em=b.dataset.rm;
        if(!confirm(`להסיר את ההרשאה של ${em}? הוא/היא לא יוכל/תוכל יותר להיכנס למערכת.`)) return;
        DB.settings.allowedEmails=(DB.settings.allowedEmails||[]).filter(x=>String(x).toLowerCase()!==em);
        save(); toast(`ההרשאה של ${em} הוסרה`); renderUsers();
      });
      usersBox.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addAllowed(b.dataset.add));
      usersBox.querySelectorAll(".nu-nm").forEach(inp=>inp.onchange=()=>{
        const em=inp.dataset.em, v=inp.value.trim();
        DB.settings.userNames=Object.assign({}, DB.settings.userNames||{});
        if(v) DB.settings.userNames[em]=v; else delete DB.settings.userNames[em];
        save(); toast("השם נשמר");
      });
      usersBox.querySelectorAll(".nu-scope").forEach(sel=>sel.onchange=()=>{
        const em=sel.dataset.em, v=sel.value;
        const m=Object.assign({}, DB.settings.editScopes||{});
        if(v) m[em]=v; else delete m[em];
        DB.settings.editScopes=m; save(); toast("הרשאת העריכה עודכנה"); renderUsers();
      });
    };
    const addAllowed=(raw, rawName)=>{
      const em=String(raw||"").trim().toLowerCase();
      if(!isEmail(em)){ showNuMsg("יש להזין כתובת אימייל תקינה.", false); return; }
      const nm=String(rawName||"").trim();
      if(nm){ DB.settings.userNames=Object.assign({}, DB.settings.userNames||{}); DB.settings.userNames[em]=nm; }
      const cur=(DB.settings.allowedEmails||[]).map(x=>String(x).toLowerCase());
      const admins=(DB.settings.admins||[]).map(x=>String(x).toLowerCase());
      if(admins.includes(em)){ save(); showNuMsg(`${em} כבר מנהל מערכת — מורשה ממילא.`, true); renderUsers(); return; }
      if(cur.includes(em)){ save(); showNuMsg(`${em} כבר ברשימת המורשים.`, true); renderUsers(); return; }
      DB.settings.allowedEmails=(DB.settings.allowedEmails||[]).concat(em);
      save(); showNuMsg(`${em} אושר/ה. עכשיו אפשר להיכנס עם חשבון ה-Google הזה.`, true); renderUsers();
    };
    $("#nu-add").onclick=()=>{ addAllowed($("#nu-email").value, $("#nu-name").value); $("#nu-email").value=""; $("#nu-name").value=""; };
    $("#nu-email").addEventListener("keydown",ev=>{ if(ev.key==="Enter") $("#nu-add").click(); });
    renderUsers();
  }

  // גילי ילדים ותפקידי צוות (עריכה למנהל בלבד)
  const saveAges  = next => { DB.settings.childAges  = cleanList(next)||[]; save(); route(); toast("נשמר"); };
  const saveRoles = next => { DB.settings.staffRoles = cleanList(next)||[]; save(); route(); toast("נשמר"); };
  const saveCampuses = next => { DB.settings.campuses = cleanList(next)||[]; save(); route(); toast("נשמר"); };
  renderSettingsList($("#ages-box"),  CHILD_AGES.slice(),  saveAges,  dis);
  renderRolesEditor($("#roles-box"), dis);
  renderSettingsList($("#campus-box"), CAMPUSES.slice(), saveCampuses, dis);
  if(admin){
    $("#addAge").onclick=()=>{ const v=$("#new-age").value.trim(); if(!v)return; if(CHILD_AGES.includes(v)){toast("כבר קיים");return;} saveAges(CHILD_AGES.concat(v)); };
    $("#resetAges").onclick=()=>{ delete DB.settings.childAges; save(); route(); toast("אופס לברירת מחדל"); };
    $("#addRole").onclick=()=>{ const v=$("#new-role").value.trim(); if(!v)return; if(STAFF_ROLES.includes(v)){toast("כבר קיים");return;} saveRoles(STAFF_ROLES.concat(v)); };
    $("#resetRoles").onclick=()=>{ delete DB.settings.staffRoles; save(); route(); toast("אופס לברירת מחדל"); };
    $("#addCampus").onclick=()=>{ const v=$("#new-campus").value.trim(); if(!v)return; if(CAMPUSES.includes(v)){toast("כבר קיים");return;} saveCampuses(CAMPUSES.concat(v)); };
    $("#syncCampus").onclick=()=>{ let n=0; DB.students.forEach(s=>{ if(!s.ganId) return; const c=ganCampus(s.ganId); if(s.campus!==c){ s.campus=c; n++; } }); if(n) save(); route(); toast(n?`עודכנו ${n} תלמידות`:"הכל כבר מעודכן לפי הגנים"); };
  }

  // מיתוג (כותרת + לוגו)
  if(admin){
    const logoPrevUpdate=()=>{ const p=$("#br-logo-prev"); if(!p) return; const v=$("#br-logo").value.trim();
      p.innerHTML = /^(https?:|data:)/i.test(v) ? `<img src="${esc(v)}" alt="לוגו" style="width:100%;height:100%;object-fit:cover">` : esc(v||"🎒"); };
    $("#br-logo").addEventListener("input", logoPrevUpdate);
    // העלאת קובץ לוגו — קריאה, הקטנה לקנבס (עד 512px) והטמעה כ-data URI (בלי תלות בקישור חיצוני)
    const lf=$("#br-logo-file"); if(lf) lf.onchange=()=>{
      const file=lf.files&&lf.files[0]; if(!file) return;
      if(!/^image\//.test(file.type)){ toast("יש לבחור קובץ תמונה"); return; }
      const rd=new FileReader();
      rd.onload=()=>{ const img=new Image(); img.onload=()=>{
        const max=512, scale=Math.min(1, max/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        let uri; try{ uri=c.toDataURL("image/png"); }catch(_){ uri=rd.result; }
        $("#br-logo").value=uri; logoPrevUpdate(); toast('הלוגו נטען — לחצ/י "שמור מיתוג" לשמירה');
      }; img.onerror=()=>toast("לא ניתן לקרוא את התמונה"); img.src=rd.result; };
      rd.onerror=()=>toast("שגיאה בקריאת הקובץ"); rd.readAsDataURL(file);
    };
    $("#saveBrand").onclick=()=>{ DB.settings.appTitle=$("#br-title").value.trim(); DB.settings.appLogo=$("#br-logo").value.trim();
      _brandMigrated=true; saveBranding().catch(e=>{ console.error(e); toast("שגיאת שמירת מיתוג — בדוק/י חיבור"); }); save(); applyBranding(); logoPrevUpdate(); toast("המיתוג נשמר"); };
    $("#resetBrand").onclick=()=>{ delete DB.settings.appTitle; delete DB.settings.appLogo;
      _brandMigrated=true; saveBranding().catch(e=>console.error(e)); save(); route(); toast("הוחזר לברירת מחדל"); };
  }

  // מנהלי מערכת
  const ab=$("#admins-box");
  const admins=(DB.settings.admins||[]);
  ab.innerHTML = admins.length
    ? `<div class="row" style="gap:8px">${admins.map(e=>`<span class="pill ok" style="padding:6px 12px">${esc(e)} ${admin?`<button class="btn ghost sm" data-delA="${esc(e)}" style="padding:0 6px;margin-inline-start:6px">✕</button>`:''}</span>`).join("")}</div>`
    : `<div class="hint">אין עדיין מנהלים מוגדרים — כל משתמש מחובר יכול לשנות הגדרות. מומלץ להוסיף את עצמך כמנהל.</div>`;
  if(admin){
    ab.querySelectorAll("[data-delA]").forEach(b=>b.onclick=()=>{ const e=b.dataset.dela;
      if(admins.length===1 && !confirm("זהו המנהל האחרון. לאחר הסרתו כל משתמש יוכל לשנות הגדרות. להמשיך?")) return;
      DB.settings.admins=admins.filter(x=>x!==e); save(); route(); toast("הוסר מנהל"); });
    $("#addAdmin").onclick=()=>{ const e=$("#new-admin").value.trim().toLowerCase(); if(!e)return;
      if(admins.map(x=>x.toLowerCase()).includes(e)){ toast("כבר ברשימה"); return; }
      DB.settings.admins=admins.concat(e); save(); route(); toast("נוסף מנהל"); };
  }

  // פניות והצעות שיפור
  const fbBox=$("#feedback-box");
  if(fbBox){
    const list=Array.isArray(DB.settings.feedback)?DB.settings.feedback:[];
    fbBox.innerHTML = list.length
      ? `<div class="table-wrap"><table><thead><tr><th>תאריך</th><th>נושא</th><th>הודעה</th><th>מאת</th><th></th></tr></thead><tbody>${list.map(f=>`<tr${f.done?' style="opacity:.55"':''}>
          <td style="white-space:nowrap">${esc(new Date(f.date).toLocaleDateString("he-IL"))}</td>
          <td>${esc(f.subject)||'—'}</td>
          <td>${esc(f.text)}</td>
          <td style="white-space:nowrap">${esc(f.from||f.contact)||'—'}${(f.contact&&f.contact!==f.from)?`<div class="hint">${esc(f.contact)}</div>`:''}</td>
          <td style="white-space:nowrap"><button class="btn ghost sm" data-fbdone="${esc(f.id)}">${f.done?'↩︎':'✓ טופל'}</button> <button class="btn ghost sm" data-fbdel="${esc(f.id)}">🗑️</button></td></tr>`).join("")}</tbody></table></div>`
      : `<div class="hint">אין פניות עדיין.</div>`;
    fbBox.querySelectorAll("[data-fbdone]").forEach(b=> b.onclick=()=>{ const f=list.find(x=>x.id===b.dataset.fbdone); if(f){ f.done=!f.done; save(); route(); } });
    fbBox.querySelectorAll("[data-fbdel]").forEach(b=> b.onclick=()=>{ if(!confirm("למחוק את הפנייה?")) return; DB.settings.feedback=list.filter(x=>x.id!==b.dataset.fbdel); save(); route(); });
    const ce=$("#contact-email-save"); if(ce) ce.onclick=()=>{ DB.settings.contactEmail=($("#contact-email").value||"").trim(); save(); toast("נשמר"); };
  }

  // years
  const yb=$("#years-box");
  yb.innerHTML=`<div class="row" style="gap:8px">${DB.years.map(y=>`<span class="pill ${y===DB.activeYear?'ok':'neutral'}" style="padding:6px 12px">${esc(y)} ${(admin&&DB.years.length>1)?`<button class="btn ghost sm" data-dely="${esc(y)}" style="padding:0 6px;margin-inline-start:6px">✕</button>`:''}</span>`).join("")}</div>`;
  yb.querySelectorAll("[data-dely]").forEach(b=>b.onclick=()=>{ const y=b.dataset.dely;
    if(studentsOfYear(y).length && !confirm(`בשנת ${y} יש תלמידות. למחוק את השנה ואת התלמידות שבה?`)) return;
    DB.years=DB.years.filter(x=>x!==y); DB.students=DB.students.filter(s=>s.year!==y);
    if(DB.activeYear===y){ DB.activeYear=DB.years[0]; setYearPref(DB.activeYear); } save(); route(); });
  if(admin) $("#addYear").onclick=()=>{ const y=$("#new-year").value.trim(); if(!y)return; if(DB.years.includes(y)){toast("שנה קיימת");return;} DB.years.push(y); save(); route(); toast("נוספה שנה"); };

  if(admin) $("#doPromote").onclick=async ()=>{
    const from=$("#pr-from").value, to=$("#pr-to").value;
    const copyId = DRIVE_READY && !!($("#pr-copyId")&&$("#pr-copyId").checked);
    if(from===to){ toast("בחר/י שנת מקור ושנת יעד שונות"); return; }
    const src=DB.students.filter(s=>s.year===from);
    if(!src.length){ toast("אין תלמידות בשנת המקור"); return; }
    const existing=new Set(DB.students.filter(s=>s.year===to).map(s=>digits(s.tz)).filter(Boolean));
    let added=0, skippedGrad=0, noGan=0;
    const toCopy=[]; // {id: מזהה התלמידה החדשה, src: מזהה קובץ ת"ז המקורי}
    src.forEach(s=>{ if(s.tz && existing.has(digits(s.tz))) return; // כבר קיימת ביעד (למשל הועברה בהשארות)
      const n=buildPromoted(s, to); // כללי המעבר המלאים (גן מתקדם, איפוסים, שונות)
      if(!n){ skippedGrad++; return; } // מסיימת (גן חובה) שאינה בהשארות
      if(!n.ganId) noGan++;
      if(copyId && s.docFiles && s.docFiles.idCopy && s.docFiles.idCopy.id) toCopy.push({ id:n.id, src:s.docFiles.idCopy.id });
      DB.students.push(n); added++; });
    save(); route(); toast(`הועברו ${added} תלמידות לשנת ${to}${skippedGrad?` · ${skippedGrad} מסיימות דולגו`:''}${noGan?` · ${noGan} ללא גן (לשיבוץ)`:''}`);

    // מעבר אסינכרוני: העתקה פיזית של קובצי ת"ז לתיקיות השנה החדשה (לא חוסם את הקידום)
    if(copyId && toCopy.length){
      const st=$("#pr-status");
      let done=0, failed=0;
      for(const c of toCopy){
        const n=DB.students.find(x=>x.id===c.id); if(!n) continue;
        if(st) st.textContent=`מעתיק קובצי ת"ז לתיקיות השנה החדשה… ${done+failed}/${toCopy.length}`;
        try{
          await driveEnsureChildFolder(n);
          const nm='צילום תעודת זהות · '+([n.lastName,n.firstName].filter(Boolean).join(" "))+(n.tz?(" · "+n.tz):"");
          const res=await driveCopyFile(c.src, n.driveFolderId, nm);
          const cur=DB.students.find(x=>x.id===c.id);
          if(cur){ cur.docFiles=cur.docFiles||{}; cur.docFiles.idCopy={ id:res.id||"", name:res.name||nm, link:res.link||"" }; }
          done++;
        }catch(e){ console.error(e); failed++; }
      }
      save();
      if(st) st.textContent="";
      toast(`הועתקו ${done} קובצי ת"ז לתיקיות השנה${failed?` · ${failed} נכשלו (נשמר קישור לשנה הקודמת)`:''}`);
    }
  };

  // historical — נעול כברירת מחדל כדי לא לשנות בטעות מספרי תלמידים שהוזנו (סעיף 14)
  const hb=$("#hist-box");
  const histFinal=h=>(+h.periodA||0)+(+h.periodB||0)+(+h.periodC||0); // סופי = סכום א׳+ב׳+ג׳
  let histUnlocked=false;
  const drawHist=()=>{
    const editable = admin && histUnlocked;
    const ro = editable? "" : "readonly";
    hb.innerHTML=`
    <div class="row" style="margin-bottom:8px;align-items:center">
      <div class="note" style="flex:1">🔒 המספרים נעולים כדי לא לשנות בטעות נתונים שכבר הוזנו משנים קודמות.${admin?' לחצ/י "אפשר עריכה" כדי לעדכן.':' רק מנהל מערכת יכול לפתוח לעריכה.'}</div>
      ${admin?`<button class="btn ghost sm" id="hist-lock" style="align-self:center">${editable?'🔓 נעל שוב':'✏️ אפשר עריכה'}</button>`:''}
    </div>
    <div class="table-wrap"><table><thead><tr><th>שנה</th><th>מועד א׳</th><th>מועד ב׳</th><th>מועד ג׳</th><th>סופי (סיכום)</th>${editable?'<th></th>':''}</tr></thead><tbody>
      ${DB.years.map(y=>{const h=DB.historical[y]||{};return `<tr>
        <td><b>${esc(y)}</b></td>
        <td><input class="hist-p" data-h="${esc(y)}|periodA" value="${esc(h.periodA??"")}" inputmode="numeric" style="width:80px" ${ro}></td>
        <td><input class="hist-p" data-h="${esc(y)}|periodB" value="${esc(h.periodB??"")}" inputmode="numeric" style="width:80px" ${ro}></td>
        <td><input class="hist-p" data-h="${esc(y)}|periodC" value="${esc(h.periodC??"")}" inputmode="numeric" style="width:80px" ${ro}></td>
        <td><input data-final value="${histFinal(h)||""}" style="width:80px;font-weight:800;background:var(--surface)" readonly title="סכום מועדים א׳+ב׳+ג׳ (מחושב אוטומטית)"></td>
        ${editable?`<td class="actions"><button class="btn ghost sm" data-livey="${esc(y)}">מלא מנתוני המערכת</button></td>`:''}</tr>`;}).join("")}
    </tbody></table></div><div class="hint">עמודת "סופי" מחושבת אוטומטית כסכום מועדים א׳+ב׳+ג׳.</div>`;
    const lk=$("#hist-lock"); if(lk) lk.onclick=()=>{ histUnlocked=!histUnlocked; drawHist(); };
    if(editable){
      hb.querySelectorAll("input.hist-p").forEach(inp=> inp.oninput=inp.onchange=()=>{
        const [y,k]=inp.dataset.h.split("|"); DB.historical[y]=DB.historical[y]||{};
        const v=inp.value.trim(); if(v==="") delete DB.historical[y][k]; else DB.historical[y][k]=+v;
        const h=DB.historical[y]; const f=histFinal(h);
        const cell=inp.closest("tr").querySelector("[data-final]"); if(cell) cell.value=f||"";
        if(f>0) h.final=f; else delete h.final; save(); });
      hb.querySelectorAll("[data-livey]").forEach(b=>b.onclick=()=>{ const y=b.dataset.livey;
        const ys=DB.students.filter(s=>s.year===y);
        const pa=ys.filter(s=>s.period==='א').length, pb=ys.filter(s=>s.period==='ב').length, pc=ys.filter(s=>s.period==='ג').length;
        DB.historical[y]={ periodA:pa, periodB:pb, periodC:pc, final:pa+pb+pc };
        save(); drawHist(); toast("מולא מנתוני המערכת"); });
    }
  };
  drawHist();
  renderHistGans($("#hist-gans-box"), admin);

  if(admin) $("#saveTzMin").onclick=()=>{ const raw=$("#tzmin").value.trim(); const v=+raw; if(!raw){ delete DB.settings.tzaharonMin; save(); toast("נוקה"); } else if(v>=0){ DB.settings.tzaharonMin=v; save(); toast("נשמר"); } };

}

/* ============================================================
   מודל / כללי
   ============================================================ */
/* ניהול כפתור "חזור" בנייד (PWA): חזור סוגר חלון פתוח או חוזר ללשונית הקודמת,
   במקום לצאת מהאפליקציה. מבוסס על History API. */
let modalHistoryOpen=false; // האם נדחף מצב היסטוריה עבור חלון פתוח
let inPopstate=false;       // האם אנו כרגע בתוך טיפול ב-popstate (למניעת לולאה)
function modal(html){
  $("#modal").innerHTML=html; $("#overlay").classList.add("show"); document.body.style.overflow="hidden";
  if(!modalHistoryOpen){ modalHistoryOpen=true; try{ history.pushState({rgModal:true},""); }catch(_){} }
  updateBackBtn();
}
function closeModal(){
  $("#overlay").classList.remove("show"); document.body.style.overflow="";
  if(modalHistoryOpen){ modalHistoryOpen=false; if(!inPopstate){ try{ history.back(); }catch(_){} } } // אזן את מחסנית ההיסטוריה שנדחפה בפתיחה
  if(pendingRender){ pendingRender=false; route(); }
  updateBackBtn();
}
function navToTab(tab){ closeDrawer(); if(tab===active) return; active=tab; try{ history.pushState({rgTab:tab},""); }catch(_){} route(); window.scrollTo(0,0); }
/* חץ חזרה גלוי בכותרת — חוזר למסך הקודם דרך מנגנון ההיסטוריה הקיים (סוגר חלון/מגירה, או חוזר ללשונית הקודמת עד לראשי) */
function goBack(){
  if($("#drawer").classList.contains("open")){ closeDrawer(); return; }
  if($("#overlay").classList.contains("show")){ closeModal(); return; }
  if(active!=="home"){ try{ history.back(); }catch(_){ active="home"; route(); } }
}
function updateBackBtn(){
  const b=$("#backBtn"); if(!b) return;
  const show = !document.body.classList.contains("locked") &&
    ($("#overlay").classList.contains("show") || active!=="home");
  b.classList.toggle("show", show);
}
window.addEventListener("popstate", e=>{
  inPopstate=true;
  if($("#drawer").classList.contains("open")){ closeDrawer(); }
  else if($("#overlay").classList.contains("show")){ closeModal(); } // חזור סוגר חלון פתוח ולא יוצא
  else { const st=e.state; if(st && st.rgTab && st.rgTab!==active){ active=st.rgTab; route(); window.scrollTo(0,0); } }
  inPopstate=false;
});
$("#overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeModal(); });
/* כפתורי פעולה בתוך טפסים (חיוג/מייל/ניווט) — קוראים את הערך *הנוכחי* של השדה בעת הלחיצה */
$("#modal").addEventListener("click",e=>{
  const cb=e.target.closest("[data-call]"); if(cb){ const el=$("#"+cb.dataset.call); const v=el?el.value.trim():""; if(v) location.href=telHref(v); else toast("אין מספר טלפון בשדה"); return; }
  const mb=e.target.closest("[data-mail]"); if(mb){ const el=$("#"+mb.dataset.mail); const v=el?el.value.trim():""; if(v) location.href="mailto:"+encodeURIComponent(v); else toast("אין כתובת מייל בשדה"); return; }
  const nb=e.target.closest("[data-nav]"); if(nb){ const el=$("#"+nb.dataset.nav); const v=el?el.value.trim():""; if(v) window.open("https://waze.com/ul?q="+encodeURIComponent(v)+"&navigate=yes","_blank","noopener"); else toast("אין כתובת בשדה"); return; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#drawer").classList.contains("open")) closeDrawer(); else closeModal(); } });

$("#tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b){ navToTab(b.dataset.tab); } });
$("#backBtn").addEventListener("click", goBack);
$("#menuBtn").addEventListener("click",toggleDrawer);
$("#drawerClose").addEventListener("click",closeDrawer);
$("#scrim").addEventListener("click",closeDrawer);
$("#yearSelect").addEventListener("change",e=>{ DB.activeYear=e.target.value; setYearPref(DB.activeYear); route(); }); // העדפה מקומית — ללא כתיבה לענן

/* theme */
(function(){ const KEY="rg-theme"; const saved=localStorage.getItem(KEY); if(saved)document.documentElement.dataset.theme=saved;
  $("#themeBtn").onclick=()=>{ const cur=document.documentElement.dataset.theme|| (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
    const next=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=next; localStorage.setItem(KEY,next); };
  { const fb=$("#feedbackBtn"); if(fb) fb.onclick=()=>{ closeDrawer(); openFeedback(); }; }
  { const ai=$("#aiHelpBtn"); if(ai) ai.onclick=()=>{ closeDrawer(); openAiHelp(); }; } })();

boot();
</script>
