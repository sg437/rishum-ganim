/* פענוח CSV/הדבקה — תומך בפסיקים או טאבים, מרכאות, ותאים רב-שורתיים */
function parseTable(text){
  text=String(text||"").replace(/^﻿/,"");
  const firstLine=text.split(/\r?\n/)[0]||"";
  // זיהוי מפריד: טאב / נקודה-פסיק / פסיק — לפי מה שמפצל להכי הרבה עמודות (אקסל בעברית שומר לרוב עם ; )
  const cand=[["\t",firstLine.split("\t").length],[";",firstLine.split(";").length],[",",firstLine.split(",").length]];
  const delim=cand.reduce((a,b)=> b[1]>a[1] ? b : a)[0];
  const rows=[]; let row=[], cur="", inq=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(inq){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inq=false; } else cur+=ch; }
    else { if(ch==='"' && cur===""){ inq=true; } /* מרכאה נחשבת ציטוט רק בתחילת תא */
      else if(ch===delim){ row.push(cur); cur=""; }
      else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(ch==='\r'){ /* מטופל ע"י \n */ }
      else cur+=ch; }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
/* פירוק שם למילים (מתעלם מפיסוק/מרכאות/מקפים) */
function nameTokens(s){ return String(s||"").replace(/["'.,\-–־׳״]/g," ").split(/\s+/).map(w=>w.trim()).filter(Boolean); }
/* השוואת שמות ללא תלות בסדר המילים: "מצגר רחל" == "רחל מצגר".
   דורש לפחות שתי מילים והתאמה מלאה של קבוצת המילים (למניעת התאמות שגויות). */
function sameNameUnordered(a,b){
  const ta=nameTokens(a), tb=nameTokens(b);
  if(ta.length<2 || tb.length!==ta.length) return false;
  const sa=ta.slice().sort((x,y)=>x.localeCompare(y,"he"));
  const sb=tb.slice().sort((x,y)=>x.localeCompare(y,"he"));
  return sa.every((w,i)=>w===sb[i]);
}
/* התאמת שם/סמל גן מהקובץ לגן קיים במערכת */
function matchGanText(text){
  const t=String(text||"").trim(); if(!t) return "";
  const nz=x=>String(x||"").trim();
  const g = DB.gans.find(g=>nz(g.teacherName)===t)
        || DB.gans.find(g=>nz(g.ganSymbol)===t)
        || DB.gans.find(g=>nz(g.internalSymbol)===t)
        || DB.gans.find(g=>nz(g.teacherName) && (t.includes(nz(g.teacherName)) || nz(g.teacherName).includes(t)))
        || DB.gans.find(g=>nz(g.teacherName) && sameNameUnordered(g.teacherName, t)); // שם גננת בסדר מילים הפוך
  return g? g.id : "";
}
/* בניית רשומות מהטבלה שנקראה */
function buildImportRows(rows, opts){
  if(!rows.length) return { list:[], mapped:[] };
  const header=rows[0].map(normHeader);
  const idx={}; header.forEach((h,i)=>{ const k=IMPORT_HEADER_MAP[h]; if(k && idx[k]==null) idx[k]=i; });
  const mapped=Object.keys(idx); // אילו שדות זוהו
  const existing=new Set(studentsOfYear().map(s=>digits(s.tz)).filter(Boolean));
  const seen=new Set();
  const list=[];
  for(let r=1;r<rows.length;r++){
    const cells=rows[r];
    const g=key=> idx[key]!=null ? String(cells[idx[key]]??"").trim() : "";
    const st=makeStudent();
    st.lastName=g("lastName"); st.firstName=g("firstName"); st.tz=digits(g("tz"));
    st.dob=normDateVal(g("dob")); st.motherName=g("motherName"); st.fatherName=g("fatherName");
    st.phone=fixPhone(g("phone")); st.mobile=fixPhone(g("mobile")); // תיקון 0 מוביל בנייד (סעיף 4)
    st.street=g("street"); st.building=g("building"); st.city=g("city"); st.campus=g("campus");
    st.age=g("age").replace(/[^\d]/g,""); st.period=normPeriodVal(g("period")); st.education=normEduVal(g("education"));
    st.notes=g("notes");
    const fl=flagsFromNotes(st.notes); if(fl.outOfCity) st.special.outOfCity=true; if(fl.retention) st.special.retention=true; // זיהוי "תושב/ת חוץ" / "השארות" מההערות
    const ganText=g("gan"); st.ganId=matchGanText(ganText);
    if(st.ganId && ganCampus(st.ganId)) st.campus=ganCampus(st.ganId);   // קמפוס נגזר מהגן המשובץ
    st.absorbedMunicipality = idx.absorbed!=null ? truthyCell(g("absorbed")) : !!opts.absorbed;
    st.registeredByUs        = idx.regByUs!=null ? truthyCell(g("regByUs"))  : !!opts.reg;
    if(opts.tzaharon){ st.programs=st.programs||{}; st.programs.tzaharon=true; } // רישום אוטומטי לצהרון (סעיף 11)
    if(!st.firstName && !st.lastName && !st.tz) continue; // שורה ריקה
    const fileDup = st.tz && seen.has(st.tz);   // ת"ז כפולה בתוך הקובץ עצמו (סעיף 5)
    const dup     = st.tz && existing.has(st.tz); // ת"ז שכבר קיימת במערכת
    if(st.tz) seen.add(st.tz);
    list.push({ st, ganText, ganMatched:!!st.ganId, dup, fileDup });
  }
  return { list, mapped };
}

/* זיהוי קבוצת הייבוא האחרונה — תלמידות השנה הפעילה שנוצרו בסמיכות זמן ליצירה האחרונה
   (בייבוא מרוכז כל השורות מקבלות createdAt כמעט זהה, ולכן אפשר לזהות ולבטל את הייבוא) */
function lastImportBatch(){
  const ys=studentsOfYear().filter(s=>s.createdAt && !isNaN(Date.parse(s.createdAt)));
  if(!ys.length) return [];
  const maxT=Math.max(...ys.map(s=>Date.parse(s.createdAt)));
  const WINDOW=5*60*1000; // חלון של 5 דקות אחורה מהיצירה האחרונה
  return ys.filter(s=> maxT-Date.parse(s.createdAt) <= WINDOW)
           .sort((a,b)=>Date.parse(a.createdAt)-Date.parse(b.createdAt));
}

/* ============================================================
   מפת שיבוץ — OpenStreetMap + Leaflet (חינם, ללא מפתח / חיוב).
   גאוקוד דרך Nominatim; הקואורדינטות נשמרות במטמון (g.geo/s.geo)
   כדי לא לגאוקד שוב ולכבד את מדיניות השימוש (בקשה אחת לשנייה).

let _leafletPromise=null;
function ensureLeaflet(){
  if(window.L) return Promise.resolve(window.L);
  if(_leafletPromise) return _leafletPromise;
  _leafletPromise=new Promise((resolve,reject)=>{
    const css=document.createElement("link");
    css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(css);
    const js=document.createElement("script");
    js.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    js.onload=()=>resolve(window.L);
    js.onerror=()=>reject(new Error("leaflet-load-failed"));
    document.head.appendChild(js);
  });
  return _leafletPromise;
}
function haversineKm(a,b){
  const R=6371, toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
function geoDefaultCity(){
  const c={}; DB.students.forEach(s=>{ const v=(s.city||"").trim(); if(v) c[v]=(c[v]||0)+1; });
  let best="", n=0; for(const k in c){ if(c[k]>n){ n=c[k]; best=k; } } return best;
}
function ganAddrQuery(g){
  // שם הרחוב עשוי להיות בשדה "כתובת" או בשדה "רחוב"; המספר בשדה "מספר".
  // בוחרים כשם-רחוב את השדה שמכיל טקסט (אותיות), ומצרפים מספר אם עוד אין.
  const cand=[String(g.address||"").trim(), String(g.street||"").trim()];
  const streetName = cand.find(p=>p && /[א-ת]/.test(p)) || "";
  if(!streetName) return "";                          // אין שם רחוב (אותיות) → לא ניתן לגאוקד
  const num=String(g.building||"").trim();
  const base = /\d/.test(streetName) ? streetName : (streetName + (num?(" "+num):""));
  const city=(_mapState&&_mapState.city)||geoDefaultCity();   // העיר הנבחרת במפה מנצחת
  return base+(city?(", "+city):"")+", ישראל";
}
function studentAddrQuery(s){
  const base=[s.street,s.building].filter(Boolean).join(" ").trim();
  if(!base) return "";
  // אם נבחרה עיר במפה — היא הקובעת (כולם באותה עיר), אחרת עיר התלמידה
  const city=(_mapState&&_mapState.city)||(s.city||"").trim()||geoDefaultCity();
  return base+(city?(", "+city):"")+", ישראל";

/* גאוקוד: קודם Google דרך הגשר (דיוק גבוה, המפתח מוסתר); אם אין מפתח
   או שנכשל — נפילה ל-OpenStreetMap (Nominatim, חינם). בטור עם השהיה
   ל-OSM בלבד — כיבוד מדיניות (≤1 בקשה/שנייה). */
let _geoChain=Promise.resolve();
let _geoGoogle=null;   // null=לא ידוע · true=מפתח Google פעיל · false=אין מפתח → OSM
async function geocodeGoogleBridge(q, city, bias){
  if(_geoGoogle===false) return null;
  if(!DRIVE_READY){ _geoGoogle=false; return null; }
  try{
    const res=await driveCall("geocode",{ q, city:city||"", bias:(bias&&bias.lat!=null)?{lat:bias.lat,lng:bias.lng}:null });
    if(res && res.lat!=null && res.lng!=null){ _geoGoogle=true; return { lat:res.lat, lng:res.lng, partial:!!res.partial, locType:res.locType||"" }; }
    return null;
  }catch(e){
    const m=String((e&&e.message)||e||"");
    if(m.indexOf("no-geo-key")>=0){ _geoGoogle=false; return null; }        // אין מפתח → OSM
    if(m.indexOf("unknown-action")>=0){ _geoGoogle=false; return null; }    // גשר עדיין לא עודכן → OSM
    if(m.indexOf("geo-not-found")>=0){ _geoGoogle=true; return null; }      // Google פעיל אך ללא תוצאה
    return null;                                                             // רשת/אחר → נפילה ל-OSM
  }
}
function geocodeOnce(q, city, bias){
  const run=async()=>{
    const g=await geocodeGoogleBridge(q, city, bias);
    if(g) return { lat:g.lat, lng:g.lng, source:"google", partial:g.partial, locType:g.locType };
    await new Promise(r=>setTimeout(r,1100));   // כיבוד מדיניות Nominatim (≤1/שנייה)
    let url="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=il&accept-language=he&q="+encodeURIComponent(q);
    // הגבלה לתיבת העיר הנבחרת — מונע התאמה לרחוב באותו שם בעיר רחוקה
    if(bias&&bias.lat!=null){ const dLat=0.06, dLng=0.07;
      url+="&bounded=1&viewbox="+(bias.lng-dLng)+","+(bias.lat+dLat)+","+(bias.lng+dLng)+","+(bias.lat-dLat); }
    const r=await fetch(url,{ headers:{ "Accept":"application/json" } });
    if(!r.ok) throw new Error("geocode-http-"+r.status);
    const arr=await r.json();
    if(!arr||!arr.length) return null;
    const lat=parseFloat(arr[0].lat), lng=parseFloat(arr[0].lon);
    return (isFinite(lat)&&isFinite(lng))? { lat, lng, source:"osm" } : null;
  };
  const result=_geoChain.then(run, run);   // ממשיך גם אחרי כשל קודם
  _geoChain=result.catch(()=>{});          // שומר את התור חי
  return result;
}
/* מוודא שלישות (גן/תלמידה) יש קואורדינטות במטמון עבור השאילתה הנוכחית.
   מחזיר {lat,lng} או null. מסמן ניסיון גם בכישלון (מונע גאוקוד חוזר אינסופי). */
async function ensureGeo(ent, q, force, city, bias){
  if(!q) return null;
  if(ent.geo && ent.geo.q===q && ent.geo.lat!=null) return ent.geo;
  if(!force && ent.geo && ent.geo.q===q && ent.geo.tried) return null;   // ניסינו וקיבלנו ריק (אלא אם force)
  let pt=null; try{ pt=await geocodeOnce(q, city, bias); }catch(e){ pt=null; }
  // דחיית תוצאה שנפלה מחוץ לרדיוס העיר הנבחרת — עדיף "לא נמצא בעיר" מאשר
  // מיקום שגוי במרחק (רחוב באותו שם בעיר אחרת). כך "אם בחרנו עיר — כולם בעיר".
  if(pt && bias && bias.lat!=null && haversineKm(pt,bias) > MAP_CITY_RADIUS_KM){
    ent.geo = { lat:null, lng:null, q, tried:true, outCity:true };
    return null;
  }
  const locType = pt ? (pt.locType||"") : "";
  const partial = pt ? !!pt.partial : false;
  // "משוער" רך (סימון ⚠) = מרכז רחוב/אזור או התאמה חלקית
  const approx = pt ? (partial || locType==="APPROXIMATE" || locType==="GEOMETRIC_CENTER") : false;
  ent.geo = pt ? { lat:pt.lat, lng:pt.lng, q, source:pt.source, locType, partial, approx } : { lat:null, lng:null, q, tried:true };
  return ent.geo.lat!=null ? ent.geo : null;
}

/* ===== מיקום ידני לגן =====================================================
   כשגן אינו מתגאוקד נכון (כתובת חלקית / הגיע למרכז העיר), מציבים לו סמן ידני:
   בוחרים גן → קופצים לכתובת או גוררים/לוחצים על המפה → "שמור מיקום".
   המיקום נשמר בכרטיס הגן (geo.manual=true) ואינו נדרס עוד ע"י גאוקוד אוטומטי. */
let _placeMarker=null, _placeGanId=null;
function mapPlaceIcon(L){
  const html=`<div style="font-size:34px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));cursor:grab">📍</div>`;
  return L.divIcon({ className:"map-place-divicon", html, iconSize:[34,34], iconAnchor:[17,32] });
}
function mapPlaceHint(t){ const el=$("#place-hint"); if(el) el.textContent=t; }
/* אכלוס הרשימה הנפתחת: ⚠ = גן ללא מיקום תקין · 📍 = בעל מיקום ידני */
function mapPlaceOptions(){
  const sel=$("#place-gan"); if(!sel) return; const cur=sel.value;
  const gans=mapGansForEdu().slice().sort((a,b)=>ganName(a.id).localeCompare(ganName(b.id),"he"));
  sel.innerHTML=`<option value="">— בחר/י גן —</option>`+gans.map(g=>{
    const mark=(g.geo&&g.geo.manual)?"📍 ":(mapGanShown(g)?"":"⚠ ");
    return `<option value="${esc(g.id)}">${mark}${esc(ganName(g.id))}</option>`;
  }).join("");
  if(cur) sel.value=cur;
}
function mapPlaceRemoveMarker(){
  if(_placeMarker){ try{ _map&&_map.removeLayer(_placeMarker); }catch(e){} _placeMarker=null; }
  if(_map){ try{ _map.off("click", mapPlaceMapClick); }catch(e){} }
}
function mapPlaceMapClick(e){
  if(!_placeMarker) return;
  _placeMarker.setLatLng(e.latlng);
  mapPlaceHint("מיקום נבחר: "+e.latlng.lat.toFixed(5)+", "+e.latlng.lng.toFixed(5)+' — לחצ/י "שמור מיקום".');
}
function mapPlaceSelect(ganId){
  mapPlaceRemoveMarker(); _placeGanId=ganId||null;
  if(!ganId){ mapPlaceHint('בוחרים גן → כתובת ו"קפוץ" (או גרירה/לחיצה על המפה) → "שמור מיקום". המיקום נשמר לגן לתמיד.'); return; }
  const g=DB.gans.find(x=>x.id===ganId); if(!g||!_map) return;
  let lat, lng;
  if(g.geo&&g.geo.lat!=null){ lat=g.geo.lat; lng=g.geo.lng; }
  else if(_cityCenter&&_cityCenter.lat!=null){ lat=_cityCenter.lat; lng=_cityCenter.lng; }
  else { const c=_map.getCenter(); lat=c.lat; lng=c.lng; }
  _placeMarker=_mapL.marker([lat,lng],{ draggable:true, icon:mapPlaceIcon(_mapL), zIndexOffset:2000 }).addTo(_map);
  _placeMarker.on("dragend",()=>{ const p=_placeMarker.getLatLng();
    mapPlaceHint("מיקום נבחר: "+p.lat.toFixed(5)+", "+p.lng.toFixed(5)+' — לחצ/י "שמור מיקום".'); });
  _map.on("click", mapPlaceMapClick);
  try{ _map.setView([lat,lng], Math.max(_map.getZoom(),15)); }catch(e){}
  const inp=$("#place-addr"); if(inp&&!inp.value.trim()){ const q=ganAddrQuery(g); if(q) inp.value=q.replace(/, ?ישראל\s*$/,""); }
  mapPlaceHint('גוררים את 📍 למקום הגן, או מקלידים כתובת ולוחצים "קפוץ". לסיום — "שמור מיקום".');
}
async function mapPlaceJump(){
  if(!_placeMarker){ toast("בחר/י גן קודם"); return; }
  const inp=$("#place-addr"); const q=(inp?inp.value:"").trim();
  if(!q){ toast("הקלד/י כתובת לקפיצה"); return; }
  mapPlaceHint("מחפש כתובת…");
  const city=_mapState.city||geoDefaultCity();
  const bias=(_cityCenter&&_cityCenter.lat!=null)?_cityCenter:null;
  const full=/ישראל/.test(q)?q:(q+((city&&!q.includes(city))?(", "+city):"")+", ישראל");
  let pt=null; try{ pt=await geocodeOnce(full,city,bias); }catch(e){ pt=null; }
  if(!pt){ mapPlaceHint("לא נמצאה כתובת — אפשר לגרור את 📍 ידנית."); toast("הכתובת לא נמצאה — גרור/י ידנית"); return; }
  _placeMarker.setLatLng([pt.lat,pt.lng]);

  mapPlaceHint("נמצא: "+pt.lat.toFixed(5)+", "+pt.lng.toFixed(5)+'. אפשר לתקן בגרירה ואז "שמור מיקום".');

function mapPlaceSave(){
  if(!_placeMarker||!_placeGanId){ toast("בחר/י גן והצב/י מיקום"); return; }
  const g=DB.gans.find(x=>x.id===_placeGanId); if(!g){ toast("הגן לא נמצא"); return; }
  const p=_placeMarker.getLatLng();
  g.geo={ lat:p.lat, lng:p.lng, manual:true, q:"__manual__", locType:"MANUAL", tried:true };
  try{ save(); }catch(e){}
  const nm=ganName(g.id);
  mapPlaceRemoveMarker();
  const selE=$("#place-gan"); if(selE) selE.value=""; _placeGanId=null;
  mapBuildGanColors(); mapPlotGans(); mapPlotStudents(); mapFit(); mapRenderSide(); mapPlaceOptions();
  mapStatus(mapStatusReport());
  mapPlaceHint("✔ המיקום נשמר לגן "+nm+".");

function mapPlaceClear(){
  const id=_placeGanId||($("#place-gan")?$("#place-gan").value:"");
  if(!id){ toast("בחר/י גן"); return; }
  const g=DB.gans.find(x=>x.id===id); if(!g) return;
  if(!(g.geo&&g.geo.manual)){ toast("לגן זה אין מיקום ידני"); return; }
  delete g.geo; try{ save(); }catch(e){}
  mapPlaceRemoveMarker();
  const selE=$("#place-gan"); if(selE) selE.value=""; _placeGanId=null;
  mapPlaceOptions();
  mapApply();
  mapPlaceHint("המיקום הידני בוטל — הגן יאותר שוב אוטומטית בגאוקוד.");

}
/* מרכז העיר הנבחרת — לסינון נקודות שהתגאוקדו לעיר אחרת בטעות.
   עדיף לחשב מ*חציון* מיקומי התלמידות/גנים (חסין לחריגים), ורק כגיבוי — גאוקוד שם העיר. */
const MAP_CITY_RADIUS_KM=10;
function _median(arr){ if(!arr.length) return null; const a=arr.slice().sort((x,y)=>x-y); return a[Math.floor(a.length/2)]; }
function mapComputeCenter(){
  const lats=[], lngs=[];
  mapShownStudents().forEach(s=>{ if(s.geo&&s.geo.lat!=null){ lats.push(s.geo.lat); lngs.push(s.geo.lng); } });
  mapSelectedGans().forEach(g=>{ if(g.geo&&g.geo.lat!=null){ lats.push(g.geo.lat); lngs.push(g.geo.lng); } });
  if(lats.length<5) return null;   // רק עם מספיק נקודות (חציון אמין)
  return { lat:_median(lats), lng:_median(lngs) };
}
/* מרכז העיר — גאוקוד שם העיר (מרכז אמיתי, אמין) הוא המקור העיקרי;
   חציון הנקודות רק כגיבוי. מונע קיבוע מרכז שגוי כשמעט גנים והם התגאוקדו לא נכון. */
async function mapEnsureCityCenter(city){
  if(_cityCenter && _cityCenter.city===city && _cityCenter.lat!=null) return _cityCenter;
  let pt=null; try{ pt=await geocodeOnce(city+", ישראל"); }catch(e){ pt=null; }
  if(pt){ _cityCenter={ city, lat:pt.lat, lng:pt.lng }; return _cityCenter; }
  const med=mapComputeCenter();
  _cityCenter = med ? { city, lat:med.lat, lng:med.lng } : { city, lat:null, lng:null };
  return _cityCenter;
}
/* האם נקודה נמצאת בתוך רדיוס העיר הנבחרת (או שאין סינון עיר / אין מרכז) */
function mapInCity(geo){
  if(!_mapState.city) return true;
  const c=_cityCenter; if(!c || c.city!==_mapState.city || c.lat==null) return true; // מרכז לא ידוע → לא מסננים
  if(!(geo&&geo.lat!=null)) return false;
  return haversineKm(geo,c)<=MAP_CITY_RADIUS_KM;
}

/* מסך מלא למפה — עדיפות ל-Fullscreen API של הדפדפן (מכסה באמת את כל המסך,

function _fsElement(){ return document.fullscreenElement||document.webkitFullscreenElement||null; }
/* אלמנט המסך-מלא = הבמה (מפה + רשימת הצד יחד), כדי שגם הרשימה תוצג במסך מלא */
function mapFullEl(){ return $("#map-stage")||$("#leaflet-map"); }
function mapToggleFull(){
  const el=mapFullEl(); if(!el) return;
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  const exit=document.exitFullscreen||document.webkitExitFullscreen;
  if(req && exit){                       // Fullscreen API זמין — הדרך האמינה
    if(_fsElement()){ try{ exit.call(document); }catch(e){} }
    else {
      if(!_mapFsBound){ _mapFsBound=()=>{ const fs=_fsElement(); const on=!!fs;
        const stage=$("#map-stage");   // מחלקה מפורשת — לא תלוי בתמיכת :fullscreen עם קידומות
        if(stage){ if(fs===stage) stage.classList.add("map-full-native"); else stage.classList.remove("map-full-native"); }
        const b=$("#map-full-btn"); if(b) b.textContent=on?"⛶ יציאה ממסך מלא":"⛶ מסך מלא";
        setTimeout(()=>{ try{ _map.invalidateSize(); mapFit(); }catch(e){} }, 120); };
        document.addEventListener("fullscreenchange",_mapFsBound);
        document.addEventListener("webkitfullscreenchange",_mapFsBound); }
      try{ const p=req.call(el); if(p&&p.catch) p.catch(()=>mapToggleFullFallback()); }
      catch(e){ mapToggleFullFallback(); }

}
/* גיבוי: העברת הבמה ל-body עם position:fixed (כשאין Fullscreen API) */
function mapToggleFullFallback(){

  const on=!el.classList.contains("map-full");
  const b=$("#map-full-btn"); if(b) b.textContent=on?"⛶ יציאה ממסך מלא":"⛶ מסך מלא";
  let x=document.getElementById("map-full-exit");
  if(on){
    _mapFullReturn={ parent:el.parentNode, next:el.nextSibling };
    document.body.appendChild(el);          // חסין: body אינו מושפע מ-transform של אבות
    el.classList.add("map-full");
    document.body.style.overflow="hidden";
    if(!x){ x=document.createElement("button"); x.id="map-full-exit"; x.type="button"; x.textContent="✕ סגירה";
      x.style.cssText="position:fixed;top:10px;inset-inline-end:10px;z-index:10000;background:#12251a;color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)";
      x.onclick=mapToggleFull; document.body.appendChild(x); }
    if(!_mapEscBound){ _mapEscBound=e=>{ if(e.key==="Escape"){ const m=mapFullEl(); if(m&&m.classList.contains("map-full")) mapToggleFull(); } };

/* מרחק/זמן הליכה אמיתי דרך הגשר (Google Distance Matrix), עם מטמון בזיכרון.

async function mapWalk(origin, gans){

  const need=[], needIdx=[];
  gans.forEach((g,i)=>{ if(!(g.geo&&g.geo.lat!=null)) return; const k=_walkKey(origin,g.geo);

    try{

    const warn=(g.geo&&g.geo.approx)?' <span title="מיקום הגן משוער — ודא/י כתובת">⚠</span>':'';
    row.innerHTML=`<span><b style="color:${mapDistColor(colorKm)}">●</b> ${esc(ganName(g.id))}${warn} · <span style="color:#666">${distTxt}</span></span>`;
    row.appendChild(mkBtn(isCur?"משובצת":"שבץ", isCur, "#1a7f37", "#fff", ()=>mapAssign(s,g)));
    return row;
  };
  const draw=items=>{ listWrap.innerHTML=""; items.slice(0,6).forEach(c=>listWrap.appendChild(rowFor(c))); };
  draw(cands);   // תצוגה ראשונית: אווירי + "🚶 …"
  mapWalk(s.geo, cands.map(c=>c.g)).then(walks=>{
    let any=false;
    cands.forEach((c,i)=>{ c.walk=walks[i]||null; if(c.walk) any=true; });
    const sorted=cands.slice().sort((a,b)=>{
      const wa=a.walk?a.walk.m:(a.km*1000+1e7), wb=b.walk?b.walk.m:(b.km*1000+1e7); return wa-wb;
    });
    draw(sorted);
    if(!any && _geoGoogle!==false){ const h=document.createElement("div");
      h.style.cssText="color:#999;font-size:.85em;margin-top:4px";
      h.textContent="מרחק הליכה לא זמין — ודא ש-Distance Matrix API מופעל בפרויקט Google."; box.appendChild(h); }
  });
  return box;
}

async function mapLoadStudents(){
  const btn=$("#map-load-students"); if(btn) btn.disabled=true;
  if(_mapState.city) await mapEnsureCityCenter(_mapState.city);   // מרכז העיר — לדחיית תוצאות מחוץ לעיר
  const c0=mapCounts();
  const list=mapShownStudents().filter(stuNeedsGeo);   // כולל כתובות שנכשלו — ניסיון חוזר
  if(!list.length){
    mapPlotStudents(); mapFit();
    let msg = c0.stuAddr===0 ? "אין לתלמידות המוצגות כתובת (רחוב/מספר) להצגה על המפה"
            : ("כל התלמידות עם כתובת כבר ממוקמות ("+c0.stuLoc+")");
    mapStatus(msg); if(btn) btn.disabled=false; return;
  }
  let done=0, ok=0, fail=0;
  for(const s of list){ const q=studentAddrQuery(s);
    const r=await ensureGeo(s,q,true,(s.city||"").trim()||_mapState.city||geoDefaultCity(),(_cityCenter&&_cityCenter.lat!=null)?_cityCenter:null); done++; if(r) ok++; else fail++;
    mapStatus("ממקם תלמידות… "+done+"/"+list.length+(fail?(" · "+fail+" ללא תוצאה"):""));
    if(r) mapPlotStudents();
  }
  try{ save(); }catch(e){}
  mapBuildGanColors();
  mapPlotStudents(); mapFit(); mapRenderSide();
  let extra="";
  if(fail && _geoGoogle!==true) extra=" — הרבה כתובות לא נמצאו ב-OpenStreetMap; חיבור מפתח Google (כלים ושירותים → דיוק מפה) ישפר משמעותית";
  mapStatus(mapStatusReport()+extra);

}
function mapRefreshGeo(){
  if(!confirm("לרענן את המיקומים של הגנים והתלמידות המוצגים? הכתובות יומרו מחדש (עשוי לקחת זמן). אם הוגדר מפתח Google — הרענון ישדרג לדיוק גבוה.")) return;
  mapSelectedGans().forEach(g=>{ if(!(g.geo&&g.geo.manual)) delete g.geo; });   // שומר מיקום ידני
  mapShownStudents().forEach(s=>{ delete s.geo; });
  mapStatus("מרענן מיקומי גנים…");
  mapGeocodeSelectedGans().then(()=>{ mapBuildGanColors(); mapPlotGans(); mapPlotStudents(); mapFit(); mapRenderSide();
    mapStatus("רענון הגנים הושלם — לחצ/י \"טעינת מיקומי תלמידות\""); });

function mapFit(){
  if(!_map||!_mapL) return;
  const pts=[];
  mapSelectedGans().forEach(g=>{ if(mapGanShown(g)) pts.push([g.geo.lat,g.geo.lng]); });
  mapShownStudents().forEach(s=>{ if(s.geo&&s.geo.lat!=null && mapInCity(s.geo)) pts.push([s.geo.lat,s.geo.lng]); });
  if(!pts.length) return;
  try{ _map.fitBounds(_mapL.latLngBounds(pts).pad(0.2), { maxZoom:16 }); }catch(e){}
}

function buildGanImportRows(rows){

    gn.teacherName=g("teacherName");

    gn.phoneGan=g("phoneGan"); gn.phoneHome=g("phoneHome"); gn.teacherMobile=fixPhone(g("teacherMobile"));
    gn.assistantName=g("assistantName"); gn.assistantMobile=fixPhone(g("assistantMobile"));
    gn.capacity=g("capacity").replace(/[^\d]/g,""); gn.docsNote=g("docsNote");
    if(idx.active!=null){ const av=g("active").trim(); gn.active=!/^(לא|כבוי|לאפעיל|0|false|no|off|inactive)$/i.test(av); }
    if(!gn.ganName && !gn.teacherName && !gn.ganSymbol && !gn.internalSymbol) continue; // שורה ריקה
    const key=(gn.ganSymbol||"")+"|"+(gn.internalSymbol||"")+"|"+(gn.ganName||gn.teacherName||"");
    const fileDup = seen.has(key); seen.add(key);
    list.push({ gan:gn, dup:ganExists(gn), fileDup });
  }
  return { list, mapped };
}

    function go(){try{if(onePage){var availMm=landscape?186:273,avail=availMm*96/25.4,h=document.body.scrollHeight;if(h>avail)document.body.style.zoom=Math.max(0.4,avail/h);}}catch(e){}

/* טעינה עצלה של ספריות ה-PDF מ-CDN (כמו טעינת Firebase) — פעם אחת. */
let _pdfLibs=null;
function loadPdfLibs(){
  if(_pdfLibs) return _pdfLibs;
  const one=src=>new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src;
    const to=setTimeout(()=>rej(new Error("timeout")), 15000); // אם ה-CDN אינו נגיש — לא נתקע
    s.onload=()=>{ clearTimeout(to); res(); }; s.onerror=()=>{ clearTimeout(to); rej(new Error("load-fail")); };
    document.head.appendChild(s); });
  _pdfLibs=(async()=>{
    if(!window.html2canvas) await one("https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js");
    if(!(window.jspdf&&window.jspdf.jsPDF)) await one("https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js");
  })().catch(e=>{ _pdfLibs=null; throw e; });
  return _pdfLibs;
}
/* יצירת PDF ממותג מהמסמך — רינדור לתמונה (עברית RTL מושלמת) ואז לעמודי A4. */
async function reportToPdfBlob(opts){
  await loadPdfLibs();
  const { jsPDF }=window.jspdf;
  const widthPx = opts.landscape ? 1080 : 760;
  const holder=document.createElement("div");
  holder.style.cssText="position:fixed;left:-10000px;top:0;width:"+widthPx+"px;background:#fff;z-index:-1";
  holder.innerHTML=reportInnerHtml(opts);
  document.body.appendChild(holder);
  let canvas;
  try{ canvas=await window.html2canvas(holder.querySelector(".rep-doc"), { scale:2, backgroundColor:"#fff", useCORS:true }); }
  finally{ document.body.removeChild(holder); }
  const pdf=new jsPDF({ orientation: opts.landscape?"landscape":"portrait", unit:"mm", format:"a4" });
  const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(), margin=8;
  const imgW=pw-margin*2, pxPerMm=canvas.width/imgW, fullH=canvas.height/pxPerMm; // גובה התמונה במ"מ ברוחב העמוד
  const pageH=ph-margin*2;
  if(opts.onePage || fullH<=pageH){
    let drawW=imgW, drawH=fullH;
    if(drawH>pageH){ const sc=pageH/drawH; drawH*=sc; drawW*=sc; }
    pdf.addImage(canvas.toDataURL("image/jpeg",0.92),"JPEG",(pw-drawW)/2,margin,drawW,drawH);
  } else {
    const sliceHpx=Math.floor(pageH*pxPerMm); let y=0, first=true;
    while(y<canvas.height){
      const hpx=Math.min(sliceHpx, canvas.height-y);
      const sc=document.createElement("canvas"); sc.width=canvas.width; sc.height=hpx;
      const ctx=sc.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,sc.width,sc.height);
      ctx.drawImage(canvas,0,y,canvas.width,hpx,0,0,canvas.width,hpx);
      if(!first) pdf.addPage();
      pdf.addImage(sc.toDataURL("image/jpeg",0.92),"JPEG",margin,margin,imgW,hpx/pxPerMm);
      y+=hpx; first=false;
    }
  }
  return pdf.output("blob");
}
/* שיתוף המסמך כ-PDF — קובץ אמיתי המצורף למייל/וואטסאפ דרך Web Share API.
   נפילות: אם יצירת ה-PDF נכשלה → מסמך HTML; אם אין שיתוף קבצים → הורדה + מייל. */
async function shareReportDoc(opts){
  toast("מכין מסמך PDF…");
  let file;
  try{
    const blob=await reportToPdfBlob(opts);
    file=new File([blob], safeFileName(opts.fileName||opts.title)+".pdf", { type:"application/pdf" });
  }catch(e){
    console.error("pdf-fail", e);
    const html=buildReportHtml(opts, { autoPrint:false });
    file=new File([html], safeFileName(opts.fileName||opts.title)+".html", { type:"text/html" });
    toast("יצירת PDF נכשלה — משתף מסמך HTML במקום");
  }
  try{
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ title:opts.title, text:(opts.subtitle||opts.title||""), files:[file] });
      return;
    }
  }catch(e){ if(e && e.name==="AbortError") return; }
  // נפילה — הורדת הקובץ + פתיחת מייל לצירוף ידני
  downloadBlob(file, file.name);
  toast("המסמך הורד — צרפ/י אותו למייל");
  location.href="mailto:?subject="+encodeURIComponent(opts.title||"")+"&body="+encodeURIComponent((opts.subtitle||"")+"\n\n(הקובץ '"+file.name+"' הורד למכשיר — יש לצרפו למייל.)");
}

/* פרטי איש צוות המשובץ בתפקיד בגן (שם/טלפון/ימים) + רשומת הצוות המלאה */
function asgStaffInfo(a, role){ const c=a[role]||{}; const m=c.staffId?DB.staff.find(x=>x.id===c.staffId):null;
  return { name:c.name||(m?staffName(m):""), phone:c.phone||(m?(m.mobile||m.phone||""):"")||"", days:(c.days||[]), m }; }

/* ---- יום חופשי אוטומטי (סעיף 6) ----
   כשמשובץ תפקיד "משלים" בימים מסוימים, בעל התפקיד הראשי המקביל בגן ביום חופשי באותם ימים.
   מיפוי: גננת משלימה→גננת · סייעת משלימה→סייעת · סייעת רפואית משלימה→סייעת רפואית.
   (סייעת רפואית רגילה אינה מקנה יום חופשי לאף אחד.) */
const FREE_DAY_MAP = { "גננת משלימה":"גננת", "סייעת משלימה":"סייעת", "סייעת רפואית משלימה":"סייעת רפואית" };
/* מפה של תפקיד-ראשי → ימים חופשיים, לפי המשלימות בגן */
function ganFreeDays(ganId, ctx='activity'){
  const a=ganAsg(ganId, ctx), out={};
  Object.keys(FREE_DAY_MAP).forEach(comp=>{ const c=a[comp];
    if(c && Array.isArray(c.days) && c.days.length){ const p=FREE_DAY_MAP[comp]; out[p]=[...new Set((out[p]||[]).concat(c.days))]; } });
  return out;
}
/* הימים החופשיים של איש צוות (לפי שיבוצו כתפקיד ראשי בגן) — מחזיר [{ganId, role, days}] */
function staffFreeDays(staffId, ctx='activity'){
  const y=DB.assignments[DB.activeYear], c=y&&y[ctx]; if(!c||!staffId) return [];
  const res=[];
  Object.keys(c).forEach(ganId=>{ const a=c[ganId]||{};
    ["גננת","סייעת","סייעת רפואית"].forEach(role=>{ const e=a[role];
      if(e && e.staffId===staffId){ const fd=ganFreeDays(ganId, ctx)[role]; if(fd&&fd.length) res.push({ ganId, role, days:fd }); } });
  });
  return res;
}

/* ---- 7.2 · מצבת למשרד הראשי — מסודר לפי גן, כל אנשי הצוות עם צבע לפי התפקיד ---- */
function makeAsgMainOffice(opts){
  opts=opts||{};

  const rolesUsed=new Set();
  const blocks=gans.map(g=>{
    const a=ganAsg(g.id,'activity'), free=ganFreeDays(g.id,'activity');
    const rows=assignRoles().map(meta=>{
      const c=a[meta.role]; if(!c || !(c.name||c.staffId)) return "";
      rolesUsed.add(meta.role);

      const hours=HOURS_ROLES.includes(meta.role)?esc(c.hours||(info.m&&info.m.weeklyHours)||""):"";
      let daysTxt=info.days.length?info.days.join(", "):asgExtraText(meta.role,c);
      if(free[meta.role] && free[meta.role].length) daysTxt=`🏖️ יום חופשי: ${free[meta.role].join(", ")}`;
      const col=roleColor(meta.role), bg=col?` style="background:${hexToRgba(col,.20)}"`:"";
      return `<tr${bg}><td>${esc(meta.role)}</td><td><b>${esc(info.name)}</b></td><td>${esc(info.phone)}</td><td>${esc(daysTxt)}</td><td>${hours}</td></tr>`;
    }).filter(Boolean).join("");
    if(!rows) return "";
    const reg=studentsOfYear().filter(s=>s.ganId===g.id&&!s.finished).length;
    const meta=[g.age?("גיל "+g.age):"", g.ganSymbol?("סמל "+g.ganSymbol):"", [g.address,g.building].filter(Boolean).join(" "), reg+" תלמידות"].filter(Boolean).join(" · ");

  }).filter(Boolean).join("");
  if(!blocks){ toast("אין שיבוצים להצגה"); return; }
  const legendRoles=[...rolesUsed].filter(r=>roleColor(r));
  const legend=legendRoles.length?`<div class="legend"><b style="margin-inline-end:6px">מקרא תפקידים:</b>${legendRoles.map(r=>`<span><span class="sw" style="background:${roleColor(r)}"></span>${esc(r)}</span>`).join("")}</div>`:"";
  const rep={ title:"מצבת שיבוץ צוות — משרד ראשי", subtitle:`שנת ${DB.activeYear} · ${gans.length} גנים`,
    bodyHtml:blocks+legend, onePage:!!opts.onePage, landscape:true, fileName:"מצבת שיבוץ ראשי "+DB.activeYear };
  if(opts.share) shareReportDoc(rep); else printReport(rep);

/* ============================================================
   עוגות (donut) — כלי עזר לציור התפלגויות באחוזים ובצבעים
   ============================================================ */
const PIE_PALETTE = ['#2c6a4c','#e0a53a','#3f7cac','#c65d5d','#7b5ea7','#4bb1a6','#b0743e','#8a9b3e','#c977a6','#5a7a8c','#9c6f2c','#6a8f5b','#a15b12','#5b8def','#d08770','#69a297'];

/* SVG donut. items:[{label,value,color}] — center מוצג במרכז */
function donutSVG(items,{size=190,thickness=30,center=''}={}){
  const total=items.reduce((s,d)=>s+(+d.value||0),0);
  const r=(size-thickness)/2, cx=size/2, cy=size/2, C=2*Math.PI*r;
  let acc=0;
  const arcs = total<=0
    ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${thickness}"/>`
    : items.filter(d=>+d.value>0).map(d=>{
        const len=(+d.value/total)*C;
        const el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${thickness}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"><title>${esc(d.label)}: ${d.value} (${(d.value/total*100).toFixed(1)}%)</title></circle>`;
        acc+=len; return el;
      }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" style="max-width:100%;height:auto">
    ${arcs}
    <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="${(size*0.24).toFixed(0)}" font-weight="800" fill="var(--ink)">${esc(center===''?String(total):center)}</text>
    <text x="${cx}" y="${(cy+size*0.16).toFixed(0)}" text-anchor="middle" font-size="${(size*0.08).toFixed(0)}" fill="var(--muted)">סה"כ</text>
  </svg>`;
}
/* בלוק עוגה + מקרא (legend) עם אחוזים */
function pieBlock(rawItems,{size=190,thickness=30,center=''}={}){
  const items=rawItems.map((d,i)=>({...d,color:d.color||PIE_PALETTE[i%PIE_PALETTE.length]}));
  const total=items.reduce((s,d)=>s+(+d.value||0),0);
  const legend=items.map(d=>{
    const pct=total?(+d.value/total*100):0;
    return `<div class="pie-leg-row"><span class="pie-dot" style="background:${d.color}"></span><span class="pie-leg-label">${esc(d.label)}</span><span class="pie-leg-val">${d.value}<small>· ${pct.toFixed(1)}%</small></span></div>`;
  }).join("");
  return `<div class="pie-block"><div class="pie-svg">${donutSVG(items,{size,thickness,center})}</div><div class="pie-legend">${legend||'<div class="hint">אין נתונים להצגה.</div>'}</div></div>`;
}

/* מחשבון אחוזים חופשי — בחירת קמפוסים + גילי גנים + שנים, עם עוגות ותחזית (סעיף 2) */
let freeCalc = { campuses:[], ganAges:[], years:null, forecast:'' };
function renderFreeCalc(host){
  const scopedGans = eduScope(DB.gans).filter(g=>g.active);
  // גילים וקמפוסים מתוך נתונים היסטוריים לפי גן — כדי שיוצגו כאפשרויות גם לשנים היסטוריות
  const histAges=new Set(), histCampuses=new Set();
  Object.values(DB.historicalGans||{}).forEach(arr=>(arr||[]).forEach(r=>{ if((r.age||'').trim())histAges.add(r.age.trim()); if((r.campus||'').trim())histCampuses.add(r.campus.trim()); }));
  const campuses=[...new Set([...scopedGans.map(g=>(g.campus||'').trim()),...histCampuses].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'he'));
  const ages=[...new Set([...scopedGans.map(g=>(g.age||'').trim()),...histAges].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'he',{numeric:true}));
  if(freeCalc.years===null) freeCalc.years=[DB.activeYear];
  // ניקוי בחירות שכבר לא קיימות
  freeCalc.campuses=freeCalc.campuses.filter(c=>campuses.includes(c));
  freeCalc.ganAges=freeCalc.ganAges.filter(a=>ages.includes(a));
  freeCalc.years=freeCalc.years.filter(y=>DB.years.includes(y)); if(!freeCalc.years.length) freeCalc.years=[DB.activeYear];

  host.innerHTML=`
    <div class="grid" style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
      <fieldset><legend>קמפוסים</legend>
        ${campuses.length?`<div class="checks" style="grid-template-columns:1fr">
          ${campuses.map(c=>`<label class="check"><input type="checkbox" class="fc-campus" value="${esc(c)}" ${freeCalc.campuses.includes(c)?'checked':''}> ${esc(c)}</label>`).join("")}
        </div><div class="hint">ריק = כל הקמפוסים.</div>`:'<div class="hint">לא הוגדרו קמפוסים בגנים. מלא/י "קמפוס גנים" בכרטיס הגן.</div>'}
      </fieldset>
      <fieldset><legend>גילי גנים</legend>
        ${ages.length?`<div class="checks" style="grid-template-columns:repeat(auto-fill,minmax(70px,1fr))">
          ${ages.map(a=>`<label class="check"><input type="checkbox" class="fc-age" value="${esc(a)}" ${freeCalc.ganAges.includes(a)?'checked':''}> גיל ${esc(a)}</label>`).join("")}
        </div><div class="hint">ריק = כל הגילים.</div>`:'<div class="hint">לא הוגדרו גילי גנים.</div>'}
      </fieldset>
      <fieldset><legend>שנים להשוואה</legend>
        <div class="checks" style="grid-template-columns:repeat(auto-fill,minmax(90px,1fr))">
          ${DB.years.map(y=>`<label class="check"><input type="checkbox" class="fc-year" value="${esc(y)}" ${freeCalc.years.includes(y)?'checked':''}> ${esc(y)}</label>`).join("")}
        </div><div class="hint">בחר/י שנה אחת או יותר להשוואה.</div>
      </fieldset>
      <fieldset><legend>תחזית לשנה חדשה</legend>
        <div class="field"><label>מספר גנים לתחזית (למשל 8 במקום 9)</label>
          <input id="fc-forecast" inputmode="numeric" placeholder="אופציונלי" value="${esc(freeCalc.forecast)}"></div>
        <div class="hint">מחשב מחדש את הממוצע לגן לפי מספר הגנים שתבחר/י.</div>
      </fieldset>
    </div>
    <div id="fc-out" style="margin-top:16px"></div>`;

  const recalc=()=>{
    freeCalc.campuses=[...host.querySelectorAll('.fc-campus:checked')].map(c=>c.value);
    freeCalc.ganAges=[...host.querySelectorAll('.fc-age:checked')].map(c=>c.value);
    freeCalc.years=[...host.querySelectorAll('.fc-year:checked')].map(c=>c.value);
    freeCalc.forecast=$("#fc-forecast").value.trim();
    if(!freeCalc.years.length) freeCalc.years=[DB.activeYear];
    computeFreeCalc($("#fc-out"), scopedGans);
  };
  host.querySelectorAll('.fc-campus,.fc-age,.fc-year').forEach(el=>el.onchange=recalc);
  $("#fc-forecast").oninput=recalc;
  computeFreeCalc($("#fc-out"), scopedGans);
}

function computeFreeCalc(out, scopedGans){
  const campusF=freeCalc.campuses, ageF=freeCalc.ganAges;
  const forecastN=+freeCalc.forecast>0?+freeCalc.forecast:0;
  const matchAge=a=>!ageF.length || ageF.includes((a||'').trim());
  const matchCampus=c=>!campusF.length || campusF.includes((c||'').trim());
  const sumk=(rows,k)=>rows.reduce((s,r)=>s+(+r[k]||0),0);
  // מיפוי שם גן → קמפוס, לזיהוי קמפוס בנתונים היסטוריים לפי שם הגן
  const norm=s=>String(s||'').replace(/["'.\-–־׳״]/g,'').replace(/\s+/g,'').trim().toLowerCase();
  const campusByName=new Map();
  eduScope(DB.gans).forEach(g=>{ const c=(g.campus||'').trim(); if(!c) return; [g.ganName,g.teacherName].forEach(nm=>{ if(nm&&!campusByName.has(norm(nm))) campusByName.set(norm(nm),c); }); });

  // נתונים לשנה — נתונים חיים אם קיימים, אחרת נתונים היסטוריים לפי גן
  function dataForYear(y){
    const liveStu=eduScope(studentsOfYear(y).filter(s=>!s.finished));
    if(liveStu.length){
      const gans=scopedGans.filter(g=>matchCampus(g.campus)&&matchAge(g.age));
      const ids=new Set(gans.map(g=>g.id));
      const stu=liveStu.filter(s=>ids.has(s.ganId));
      const perGan=gans.map(g=>({label:ganName(g.id),n:stu.filter(s=>s.ganId===g.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
      const byPeriod=PERIODS.map(p=>({p,n:stu.filter(s=>s.period===p).length}));
      return {year:y,source:'live',ganCount:gans.length,total:stu.length,perGan,byPeriod,hasData:gans.length>0};
    }
    const hg=(DB.historicalGans&&DB.historicalGans[y])||[];
    if(hg.length){
      const rows=hg.filter(r=>matchAge(r.age)&&matchCampus(r.campus||campusByName.get(norm(r.gan))||''));
      const perGan=rows.map(r=>({label:r.gan+(r.age?` · גיל ${esc(r.age)}`:''),n:histGanTotal(r)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
      const byPeriod=[{p:'א',n:sumk(rows,'a')},{p:'ב',n:sumk(rows,'b')},{p:'ג',n:sumk(rows,'c')},{p:'סופי',n:sumk(rows,'f')}];
      return {year:y,source:'hist',ganCount:rows.length,total:rows.reduce((s,r)=>s+histGanTotal(r),0),perGan,byPeriod,hasData:rows.length>0};
    }
    return {year:y,source:'none',ganCount:0,total:0,perGan:[],byPeriod:PERIODS.map(p=>({p,n:0})),hasData:false};
  }

  const chips=[
    campusF.length?`קמפוסים: ${campusF.map(esc).join(", ")}`:'כל הקמפוסים',
    ageF.length?`גילים: ${ageF.map(esc).join(", ")}`:'כל הגילים'
  ].join(' · ');

  const years=freeCalc.years.slice().sort((a,b)=>String(a).localeCompare(String(b),'he',{numeric:true}));
  const perYear=years.map(dataForYear);

  if(!perYear.some(y=>y.hasData)){
    out.innerHTML=`<div class="note">אין נתונים תואמים לבחירה בשנים שנבחרו — לא נמצאו גנים חיים ולא נתונים היסטוריים. שנה/י את הקמפוסים, הגילים או השנים.<br><span class="hint">נתונים היסטוריים לפי גן מזינים בלשונית "הגדרות".</span></div>`;
    return;
  }

  const yearCards=perYear.map(yd=>{
    const avgActual=yd.ganCount?yd.total/yd.ganCount:0;
    const avgForecast=forecastN?yd.total/forecastN:0;
    const badge=yd.source==='hist'?'<span class="pill neutral" style="font-size:.72rem">נתונים היסטוריים</span>':(yd.source==='live'?'<span class="pill ok" style="font-size:.72rem">נתונים חיים</span>':'');
    return `<div class="pie-card">
      <h4>שנת ${esc(yd.year)} ${badge}</h4>
      ${!yd.hasData?'<div class="empty" style="padding:20px">אין נתונים לשנה זו בבחירה הנוכחית.</div>':`
      <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin-bottom:12px">
        <div class="stat hero"><div class="k">סה"כ תלמידות</div><div class="v">${yd.total}</div></div>
        <div class="stat"><div class="k">ממוצע לגן</div><div class="v">${avgActual.toFixed(1)}<small>/ ${yd.ganCount} גנים</small></div></div>
        ${forecastN?`<div class="stat"><div class="k">תחזית: ממוצע ל-${forecastN} גנים</div><div class="v">${avgForecast.toFixed(1)}</div></div>`:''}
      </div>
      ${pieBlock(yd.perGan.map(x=>({label:x.label,value:x.n})),{size:170,thickness:26,center:String(yd.total)})}
      <div class="hint" style="margin-top:10px">מועדים: ${yd.byPeriod.map(p=>`${p.p}: <b>${p.n}</b>`).join(' · ')}</div>`}
    </div>`;
  }).join("");

  // השוואה בין שנים (אם יותר משנה אחת)
  let compare='';
  if(perYear.length>1){
    const comparePie=pieBlock(perYear.map(yd=>({label:`שנת ${yd.year}`,value:yd.total})),{size:180,thickness:28});
    let growth='';
    for(let i=1;i<perYear.length;i++){
      const a=perYear[i-1], b=perYear[i];
      const diff=b.total-a.total, pct=a.total?diff/a.total*100:0;
      growth+=`<div class="pie-leg-row"><span class="pie-leg-label">${esc(a.year)} ← ${esc(b.year)}</span><span class="pie-leg-val">${diff>=0?'+':''}${diff}<small>· ${pct>=0?'+':''}${pct.toFixed(1)}%</small></span></div>`;
    }
    compare=`<div class="pie-card" style="margin-bottom:16px">
      <h4>השוואה בין השנים · סה"כ תלמידות</h4>
      ${comparePie}
      <div class="pie-legend" style="margin-top:10px">${growth}</div>
    </div>`;
  }

  out.innerHTML=`
    <div class="note" style="background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent-strong);margin-bottom:14px">
      ${esc(chips)}${forecastN?` · תחזית ל-<b>${forecastN}</b> גנים`:''}
    </div>
    ${compare}
    <div class="pie-grid">${yearCards}</div>`;
}

/* ============================================================
   טאב עירייה — התאמה לפי ת"ז
   ============================================================ */
const MUNI_HEADER_MAP = {
  "תז":"tz","תעודתזהות":"tz","מספרזהות":"tz","זהות":"tz","מסזהות":"tz",
  "שםהאב":"fatherName","אב":"fatherName","אבא":"fatherName","שםאב":"fatherName","שםהאבא":"fatherName","שםאבא":"fatherName",
  "שםהאם":"motherName","אם":"motherName","אמא":"motherName","שםאם":"motherName","שםהאמא":"motherName","שםאמא":"motherName"
};
/* פענוח קלט העירייה: אם יש כותרת "ת"ז" — קוראים כטבלה (כולל שם אב/אם); אחרת — רשימת ת"ז חופשית */
function parseMuniInput(text){
  const rows=parseTable(text);
  const parents=new Map(); // tz -> {father,mother}
  let structured=false, tzList=[];
  if(rows.length){
    const header=rows[0].map(normHeader); const hi={};
    header.forEach((h,i)=>{ const k=MUNI_HEADER_MAP[h]; if(k && hi[k]==null) hi[k]=i; });
    if(hi.tz!=null){
      structured=true;
      for(let r=1;r<rows.length;r++){ const c=rows[r];
        const tz=digits(c[hi.tz]||""); if(!tz) continue; tzList.push(tz);
        const fa=hi.fatherName!=null?String(c[hi.fatherName]??"").trim():"";
        const mo=hi.motherName!=null?String(c[hi.motherName]??"").trim():"";
        if(fa||mo){ const cur=parents.get(tz)||{}; if(fa&&!cur.father)cur.father=fa; if(mo&&!cur.mother)cur.mother=mo; parents.set(tz,cur); }
      }
    }
  }
  if(!structured) tzList=(String(text||"").match(/\d{5,}/g)||[]);
  return { nums:[...new Set(tzList)], parents, structured };
}

        </div>

        <div class="stat"><div class="k">בעירייה ולא במערכת</div><div class="v">${notFound.length}</div></div>

    toast("ההתאמה בוצעה");
  };
}

let staffFilter = { q:"", role:"", status:"active" }; // status: active / left / all
let staffFiltersOpen=false;
const staffIsActive = m => m.active!==false;              // רשומות ישנות ללא הדגל = פעילות
let staffSort = { key:"lastName", dir:1 };
function staffFiltered(){
  const q=staffFilter.q.trim().toLowerCase();
  const list=eduScope(DB.staff).filter(m=>{ // מכבד את בורר החינוך הראשי (רגיל/מיוחד)
    if(staffFilter.status==='active' && !staffIsActive(m)) return false;   // הסתרת מי שעזב/ה
    if(staffFilter.status==='left'   &&  staffIsActive(m)) return false;
    if(staffFilter.role && m.role!==staffFilter.role) return false;
    if(q){ const hay=(staffName(m)+" "+m.tz+" "+m.email+" "+m.role+" "+m.phone+" "+m.mobile+" "+m.city).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const k=staffSort.key, d=staffSort.dir;
  const roleIdx=m=>{ const i=STAFF_ROLES.indexOf(m.role); return i<0?99:i; };
  const keyVal=m=> k==='name'? staffName(m) : String(m[k]||"");
  return list.sort((a,b)=>{
    let r; if(k==='role') r=roleIdx(a)-roleIdx(b);
    else r=keyVal(a).localeCompare(keyVal(b),"he");
    return r*d || staffName(a).localeCompare(staffName(b),"he");
  });
}

        ${show.map(x=>`<tr style="${(x.fileDup||(x.dup&&skip))?'opacity:.5':''}">

/* ============================================================
   טאב שיבוץ — שיבוץ צוות לגנים לפי שנה + הקשר (פעילות/צהרונים/קייטנות)
   סעיפים 5, 7, 8, 17–18
   ============================================================ */
let asgContext = "activity"; // הקשר השיבוץ הנבחר (סעיף 8)
let asgGanQ = "";            // חיפוש גן בשיבוץ (סעיף 19)
function asgYear(){ return DB.assignments[DB.activeYear] || (DB.assignments[DB.activeYear]={}); }
function asgCtxMap(ctx=asgContext){ const y=asgYear(); return y[ctx] || (y[ctx]={}); } // ליצירה/כתיבה
function ganAsg(ganId, ctx=asgContext){ const y=DB.assignments[DB.activeYear]; const c=y&&y[ctx]; return (c&&c[ganId])||{}; } // קריאה בלבד
function ctxLabel(id){ const c=ASSIGN_CONTEXTS.find(x=>x.id===id); return c?c.label:id; }
function asgRoleMeta(role){ return ASSIGN_ROLES.find(r=>r.role===role); }
function asgExtraLabel(role){ const ex=EXTRA_BY_ROLE[role]; return ex==="days"?"ימים":(ex==="duration"?"תקופה":""); }
function asgExtraText(role, cur){
  const ex=EXTRA_BY_ROLE[role]; if(!ex||!cur) return "";
  if(ex==="days") return (cur.days||[]).join(", ");
  if(ex==="duration"){
    if(cur.durType==="year") return "שנה";
    if(cur.durType==="dates") return (cur.durFrom||cur.durTo)?`${cur.durFrom?fmtDate(cur.durFrom):'—'} עד ${cur.durTo?fmtDate(cur.durTo):'—'}`:"טווח תאריכים";
    if(cur.durType==="months") return cur.durMonths?`${cur.durMonths} חודשים`:"מספר חודשים"; // תאימות לאחור
  }
  return "";
}
/* שמות הילדות המשויכות לעובד/ת בתפקיד סיוע (שילוב/רפואית/מנתחת/הכנה) — סעיפים 15, 21 */
function asgStudentsLabel(role, cur){
  if(!supportKeyForRole(role) || !cur || !Array.isArray(cur.students) || !cur.students.length) return "";
  return cur.students.map(id=>{ const s=DB.students.find(x=>x.id===id); return s?staffName({lastName:s.lastName,firstName:s.firstName}):""; }).filter(Boolean).join(", ");
}
/* אינדקס שיבוצי צוות לשנה+הקשר הנוכחיים לפי מזהה עובד/ת — לצורך מניעת שיבוץ כפול (סעיף 1).
   מדלג על הגן הנוכחי (exceptGanId) כדי לזהות רק שיבוצים בגנים אחרים. הכל לפי השנה הפעילה (סעיף 3). */
function staffAsgIndex(ctx=asgContext, exceptGanId=null){
  const idx={};
  const y=DB.assignments[DB.activeYear]; const c=y&&y[ctx]; if(!c) return idx;
  Object.keys(c).forEach(ganId=>{
    if(ganId===exceptGanId) return;
    const entry=c[ganId]||{};
    Object.keys(entry).forEach(role=>{
      const v=entry[role]; if(!v||!v.staffId) return;
      (idx[v.staffId]||(idx[v.staffId]=[])).push({ ganId, role, days:(v.days||[]) });
    });
  });
  return idx;
}
/* כל שיבוצי איש/אשת צוות בכל השנים/הקשרים — לתיק מלא (סעיף 22) */
function staffAssignmentsFull(staffId){
  const out=[]; const A=DB.assignments||{};
  Object.keys(A).forEach(year=>{ const yc=A[year]||{};
    Object.keys(yc).forEach(ctx=>{ const cg=yc[ctx]||{};
      Object.keys(cg).forEach(ganId=>{ const entry=cg[ganId]||{};
        Object.keys(entry).forEach(role=>{ const v=entry[role]; if(!v||v.staffId!==staffId) return;
          out.push({ year, ctx, ganId, role, days:v.days||[], durType:v.durType, durMonths:v.durMonths, durFrom:v.durFrom, durTo:v.durTo, students:v.students||[] });
        });
      });
    });
  });
  return out;
}
/* הימים התפוסים לעובד/ת בגנים אחרים (תפקידי "לפי ימים") → { יום: שם הגן } */
function staffTakenDays(idx, staffId){
  const map={}; (idx[staffId]||[]).forEach(a=>(a.days||[]).forEach(d=>{ if(!map[d]) map[d]=ganName(a.ganId); })); return map;
}
function viewAssign(root){

  root.innerHTML=`

        <div class="stat"><div class="k">גנים מתחת למינימום</div><div class="v" style="color:${below?'var(--bad)':'var(--good)'}">${below}</div></div>
        <div class="stat"><div class="k">סה"כ רשומות לצהרון</div><div class="v">${totalReg}</div></div>
      </div>${!tzMin?`<div class="hint" style="margin-top:6px">לחישוב מדויק — הגדר/י "מינימום לפתיחת צהרון" בהגדרות.</div>`:''}`;
    } else asgSum.innerHTML="";
  }
  const regBadgeFor = g => {
    if(asgContext==='tzaharon'){ const c=progCount(g); const cls=(tzMin && c<tzMin)?'no':'ok'; return `<span class="pill ${cls}" title="רשומים לצהרון${tzMin?` · מינימום לפתיחה ${tzMin}`:''}">${c}${tzMin?(' / '+tzMin):''}</span>`; }
    if(isProg){ return `<span class="pill neutral">${progCount(g)}</span>`; }
    const c=ganReg(g); return capPill(c, g.capacity);

  pick.innerHTML=`${asgContext==='tzaharon'?`<div class="hint" style="margin-bottom:8px">מינימום לפתיחת צהרון: <b>${tzMin||'לא הוגדר'}</b> (נקבע בהגדרות). אדום = מתחת למינימום, ירוק = ניתן לפתוח.</div>`:''}
    <div class="searchbar" style="max-width:420px"><div class="search-field"><span class="mag">🔎</span><input id="asgGanSearch" value="${esc(asgGanQ)}" placeholder="חיפוש גן (שם / סמל / כתובת)…"></div></div>
    <div class="table-wrap"><table><thead><tr>
    <th>שם הגן</th><th>סמל</th><th>כתובת</th><th>${esc(regLabel)}</th><th>מצב שיבוץ</th><th></th></tr></thead><tbody>
    ${gans.map(g=>{
      const filled=Object.keys(ganAsg(g.id)).length;
      const hay=(ganName(g.id)+" "+(g.ganSymbol||"")+" "+(g.internalSymbol||"")+" "+(g.address||"")+" "+(g.building||"")).toLowerCase();
      return `<tr class="asg-gan-row" data-hay="${esc(hay)}">

/* מודל שיבוץ צוות לגן בודד — סעיפים 5, 7 */
/* גן חובה — גיל 5 (בגני חובה אין "סייעת ב'") — סעיף 14 */
function isMandatoryGan(g){ return String(g&&g.age||"").trim()==="5"; }
function openGanAssign(ganId){
  const g=ganById(ganId); if(!g) return;
  const a=ganAsg(ganId);
  const ganEdu=eduLabel(g);
  const reg=studentsOfYear().filter(s=>s.ganId===g.id && !s.finished).length;
  /* אינדקס שיבוצי צוות בגנים אחרים (אותה שנה + אותו הקשר) — למניעת שיבוץ כפול (סעיף 1) */
  const idx=staffAsgIndex(asgContext, ganId);
  /* "סייעת ב'" נפתחת רק כשהגן הגיע ל-30 בנות; אם כבר קיים שיבוץ כזה נשמור אותו לעריכה (סעיף 2).
     בגני חובה (גיל 5) אין "סייעת ב'" כלל (סעיף 14). */
  const mandatory = isMandatoryGan(g);
  const bAssigned = !!(a[ASSISTANT_B_ROLE] && (a[ASSISTANT_B_ROLE].staffId||a[ASSISTANT_B_ROLE].name));
  const bEligible = reg>=ASSISTANT_B_MIN && !mandatory;
  const roles = assignRoles()   // לפי הסדר שנקבע בהגדרות
    .filter(m=> m.role!==ASSISTANT_B_ROLE || ((bEligible || bAssigned) && !mandatory))
    .filter(m=> roleFitsEdu(m.role, ganEdu)); // רק תפקידים המשויכים לחינוך הגן
  /* בניית רשימת עובדות לבחירה — משלים אוטומטי מקובץ, עם הפרדה לפי חינוך הגן (רגיל/מיוחד) */
  const byNameHe=(x,y)=>staffName(x).localeCompare(staffName(y),"he");
  const staffEduMatch=m=> eduLabel(m)===ganEdu;   // רק צוות מאותו חינוך של הגן — לא לערבב רגיל/מיוחד
  function staffPool(role, q){
    const ql=String(q||"").trim();
    const ok=m=> staffIsActive(m) && staffEduMatch(m) && (!ql || (staffName(m)+" "+(m.mobile||"")+" "+(m.phone||"")+" "+(m.role||"")).includes(ql));
    return { here:DB.staff.filter(m=>ok(m)&&m.role===role).sort(byNameHe),
             other:DB.staff.filter(m=>ok(m)&&m.role!==role).sort(byNameHe) };
  }
  /* HTML של רשימה נפתחת מקובצת: קודם התפקיד המבוקש, ואז "שאר הצוות" */
  function dropHtml(role, q){
    const {here,other}=staffPool(role,q);
    const item=(m,showRole)=>{ const elsewhere=idx[m.id]?ganName(idx[m.id][0].ganId):"";
      return `<div class="asg-opt" data-id="${esc(m.id)}"><b>${esc(staffName(m))}</b>${showRole?` · <span style="color:var(--muted)">[${esc(m.role||'ללא תפקיד')}]</span>`:''}${(m.mobile||m.phone)?` · ${esc(m.mobile||m.phone)}`:''}${elsewhere?` <span style="color:var(--warn)">· כבר משובצת ב${esc(elsewhere)}</span>`:''}</div>`; };
    let h="";
    if(here.length) h+=`<div class="asg-grp">${esc(role)}</div>`+here.map(m=>item(m,false)).join("");
    if(other.length) h+=`<div class="asg-grp">שאר הצוות</div>`+other.map(m=>item(m,true)).join("");
    if(!h) h=`<div class="asg-empty">אין תוצאות בחינוך ${ganEdu==='ח"מ'?'המיוחד':'הרגיל'}</div>`;
    return h;
  }
  function resolveStaff(role, text){ const t=String(text||"").trim(); if(!t) return null;
    const pool=DB.staff.filter(m=>staffEduMatch(m));
    return pool.find(m=>m.role===role && staffName(m)===t) || pool.find(m=>staffName(m)===t) || null; }
  /* בניית תיבות הימים לתפקיד "לפי ימים" — משבצת רק ימים פנויים לעובד/ת שנבחרה (סעיף 1) */
  function daysBoxHtml(selectedStaffId, wantDays){
    const taken = selectedStaffId ? staffTakenDays(idx, selectedStaffId) : {};
    return WEEK_DAYS.map(d=>{
      const isTaken = !!taken[d];
      const checked = wantDays.includes(d) && !isTaken;
      return `<label class="check" style="${isTaken?'opacity:.55':''}" ${isTaken?`title="כבר משובצת ב${esc(taken[d])} ביום ${esc(d)}"`:''}>`+
        `<input type="checkbox" class="asg-day" value="${esc(d)}" ${checked?'checked':''} ${isTaken?'disabled':''}> ${esc(d)}${isTaken?' 🔒':''}</label>`;
    }).join("");
  }
  const fixed=[["סמל פנימי",g.internalSymbol],["סמל גן",g.ganSymbol],["גיל",g.age],["חינוך",eduLabel(g)],
    ["כתובת",[g.address,g.building].filter(Boolean).join(" ")],["אזור",g.zone],["טל' גן",g.phoneGan],["קיבולת",g.capacity],["רשומות",reg]];
  const bHint = mandatory
    ? `<div class="hint" style="margin-bottom:10px;color:var(--muted)">💡 גן חובה (גיל 5) — אין שיבוץ "${esc(ASSISTANT_B_ROLE)}".</div>`
    : ((!bEligible && !bAssigned)
      ? `<div class="hint" style="margin-bottom:10px;color:var(--muted)">💡 שיבוץ "${esc(ASSISTANT_B_ROLE)}" ייפתח כשהגן יגיע ל-${ASSISTANT_B_MIN} בנות (כרגע ${reg}).</div>` : "");
  modal(`
    <style>
      .asg-drop{position:absolute;z-index:60;inset-inline:0;top:100%;margin-top:2px;max-height:240px;overflow:auto;background:var(--card,#fff);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
      .asg-grp{position:sticky;top:0;background:var(--surface,#f2f2f2);color:var(--accent-strong);font-weight:700;font-size:.8rem;padding:4px 10px;border-bottom:1px solid var(--border)}
      .asg-opt{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.9rem}

        } else if(meta.extra==="duration"){
          extraHtml=`<div class="field" style="min-width:150px"><label>תקופה</label>
              <select class="asg-durtype">
                <option value="" ${!cur.durType?'selected':''}>—</option>
                <option value="year" ${cur.durType==='year'?'selected':''}>שנה</option>
                <option value="dates" ${datesOn?'selected':''}>מתאריך עד תאריך</option>

            <div class="field asg-dates-wrap" style="min-width:150px;${datesOn?'':'display:none'}"><label>מתאריך</label>
              <input type="date" class="asg-durfrom" value="${esc(cur.durFrom||'')}"></div>
            <div class="field asg-dates-wrap" style="min-width:150px;${datesOn?'':'display:none'}"><label>עד תאריך</label>
              <input type="date" class="asg-durto" value="${esc(cur.durTo||'')}"></div>`;
        }
        /* תיבת בחירת ילדות משויכות לתפקידי סיוע — רק ילדות בגן זה המסומנות באותו סיוע */
        let kidsHtml="";
        if(supKey){
          const supLbl=(SUPPORT_TYPES.find(t=>t[0]===supKey)||[])[1]||"";
          const kids=studentsOfYear().filter(s=>s.ganId===g.id && !s.finished && s.support && s.support[supKey]);
          const chosen=new Set(cur.students||[]);
          kidsHtml=`<div class="field" style="flex:1 1 100%;min-width:230px"><label>ילדות משויכות · ${esc(supLbl)}</label>
            ${kids.length? `<div class="checks asg-kids-box" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px">
              ${kids.map(s=>`<label class="check"><input type="checkbox" class="asg-kid" value="${esc(s.id)}" ${chosen.has(s.id)?'checked':''}> ${esc(s.lastName)} ${esc(s.firstName)}</label>`).join("")}
            </div>` : `<div class="hint">אין בגן זה ילדות המסומנות "${esc(supLbl)}". יש לסמן זאת בתיק הילדה (שונות → סיוע/העשרה).</div>`}
          </div>`;
        }
        return `<div class="panel" style="padding:10px;margin:0" data-role="${esc(role)}" data-days="${isDays?1:0}" data-multi="${multiGan?1:0}">
          <div class="row" style="gap:8px;align-items:flex-end;flex-wrap:wrap">
            <div class="field asg-pick" style="min-width:200px;flex:1;position:relative"><label>${roleChip(role)}</label>
              <input class="asg-combo" value="${esc(display)}" placeholder="הקלד/י שם או בחר/י ▾" autocomplete="off">
              <div class="asg-drop" style="display:none"></div>
              <input type="hidden" class="asg-staffid" value="${esc(cur.staffId||'')}"></div>
            <div class="field" style="min-width:130px"><label>טלפון</label><input class="asg-phone" value="${esc(cur.phone||"")}" inputmode="tel"></div>
            ${extraHtml}
            ${HOURS_ROLES.includes(role)?`<div class="field" style="min-width:110px"><label>שעות שבועיות</label><input class="asg-hours" value="${esc(cur.hours||"")}" inputmode="numeric"></div>`:""}
            <button class="btn ghost sm asg-clear" type="button" title="הסרת השיבוץ בשורה זו">🗑️ הסר</button>
          </div>
          ${kidsHtml}

      }).join("")}
    </div>
    <div class="foot">
      <button class="btn" id="asg-save" style="margin-inline-start:auto">💾 שמירה</button>
      <button class="btn ghost" id="asg-cancel">ביטול</button>

  $("#modal").querySelectorAll("[data-role]").forEach(box=>{
    const combo=box.querySelector(".asg-combo"), sid=box.querySelector(".asg-staffid"), ph=box.querySelector(".asg-phone"), drop=box.querySelector(".asg-drop");
    let lastId=sid.value||"";
    const setStaff=st=>{
      sid.value=st.id; combo.value=staffName(st); if(st.mobile||st.phone) ph.value=st.mobile||st.phone;
      if(box.dataset.days==='1'){ const dbox=box.querySelector(".asg-days-box"); if(dbox){
        const checked=[...dbox.querySelectorAll(".asg-day:checked")].map(x=>x.value);
        dbox.innerHTML=daysBoxHtml(st.id, checked); } }
      if(st.id!==lastId && box.dataset.multi!=='1' && box.dataset.days!=='1' && idx[st.id]){
        toast("שים/י לב: "+staffName(st)+" כבר משובצת ב"+ganName(idx[st.id][0].ganId)); }
      lastId=st.id;
    };
    const openDrop=q=>{ // בונה ומציג את הרשימה המקובצת, ומחווט בחירה
      drop.innerHTML=dropHtml(box.dataset.role, q); drop.style.display="block";
      drop.querySelectorAll(".asg-opt").forEach(el=> el.onmousedown=e=>{ e.preventDefault(); const st=DB.staff.find(x=>x.id===el.dataset.id); if(st){ setStaff(st); drop.style.display="none"; } });
    };
    combo.onfocus=()=>openDrop("");
    combo.oninput=()=>{ openDrop(combo.value); // סינון חי
      const st=resolveStaff(box.dataset.role, combo.value); if(st){ sid.value=st.id; } else { sid.value=""; lastId=""; } };
    combo.onblur=()=>setTimeout(()=>{ drop.style.display="none"; }, 150);
    /* הסרת שיבוץ בשורה */
    const clr=box.querySelector(".asg-clear");
    if(clr) clr.onclick=()=>{ combo.value=""; sid.value=""; ph.value=""; lastId=""; drop.style.display="none";
      box.querySelectorAll(".asg-kid:checked,.asg-day:checked").forEach(c=>c.checked=false); };
    /* תקופה: הצגת שדות התאריכים כשנבחר "מתאריך עד תאריך" */
    const dt=box.querySelector(".asg-durtype");
    if(dt) dt.onchange=()=>{ box.querySelectorAll(".asg-dates-wrap").forEach(w=> w.style.display = dt.value==='dates'?'':'none'); };
  });
  $("#asg-cancel").onclick=closeModal;
  if(!canEditRec(g)) makeModalReadOnly(["asg-save"]);
  $("#asg-save").onclick=()=>{
    if(!canEditRec(g)){ toast("אין הרשאת עריכה בחינוך זה"); return; }
    const cmap=asgCtxMap();
    const existing=cmap[ganId]||{};
    const rendered=new Set([...$("#modal").querySelectorAll("[data-role]")].map(b=>b.dataset.role));
    const entry={};
    /* שמירת תפקידים שלא הוצגו במסך (למשל "סייעת ב'" שהוסתרה כשהגן מתחת ל-30) כדי לא לאבד נתונים */
    Object.keys(existing).forEach(r=>{ if(!rendered.has(r)) entry[r]=existing[r]; });
    $("#modal").querySelectorAll("[data-role]").forEach(box=>{
      const role=box.dataset.role;
      const combo=box.querySelector(".asg-combo"), sid=box.querySelector(".asg-staffid"), ph=box.querySelector(".asg-phone");
      const st=sid.value? DB.staff.find(x=>x.id===sid.value) : null;
      const val={ staffId:sid.value||"", name:(st?staffName(st):combo.value.trim()), phone:ph.value.trim() };
      const days=[...box.querySelectorAll(".asg-day:checked")].map(x=>x.value); if(days.length) val.days=days;
      const kids=[...box.querySelectorAll(".asg-kid:checked")].map(x=>x.value); if(kids.length) val.students=kids;
      const dt=box.querySelector(".asg-durtype");
      if(dt&&dt.value){ val.durType=dt.value; if(dt.value==='dates'){ const df=box.querySelector(".asg-durfrom"), dto=box.querySelector(".asg-durto"); if(df&&df.value) val.durFrom=df.value; if(dto&&dto.value) val.durTo=dto.value; } }
      const hrs=box.querySelector(".asg-hours"); if(hrs && hrs.value.trim()) val.hours=hrs.value.trim();
      if(val.staffId||val.name||val.phone||val.days||val.durType||val.students||val.hours) entry[role]=val;
    });
    if(Object.keys(entry).length) cmap[ganId]=entry; else delete cmap[ganId];
    /* עדכון שעות שבועיות מהשיבוץ לתיק העובדת (סעיף 9) */
    Object.keys(entry).forEach(role=>{ const v=entry[role];
      if(HOURS_ROLES.includes(role) && v && v.staffId && v.hours){ const st=DB.staff.find(x=>x.id===v.staffId); if(st) st.weeklyHours=v.hours; } });
    save(); closeModal(); route(); toast("השיבוץ נשמר");
  };
}

function openAsgExport(){
  modal(`
    <h3>ייצוא / הדפסה — שיבוץ ${esc(DB.activeYear)} · ${esc(ctxLabel(asgContext))}</h3>
    <div class="note">מיוצא השיבוץ של ההקשר הנבחר (${esc(ctxLabel(asgContext))}) לפי סינון החינוך הפעיל${activeEdu?` (חינוך ${activeEdu==='ח"מ'?'מיוחד':'רגיל'})`:' (כל החינוך)'}. אפשר לכלול/להשמיט מספרי טלפון.</div>
    <div class="field" style="margin-top:10px;max-width:340px"><label>גן</label>
      <select id="ax-gan"><option value="">כל הגנים</option>${eduScope(DB.gans.slice()).sort((a,b)=>ganName(a.id).localeCompare(ganName(b.id),"he")).map(g=>`<option value="${esc(g.id)}">${esc(ganName(g.id))}</option>`).join("")}</select></div>
    <fieldset style="margin-top:10px"><legend>אפשרויות</legend>
      <div class="checks">
        <label class="check"><input type="checkbox" id="ax-phones" checked> כלול מספרי טלפון</label>
        <label class="check"><input type="checkbox" id="ax-fixed" checked> כלול נתוני גן קבועים (סמל, גיל, כתובת…)</label>
      </div>
    </fieldset>
    <label class="check" style="margin-top:8px"><input type="checkbox" id="ax-onepage"> התאם לעמוד אחד</label>
    <div class="foot">
      <button class="btn" id="ax-xls" type="button">🎨 אקסל צבעוני</button>
      <button class="btn ghost" id="ax-csv" type="button">⬇️ CSV</button>
      <button class="btn ghost" id="ax-pdf" type="button">🖨️ הדפסה / PDF</button>
      <button class="btn ghost" id="ax-mail" type="button">📎 שיתוף מסמך</button>
      <button class="btn ghost" id="ax-cancel" type="button" style="margin-inline-start:auto">סגירה</button>
    </div>`);
  $("#ax-cancel").onclick=closeModal;
  const selGanId=()=>$("#ax-gan")?.value||"";
  const build=()=>{
    const phones=$("#ax-phones").checked, fixed=$("#ax-fixed").checked, gid=selGanId();
    let gans=eduScope(DB.gans.slice()).sort((a,b)=>ganName(a.id).localeCompare(ganName(b.id),"he"));
    if(gid) gans=gans.filter(g=>g.id===gid);
    const FREE_COLS=[["יום חופשי גננת","גננת"],["יום חופשי סייעת","סייעת"],["יום חופשי סייעת רפואית","סייעת רפואית"]];
    const headers=["שם הגן"], colBg=[""]; if(fixed){ headers.push("סמל פנימי","סמל גן","גיל","חינוך","כתובת","אזור","טל' גן","קיבולת","רשומות","סטטוס"); for(let i=0;i<10;i++) colBg.push(""); }
    assignRoles().forEach(meta=>{ const tint=tintHex(roleColor(meta.role),.74);
      headers.push(meta.role); colBg.push(tint);
      if(phones){ headers.push(meta.role+" — טלפון"); colBg.push(tint?tintHex(roleColor(meta.role),.85):""); }
      if(meta.extra){ headers.push(meta.role+" — "+asgExtraLabel(meta.role)); colBg.push(tint?tintHex(roleColor(meta.role),.85):""); } });
    headers.push(...FREE_COLS.map(f=>f[0])); FREE_COLS.forEach(()=>colBg.push(""));
    const rows=gans.map(g=>{
      const reg=studentsOfYear().filter(s=>s.ganId===g.id && !s.finished).length;
      const a=ganAsg(g.id), free=ganFreeDays(g.id, asgContext); const row=[ganName(g.id)];
      if(fixed) row.push(g.internalSymbol,g.ganSymbol,g.age,eduLabel(g),[g.address,g.building].filter(Boolean).join(" "),g.zone,g.phoneGan,g.capacity,reg,g.active?"פעיל":"כבוי");
      assignRoles().forEach(meta=>{ const c=a[meta.role]||{}; row.push(c.name||""); if(phones) row.push(c.phone||""); if(meta.extra) row.push(asgExtraText(meta.role,c)); });
      FREE_COLS.forEach(f=>row.push((free[f[1]]||[]).join(", ")));
      return row;
    });
    return { headers, rows, colBg };
  };
  const ctxFile=ctxLabel(asgContext).replace(/\s+/g,"-");
  const xlsSuffix=()=>`${DB.activeYear}${activeEdu==='ח"מ'?'_מיוחד':(activeEdu?'_רגיל':'')}`;
  $("#ax-csv").onclick=()=>{
    const {headers,rows}=build(); if(!rows.length){ toast("אין גנים לייצוא"); return; }
    const csv=[headers.join(",")].concat(rows.map(r=>r.map(csvCell).join(","))).join("\r\n");
    downloadBlob(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}), `שיבוץ_${ctxFile}_${xlsSuffix()}.csv`); toast("קובץ CSV נוצר");
  };
  $("#ax-xls").onclick=()=>{
    const {headers,rows,colBg}=build(); if(!rows.length){ toast("אין גנים לייצוא"); return; }
    tableToXls(`שיבוץ_${ctxFile}_${xlsSuffix()}.xls`, headers, rows, { colBg, title:asgTitle() }); toast("קובץ אקסל צבעוני נוצר ✓");
  };
  const asgTitle=()=>`שיבוץ צוות · ${DB.activeYear} · ${ctxLabel(asgContext)}${selGanId()?` · ${ganName(selGanId())}`:''}`;
  const asgSub=()=>{ const gid=selGanId(); if(gid) return ganPlaceLine(ganById(gid))||ganName(gid);
    return `${activeEdu?`חינוך ${activeEdu==='ח"מ'?'מיוחד':'רגיל'} · `:''}${eduScope(DB.gans.slice()).length} גנים`; };
  $("#ax-pdf").onclick=()=>{
    const {headers,rows}=build(); if(!rows.length){ toast("אין נתונים"); return; }
    printReport({ title:asgTitle(), subtitle:asgSub(), headers, rows, onePage:$("#ax-onepage").checked, landscape:headers.length>6 });
  };
  $("#ax-mail").onclick=()=>{
    const {headers,rows}=build(); if(!rows.length){ toast("אין נתונים לשיתוף"); return; }
    shareReportDoc({ title:asgTitle(), subtitle:asgSub(), headers, rows, onePage:$("#ax-onepage").checked, landscape:headers.length>6, fileName:asgTitle() });
  };
}

function csvCell(v){ v=String(v??""); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function downloadBlob(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }
/* מיזוג צבע לכיוון לבן — גוון בהיר לרקע תא (p=0..1, ככל שגדול בהיר יותר) */
function tintHex(hex, p){ hex=String(hex||"").replace('#',''); if(hex.length===3) hex=hex.split('').map(x=>x+x).join(''); if(!/^[0-9a-fA-F]{6}$/.test(hex)) return ""; const n=parseInt(hex,16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255; const mix=c=>Math.round(c+(255-c)*p); const h=v=>v.toString(16).padStart(2,'0'); return "#"+h(mix(r))+h(mix(g))+h(mix(b)); }
/* יצוא טבלה צבעונית לאקסל: HTML‏-table בסיומת .xls — נפתח באקסל וב-Google Sheets עם הצבעים.
   opts.colBg[i] = צבע רקע לעמודה i (בגוף הטבלה) · opts.title = כותרת מעל הטבלה. */
function tableToXls(name, headers, rows, opts){
  opts=opts||{}; const colBg=opts.colBg||[], title=opts.title||"";
  const td=(v,bg)=>`<td${bg?` style="background:${bg}"`:''}>${esc(String(v==null?"":v))}</td>`;
  let h='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">'+
    '<head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>שיבוץ</x:Name>'+
    '<x:WorksheetOptions><x:DisplayRightToLeft/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->'+
    '<style>table{border-collapse:collapse}td,th{border:1px solid #b9c4bd;padding:4px 9px;font-family:Arial,sans-serif;font-size:12px;mso-number-format:"\\@";text-align:right}'+
    'th{background:#2f6f43;color:#fff;font-weight:bold}</style></head><body dir="rtl">';
  if(title) h+='<h3 style="font-family:Arial,sans-serif">'+esc(title)+'</h3>';
  h+='<table><thead><tr>'+headers.map(hd=>`<th>${esc(String(hd==null?"":hd))}</th>`).join("")+'</tr></thead><tbody>'+
    rows.map(r=>'<tr>'+r.map((c,i)=>td(c,colBg[i])).join("")+'</tr>').join("")+'</tbody></table></body></html>';
  downloadBlob(new Blob(["﻿"+h],{type:"application/vnd.ms-excel;charset=utf-8"}), name);
}
/* פענוח קובץ טקסט עם זיהוי קידוד — תומך UTF-8 (עם/בלי BOM) וגם Windows-1255
   (הקידוד שאקסל בעברית שומר בו כברירת מחדל, מה שמקלקל את הכותרות אם קוראים כ-UTF-8) */
function decodeFileText(buf){
  const bytes=new Uint8Array(buf);
  if(bytes.length>=3 && bytes[0]===0xEF && bytes[1]===0xBB && bytes[2]===0xBF)
    return new TextDecoder("utf-8").decode(bytes.subarray(3)); // UTF-8 עם BOM
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(bytes); } // UTF-8 תקין
  catch(_){ try{ return new TextDecoder("windows-1255").decode(bytes); } // נפילה לעברית ANSI (אקסל)
            catch(__){ return new TextDecoder("utf-8").decode(bytes); } }
}
function readFileSmart(file,cb){ const r=new FileReader(); r.onload=()=>cb(decodeFileText(r.result)); r.readAsArrayBuffer(file); }

const HIST_GAN_HEADER_MAP = {
  "גן":"gan","שםהגן":"gan","שםגן":"gan","גננת":"gan","שםהגננת":"gan",
  "כתובת":"address","כתובתהגן":"address","רחוב":"address","כתובתגן":"address",
  "קמפוס":"campus","קמפוסגנים":"campus","קמפוסהגן":"campus",
  "גיל":"age","גילהגן":"age",
  "מועדא":"a","א":"a","מועדא׳":"a",
  "מועדב":"b","ב":"b","מועדב׳":"b",
  "מועדג":"c","ג":"c","מועדג׳":"c",
  "סופי":"f","מועדסופי":"f",
  "סהכ":"total","סךהכל":"total","total":"total"
};
function histGanTotal(r){ return (+r.a||0)+(+r.b||0)+(+r.c||0)+(+r.f||0); }
/* פענוח טבלת גנים היסטורית: כותרות גן/גיל/מועדים */
function parseHistGans(text){
  const rows=parseTable(text); if(!rows.length) return [];
  const header=rows[0].map(normHeader); const hi={};
  header.forEach((h,i)=>{ const k=HIST_GAN_HEADER_MAP[h]; if(k && hi[k]==null) hi[k]=i; });
  if(hi.gan==null) return []; // חובה עמודת "גן"
  const out=[];
  for(let r=1;r<rows.length;r++){ const c=rows[r];
    const gan=String(c[hi.gan]??"").trim(); if(!gan) continue;
    out.push({ gan,
      address: hi.address!=null?String(c[hi.address]??"").trim():"",
      campus: hi.campus!=null?String(c[hi.campus]??"").trim():"",
      age: hi.age!=null?String(c[hi.age]??"").trim():"",
      a: hi.a!=null?(+digits(c[hi.a])||0):0,
      b: hi.b!=null?(+digits(c[hi.b])||0):0,
      c: hi.c!=null?(+digits(c[hi.c])||0):0,
      f: hi.f!=null?(+digits(c[hi.f])||0):0 });
  }
  return out;
}

async function approveReg(rec, after){
  if(!rec) return; const d=rec.data||{};
  const g=DB.gans.find(x=>String(x.ganSymbol||x.internalSymbol||"")===String(d.ganSymbol)) || DB.gans.find(x=>ganName(x.id)===d.ganName);
  const year=(Array.isArray(DB.years)&&DB.years.includes(d.year))? d.year : DB.activeYear;
  const s=makeStudent(); s.year=year;
  // שם פרטי/משפחה מהטופס; לרישומים ישנים — פיצול שם מלא (מילה ראשונה=משפחה)
  if(d.childFirst||d.childLast){ s.firstName=d.childFirst||""; s.lastName=d.childLast||""; }
  else { const w=String(d.childName||"").trim().split(/\s+/); s.lastName=w[0]||""; s.firstName=w.slice(1).join(" ")||""; }
  s.tz=digits(d.childTz||""); s.dob=d.dob||"";
  s.dadMobile=d.dadMobile||""; s.momMobile=d.momMobile||"";
  s.mobile=d.momMobile||d.dadMobile||""; s.phone=d.homePhone||"";
  s.street=d.street||d.address||""; s.building=d.building||""; s.city=d.city||""; s.email=d.email||"";
  if(g){ s.ganId=g.id; s.campus=ganCampus(g.id)||""; s.education=eduLabel(g);
    // גיל אוטומטי לפי הגן (גן חד-גילאי → נקבע; דו-גילאי → נשאר לבחירה)
    const ages=String(g.age||"").split("/").map(x=>x.trim()).filter(Boolean); if(ages.length===1) s.age=ages[0];
  }
  s.placed=false; s.registeredByUs=true;
  // סימון המסמכים שצורפו בטופס (ת"ז / ספח) + קישור לקבצים
  (rec.files||[]).forEach(f=>{ const k=String(f.kind||"");
    if(k.indexOf("תעודת זהות")>=0){ s.docs.idCopy=true; s.docFiles.idCopy={id:f.id,name:f.name,link:f.link}; }
    else if(k.indexOf("ספח")>=0){ s.docs.nispach=true; s.docFiles.nispach={id:f.id,name:f.name,link:f.link}; }
  });
  s.driveFolderId=rec.folderId||""; s.driveFolder=rec.folderLink||"";
  s.notes="נרשמה דרך טופס דיגיטלי · הורה: "+(d.parentName||"")+(d.parentTz?(" ("+d.parentTz+")"):"");

  if(g && rec.folderId){
    try{ const mv=await driveCall("childMove",{ folderId:rec.folderId, year:String(year), edu:eduLabel(g), gan:ganName(g.id) });
      if(mv&&mv.folderLink) s.driveFolder=mv.folderLink; }catch(e){}
  }
  DB.students.push(s); save();
  try{ await driveCall("regRemove",{ id:rec.id }); }catch(e){}
  toast("נפתח תיק ל"+[s.lastName,s.firstName].filter(Boolean).join(" "));
  if(after) after();
}
