<!doctype html>
<html lang="he" dir="rtl">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4a9d5b">
<title>מערכת רישום וקליטת תלמידות</title>

<link rel="manifest" id="manifestLink">
<link rel="icon" id="faviconLink" type="image/png">
<link rel="apple-touch-icon" id="appleIcon">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="רישום תלמידות">
<style>
:root{
  --bg:#eaf4ec;--surface:#fff;--surface-2:#f1f8f2;--ink:#12251a;--ink-soft:#3d5546;
  --muted:#6a8072;--border:#d5e7d9;--accent:#4a9d5b;--accent-strong:#357a44;--accent-soft:#d8eede;
  --brass:#9c6f2c;--good:#2c7a52;--good-soft:#d7ecdf;--warn:#a15b12;--warn-soft:#f6e6d2;
  --bad:#a5342b;--bad-soft:#f5dcd9;
  --shadow:0 1px 2px rgba(16,43,24,.06),0 10px 30px rgba(16,43,24,.08);--radius:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0a1710;--surface:#0f2117;--surface-2:#163021;--ink:#e9f4ec;
  --ink-soft:#b2ccb8;--muted:#7d977f;--border:#22402c;--accent:#4cbf6a;--accent-strong:#6ad684;--accent-soft:#103322;
  --brass:#cc9c56;--good:#54b888;--good-soft:#123527;--warn:#d9a25a;--warn-soft:#3a2c15;
  --bad:#e07b6f;--bad-soft:#3a1c18;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4)}}
:root[data-theme="light"]{--bg:#eaf4ec;--surface:#fff;--surface-2:#f1f8f2;--ink:#12251a;--ink-soft:#3d5546;--muted:#6a8072;--border:#d5e7d9;--accent:#4a9d5b;--accent-strong:#357a44;--accent-soft:#d8eede;--good:#2c7a52;--good-soft:#d7ecdf;--warn:#a15b12;--warn-soft:#f6e6d2;--bad:#a5342b;--bad-soft:#f5dcd9}
:root[data-theme="dark"]{--bg:#0a1710;--surface:#0f2117;--surface-2:#163021;--ink:#e9f4ec;--ink-soft:#b2ccb8;--muted:#7d977f;--border:#22402c;--accent:#4cbf6a;--accent-strong:#6ad684;--accent-soft:#103322;--good:#54b888;--good-soft:#123527;--warn:#d9a25a;--warn-soft:#3a2c15;--bad:#e07b6f;--bad-soft:#3a1c18}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;line-height:1.55;
  font-family:"Assistant","Heebo","Segoe UI","Arial Hebrew",system-ui,sans-serif;font-size:15px}
h1,h2,h3{margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;font-weight:700}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--border);
  border-radius:9px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
label{font-size:.82rem;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:4px}
a{color:var(--accent)}

/* header */
header.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);
  box-shadow:var(--shadow)}
.top-inner{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.12rem}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1.2rem}
.top-spacer{flex:1}
.year-pick{display:flex;align-items:center;gap:6px;background:var(--accent-soft);padding:5px 10px;border-radius:999px;font-weight:800;color:var(--accent-strong)}
.year-pick select{width:auto;background:transparent;border:0;font-weight:800;color:var(--accent-strong);padding:2px 4px}
.brand .logo img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.edu-pick{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);padding:3px;border-radius:999px}
.edu-pick button{background:transparent;color:var(--ink-soft);padding:5px 12px;border-radius:999px;font-size:.85rem;font-weight:800}
.edu-pick button.active{background:var(--accent);color:#fff}
.doc-row{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:7px 10px;flex-wrap:wrap}
.doc-row .lbl{display:flex;align-items:center;gap:8px;font-weight:600;flex:1;min-width:150px;cursor:pointer}
.doc-row .lbl input{width:auto;margin:0}
.doc-rows{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(max-width:640px){.doc-rows{grid-template-columns:1fr}}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--accent-strong)}
th.sortable .arr{font-size:.7rem;opacity:.7;margin-inline-start:3px}
.icon-btn{background:var(--surface-2);border:1px solid var(--border);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:1.05rem}

/* nav */
nav.tabs{max-width:1200px;margin:0 auto;padding:8px 16px 0;display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{background:transparent;color:var(--ink-soft);padding:9px 15px;border-radius:10px 10px 0 0;border:1px solid transparent;border-bottom:0;font-weight:700}
nav.tabs button.active{background:var(--surface);color:var(--accent-strong);border-color:var(--border);box-shadow:0 -2px 0 var(--accent) inset}
nav.tabs .count{background:var(--accent-soft);color:var(--accent-strong);border-radius:999px;padding:0 7px;font-size:.75rem;margin-inline-start:6px}

main{max-width:1200px;margin:0 auto;padding:18px 16px 80px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
.panel h2{font-size:1.15rem;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:.86rem;margin-bottom:14px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}

.btn{background:var(--accent);color:#fff;padding:9px 16px}
.btn:hover{background:var(--accent-strong)}
.btn.ghost{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent-strong)}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:#fff}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar .field{min-width:130px}
.toolbar .field.grow{flex:1;min-width:180px}
.toolbar .field label{margin-bottom:3px}

/* table */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:720px}
th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--surface-2);font-weight:800;color:var(--ink-soft);position:sticky;top:0}
tbody tr:hover{background:var(--surface-2)}
td.actions{white-space:nowrap}
.empty{padding:34px;text-align:center;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:800}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.dot-list{display:flex;gap:3px}
.doc-dot{width:16px;height:16px;border-radius:50%;font-size:10px;display:grid;place-items:center;font-weight:800}
.doc-dot.on{background:var(--good);color:#fff}
.doc-dot.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:linear-gradient(200deg,var(--surface-2),var(--surface));border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.stat .k{font-size:.78rem;color:var(--muted);font-weight:700}
.stat .v{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:.9rem;color:var(--muted);font-weight:700}
.stat.hero{background:radial-gradient(120% 140% at 88% -20%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 60%),linear-gradient(200deg,var(--surface-2),var(--surface))}

.bar{height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,18,22,.55);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:24px 14px;overflow:auto}
.overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);width:min(760px,100%);padding:20px 22px}
.modal h3{font-size:1.2rem;margin-bottom:14px}
.modal .foot{display:flex;gap:10px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
fieldset{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:0 0 12px}
legend{font-weight:800;color:var(--accent-strong);padding:0 6px;font-size:.9rem}
.check{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;cursor:pointer}
.check input{width:auto;margin:0}
.checks{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(max-width:640px){.checks{grid-template-columns:1fr}}
.hidden{display:none!important}
body.locked nav.tabs,body.locked .year-pick,body.locked #themeBtn,body.locked #lockBtn{display:none!important}
.login-card{max-width:420px;margin:6vh auto}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}
.note{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn);
  border-radius:10px;padding:9px 12px;font-size:.84rem;font-weight:600}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:12px;font-weight:700;box-shadow:var(--shadow);z-index:90;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(50%) translateY(-4px)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}

@media print{
  header.top,nav.tabs,.toolbar,.no-print{display:none!important}
  body{background:#fff}
  main{padding:0}
  .panel{box-shadow:none;border:0}
  th{position:static}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand" id="brandBox"><span class="logo">🎒</span> מערכת רישום וקליטת תלמידות</div>
    <div class="top-spacer"></div>
    <div class="edu-pick" id="eduPick"></div>
    <div class="year-pick">שנה: <select id="yearSelect"></select></div>
    <button class="icon-btn" id="lockBtn" title="נעילה" style="display:none">🔒</button>
    <button class="icon-btn" id="themeBtn" title="מצב תצוגה">🌓</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="view"></main>

<!-- modal host -->
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ============================================================
   מערכת רישום וקליטת תלמידות — גרסה מתארחת (Firebase)
   נתונים בענן (Firestore) + התחברות (Firebase Auth) → סנכרון בין מכשירים.
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         doc, setDoc, deleteDoc, onSnapshot, collection }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ===== הגדרות Firebase — הדבק/י כאן את 6 המפתחות מהפרויקט שלך (ראה SETUP.md) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBRIWtqtPXxd-W0WR3nB-iGn0Qn9ml-Q8I",
  authDomain: "rishum-ganim-fad40.firebaseapp.com",
  projectId: "rishum-ganim-fad40",
  storageBucket: "rishum-ganim-fad40.firebasestorage.app",
  messagingSenderId: "695537337833",
  appId: "1:695537337833:web:8f1e46f6d6b4c8e5a37778"
};
const CONFIG_READY = !JSON.stringify(firebaseConfig).includes("YOUR_");

/* ===== כתובת "גשר" ה-Drive (Google Apps Script). ראה SETUP.md — "גשר Drive". אינה סוד ===== */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxC0ywjZFGGb1IOCRhscp5dO9FSv4rEX3_bWV2wEgY05dIq3_OHTqFwU7UveV27KXm1/exec";
const DRIVE_READY = !APPS_SCRIPT_URL.includes("YOUR_");
const PERIODS = ["א","ב","ג","סופי"]; // מועדי רישום
const EDU_TYPES = ["רגיל",'ח"מ']; // סוג חינוך: רגיל / חינוך מיוחד
const DEFAULT_YEARS = ['תשפ"ה','תשפ"ו','תשפ"ז','תשפ"ח'];
const STAFF_ROLES = ["גננת","סייעת","סייעת ב'","סייעת רפואית","סייעת צמודה","גננת משלימה","סייעת משלימה","גננת ממלאת מקום","סייעת ממלאת מקום"]; // תפקידי צוות (סעיף 2)
const CHILD_AGES = ["2","3","4","5","6"]; // גיל ילדה בודדת (סעיף 6)
const GAN_AGES = ["3","4","5","3/4","4/5"]; // גיל הגן — כולל גנים דו-גלאיים 3/4, 4/5 (סעיף 6)
const WEEK_DAYS = ["ראשון","שני","שלישי","רביעי","חמישי","שישי"]; // ימי שיבוץ למשלימה (סעיף 7)
/* תפקידי שיבוץ + שדות נוספים לכל תפקיד (סעיף 7):
   extra:"days" — בחירת ימים (משלימה) · extra:"duration" — שנה / מספר חודשים (ממלאת מקום) */
const ASSIGN_ROLES = [
  {role:"גננת"},
  {role:"סייעת"},
  {role:"סייעת ב'"},
  {role:"סייעת רפואית"},
  {role:"סייעת צמודה"},
  {role:"גננת משלימה", extra:"days"},
  {role:"סייעת משלימה", extra:"days"},
  {role:"גננת ממלאת מקום", extra:"duration"},
  {role:"סייעת ממלאת מקום", extra:"duration"}
];
/* הקשרי שיבוץ — פעילות הגן / צהרונים / קייטנות (סעיף 8) */
const ASSIGN_CONTEXTS = [
  {id:"activity",     label:"פעילות הגן"},
  {id:"tzaharon",     label:"צהרונים"},
  {id:"campHanukkah", label:"קייטנת חנוכה"},
  {id:"campNisan",    label:"קייטנת ניסן"},
  {id:"campEndYear",  label:"קייטנת סוף שנה"}
];
/* תוכניות/מועדונים לרישום ילדה (סעיף 9) */
const PROGRAMS = [
  ["tzaharon","צהרון"],
  ["campHanukkah","קייטנת חנוכה"],
  ["campNisan","קייטנת ניסן"],
  ["campEndYear","קייטנת סוף שנה"]
];
/* מסמכי התלמידה — מפתח, כותרת (סעיפים 11–12) */
const STUDENT_DOCS = [
  ["nispach","נספח"],
  ["idCopy",'צילום תעודת זהות'],
  ["takanon","תקנון"]
];

/* ---------- מודל נתונים ---------- */
function blankDB(){
  return {
    activeYear: 'תשפ"ז',
    years: DEFAULT_YEARS.slice(),
    students: [],       // ראה makeStudent
    gans: [],           // ראה makeGan
    management: [],      // {id, dept, name, role, phone}
    staff: [],           // ראה makeStaff — מאגר אנשי צוות הגנים (סעיף 16)
    assignments: {},     // { [year]: { [context]: { [ganId]: { [role]: {staffId,name,phone,days,durType,durMonths} } } } } — שיבוץ (סעיפים 7–8, 17)
    municipality: {},    // { [year]: [ '123456789', ... ] }  ת"ז מרשימת העירייה
    historical: {},      // { [year]: {periodA,periodB,periodC,final} } סיכומי שנים קודמות
    settings: { gansTarget: 29, admins: [] } // יעד מספר גנים + מנהלי מערכת (סעיף 15)
  };
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

let app=null, auth=null, db=null, currentUser=null;
let DB = blankDB();
let dataUnsub=null;
const knownStudentDocs = new Set(); // מזהי מסמכי students_<שנה> הקיימים בענן
function safeYearId(y){ return "students_"+String(y).replace(/[^0-9A-Za-z֐-׿]/g,"_"); }

/* שמירה לענן — דחייה קצרה לאיגוד שינויים, ושמירה על שינויים מקומיים שטרם נכתבו */
let _saveTimer=null, savePending=false, cloudDocs=new Map();
function save(){ if(!db) return; savePending=true; clearTimeout(_saveTimer); _saveTimer=setTimeout(runPush, 250); }
async function runPush(){
  try{ await pushAll(); }
  catch(e){ console.error(e); toast("שגיאת שמירה לענן — בדוק/י חיבור"); }
  finally{
    savePending=false;
    rebuildDB(cloudDocs); // הצג את המצב המעודכן (כולל שינויים מרחוק שהגיעו בזמן השמירה)
    if($("#overlay").classList.contains("show")) pendingRender=true; else route();
  }
}
async function pushAll(){
  if(!db) return;
  // לוכדים תמונת מצב לפני כל await — כדי שרענון-רקע לא ידרוס את מה שאנחנו כותבים
  const meta={ activeYear:DB.activeYear, years:DB.years.slice(), municipality:DB.municipality, historical:DB.historical, settings:DB.settings, assignments:DB.assignments };
  const gans=DB.gans.slice(), management=DB.management.slice(), staff=DB.staff.slice();
  const byYear={}; DB.students.forEach(s=>{ (byYear[s.year]=byYear[s.year]||[]).push(s); });
  await setDoc(doc(db,"app","meta"), meta);
  await setDoc(doc(db,"app","gans"), { gans });
  await setDoc(doc(db,"app","management"), { management });
  await setDoc(doc(db,"app","staff"), { staff });
  const wantIds=new Set();
  for(const y of Object.keys(byYear)){ const id=safeYearId(y); wantIds.add(id); knownStudentDocs.add(id); await setDoc(doc(db,"app",id), { year:y, students:byYear[y] }); }
  for(const id of [...knownStudentDocs]){ if(!wantIds.has(id)){ try{ await deleteDoc(doc(db,"app",id)); }catch(e){} knownStudentDocs.delete(id); } }
}
/* בנייה מחדש של DB מתוך מסמכי הענן */
function rebuildDB(docsMap){
  const meta=docsMap.get("meta")||{};
  DB.years = (meta.years&&meta.years.length)? meta.years : DEFAULT_YEARS.slice();
  DB.activeYear = meta.activeYear && DB.years.includes(meta.activeYear) ? meta.activeYear : DB.years[0];
  DB.municipality = meta.municipality||{};
  DB.historical = meta.historical||{};
  DB.settings = meta.settings||{ gansTarget:29, admins:[] };
  if(!Array.isArray(DB.settings.admins)) DB.settings.admins=[];
  DB.assignments = meta.assignments||{};
  migrateAssignments();
  DB.gans = (docsMap.get("gans")||{}).gans||[];
  DB.management = (docsMap.get("management")||{}).management||[];
  DB.staff = ((docsMap.get("staff")||{}).staff||[]).map(normStaff);
  const studs=[];
  for(const [id,val] of docsMap){ if(id.startsWith("students_") && val && Array.isArray(val.students)) studs.push(...val.students); }
  DB.students = studs.map(normStudent);
}
/* השלמת שדות חדשים לרשומות ישנות שנשמרו לפני העדכון */
function normStudent(s){
  if(s.campus==null) s.campus=""; // קמפוס גנים (סעיף 1)
  s.docs = Object.assign({ nispach:false, idCopy:false, takanon:false }, s.docs||{});
  s.docFiles = s.docFiles||{};
  s.programs = Object.assign({ tzaharon:false, campHanukkah:false, campNisan:false, campEndYear:false }, s.programs||{});
  s.special = Object.assign({ divorced:false, approvalFather:false, approvalMother:false,
    outOfCity:false, paymentArrangement:false, retention:false, retentionDoc:false,
    other:false, otherText:"" }, s.special||{});
  return s;
}
/* השלמת שדות חדשים לאנשי צוות ישנים (ת"ז, מייל, שם משפחה/פרטי) — סעיף 1 */
function normStaff(m){
  m=Object.assign({ lastName:"", firstName:"", name:"", tz:"", email:"", role:"סייעת", phone:"", mobile:"", city:"", notes:"" }, m||{});
  // רשומה ישנה עם "שם" מלא בלבד — נשלוף ממנו משפחה/פרטי בברירת מחדל
  if(!m.lastName && !m.firstName && m.name){ const p=String(m.name).trim().split(/\s+/); m.lastName=p.shift()||""; m.firstName=p.join(" "); }
  if(!m.name) m.name=[m.lastName,m.firstName].filter(Boolean).join(" ");
  return m;
}
/* מעבר למבנה שיבוץ עם הקשרים (פעילות/צהרונים/קייטנות) — עוטף נתונים ישנים תחת "פעילות הגן" (סעיף 8) */
function migrateAssignments(){
  const A=DB.assignments||{};
  for(const y of Object.keys(A)){
    const yr=A[y]; if(!yr || typeof yr!=='object') continue;
    const hasContext=ASSIGN_CONTEXTS.some(c=>yr[c.id]);
    if(hasContext) continue;
    A[y] = Object.keys(yr).length ? { activity: yr } : {};
  }
  DB.assignments=A;
}

/* תיקון טלפון בייבוא: מספר נייד שאיבד את ה-0 המוביל (מתחיל ב-5) — מוסיפים 0 (סעיף 4) */
function fixPhone(v){ v=String(v||"").trim(); if(!v) return ""; const d=v.replace(/\D/g,""); if(d && d[0]==='5' && d.length===9) return "0"+d; return v; }
/* מפתח כתובת לזיהוי אחים/אחיות (רחוב+בניין+עיר) — סעיף 2 */
function addrKey(o){ return [o.street,o.building,o.city].map(x=>String(x||"").trim().toLowerCase()).join("|"); }
function nameKey(v){ return String(v||"").trim().toLowerCase(); }
/* איתור אחים/אחיות: אותו שם משפחה + אותה כתובת, בשנה הפעילה (סעיף 2) */
function findSiblings(ref){
  const ln=nameKey(ref.lastName), ak=addrKey(ref);
  if(!ln || !ak.replace(/\|/g,"")) return { list:[], missing:!ln||!ak.replace(/\|/g,"") };
  const list=studentsOfYear().filter(o=> o.id!==ref.id && nameKey(o.lastName)===ln && addrKey(o)===ak);
  return { list, missing:false };
}

/* ---------- אייקון אפליקציה (PWA) שנוצר מהלוגו — סעיף "התקנה בטלפון" ---------- */
let _manifestUrl=null;
function iconFromEmoji(emoji,size){
  try{
    const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
    const g=(getComputedStyle(document.documentElement).getPropertyValue('--accent')||'').trim()||'#4a9d5b';
    const r=size*0.22;
    x.fillStyle=g; x.beginPath();
    x.moveTo(r,0); x.arcTo(size,0,size,size,r); x.arcTo(size,size,0,size,r); x.arcTo(0,size,0,0,r); x.arcTo(0,0,size,0,r); x.closePath(); x.fill();
    x.font=Math.floor(size*0.6)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
    x.textAlign='center'; x.textBaseline='middle';
    x.fillText(emoji||'🎒', size/2, size/2+size*0.03);
    return c.toDataURL('image/png');
  }catch(e){ return null; }
}
function updatePwaIcons(){
  try{
    const logo=appLogo(), isImg=/^(https?:|data:)/i.test(logo);
    const i512 = isImg? logo : iconFromEmoji(logo,512);
    const i192 = isImg? logo : iconFromEmoji(logo,192);
    if(!i192) return;
    const ai=$("#appleIcon"); if(ai) ai.href=i192;
    const fi=$("#faviconLink"); if(fi) fi.href=i192;
    const at=document.querySelector('meta[name="apple-mobile-web-app-title"]'); if(at) at.content=appTitle();
    const scope=location.pathname.replace(/[^/]*$/,'');
    const manifest={
      id:scope, name:appTitle(), short_name:(appTitle()||'רישום').slice(0,12),
      start_url:location.pathname+location.search, scope,
      display:'standalone', display_override:['standalone'], categories:['education','productivity'],
      background_color:'#eaf4ec', theme_color:'#4a9d5b', lang:'he', dir:'rtl',
      icons:[ {src:i192,sizes:'192x192',type:'image/png',purpose:'any maskable'},
              {src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'} ]
    };
    const ml=$("#manifestLink");
    if(ml){ if(_manifestUrl) try{ URL.revokeObjectURL(_manifestUrl); }catch(e){}
      _manifestUrl=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'}));
      ml.href=_manifestUrl; }
  }catch(e){ console.error(e); }
}

let pendingRender=false;
function firebaseErrHe(code){
  const m={
    "auth/invalid-email":"כתובת אימייל לא תקינה",
    "auth/user-not-found":"משתמש לא נמצא",
    "auth/wrong-password":"סיסמה שגויה",
    "auth/invalid-credential":"אימייל או סיסמה שגויים",
    "auth/missing-password":"יש להזין סיסמה",
    "auth/too-many-requests":"יותר מדי ניסיונות — נסה/י שוב מאוחר יותר",
    "auth/network-request-failed":"בעיית רשת — בדוק/י חיבור לאינטרנט"
  };
  return m[code]||("שגיאה בהתחברות ("+code+")");
}
function startDataSync(){
  if(dataUnsub) return;
  document.body.classList.remove("locked");
  cloudDocs=new Map();
  dataUnsub = onSnapshot(collection(db,"app"), snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type==="removed"){ cloudDocs.delete(ch.doc.id); knownStudentDocs.delete(ch.doc.id); }
      else { cloudDocs.set(ch.doc.id, ch.doc.data()); if(ch.doc.id.startsWith("students_")) knownStudentDocs.add(ch.doc.id); }
    });
    if(savePending) return; // בזמן שמירה מקומית — אל תדרוס שינויים שטרם נכתבו
    rebuildDB(cloudDocs);
    if(!cloudDocs.has("meta")) save(); // איתחול ראשוני חד-פעמי (יצירת מסמך meta)
    if($("#overlay").classList.contains("show")){ pendingRender=true; }
    else route();
  }, err=>{ console.error(err); toast("שגיאת גישה לנתונים — ודא/י הרשאות (Firestore rules)"); });
}
function stopDataSync(){ if(dataUnsub){ dataUnsub(); dataUnsub=null; } knownStudentDocs.clear(); cloudDocs=new Map(); DB=blankDB(); }

function boot(){
  const lb=$("#lockBtn"); if(lb){ lb.textContent="⎋"; lb.title="יציאה מהמערכת"; lb.onclick=doSignOut; lb.style.display="none"; }
  if(!CONFIG_READY){ renderSetupNeeded(); return; }
  try{
    app=initializeApp(firebaseConfig);
    auth=getAuth(app);
    try{ db=initializeFirestore(app,{ localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
    catch(e){ db=initializeFirestore(app,{}); }
  }catch(e){ console.error(e); renderSetupNeeded(String(e.message||e)); return; }
  onAuthStateChanged(auth, user=>{
    currentUser=user;
    const b=$("#lockBtn"); if(b) b.style.display=user?"grid":"none";
    if(user){ startDataSync(); }
    else { stopDataSync(); renderLogin(); }
  });
}

/* ============================================================
   חיבור Google Drive — דרך "גשר" (Google Apps Script) הרץ בחשבון הארגון.
   כל משתמש מחובר לתוכנה יכול ליצור תיקיות/להעלות/לצפות/להוריד — ללא חיבור Google אישי.
   ============================================================ */
async function driveIdToken(force){ if(!currentUser) throw new Error("not-logged-in"); return await currentUser.getIdToken(!!force); }
async function driveCall(action, payload){
  if(!DRIVE_READY) throw new Error("drive-not-configured");
  let force=false;
  for(let attempt=0; attempt<2; attempt++){
    const idToken=await driveIdToken(force);
    const json=JSON.stringify(Object.assign({action, idToken}, payload||{}));
    // Apps Script לעיתים משמיט את גוף בקשת ה-POST החוצה-מקור (בגלל הפניה פנימית),
    // ואז הטוקן לא מגיע. לכן בקשות קטנות נשלחות בשאילתת ה-URL ששורדת הפניות,
    // ורק העלאות גדולות (base64) נשלחות בגוף הבקשה.
    let url=APPS_SCRIPT_URL, opts;
    if(json.length < 6000){ url=APPS_SCRIPT_URL+"?data="+encodeURIComponent(json); opts={ method:"POST" }; }
    else { opts={ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: json }; }
    let r;
    try{ r=await fetch(url, opts); }
    catch(e){ throw new Error("network"); }
    let data; try{ data=await r.json(); }catch(e){ throw new Error("bad-response"); }
    if(data && data.ok===false){
      // טוקן פג תוקף / לא תקף — רענון כפוי של הטוקן וניסיון חוזר אחד (מונע "בעיית הרשאה")
      if((data.error==='unauthorized' || data.error==='token') && !force){ force=true; continue; }
      throw new Error(data.error||"drive-error");
    }
    if(!data) throw new Error("drive-error");
    return data;
  }
  throw new Error("drive-error");
}
async function drivePing(){ const res=await driveCall("ping",{}); if(res.rootLink){ DB.settings.drive=DB.settings.drive||{}; DB.settings.drive.rootLink=res.rootLink; save(); } return res; }
async function driveEnsureChildFolder(student){
  const nm=([student.lastName,student.firstName].filter(Boolean).join(" ")+(student.tz?(" · "+student.tz):"")) || ("ילדה "+student.id);
  const res=await driveCall("childFolder", { year:String(student.year), name:nm });
  student.driveFolderId=res.folderId; student.driveFolder=res.folderLink;
  const i=DB.students.findIndex(x=>x.id===student.id); if(i>=0){ DB.students[i].driveFolderId=res.folderId; DB.students[i].driveFolder=res.folderLink; }
  DB.settings.drive=DB.settings.drive||{}; if(res.rootLink) DB.settings.drive.rootLink=res.rootLink;
  save();
  return res.folderId;
}
async function driveListFolder(folderId){ const res=await driveCall("list", { folderId }); return res.files||[]; }
function fileToB64(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>{ const s=String(r.result); resolve(s.slice(s.indexOf(",")+1)); }; r.onerror=()=>reject(new Error("read")); r.readAsDataURL(file); }); }
async function driveUploadFile(file, folderId){
  const dataB64=await fileToB64(file);
  return await driveCall("upload", { folderId, name:file.name, mimeType:file.type||"application/octet-stream", dataB64 });
}
/* העלאה עם שם קובץ קבוע (שומר על סיומת המקור) — סעיף 11 */
function fileExt(name){ const m=String(name||"").match(/\.[A-Za-z0-9]{1,8}$/); return m?m[0]:""; }
async function driveUploadNamed(file, folderId, baseName){
  const dataB64=await fileToB64(file);
  const name=String(baseName||"קובץ").replace(/[\/\\:*?"<>|]/g,"-") + fileExt(file.name);
  return await driveCall("upload", { folderId, name, mimeType:file.type||"application/octet-stream", dataB64 });
}
async function driveShare(email, role){ return await driveCall("share", { email, role:role||"reader" }); }
/* העתקת קובץ קיים לתיקייה אחרת (למשל צילום ת"ז לתיקיית השנה החדשה) — סעיף 5 */
async function driveCopyFile(fileId, folderId, name){ return await driveCall("copy", { fileId, folderId, name }); }
function b64ToBlobDownload(name, mimeType, b64){
  const bin=atob(b64||""); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  const blob=new Blob([arr],{type:mimeType||"application/octet-stream"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name||"file"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
async function downloadDriveFile(fileId, fallbackName){ try{ const res=await driveCall("download",{fileId}); b64ToBlobDownload(res.name||fallbackName, res.mimeType, res.dataB64); }catch(e){ toast(driveErrHe(e)); } }
function driveErrHe(e){
  const m=String((e&&e.message)||e||"");
  if(m.includes("not-logged-in")) return "יש להתחבר למערכת קודם";
  if(m.includes("drive-not-configured")) return "הגשר לדרייב לא הוגדר (ראה SETUP.md)";
  if(m.includes("network")||m.includes("bad-response")) return "לא הצלחתי להגיע לגשר הדרייב — בדוק/י את הכתובת/החיבור";
  if(m.includes("unauthorized")||m.includes("token")) return "בעיית הרשאה — התחבר/י מחדש למערכת";
  return "שגיאת דרייב — נסה/י שוב";
}

function filteredStudents(){
  const f=stuFilter, q=f.q.trim();
  const eduFilter = activeEdu || f.edu;
  const list = studentsOfYear().filter(s=>{
    if(f.status==='active' && s.finished) return false;
    if(f.status==='finished' && !s.finished) return false;
    if(q){ const hay=(s.firstName+" "+s.lastName+" "+s.tz).toLowerCase(); if(!hay.includes(q.toLowerCase())) return false; }
    if(f.gan && s.ganId!==f.gan) return false;
    if(f.age && f.age.length && !f.age.includes(String(s.age))) return false;
    if(f.city && s.city!==f.city) return false;
    if(f.campus && s.campus!==f.campus) return false;
    if(f.period && s.period!==f.period) return false;
    if(eduFilter && eduLabel(s)!==eduFilter) return false;
    if(f.muni==='yes' && !s.absorbedMunicipality) return false;
    if(f.muni==='no' && s.absorbedMunicipality) return false;
    return true;
  });
  return sortStudents(list);
}
function sortStudents(list){
  const k=stuSort.key, d=stuSort.dir;
  const cmpTxt=(a,b)=>String(a||"").localeCompare(String(b||""),"he");
  const cmpNum=(a,b)=>(+a||0)-(+b||0);
  const val={
    name:s=>[s.lastName,s.firstName].filter(Boolean).join(" "),
    tz:s=>s.tz, gan:s=>ganName(s.ganId), age:s=>s.age, city:s=>s.city,
    period:s=>PERIODS.indexOf(s.period), edu:s=>eduLabel(s)
  };
  const getter=val[k]||val.name;
  const numeric = (k==='age'||k==='period');
  return list.slice().sort((a,b)=>{ const r= numeric?cmpNum(getter(a),getter(b)):cmpTxt(getter(a),getter(b)); return r*d || cmpTxt(val.name(a),val.name(b)); });
}

function docDots(s){
  const d=s.docs;
  const mk=(on,t)=>`<span class="doc-dot ${on?'on':'off'}" title="${t}">${on?'✓':'·'}</span>`;
  return `<span class="dot-list">${mk(d.nispach,'נספח')}${mk(d.idCopy,'צילום ת"ז')}${mk(d.takanon,'תקנון')}</span>`;
}
function specialBadges(s){

  if(sp.divorced) b.push('<span class="pill warn">גרושים</span>');

  if(sp.retention) b.push('<span class="pill warn">השארות</span>');
  if(sp.other) b.push('<span class="pill warn">'+(sp.otherText?esc(sp.otherText):'אחר')+'</span>');

}
function programBadges(s){

}

  /* צירוף קבצים פיזיים לתיקיית הדרייב, עם שם אוטומטי: סוג · שם הילדה · ת"ז (סעיפים 11–12) */
  function docFileBaseName(label){
    const nm=[s.lastName,s.firstName].filter(Boolean).join(" ")||"ללא שם";
    return `${label} · ${nm}${s.tz?(" · "+s.tz):""}`;
  }
  const SPECIAL_DOC_KEYS=["approvalFather","approvalMother","paymentArrangement","retentionDoc","other"];
  async function uploadDocFile(file, key, label){
    persistCurrent(); await driveEnsureChildFolder(s);
    const res=await driveUploadNamed(file, s.driveFolderId, docFileBaseName(label));
    s.docFiles=s.docFiles||{}; s.docFiles[key]={ id:res.fileId||res.id||"", name:res.name||file.name, link:res.link||res.webViewLink||"" };
    if(["nispach","idCopy","takanon"].includes(key)) s.docs[key]=true;
    if(SPECIAL_DOC_KEYS.includes(key)) s.special[key]=true;
  }
  function docAttachHtml(key,label){
    const f=(s.docFiles||{})[key];

    return attached+btn;
  }

    host.querySelectorAll(".doc-file").forEach(inp=> inp.onchange=async ()=>{

        toast("מעלה מסמך…");
        await uploadDocFile(file, inp.dataset.k, inp.dataset.label||inp.dataset.k);
        if(after) after();      // רינדור מחדש כדי שה-DOM ישקף את הסימון/הקישור החדשים
        persistCurrent(); save(); // ואז שמירה (collect קורא מה-DOM המעודכן)
        toast("המסמך צורף ✓");

  function renderDocRows(){
    const host=$("#doc-rows"); if(!host) return;

  /* שונות — כל אפשרות משנית נפתחת מיד מתחת לסימון שלה, עם צירוף מסמך (סעיפי התיקון) */
  function syncSpecial(){
    const set=(id,key)=>{ const el=$("#"+id); if(el) s.special[key]=el.checked; };
    set("sp-divorced","divorced"); set("sp-outOfCity","outOfCity"); set("sp-retention","retention"); set("sp-other","other");
    set("sp-approvalFather","approvalFather"); set("sp-approvalMother","approvalMother");
    set("sp-paymentArrangement","paymentArrangement"); set("sp-retentionDoc","retentionDoc");

    const host=$("#special-blocks"); if(!host) return;

    const parent=(id,key,label)=>`<div class="doc-row"><label class="lbl"><input type="checkbox" id="${id}" ${sp[key]?'checked':''}> ${esc(label)}</label></div>`;

        status("יוצר תיקייה…"); persistCurrent();

  function collect(){
    const g=id=>$("#"+id), val=id=>g(id)?.value.trim()??"", chk=id=>!!g(id)?.checked;

  const sib=$("#s-sibcheck"); if(sib) sib.onclick=()=>{

      ${list.map(o=>`<tr>
        <td><b>${esc([o.lastName,o.firstName].filter(Boolean).join(" "))}</b></td>
        <td>${o.campus?`<span class="pill ok">${esc(o.campus)}</span>`:'<span class="pill neutral">—</span>'}</td>
        <td>${o.ganId?esc(ganName(o.ganId)):'—'}</td>
        <td>${esc(o.age)||'—'}</td>
        <td><span class="pill neutral">${esc(o.period)}</span></td></tr>`).join("")}
      </tbody></table></div>
      ${list.some(o=>o.campus)?`<div class="hint">אפשר לשבץ באותו קמפוס — לחצ/י על שדה "קמפוס גנים" ובחר/י מהרשימה.</div>`:''}`;
  };
  if(!isNew) $("#delStu").onclick=()=>{ if(confirm("למחוק את תיק הילדה לצמיתות?")){ DB.students=DB.students.filter(x=>x.id!==s.id); save(); closeModal(); route(); toast("התיק נמחק"); } };

function suggestFolder(s){

function normHeader(h){ return String(h||"").replace(/["'.׳״]/g,"").replace(/\s+/g,"").trim(); }
function truthyCell(v){ return /^(כן|yes|true|1|✓|v|קלוט|נרשמה|כ)$/i.test(String(v??"").trim()); }
function normEduVal(v){ const t=String(v??"").replace(/\s/g,""); if(!t) return "רגיל"; return /(מיוחד|חינוךמיוחד|ח"?מ|חמ|special)/i.test(t)?'ח"מ':"רגיל"; }
function normPeriodVal(v){ const t=String(v??"").trim(); return PERIODS.includes(t)?t:"א"; }
function normDateVal(v){
  const t=String(v??"").trim(); if(!t) return "";
  let m=t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if(m){ let d=m[1],mo=m[2],y=m[3]; if(y.length===2)y="20"+y; return `${y.padStart(4,"0")}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`; }
  m=t.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/);
  if(m){ return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`; }
  return t;
}
/* פענוח CSV/הדבקה — תומך בפסיקים או טאבים, מרכאות, ותאים רב-שורתיים */
function parseTable(text){
  text=String(text||"").replace(/^﻿/,"");
  const firstLine=text.split(/\r?\n/)[0]||"";
  // זיהוי מפריד: טאב / נקודה-פסיק / פסיק — לפי מה שמפצל להכי הרבה עמודות (אקסל בעברית שומר לרוב עם ; )
  const cand=[["\t",firstLine.split("\t").length],[";",firstLine.split(";").length],[",",firstLine.split(",").length]];
  const delim=cand.reduce((a,b)=> b[1]>a[1] ? b : a)[0];
  const rows=[]; let row=[], cur="", inq=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(inq){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inq=false; } else cur+=ch; }
    else { if(ch==='"' && cur===""){ inq=true; } /* מרכאה נחשבת ציטוט רק בתחילת תא */
      else if(ch===delim){ row.push(cur); cur=""; }
      else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(ch==='\r'){ /* מטופל ע"י \n */ }
      else cur+=ch; }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
/* התאמת שם/סמל גן מהקובץ לגן קיים במערכת */
function matchGanText(text){
  const t=String(text||"").trim(); if(!t) return "";
  const nz=x=>String(x||"").trim();
  const g = DB.gans.find(g=>nz(g.teacherName)===t)
        || DB.gans.find(g=>nz(g.ganSymbol)===t)
        || DB.gans.find(g=>nz(g.internalSymbol)===t)
        || DB.gans.find(g=>nz(g.teacherName) && (t.includes(nz(g.teacherName)) || nz(g.teacherName).includes(t)));
  return g? g.id : "";
}
/* בניית רשומות מהטבלה שנקראה */
function buildImportRows(rows, opts){
  if(!rows.length) return { list:[], mapped:[] };
  const header=rows[0].map(normHeader);
  const idx={}; header.forEach((h,i)=>{ const k=IMPORT_HEADER_MAP[h]; if(k && idx[k]==null) idx[k]=i; });
  const mapped=Object.keys(idx); // אילו שדות זוהו
  const existing=new Set(studentsOfYear().map(s=>digits(s.tz)).filter(Boolean));
  const seen=new Set();
  const list=[];
  for(let r=1;r<rows.length;r++){
    const cells=rows[r];
    const g=key=> idx[key]!=null ? String(cells[idx[key]]??"").trim() : "";
    const st=makeStudent();
    st.lastName=g("lastName"); st.firstName=g("firstName"); st.tz=digits(g("tz"));
    st.dob=normDateVal(g("dob")); st.motherName=g("motherName"); st.fatherName=g("fatherName");
    st.phone=fixPhone(g("phone")); st.mobile=fixPhone(g("mobile")); // תיקון 0 מוביל בנייד (סעיף 4)
    st.street=g("street"); st.building=g("building"); st.city=g("city"); st.campus=g("campus");
    st.age=g("age").replace(/[^\d]/g,""); st.period=normPeriodVal(g("period")); st.education=normEduVal(g("education"));
    st.notes=g("notes");
    const ganText=g("gan"); st.ganId=matchGanText(ganText);
    st.absorbedMunicipality = idx.absorbed!=null ? truthyCell(g("absorbed")) : !!opts.absorbed;
    st.registeredByUs        = idx.regByUs!=null ? truthyCell(g("regByUs"))  : !!opts.reg;
    if(!st.firstName && !st.lastName && !st.tz) continue; // שורה ריקה
    const fileDup = st.tz && seen.has(st.tz);   // ת"ז כפולה בתוך הקובץ עצמו (סעיף 5)
    const dup     = st.tz && existing.has(st.tz); // ת"ז שכבר קיימת במערכת
    if(st.tz) seen.add(st.tz);
    list.push({ st, ganText, ganMatched:!!st.ganId, dup, fileDup });
  }
  return { list, mapped };
}
function importTemplateCSV(){
  const headers=["שם משפחה","שם פרטי",'ת"ז',"תאריך לידה","שם האם","שם האב","טלפון","נייד","רחוב","בניין","עיר","קמפוס","גן","גיל","מועד","חינוך","קלוט בעירייה","הערות"];
  const example=["ישראלי","שרה","123456789","2021-09-01","רבקה","יעקב","03-1234567","050-1234567","הרב קוק","12","ירושלים","קמפוס מרכז","הגננת מרים","3","א","רגיל","כן",""];
  const csv=[headers.map(csvCell).join(","), example.map(csvCell).join(",")].join("\r\n");
  downloadBlob(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}), `תבנית-ייבוא-תלמידות.csv`);

/* זיהוי קבוצת הייבוא האחרונה — תלמידות השנה הפעילה שנוצרו בסמיכות זמן ליצירה האחרונה
   (בייבוא מרוכז כל השורות מקבלות createdAt כמעט זהה, ולכן אפשר לזהות ולבטל את הייבוא) */
function lastImportBatch(){
  const ys=studentsOfYear().filter(s=>s.createdAt && !isNaN(Date.parse(s.createdAt)));
  if(!ys.length) return [];
  const maxT=Math.max(...ys.map(s=>Date.parse(s.createdAt)));
  const WINDOW=5*60*1000; // חלון של 5 דקות אחורה מהיצירה האחרונה
  return ys.filter(s=> maxT-Date.parse(s.createdAt) <= WINDOW)
           .sort((a,b)=>Date.parse(a.createdAt)-Date.parse(b.createdAt));
}
/* ביטול הייבוא האחרון — הצגת התלמידות שייווצרו לאחרונה ומחיקתן לאחר אישור */

/* ====== ייבוא מרוכז של גנים ======
   קורא CSV/הדבקה עם אותה תשתית קריאה חסינת מפריד+קידוד של ייבוא התלמידות
   (readFileSmart + parseTable), כך שקבצי אקסל בעברית (מפריד ; / קידוד Windows-1255)
   נקראים כראוי ולא נופלים על "לא זוהתה אף עמודה". */
const GAN_HEADER_MAP = {
  "שםהגן":"ganName","גן":"ganName","שם":"ganName","שםגן":"ganName",
  "סמלפנימי":"internalSymbol","פנימי":"internalSymbol","סמלמוסד":"internalSymbol",
  "סמלהגן":"ganSymbol","סמלגן":"ganSymbol","סמל":"ganSymbol","סמלמשרד":"ganSymbol",
  "שםהגננת":"teacherName","גננת":"teacherName","שםגננת":"teacherName","מורה":"teacherName",
  "גיל":"age","קבוצתגיל":"age",
  "חינוך":"education","סוגחינוך":"education",
  "כתובת":"address","כתובתהגן":"address",
  "רחוב":"street",
  "מספר":"building","בניין":"building","מספרבית":"building","בית":"building","מספרבניין":"building",
  "אזור":"zone","אזורבעיר":"zone","איזור":"zone",
  "טלפון":"phoneGan","טלפוןבגן":"phoneGan","טלגן":"phoneGan","טלפוןגן":"phoneGan","טל":"phoneGan",
  "טלפוןבית":"phoneHome","טלבית":"phoneHome",
  "ניידגננת":"teacherMobile","פלאפוןגננת":"teacherMobile","סלולריגננת":"teacherMobile",
  "שםסייעת":"assistantName","סייעת":"assistantName",
  "ניידסייעת":"assistantMobile","פלאפוןסייעת":"assistantMobile",
  "קיבולת":"capacity","מקומות":"capacity","מספרמקומות":"capacity","תקן":"capacity",
  "פעיל":"active","סטטוס":"active",
  "מסמכים":"docsNote","הערות":"docsNote","הערה":"docsNote"
};
function ganExists(gn){
  return DB.gans.some(x=>
    (gn.ganSymbol && String(x.ganSymbol||"").trim()===gn.ganSymbol) ||
    (gn.internalSymbol && String(x.internalSymbol||"").trim()===gn.internalSymbol) ||
    (gn.ganName && String(x.ganName||"").trim()===gn.ganName));
}
function buildGanImportRows(rows){
  if(!rows.length) return { list:[], mapped:[] };
  const header=rows[0].map(normHeader);
  const idx={}; header.forEach((h,i)=>{ const k=GAN_HEADER_MAP[h]; if(k && idx[k]==null) idx[k]=i; });
  const mapped=Object.keys(idx);
  const seen=new Set(); const list=[];
  for(let r=1;r<rows.length;r++){
    const cells=rows[r]; const g=key=> idx[key]!=null ? String(cells[idx[key]]??"").trim() : "";
    const gn=makeGan();
    gn.ganName=g("ganName"); gn.internalSymbol=g("internalSymbol"); gn.ganSymbol=g("ganSymbol");
    gn.teacherName=g("teacherName");
    const a=g("age").replace(/\s/g,""); gn.age=GAN_AGES.includes(a)?a:a.replace(/[^\d/]/g,"");
    if(idx.education!=null) gn.education=normEduVal(g("education")); else if(activeEdu) gn.education=activeEdu;
    gn.address=g("address"); gn.street=g("street"); gn.building=g("building"); gn.zone=g("zone");
    gn.phoneGan=g("phoneGan"); gn.phoneHome=g("phoneHome"); gn.teacherMobile=fixPhone(g("teacherMobile"));
    gn.assistantName=g("assistantName"); gn.assistantMobile=fixPhone(g("assistantMobile"));
    gn.capacity=g("capacity").replace(/[^\d]/g,""); gn.docsNote=g("docsNote");
    if(idx.active!=null){ const av=g("active").trim(); gn.active=!/^(לא|כבוי|לאפעיל|0|false|no|off|inactive)$/i.test(av); }
    if(!gn.ganName && !gn.teacherName && !gn.ganSymbol && !gn.internalSymbol) continue; // שורה ריקה
    const key=(gn.ganSymbol||"")+"|"+(gn.internalSymbol||"")+"|"+(gn.ganName||gn.teacherName||"");
    const fileDup = seen.has(key); seen.add(key);
    list.push({ gan:gn, dup:ganExists(gn), fileDup });
  }
  return { list, mapped };
}
function ganTemplateCSV(){
  const headers=["שם הגן","סמל פנימי","סמל הגן","שם הגננת","גיל","חינוך","כתובת","מספר","אזור","טלפון בגן","נייד גננת","שם סייעת","נייד סייעת","קיבולת","פעיל"];
  const example=["גן הדקל","1234","567890","מרים כהן","3","רגיל","הרב קוק","12","מרכז","02-1234567","050-1234567","שרה לוי","052-7654321","35","כן"];
  const csv=[headers.map(csvCell).join(","), example.map(csvCell).join(",")].join("\r\n");
  downloadBlob(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}), `תבנית-ייבוא-גנים.csv`);

  <fieldset style="margin-top:12px"><legend>קובץ / הדבקה</legend>

  </div>
  <div id="gimp-out" style="margin-top:14px"></div>`);
  $("#gimp-template").onclick=ganTemplateCSV;
  $("#gimp-cancel").onclick=closeModal;
  $("#gimp-file").onchange=e=>{ const f=e.target.files[0]; if(!f)return;
    readFileSmart(f, txt=>{ $("#gimp-text").value=txt; toast("הקובץ נטען — לחצ/י תצוגה מקדימה"); }); };
  const skipdup=()=>$("#gimp-skipdup").checked;
  $("#gimp-preview").onclick=()=>{
    const rows=parseTable($("#gimp-text").value); const out=$("#gimp-out");
    if(rows.length<2){ out.innerHTML=`<div class="empty">לא זוהו שורות נתונים. ודא/י ששורה ראשונה היא כותרות ואחריה שורה לכל גן.</div>`; $("#gimp-do").disabled=true; return; }
    const built=buildGanImportRows(rows); state.list=built.list; state.mapped=built.mapped;
    if(!built.mapped.length){ out.innerHTML=`<div class="note">לא זוהתה אף עמודה מוכרת בשורת הכותרות. הורד/י את התבנית לדוגמה של הכותרות.</div>`; $("#gimp-do").disabled=true; return; }
    const newCnt=state.list.filter(x=>!x.fileDup && !(skipdup()&&x.dup)).length;

          <td>${esc(x.gan.zone)||'—'}</td><td>${esc(x.gan.capacity)||'—'}</td>
          <td>${x.fileDup?'<span class="pill warn">כפול בקובץ</span>':(x.dup?'<span class="pill warn">כפול</span>':'<span class="pill ok">חדש</span>')}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="hint">${state.list.length>25?`מוצגים 25 מתוך ${state.list.length} שורות. `:''}לחצ/י "ייבא גנים" להוספה.</div>`;

  $("#gimp-do").onclick=()=>{

    if(!toAdd.length){ toast("אין גנים חדשים לייבוא"); return; }
    toAdd.forEach(gn=>DB.gans.push(gn));
    save(); closeModal(); route(); toast(`יובאו ${toAdd.length} גנים`);
  };
}

function printTable(title, headers, rows){
  const w=window.open("","_blank"); if(!w){ toast("החלון נחסם — אפשר/י חלונות קופצים"); return; }
  const style=`<style>body{font-family:Arial,"Assistant",sans-serif;direction:rtl;padding:18px;color:#12251a}

    th,td{border:1px solid #bcd;padding:6px 8px;text-align:right} th{background:#e6f3e9}</style>`;
  w.document.write(`<!doctype html><html dir="rtl" lang="he"><head><meta charset="utf-8"><title>${esc(title)}</title>${style}</head><body>
    <h1>${esc(title)}</h1>
    <table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c??"")}</td>`).join("")}</tr>`).join("")}</tbody></table></body></html>`);
  w.document.close(); setTimeout(()=>{ w.focus(); w.print(); }, 250);
}

  host.innerHTML=`<div class="checks" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">

  </div><div id="zoneResult" style="margin-top:12px"></div>`;

/* ============================================================
   טאב עירייה — התאמה לפי ת"ז
   ============================================================ */
const MUNI_HEADER_MAP = {
  "תז":"tz","תעודתזהות":"tz","מספרזהות":"tz","זהות":"tz","מסזהות":"tz",
  "שםהאב":"fatherName","אב":"fatherName","אבא":"fatherName","שםאב":"fatherName","שםהאבא":"fatherName","שםאבא":"fatherName",
  "שםהאם":"motherName","אם":"motherName","אמא":"motherName","שםאם":"motherName","שםהאמא":"motherName","שםאמא":"motherName"
};
/* פענוח קלט העירייה: אם יש כותרת "ת"ז" — קוראים כטבלה (כולל שם אב/אם); אחרת — רשימת ת"ז חופשית */
function parseMuniInput(text){
  const rows=parseTable(text);
  const parents=new Map(); // tz -> {father,mother}
  let structured=false, tzList=[];
  if(rows.length){
    const header=rows[0].map(normHeader); const hi={};
    header.forEach((h,i)=>{ const k=MUNI_HEADER_MAP[h]; if(k && hi[k]==null) hi[k]=i; });
    if(hi.tz!=null){
      structured=true;
      for(let r=1;r<rows.length;r++){ const c=rows[r];
        const tz=digits(c[hi.tz]||""); if(!tz) continue; tzList.push(tz);
        const fa=hi.fatherName!=null?String(c[hi.fatherName]??"").trim():"";
        const mo=hi.motherName!=null?String(c[hi.motherName]??"").trim():"";
        if(fa||mo){ const cur=parents.get(tz)||{}; if(fa&&!cur.father)cur.father=fa; if(mo&&!cur.mother)cur.mother=mo; parents.set(tz,cur); }
      }
    }
  }
  if(!structured) tzList=(String(text||"").match(/\d{5,}/g)||[]);
  return { nums:[...new Set(tzList)], parents, structured };
}

let staffFilter = { q:"", role:"" };
let staffSort = { key:"lastName", dir:1 };
function staffFiltered(){
  const q=staffFilter.q.trim().toLowerCase();
  const list=DB.staff.filter(m=>{
    if(staffFilter.role && m.role!==staffFilter.role) return false;
    if(q){ const hay=(staffName(m)+" "+m.tz+" "+m.email+" "+m.role+" "+m.phone+" "+m.mobile+" "+m.city).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const k=staffSort.key, d=staffSort.dir;
  const roleIdx=m=>{ const i=STAFF_ROLES.indexOf(m.role); return i<0?99:i; };
  const keyVal=m=> k==='name'? staffName(m) : String(m[k]||"");
  return list.sort((a,b)=>{
    let r; if(k==='role') r=roleIdx(a)-roleIdx(b);
    else r=keyVal(a).localeCompare(keyVal(b),"he");
    return r*d || staffName(a).localeCompare(staffName(b),"he");
  });
}

    if(has("סייעת","משלימה")) return "סייעת משלימה";

    if(has("סייעת","ממלאתמקום")||has("סייעת","ממלאת")) return "סייעת ממלאת מקום";
    return t.includes("גננת")?"גננת":(t.includes("רפואי")?"סייעת רפואית":(t.includes("צמוד")?"סייעת צמודה":(/ב'?$/.test(t)&&t.includes("סייעת")?"סייעת ב'":"סייעת"))); };
  $("#sti-cancel").onclick=closeModal;
  $("#sti-template").onclick=()=>{ const csv=['שם משפחה,שם פרטי,ת"ז,מייל,תפקיד,טלפון,נייד,עיר,הערות',"כהן,מרים,123456789,mk@mail.com,גננת,02-1234567,050-1234567,ירושלים,"].join("\r\n"); downloadBlob(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}),"תבנית-צוות.csv"); };
  $("#sti-file").onchange=e=>{ const f=e.target.files[0]; if(!f)return; readFileSmart(f, txt=>{ $("#sti-text").value=txt; toast("הקובץ נטען"); }); };
  $("#sti-do").onclick=()=>{
    const rows=parseTable($("#sti-text").value);
    if(rows.length<2){ $("#sti-out").innerHTML=`<div class="empty">לא זוהו שורות נתונים.</div>`; return; }
    const header=rows[0].map(normHeader); const idx={}; header.forEach((h,i)=>{ const k=map[h]; if(k&&idx[k]==null)idx[k]=i; });
    if(idx.name==null && idx.lastName==null && idx.firstName==null){ $("#sti-out").innerHTML=`<div class="note">לא זוהתה עמודת "שם" / "שם משפחה".</div>`; return; }
    let added=0;
    for(let r=1;r<rows.length;r++){ const c=rows[r]; const g=k=>idx[k]!=null?String(c[idx[k]]??"").trim():"";
      let lastName=g("lastName"), firstName=g("firstName"); const full=g("name");
      if(!lastName && !firstName && full){ const p=full.split(/\s+/); lastName=p.shift()||""; firstName=p.join(" "); }
      if(!lastName && !firstName) continue;
      const m=makeStaff(); m.lastName=lastName; m.firstName=firstName; m.name=[lastName,firstName].filter(Boolean).join(" ");
      m.tz=digits(g("tz")); m.email=g("email"); m.role=normRole(g("role")); m.phone=g("phone"); m.mobile=g("mobile"); m.city=g("city"); m.notes=g("notes");
      DB.staff.push(m); added++;
    }
    save(); closeModal(); route(); toast(`יובאו ${added} אנשי צוות`);
  };
}

let asgContext = "activity"; // הקשר השיבוץ הנבחר (סעיף 8)
function asgYear(){ return DB.assignments[DB.activeYear] || (DB.assignments[DB.activeYear]={}); }
function asgCtxMap(ctx=asgContext){ const y=asgYear(); return y[ctx] || (y[ctx]={}); } // ליצירה/כתיבה
function ganAsg(ganId, ctx=asgContext){ const y=DB.assignments[DB.activeYear]; const c=y&&y[ctx]; return (c&&c[ganId])||{}; } // קריאה בלבד
function ctxLabel(id){ const c=ASSIGN_CONTEXTS.find(x=>x.id===id); return c?c.label:id; }
function asgRoleMeta(role){ return ASSIGN_ROLES.find(r=>r.role===role); }
function asgExtraLabel(role){ const m=asgRoleMeta(role); return m&&m.extra==="days"?"ימים":(m&&m.extra==="duration"?"תקופה":""); }
function asgExtraText(role, cur){
  const m=asgRoleMeta(role); if(!m||!m.extra||!cur) return "";
  if(m.extra==="days") return (cur.days||[]).join(", ");
  if(m.extra==="duration"){ if(cur.durType==="year") return "שנה"; if(cur.durType==="months") return cur.durMonths?`${cur.durMonths} חודשים`:"מספר חודשים"; }
  return "";
}

    ["כתובת",[g.address,g.building].filter(Boolean).join(" ")],["אזור",g.zone],["טל' גן",g.phoneGan],["קיבולת",g.capacity],["רשומות",reg]];

    <h3>שיבוץ — ${esc(ganName(g.id))} <span style="color:var(--muted);font-weight:400">· ${esc(ctxLabel(asgContext))}</span></h3>

              <input class="asg-durmonths" inputmode="numeric" value="${esc(cur.durMonths||"")}"></div>`;
        }
        return `<div class="panel" style="padding:10px;margin:0" data-role="${esc(role)}">
          <div class="row" style="gap:8px;align-items:flex-end;flex-wrap:wrap">

              <select class="asg-staff">

              </select></div>
            <div class="field" style="min-width:150px"><label>שם</label><input class="asg-name" value="${esc(cur.name||"")}"></div>
            <div class="field" style="min-width:130px"><label>טלפון</label><input class="asg-phone" value="${esc(cur.phone||"")}" inputmode="tel"></div>

      <button class="btn ghost" id="asg-cancel">ביטול</button>

  $("#modal").querySelectorAll("[data-role]").forEach(box=>{
    const sel=box.querySelector(".asg-staff"), nm=box.querySelector(".asg-name"), ph=box.querySelector(".asg-phone");
    sel.onchange=()=>{ const m=DB.staff.find(x=>x.id===sel.value); if(m){ nm.value=staffName(m); ph.value=m.mobile||m.phone||""; } };
    const dt=box.querySelector(".asg-durtype");
    if(dt) dt.onchange=()=>{ const w=box.querySelector(".asg-months-wrap"); if(w) w.style.display = dt.value==='months'?'':'none'; };
  });

    <fieldset style="margin-top:10px"><legend>אפשרויות</legend>
      <div class="checks">
        <label class="check"><input type="checkbox" id="ax-phones" checked> כלול מספרי טלפון</label>
        <label class="check"><input type="checkbox" id="ax-fixed" checked> כלול נתוני גן קבועים (סמל, גיל, כתובת…)</label>

      <button class="btn ghost" id="ax-cancel" type="button" style="margin-inline-start:auto">סגירה</button>
    </div>`);
  $("#ax-cancel").onclick=closeModal;
  const build=()=>{
    const phones=$("#ax-phones").checked, fixed=$("#ax-fixed").checked;
    const gans=eduScope(DB.gans.slice()).sort((a,b)=>ganName(a.id).localeCompare(ganName(b.id),"he"));
    const headers=["שם הגן"]; if(fixed) headers.push("סמל פנימי","סמל גן","גיל","חינוך","כתובת","אזור","טל' גן","קיבולת","רשומות","סטטוס");
    ASSIGN_ROLES.forEach(meta=>{ headers.push(meta.role); if(phones) headers.push(meta.role+" — טלפון"); if(meta.extra) headers.push(meta.role+" — "+asgExtraLabel(meta.role)); });
    const rows=gans.map(g=>{
      const reg=studentsOfYear().filter(s=>s.ganId===g.id && !s.finished).length;
      const a=ganAsg(g.id); const row=[ganName(g.id)];
      if(fixed) row.push(g.internalSymbol,g.ganSymbol,g.age,eduLabel(g),[g.address,g.building].filter(Boolean).join(" "),g.zone,g.phoneGan,g.capacity,reg,g.active?"פעיל":"כבוי");
      ASSIGN_ROLES.forEach(meta=>{ const c=a[meta.role]||{}; row.push(c.name||""); if(phones) row.push(c.phone||""); if(meta.extra) row.push(asgExtraText(meta.role,c)); });
      return row;
    });
    return { headers, rows };
  };
  const ctxFile=ctxLabel(asgContext).replace(/\s+/g,"-");
  $("#ax-csv").onclick=()=>{
    const {headers,rows}=build(); if(!rows.length){ toast("אין גנים לייצוא"); return; }
    const csv=[headers.join(",")].concat(rows.map(r=>r.map(csvCell).join(","))).join("\r\n");
    downloadBlob(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}), `שיבוץ_${ctxFile}_${DB.activeYear}${activeEdu==='ח"מ'?'_מיוחד':(activeEdu?'_רגיל':'')}.csv`); toast("קובץ אקסל נוצר");
  };
  $("#ax-pdf").onclick=()=>{
    const {headers,rows}=build(); if(!rows.length){ toast("אין נתונים"); return; }
    printTable(`שיבוץ צוות · ${DB.activeYear} · ${ctxLabel(asgContext)}${activeEdu?` · חינוך ${activeEdu==='ח"מ'?'מיוחד':'רגיל'}`:''}`, headers, rows);
  };
}

    <fieldset><legend>שדות לייצוא</legend>
      <div class="row" style="margin-bottom:8px">
        <button class="btn ghost sm" id="x-all" type="button">סמן הכל</button>
        <button class="btn ghost sm" id="x-none" type="button">נקה הכל</button>
        <button class="btn ghost sm" id="x-def" type="button">ברירת מחדל</button>
      </div>
      <div class="checks" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
        ${EXPORT_FIELDS.map(f=>`<label class="check"><input type="checkbox" class="x-col" value="${f[0]}" ${exportSel.has(f[0])?'checked':''}> ${esc(f[1])}</label>`).join("")}
      </div>
    </fieldset>
    <div class="row">
      <button class="btn" id="x-preview">🔎 תצוגה מקדימה</button>
      <button class="btn ghost" id="x-csv">⬇️ ייצוא לאקסל (CSV)</button>
      <button class="btn ghost" id="x-pdf">🖨️ ייצוא ל-PDF / הדפסה</button>
    </div>
    <div id="x-out" style="margin-top:14px"></div>
  </div>`;
  const gather=()=>{
    const gv=$("#x-gan").value, av=$("#x-age").value, pv=$("#x-period").value, ev=(activeEdu||$("#x-edu").value), mv=$("#x-muni").value, fv=$("#x-fin").value;
    return studentsOfYear().filter(s=>{
      if(fv!=='yes' && s.finished) return false;
      if(gv && s.ganId!==gv) return false;
      if(av && String(s.age)!==av) return false;
      if(pv && s.period!==pv) return false;
      if(ev && eduLabel(s)!==ev) return false;
      if(mv==='yes' && !s.absorbedMunicipality) return false;
      if(mv==='no' && s.absorbedMunicipality) return false;
      return true;
    }).sort((a,b)=>(a.lastName||"").localeCompare(b.lastName||"","he"));
  };
  const cols=()=> EXPORT_FIELDS.filter(f=>exportSel.has(f[0]));
  const preview=()=>{
    const rows=gather(); const C=cols();
    const out=$("#x-out");
    if(!C.length){ out.innerHTML=`<div class="note">בחר/י לפחות שדה אחד לייצוא.</div>`; return rows; }
    if(!rows.length){ out.innerHTML=`<div class="empty">אין תלמידות התואמות לסינון.</div>`; return rows; }
    out.innerHTML=`<div class="table-wrap"><table><thead><tr>${C.map(c=>`<th>${esc(c[1])}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(s=>`<tr>${C.map(c=>`<td>${esc(c[2](s)??"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="hint">${rows.length} שורות · ${C.length} עמודות.</div>`;
    return rows;
  };
  const rerenderCols=()=>{ root.querySelectorAll(".x-col").forEach(cb=>cb.checked=exportSel.has(cb.value)); preview(); };
  root.querySelectorAll(".x-col").forEach(cb=> cb.onchange=()=>{ if(cb.checked)exportSel.add(cb.value); else exportSel.delete(cb.value); preview(); });

  $("#x-none").onclick=()=>{ exportSel=new Set(); rerenderCols(); };
  $("#x-def").onclick=()=>{ exportSel=new Set(EXPORT_DEFAULT); rerenderCols(); };
  $("#x-preview").onclick=preview;
  $("#x-csv").onclick=()=>{
    const rows=gather(); const C=cols();
    if(!C.length){ toast("בחר/י לפחות שדה אחד"); return; }
    if(!rows.length){ toast("אין נתונים לייצוא"); return; }
    const csv=[C.map(c=>c[1]).join(",")].concat(rows.map(s=>C.map(c=>csvCell(c[2](s))).join(","))).join("\r\n");
    const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
    downloadBlob(blob, `תלמידות_${DB.activeYear}.csv`); toast("קובץ אקסל נוצר");
  };
  $("#x-pdf").onclick=()=>{ const rows=preview(); if(!rows.length){ toast("אין נתונים"); return; } setTimeout(()=>window.print(),120); };
  preview();
}
function csvCell(v){ v=String(v??""); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function downloadBlob(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }
/* פענוח קובץ טקסט עם זיהוי קידוד — תומך UTF-8 (עם/בלי BOM) וגם Windows-1255
   (הקידוד שאקסל בעברית שומר בו כברירת מחדל, מה שמקלקל את הכותרות אם קוראים כ-UTF-8) */
function decodeFileText(buf){
  const bytes=new Uint8Array(buf);
  if(bytes.length>=3 && bytes[0]===0xEF && bytes[1]===0xBB && bytes[2]===0xBF)
    return new TextDecoder("utf-8").decode(bytes.subarray(3)); // UTF-8 עם BOM
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(bytes); } // UTF-8 תקין
  catch(_){ try{ return new TextDecoder("windows-1255").decode(bytes); } // נפילה לעברית ANSI (אקסל)
            catch(__){ return new TextDecoder("utf-8").decode(bytes); } }
}
function readFileSmart(file,cb){ const r=new FileReader(); r.onload=()=>cb(decodeFileText(r.result)); r.readAsArrayBuffer(file); }

function openMgmt(m){
  const isNew=!DB.management.some(x=>x.id===m.id);
  modal(`<h3>${isNew?'איש קשר חדש':'עריכת איש קשר'}</h3>

      <div><label>טלפון</label><input id="m-phone" value="${esc(m.phone)}" inputmode="tel"></div>
      <div><label>פלאפון</label><input id="m-mobile" value="${esc(m.mobile)}" inputmode="tel"></div>
      <div><label>מייל</label><input id="m-email" value="${esc(m.email)}" type="email" inputmode="email"></div>
    </div>
    <div class="foot"><button class="btn" id="saveM">💾 שמירה</button><button class="btn ghost" id="cancelM">ביטול</button>
      ${!isNew?'<button class="btn danger" id="delM" style="margin-inline-start:auto">מחיקה</button>':''}</div>`);
  $("#saveM").onclick=()=>{ const val=id=>$("#"+id).value.trim();
    const data={id:m.id,dept:val("m-dept"),name:val("m-name"),role:val("m-role"),phone:val("m-phone"),mobile:val("m-mobile"),email:val("m-email")};
    if(!data.name){ toast("יש להזין שם"); return; }
    const i=DB.management.findIndex(x=>x.id===m.id); if(i>=0)DB.management[i]=data; else DB.management.push(data);

  $("#cancelM").onclick=closeModal;
  if(!isNew)$("#delM").onclick=()=>{ if(confirm("למחוק?")){ DB.management=DB.management.filter(x=>x.id!==m.id); save(); closeModal(); route(); } };
}

    if(from===to){ toast("בחר/י שנת מקור ושנת יעד שונות"); return; }
    const src=DB.students.filter(s=>s.year===from);
    if(!src.length){ toast("אין תלמידות בשנת המקור"); return; }
    const existing=new Set(DB.students.filter(s=>s.year===to).map(s=>digits(s.tz)).filter(Boolean));
    let added=0, skipped5=0;
    const toCopy=[]; // {id: מזהה התלמידה החדשה, src: מזהה קובץ ת"ז המקורי}
    src.forEach(s=>{ if(s.tz && existing.has(digits(s.tz))) return; // כבר קיימת ביעד
      const isRetention = !!(s.special && s.special.retention);
      // אל תעביר ילדות בגיל 5 (מסיימות), למעט המסומנות בהשארות
      if(skip5 && String(s.age)==='5' && !isRetention){ skipped5++; return; }
      const n=JSON.parse(JSON.stringify(s));
      n.id=uid(); n.year=to; n.finished=false; n.period="א"; n.absorbedMunicipality=false;
      // ילדת השארות נשארת באותו גיל (חוזרת על השנה); אחרת מקדמים גיל ב-1
      if(bump && s.age && !isRetention) n.age=String(+s.age+1);
      n.docs={nispach:false,idCopy:false,takanon:false};
      n.docFiles={};
      // צילום ת"ז הוא מסמך קבוע — מעבירים את הסימון ואת הקובץ הפיזי המצורף לשנה הבאה
      if(keepId){
        if(s.docs && s.docs.idCopy) n.docs.idCopy=true;
        if(s.docFiles && s.docFiles.idCopy){
          n.docFiles.idCopy=JSON.parse(JSON.stringify(s.docFiles.idCopy));
          if(copyId && s.docFiles.idCopy.id) toCopy.push({ id:n.id, src:s.docFiles.idCopy.id });
        }
      }
      n.special.approvalFather=n.special.approvalMother=n.special.paymentArrangement=n.special.retentionDoc=false;
      n.driveFolder=""; n.driveFolderId=""; n.createdAt=new Date().toISOString();
      DB.students.push(n); added++; });
    save(); route(); toast(`קודמו ${added} תלמידות לשנת ${to}${skipped5?` · דולגו ${skipped5} בגיל 5`:''}`);

    // מעבר אסינכרוני: העתקה פיזית של קובצי ת"ז לתיקיות השנה החדשה (לא חוסם את הקידום)
    if(copyId && toCopy.length){
      const st=$("#pr-status");
      let done=0, failed=0;
      for(const c of toCopy){
        const n=DB.students.find(x=>x.id===c.id); if(!n) continue;
        if(st) st.textContent=`מעתיק קובצי ת"ז לתיקיות השנה החדשה… ${done+failed}/${toCopy.length}`;
        try{
          await driveEnsureChildFolder(n);
          const nm='צילום תעודת זהות · '+([n.lastName,n.firstName].filter(Boolean).join(" "))+(n.tz?(" · "+n.tz):"");
          const res=await driveCopyFile(c.src, n.driveFolderId, nm);
          const cur=DB.students.find(x=>x.id===c.id);
          if(cur){ cur.docFiles=cur.docFiles||{}; cur.docFiles.idCopy={ id:res.id||"", name:res.name||nm, link:res.link||"" }; }
          done++;
        }catch(e){ console.error(e); failed++; }
      }
      save();
      if(st) st.textContent="";
      toast(`הועתקו ${done} קובצי ת"ז לתיקיות השנה${failed?` · ${failed} נכשלו (נשמר קישור לשנה הקודמת)`:''}`);
    }
  };

  // historical — נעול כברירת מחדל כדי לא לשנות בטעות מספרי תלמידים שהוזנו (סעיף 14)
  const hb=$("#hist-box");
  const histFinal=h=>(+h.periodA||0)+(+h.periodB||0)+(+h.periodC||0); // סופי = סכום א׳+ב׳+ג׳
  let histUnlocked=false;
  const drawHist=()=>{
    const editable = admin && histUnlocked;
    const ro = editable? "" : "readonly";
    hb.innerHTML=`
    <div class="row" style="margin-bottom:8px;align-items:center">
      <div class="note" style="flex:1">🔒 המספרים נעולים כדי לא לשנות בטעות נתונים שכבר הוזנו משנים קודמות.${admin?' לחצ/י "אפשר עריכה" כדי לעדכן.':' רק מנהל מערכת יכול לפתוח לעריכה.'}</div>
      ${admin?`<button class="btn ghost sm" id="hist-lock" style="align-self:center">${editable?'🔓 נעל שוב':'✏️ אפשר עריכה'}</button>`:''}
    </div>
    <div class="table-wrap"><table><thead><tr><th>שנה</th><th>מועד א׳</th><th>מועד ב׳</th><th>מועד ג׳</th><th>סופי (סיכום)</th>${editable?'<th></th>':''}</tr></thead><tbody>
      ${DB.years.map(y=>{const h=DB.historical[y]||{};return `<tr>
        <td><b>${esc(y)}</b></td>
        <td><input class="hist-p" data-h="${esc(y)}|periodA" value="${esc(h.periodA??"")}" inputmode="numeric" style="width:80px" ${ro}></td>
        <td><input class="hist-p" data-h="${esc(y)}|periodB" value="${esc(h.periodB??"")}" inputmode="numeric" style="width:80px" ${ro}></td>
        <td><input class="hist-p" data-h="${esc(y)}|periodC" value="${esc(h.periodC??"")}" inputmode="numeric" style="width:80px" ${ro}></td>
        <td><input data-final value="${histFinal(h)||""}" style="width:80px;font-weight:800;background:var(--surface)" readonly title="סכום מועדים א׳+ב׳+ג׳ (מחושב אוטומטית)"></td>
        ${editable?`<td class="actions"><button class="btn ghost sm" data-livey="${esc(y)}">מלא מנתוני המערכת</button></td>`:''}</tr>`;}).join("")}
    </tbody></table></div><div class="hint">עמודת "סופי" מחושבת אוטומטית כסכום מועדים א׳+ב׳+ג׳.</div>`;
    const lk=$("#hist-lock"); if(lk) lk.onclick=()=>{ histUnlocked=!histUnlocked; drawHist(); };
    if(editable){
      hb.querySelectorAll("input.hist-p").forEach(inp=> inp.oninput=inp.onchange=()=>{
        const [y,k]=inp.dataset.h.split("|"); DB.historical[y]=DB.historical[y]||{};
        const v=inp.value.trim(); if(v==="") delete DB.historical[y][k]; else DB.historical[y][k]=+v;
        const h=DB.historical[y]; const f=histFinal(h);
        const cell=inp.closest("tr").querySelector("[data-final]"); if(cell) cell.value=f||"";
        if(f>0) h.final=f; else delete h.final; save(); });
      hb.querySelectorAll("[data-livey]").forEach(b=>b.onclick=()=>{ const y=b.dataset.livey;
        const ys=DB.students.filter(s=>s.year===y);
        const pa=ys.filter(s=>s.period==='א').length, pb=ys.filter(s=>s.period==='ב').length, pc=ys.filter(s=>s.period==='ג').length;
        DB.historical[y]={ periodA:pa, periodB:pb, periodC:pc, final:pa+pb+pc };
        save(); drawHist(); toast("מולא מנתוני המערכת"); });
    }
  };
  drawHist();

  if(admin) $("#saveGT").onclick=()=>{ const v=+$("#gt").value; if(v>0){DB.settings.gansTarget=v;save();toast("נשמר");} };

  $("#exportAll").onclick=()=>{ downloadBlob(new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}), `גיבוי-רישום-${new Date().toISOString().slice(0,10)}.json`); };
  $("#importAll").onchange=e=>{ const f=e.target.files[0]; if(!f)return;
    readFileSmart(f, txt=>{ try{ const d=JSON.parse(txt); if(!d.students){throw 0;} if(confirm("שחזור יחליף את כל הנתונים הקיימים. להמשיך?")){ DB=Object.assign(blankDB(),d); save(); route(); toast("שוחזר בהצלחה"); } }catch(_){ toast("קובץ לא תקין"); } });
  };
}

/* ============================================================
   מודל / כללי
   ============================================================ */
function modal(html){ $("#modal").innerHTML=html; $("#overlay").classList.add("show"); document.body.style.overflow="hidden"; }
function closeModal(){ $("#overlay").classList.remove("show"); document.body.style.overflow=""; if(pendingRender){ pendingRender=false; route(); } }
$("#overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

$("#tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b){ active=b.dataset.tab; route(); window.scrollTo(0,0); } });
$("#yearSelect").addEventListener("change",e=>{ DB.activeYear=e.target.value; save(); route(); });

/* theme */
(function(){ const KEY="rg-theme"; const saved=localStorage.getItem(KEY); if(saved)document.documentElement.dataset.theme=saved;
  $("#themeBtn").onclick=()=>{ const cur=document.documentElement.dataset.theme|| (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
    const next=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=next; localStorage.setItem(KEY,next); }; })();

boot();
</script>
