<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2c6a4c">
<title>מערכת ניהול רשת הגנים</title>
<!-- PWA — התקנה כאפליקציה בטלפון. Manifest ואייקונים סטטיים (נדרש להתקנה אמיתית באנדרואיד — WebAPK) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" id="faviconLink" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" id="appleIcon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="רשת הגנים">
<style>
:root{
  --bg:#f6f2e9;--surface:#fffdf7;--surface-2:#efe9db;--ink:#182b20;--ink-soft:#48594e;
  --muted:#8a9488;--border:#e4dccb;--accent:#2c6a4c;--accent-strong:#1f4d37;--accent-soft:#e0ecdf;
  --brass:#a97f2e;--good:#2c7a52;--good-soft:#d7ecdf;--warn:#a2691c;--warn-soft:#f3e6cd;
  --bad:#a5342b;--bad-soft:#f5dcd9;--over1:#7b3fb3;--over1-soft:#ece0f7;
  --shadow:0 2px 6px rgba(24,43,32,.06),0 14px 34px rgba(24,43,32,.09);--radius:16px}
@media(prefers-color-scheme:dark){:root{--bg:#0e150f;--surface:#15201a;--surface-2:#1c2a22;--ink:#edf3ec;
  --ink-soft:#aebcae;--muted:#6f7d70;--border:#26362b;--accent:#4aa877;--accent-strong:#6fce9c;--accent-soft:#16281e;
  --brass:#d3a956;--good:#54b888;--good-soft:#123527;--warn:#d3a45c;--warn-soft:#2e2411;
  --bad:#e07b6f;--bad-soft:#3a1c18;--over1:#c39be8;--over1-soft:#2a1f3a;--shadow:0 2px 6px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.5)}}
:root[data-theme="light"]{--bg:#f6f2e9;--surface:#fffdf7;--surface-2:#efe9db;--ink:#182b20;--ink-soft:#48594e;--muted:#8a9488;--border:#e4dccb;--accent:#2c6a4c;--accent-strong:#1f4d37;--accent-soft:#e0ecdf;--good:#2c7a52;--good-soft:#d7ecdf;--warn:#a2691c;--warn-soft:#f3e6cd;--bad:#a5342b;--bad-soft:#f5dcd9;--over1:#7b3fb3;--over1-soft:#ece0f7}
:root[data-theme="dark"]{--bg:#0e150f;--surface:#15201a;--surface-2:#1c2a22;--ink:#edf3ec;--ink-soft:#aebcae;--muted:#6f7d70;--border:#26362b;--accent:#4aa877;--accent-strong:#6fce9c;--accent-soft:#16281e;--good:#54b888;--good-soft:#123527;--warn:#d3a45c;--warn-soft:#2e2411;--bad:#e07b6f;--bad-soft:#3a1c18;--over1:#c39be8;--over1-soft:#2a1f3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;line-height:1.55;
  font-family:"Assistant","Heebo","Segoe UI","Arial Hebrew",system-ui,sans-serif;font-size:15px}
h1,h2,h3{margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;font-weight:700}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--border);
  border-radius:9px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
label{font-size:.82rem;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:4px}
a{color:var(--accent)}

/* header */
header.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);
  box-shadow:var(--shadow)}
.top-inner{max-width:1200px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1.3rem;flex:0 0 auto}
.brand .logo img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.brand .txt{display:flex;flex-direction:column;line-height:1.18;min-width:0}
.brand .txt .t1{font-weight:800;font-size:1.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .txt .t2{font-weight:700;font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-spacer{flex:1}
.top-chips{display:flex;align-items:center;gap:7px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;font-weight:800;font-size:.84rem;white-space:nowrap}
/* כפתורי פעולה קטנים: ניווט (Waze/מפות), חיוג, מייל */
.act{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);text-decoration:none;font-size:.95rem;line-height:1;margin-inline-start:4px;vertical-align:middle;flex:0 0 auto}
.act:hover{border-color:var(--accent);background:var(--accent-soft,var(--surface))}
.actgrp{display:inline-flex;align-items:center;gap:0}
.fieldwrap{display:flex;gap:5px;align-items:stretch}
.fieldwrap>input{flex:1;min-width:0}
.fieldwrap>.act{width:38px;height:auto;cursor:pointer}
.chip.year{background:var(--accent-soft);color:var(--accent-strong)}
.chip.edu{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--border)}
.chip.edu.reg{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.edu.spec{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.hamburger{background:var(--surface-2);border:1px solid var(--border);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.hamburger:hover{border-color:var(--accent)}
.backbtn{background:var(--surface-2);border:1px solid var(--border);width:42px;height:42px;border-radius:12px;display:none;place-items:center;flex:0 0 auto;color:var(--ink-soft);cursor:pointer}
.backbtn.show{display:grid}
.backbtn:hover{border-color:var(--accent);color:var(--accent)}
.backbtn svg{width:20px;height:20px;display:block}
.hamburger span{display:block;width:19px;height:2px;background:var(--ink-soft);border-radius:2px;box-shadow:0 6px 0 var(--ink-soft),0 -6px 0 var(--ink-soft)}
@media(max-width:560px){.brand .txt .t2{display:none}.brand .logo{width:38px;height:38px}.chip{padding:5px 9px;font-size:.78rem}.top-inner{gap:7px}}

/* drawer (תפריט צד שמאל) */
.scrim{position:fixed;inset:0;background:rgba(6,18,22,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(330px,88vw);background:var(--surface);border-right:1px solid var(--border);
  box-shadow:0 0 44px rgba(0,0,0,.28);z-index:55;display:flex;flex-direction:column;transform:translateX(-103%);
  transition:transform .28s cubic-bezier(.4,0,.2,1)}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.drawer-head .logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1.15rem;flex:0 0 auto}
.drawer-head .logo img{width:100%;height:100%;object-fit:cover;border-radius:11px}
.drawer-head .txt{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1}
.drawer-head .txt .t1{font-weight:800;font-size:1rem}
.drawer-head .txt .t2{font-weight:700;font-size:.72rem;color:var(--muted)}
.drawer-close{background:var(--surface-2);border:1px solid var(--border);width:34px;height:34px;border-radius:9px;font-size:1.1rem;color:var(--ink-soft);flex:0 0 auto}
.drawer-body{flex:1;overflow:auto;padding:14px 12px;-webkit-overflow-scrolling:touch}
.drawer-sec{margin-bottom:16px}
.drawer-sec>.lbl{font-size:.72rem;font-weight:800;color:var(--muted);margin:0 4px 7px;letter-spacing:.02em}
.drawer-year{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:12px;padding:9px 13px;font-weight:800;color:var(--accent-strong)}
.drawer-year select{width:auto;flex:1;background:transparent;border:0;font-weight:800;color:var(--accent-strong);padding:2px}
.drawer-edu{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.drawer-edu button{background:var(--surface-2);border:1px solid var(--border);color:var(--ink-soft);padding:9px 4px;border-radius:11px;font-weight:800;font-size:.83rem}
.drawer-edu button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.drawer-edu button.reg.active{background:var(--good);border-color:var(--good)}
.drawer-edu button.spec.active{background:var(--warn);border-color:var(--warn)}
.drawer-nav{display:flex;flex-direction:column;gap:3px}
.drawer-nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:transparent;color:var(--ink-soft);padding:11px 12px;border-radius:11px;font-weight:700;font-size:.96rem}
.drawer-nav button .ic{font-size:1.18rem;width:26px;text-align:center;flex:0 0 auto}
.drawer-nav button .count{margin-inline-start:auto;background:var(--accent-soft);color:var(--accent-strong);border-radius:999px;padding:1px 9px;font-size:.76rem;font-weight:800}
.drawer-nav button:hover{background:var(--surface-2)}
.drawer-nav button.active{background:var(--accent);color:#fff;box-shadow:var(--shadow)}
.drawer-nav button.active .count{background:rgba(255,255,255,.24);color:#fff}
.drawer-foot{border-top:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:8px}
.drawer-foot .df-row{display:flex;gap:8px}
.drawer-foot button{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-soft);padding:10px 10px;border-radius:11px;font-weight:800;font-size:.86rem}
.drawer-foot button:hover{border-color:var(--accent);color:var(--accent-strong)}
.drawer-foot #signOutBtn{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.drawer-sync{text-align:center;font-size:.82rem;font-weight:800;padding:2px}
.doc-row{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:7px 10px;flex-wrap:wrap}
.doc-row .lbl{display:flex;align-items:center;gap:8px;font-weight:600;flex:1;min-width:150px;cursor:pointer}
.doc-row .lbl input{width:auto;margin:0}
.doc-rows{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(max-width:640px){.doc-rows{grid-template-columns:1fr}}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--accent-strong)}
th.sortable .arr{font-size:.7rem;opacity:.7;margin-inline-start:3px}
.icon-btn{background:var(--surface-2);border:1px solid var(--border);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:1.05rem}

/* עמוד הבית */
.home-empty{text-align:center;padding:60px 22px;color:var(--muted)}
.home-empty .big{font-size:3.4rem;margin-bottom:12px}
.home-empty h2{font-size:1.3rem;color:var(--ink);margin-bottom:8px}
.home-empty .btn{margin-top:16px;display:inline-flex;align-items:center;gap:8px}
.home-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.home-head h2{font-size:1.35rem}
.home-head .hh-edu{font-weight:800;font-size:.9rem;padding:5px 12px;border-radius:999px}
.hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.hcard{border-radius:18px;padding:18px 20px;border:1px solid var(--border);box-shadow:var(--shadow);position:relative;overflow:hidden;background:linear-gradient(200deg,var(--surface-2),var(--surface))}
.hcard .ic{position:absolute;inset-inline-end:16px;top:14px;font-size:1.7rem;opacity:.5}
.hcard .k{font-size:.82rem;color:var(--muted);font-weight:800}
.hcard .v{font-size:2.5rem;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1}
.hcard .v small{font-size:.95rem;color:var(--muted);font-weight:700}
.hcard .split{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.hcard .split .sp{display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--ink-soft)}
.hcard .split .sp b{font-size:1rem}
.hcard .sp .dt{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.hcard.acc{background:radial-gradient(120% 140% at 88% -20%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 60%),linear-gradient(200deg,var(--surface-2),var(--surface))}
.gan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.gan-card{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:14px 15px;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;cursor:default}
.gan-card:hover{transform:translateY(-2px)}
.gan-card .gc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.gan-card .gname{font-weight:800;font-size:.98rem;line-height:1.25}
.gan-card .gmeta{font-size:.74rem;color:var(--muted);font-weight:700;margin-top:2px}
.gan-card .gcount{font-size:1.7rem;font-weight:800;color:var(--accent-strong);line-height:1;white-space:nowrap}
.gan-card .gcount small{font-size:.72rem;color:var(--muted);font-weight:700}
.gan-card .gbar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.gan-card .gbar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.gan-card.spec .gcount{color:var(--warn)}
.gan-card.spec .gbar>i{background:var(--warn)}
.edu-tag{display:inline-block;font-size:.68rem;font-weight:800;padding:1px 7px;border-radius:999px;margin-inline-start:6px;vertical-align:middle}
.edu-tag.reg{background:var(--good-soft);color:var(--good)}
.edu-tag.spec{background:var(--warn-soft);color:var(--warn)}

main{max-width:1200px;margin:0 auto;padding:18px 16px 80px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
.panel h2{font-size:1.15rem;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:.86rem;margin-bottom:14px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}

.btn{background:var(--accent);color:#fff;padding:9px 16px}
.btn:hover{background:var(--accent-strong)}
.btn.ghost{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent-strong)}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:#fff}

/* שורת חיפוש עם זכוכית מגדלת + סינון מתקדם נפתח */
.searchbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search-field{position:relative;flex:1;min-width:200px}
.search-field .mag{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:1rem}
.search-field input{padding-inline-start:36px}
.filter-toggle{background:var(--surface-2);border:1px solid var(--border);color:var(--ink-soft);padding:9px 14px;border-radius:10px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.filter-toggle.on{background:var(--accent-soft);color:var(--accent-strong);border-color:var(--accent)}
.filter-toggle .fcount{background:var(--accent);color:#fff;border-radius:999px;font-size:.72rem;padding:0 7px}
.filter-panel{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--surface-2)}
.filter-panel[hidden]{display:none}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--accent-soft)}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar .field{min-width:130px}
.toolbar .field.grow{flex:1;min-width:180px}
.toolbar .field label{margin-bottom:3px}

/* table */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:720px}
th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--surface-2);font-weight:800;color:var(--ink-soft);position:sticky;top:0}
tbody tr:hover{background:var(--surface-2)}
td.actions{white-space:nowrap}
.empty{padding:34px;text-align:center;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:800}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.dot-list{display:flex;gap:3px}
.doc-dot{width:16px;height:16px;border-radius:50%;font-size:10px;display:grid;place-items:center;font-weight:800}
.doc-dot.on{background:var(--good);color:#fff}
.doc-dot.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:linear-gradient(200deg,var(--surface-2),var(--surface));border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.stat .k{font-size:.78rem;color:var(--muted);font-weight:700}
.stat .v{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:.9rem;color:var(--muted);font-weight:700}
.stat.hero{background:radial-gradient(120% 140% at 88% -20%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 60%),linear-gradient(200deg,var(--surface-2),var(--surface))}

.bar{height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* עוגות (pie / donut) + מקרא */
.pie-block{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pie-svg{flex:0 0 auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.08))}
.pie-legend{flex:1 1 200px;min-width:180px;display:flex;flex-direction:column;gap:2px}
.pie-leg-row{display:flex;align-items:center;gap:9px;font-size:.9rem;padding:5px 2px;border-bottom:1px dashed var(--border)}
.pie-leg-row:last-child{border-bottom:0}
.pie-dot{width:13px;height:13px;border-radius:4px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.08) inset}
.pie-leg-label{font-weight:700;color:var(--ink-soft);flex:1;overflow:hidden;text-overflow:ellipsis}
.pie-leg-val{font-weight:800;white-space:nowrap}
.pie-leg-val small{color:var(--muted);font-weight:700;margin-inline-start:4px}
.pie-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.pie-card{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.pie-card h4{font-size:1rem;margin-bottom:10px;color:var(--accent-strong)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,18,22,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:12px}
.overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);width:min(760px,100%);
  max-height:calc(100dvh - 24px);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:0 22px}
.modal>h3{position:sticky;top:0;z-index:3;background:var(--surface);font-size:1.2rem;margin:0 -22px 14px;padding:17px 22px 13px;border-bottom:1px solid var(--border)}
.modal>.foot{position:sticky;bottom:0;z-index:3;background:var(--surface);display:flex;gap:10px;justify-content:flex-start;
  margin:16px -22px 0;padding:13px 22px;border-top:1px solid var(--border);flex-wrap:wrap}
.modal>*:last-child:not(.foot){margin-bottom:20px}
.modal h3{font-size:1.2rem}
fieldset{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:0 0 12px}
legend{font-weight:800;color:var(--accent-strong);padding:0 6px;font-size:.9rem}

/* ===== Evergreen polish · phase 2 (additive, non-breaking) ===== */
:root{--shadow-lg:0 10px 26px rgba(24,43,32,.12),0 34px 66px rgba(24,43,32,.18)}
:root[data-theme="light"]{--shadow-lg:0 10px 26px rgba(24,43,32,.12),0 34px 66px rgba(24,43,32,.18)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--shadow-lg:0 12px 30px rgba(0,0,0,.5),0 40px 80px rgba(0,0,0,.62)}}
:root[data-theme="dark"]{--shadow-lg:0 12px 30px rgba(0,0,0,.5),0 40px 80px rgba(0,0,0,.62)}
.hcard,.stat{position:relative;overflow:hidden;transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s,border-color .28s}
.hcard:hover,.stat:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:transparent}
.hcard::after,.stat::after{content:"";position:absolute;inset-inline:0;top:0;height:3px;pointer-events:none;background:linear-gradient(90deg,var(--accent),var(--brass));transform:scaleX(0);transform-origin:100% 50%;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.hcard:hover::after,.stat:hover::after{transform:scaleX(1)}
.gan-card{transition:transform .26s cubic-bezier(.2,.7,.2,1),box-shadow .26s,border-color .26s}
.gan-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:transparent}
.drawer-nav button{transition:background .2s,color .2s,transform .15s}
.drawer-nav button:hover{transform:translateX(-2px)}
.btn{transition:background .2s,transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.hcard,.stat,.gan-card,.btn,.drawer-nav button{transition:none}.hcard::after,.stat::after{transition:none}}

/* ===== Evergreen polish · phase 3 (refinement) ===== */
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.pill{display:inline-flex;align-items:center;gap:5px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.pill.neutral::before{opacity:.55}
.table-wrap{border-radius:16px}
.brand .logo,.drawer-head .logo{background:linear-gradient(145deg,var(--accent),var(--accent-strong))}
.icon-btn{transition:background .18s,border-color .18s,color .18s,transform .15s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-strong);transform:translateY(-1px)}

/* ===== Evergreen polish · phase 4 (depth) ===== */
@keyframes rgModalIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.overlay.show .modal{animation:rgModalIn .26s cubic-bezier(.2,.7,.2,1)}
fieldset{border-radius:14px}
.check{transition:border-color .18s,background .18s}
.check:hover{border-color:var(--accent)}
.btn:active{transform:translateY(0)}
.drawer-edu button{transition:all .18s}
.drawer-edu button:hover:not(.active){border-color:var(--accent)}
.bar>i,.gan-card .gbar>i{transition:width .8s cubic-bezier(.2,.7,.2,1)}
.pie-card{transition:transform .26s,box-shadow .26s,border-color .26s}
.pie-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:transparent}
@media (prefers-reduced-motion:reduce){.overlay.show .modal{animation:none}.bar>i,.gan-card .gbar>i{transition:none}}

function hexToRgba(hex, a){ hex=String(hex||"").replace('#',''); if(hex.length===3) hex=hex.split('').map(x=>x+x).join(''); const n=parseInt(hex||"0",16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
/* תווית תפקיד צבעונית לפי הצבע שהוגדר בהגדרות (סעיף 9) */
function roleChip(role){
  if(!role) return '<span class="pill neutral">—</span>';
  const c=roleColor(role);
  if(!c) return `<span class="pill neutral">${esc(role)}</span>`;
  return `<span class="pill" style="background:${hexToRgba(c,.16)};color:${c};border:1px solid ${hexToRgba(c,.45)}">${esc(role)}</span>`;
}

  };
  const [txt,color,title]=map[state]||map.synced;
  el.style.display="inline-flex"; el.textContent=txt; el.style.color=color; el.title=title;
  // באנר מנחה כשהסנכרון תקוע (לא מחובר / מסנכרן שלא מסתיים / שגיאה) מעל ~12 שניות
  if(state==="synced"){
    clearTimeout(_offlineTimer); _offlineTimer=null; _offlineDismissed=false; hideOfflineBanner();
  } else {
    if(!_offlineTimer && !_offlineDismissed) _offlineTimer=setTimeout(showOfflineBanner, 12000);
  }
  // שומר-סף לכתיבה תקועה: כשהקריאה מהשרת עובדת (serverConfirmed) אך "מסנכרן" לא מתחלף ל"נשמר בענן"
  // תוך ~15 שניות — סימן שערוץ הכתיבה של ה-SDK חסום (רשת/פרוקסי) בעוד הקריאה עוברת. עוברים אוטומטית
  // לכתיבה דרך REST (דחיפה, בלי לדרוס נתונים מקומיים) כדי לשחרר את התקיעה גם ללא התערבות המשתמש.
  if(state==="pending" && serverConfirmed && !restMode){
    if(!_pendingWatch) _pendingWatch=setTimeout(recoverStuckWrite, 15000);
  } else {
    clearTimeout(_pendingWatch); _pendingWatch=null;
  }
}
let _offlineTimer=null, _offlineDismissed=false, _pendingWatch=null, _syncState="";
/* מעבר אוטומטי לכתיבה דרך REST כשכתיבת ה-SDK נתקעת על "מסנכרן" (ראו setSyncStatus).
   דוחף את הנתונים המקומיים כפי שהם — כדי לא לאבד עריכה שטרם עלתה לשרת. */
async function recoverStuckWrite(){
  _pendingWatch=null;
  if(restMode || !currentUser || _syncState!=="pending" || !serverConfirmed) return;
  const localEmpty = !DB.students.length && !DB.gans.length && !DB.staff.length && !DB.management.length;
  if(localEmpty) return; // אין מה לדחוף — לא נדרוס שרת עם DB ריק
  try{
    enterRestMode();
    await pushAllRest();
    savePending=false;
    setSyncStatus("synced");
    toast("הסנכרון הושלם (מצב חלופי)");
  }catch(e){ console.error(e); setSyncStatus("error"); toast("שגיאת סנכרון — נסה/י שוב או בדוק/י חיבור"); }
}

/* מסלול חלופי לטעינת נתונים דרך Firestore REST (בקשת HTTPS פשוטה) — עוקף מצב שבו
   חיבור ה-streaming של ה-SDK לא מצליח למשוך נתונים אף שהרשת מאפשרת בקשות רגילות. */
function decFsVal(v){
  if(v==null) return null;
  if('stringValue' in v) return v.stringValue;
  if('integerValue' in v) return +v.integerValue;
  if('doubleValue' in v) return v.doubleValue;
  if('booleanValue' in v) return v.booleanValue;
  if('nullValue' in v) return null;
  if('timestampValue' in v) return v.timestampValue;
  if('arrayValue' in v) return (v.arrayValue.values||[]).map(decFsVal);
  if('mapValue' in v) return decFsFields((v.mapValue||{}).fields||{});
  return null;
}
function decFsFields(fields){ const o={}; for(const k in fields) o[k]=decFsVal(fields[k]); return o; }
/* תרגום שגיאת רשת להסבר ברור בעברית — "Failed to fetch"/TypeError פירושו שהמכשיר
   כלל לא הצליח להגיע לשרת Google/Firebase (רשת/פרוקסי/VPN/סינון חוסמים, או token שפג
   שאי-אפשר לרענן ללא רשת). מבדיל מבעיית הרשאות/נתונים שמגיעה עם קוד סטטוס. */
function netErrHe(e){
  const m=String((e&&e.message)||e||"");
  if(/failed to fetch|networkerror|load failed|type ?error|err_|ERR_/i.test(m))
    return `<b style="color:var(--bad)">לא הצלחנו להגיע לשרת</b> (${esc(m)}). הרשת או הדפדפן חוסמים כרגע את החיבור ל-Firebase — הנתונים שמורים אצלך מקומית ובטוחים. עברו ל<b>רשת סלולרית</b> (או להיפך), כבו <b>VPN/סינון תוכן/חוסם פרסומות</b>, או נסו <b>דפדפן/מכשיר אחר</b> — ואז לחצו שוב "שמור לענן".`;
  return `${esc(m)}`;
}
async function loadViaRest(){
  const out=$("#ob-result");
  if(!currentUser){ if(out) out.innerHTML=`<b style="color:var(--bad)">יש להתחבר קודם.</b>`; return; }
  if(out) out.innerHTML="טוען נתונים במצב חלופי… ⏳";
  try{
    const token=await currentUser.getIdToken();
    const base="https://firestore.googleapis.com/v1/projects/"+firebaseConfig.projectId+"/databases/(default)/documents/app";
    const map=new Map(); let pageToken="";
    do{
      const url=base+"?pageSize=300"+(pageToken?("&pageToken="+encodeURIComponent(pageToken)):"");
      const res=await fetch(url,{ headers:{ Authorization:"Bearer "+token } });
      if(!res.ok){ if(out) out.innerHTML=`<b style="color:var(--bad)">שגיאת טעינה (${res.status}).</b> ${res.status===403?'אין הרשאה לחשבון הזה.':'נסה/י שוב.'}`; return; }
      const json=await res.json();
      (json.documents||[]).forEach(dnode=>{ const id=dnode.name.split("/").pop(); map.set(id, decFsFields(dnode.fields||{})); });
      pageToken=json.nextPageToken||"";
    } while(pageToken);
    if(!map.has("meta") && !map.size){ if(out) out.innerHTML=`<b style="color:var(--bad)">לא נמצאו נתונים במאגר.</b>`; return; }
    cloudDocs=map; serverConfirmed=true;
    knownStudentDocs.clear(); [...map.keys()].forEach(id=>{ if(id.startsWith("students_")) knownStudentDocs.add(id); });
    enterRestMode(); rebuildDB(cloudDocs); maybeMigrateBranding();
    if(!enforceAccess()) return; // חסימת התחברות Google לא-מורשית גם במצב חלופי
    hideOfflineBanner(); _offlineDismissed=true; setSyncStatus("synced"); route();
    toast("הנתונים נטענו (מצב חלופי) — אפשר גם לערוך");
  }catch(e){ console.error(e); if(out) out.innerHTML=`<b style="color:var(--bad)">הטעינה נכשלה:</b> ${netErrHe(e)}`; }
}
/* דחיפת הנתונים המקומיים לענן דרך Firestore REST — משחרר "מסנכרן" תקוע כשערוץ הכתיבה של

/* איפוס העותק המקומי הפגום בדפדפן וטעינה מחדש מהשרת — לשימוש כשהמצב המקומי (מטמון
   Firestore ב-IndexedDB) נתקע, בעוד הנתונים בענן תקינים (למשל נראים במכשיר אחר).
   פעולה הרסנית לעותק המקומי בלבד — לא נוגעת בנתונים שבשרת. מוגנת באישור. */
async function hardResetLocal(){
  const ok = confirm("איפוס המכשיר הזה:\n\nזה ימחק את העותק המקומי בדפדפן ויוריד הכול מחדש מהשרת. הנתונים בענן לא ייפגעו.\n\n⚠️ אם עשית שינוי *רק* במכשיר הזה שעדיין לא נשמר בשרת — הוא יימחק. ודא/י שמכשיר אחר מציג את כל השינויים לפני שממשיכים.\n\nלהמשיך?");
  if(!ok) return;
  try{ if(dataUnsub){ dataUnsub(); dataUnsub=null; } }catch(_){}
  try{ if(db) await terminate(db); }catch(_){}
  try{ if(db) await clearIndexedDbPersistence(db); }catch(_){}
  // גיבוי: מחיקה ישירה של מאגרי IndexedDB של firebase שנותרו (אם clearIndexedDbPersistence נחסם)
  try{ if(indexedDB.databases){ const dbs=await indexedDB.databases(); for(const d of dbs){ if(d.name && /firebase|firestore/i.test(d.name)){ try{ indexedDB.deleteDatabase(d.name); }catch(_){} } } } }catch(_){}
  setTimeout(()=>location.reload(), 400);
}
/* קידוד לערכי Firestore REST (הפוך מ-decFsVal) — לכתיבה במצב חלופי */
function encFsVal(v){
  if(v===null||v===undefined) return {nullValue:null};
  const t=typeof v;
  if(t==="string") return {stringValue:v};
  if(t==="boolean") return {booleanValue:v};
  if(t==="number") return Number.isInteger(v) ? {integerValue:String(v)} : {doubleValue:v};
  if(Array.isArray(v)) return {arrayValue:{values:v.map(encFsVal)}};
  if(t==="object") return {mapValue:{fields:encFsFields(v)}};
  return {stringValue:String(v)};
}
function encFsFields(obj){ const f={}; for(const k in obj){ if(obj[k]!==undefined) f[k]=encFsVal(obj[k]); } return f; }
/* כתיבת כל הנתונים דרך Firestore REST (PATCH=setDoc מלא, DELETE למסמכי שנה שהוסרו) */
async function pushAllRest(){
  const token=await currentUser.getIdToken();
  const base="https://firestore.googleapis.com/v1/projects/"+firebaseConfig.projectId+"/databases/(default)/documents/app/";
  const hdr={ "Authorization":"Bearer "+token, "Content-Type":"application/json" };
  const put=async(id,obj)=>{ const r=await fetch(base+encodeURIComponent(id),{ method:"PATCH", headers:hdr, body:JSON.stringify({fields:encFsFields(obj)}) }); if(!r.ok) throw new Error("write "+id+" ("+r.status+")"); };
  const meta=metaForWrite();
  await put("meta", meta);
  await put("gans", { gans:DB.gans.slice() });
  await put("management", { management:DB.management.slice() });
  await put("staff", { staff:DB.staff.slice() });
  const byYear={}; DB.students.forEach(s=>{ (byYear[s.year]=byYear[s.year]||[]).push(s); });
  const wantIds=new Set();
  for(const y of Object.keys(byYear)){ const id=safeYearId(y); wantIds.add(id); knownStudentDocs.add(id); await put(id,{ year:y, students:byYear[y] }); }
  for(const id of [...knownStudentDocs]){ if(!wantIds.has(id)){ try{ await fetch(base+encodeURIComponent(id),{ method:"DELETE", headers:hdr }); }catch(e){} knownStudentDocs.delete(id); } }
  // עדכון עותק הענן המקומי כדי שרענון פנימי לא ישחזר מצב ישן
  const nm=new Map(); nm.set("meta",meta); nm.set("gans",{gans:DB.gans.slice()}); nm.set("management",{management:DB.management.slice()}); nm.set("staff",{staff:DB.staff.slice()});
  for(const y of Object.keys(byYear)) nm.set(safeYearId(y),{year:y,students:byYear[y]});
  if(cloudDocs && cloudDocs.get && cloudDocs.has("branding")) nm.set("branding", cloudDocs.get("branding")); // שימור מסמך המיתוג בעותק המקומי (אינו נכתב בשמירה רגילה)
  cloudDocs=nm;
}
/* ---------- מיתוג במסמך נפרד (app/branding) — סעיף "באג לוגו" ----------
   הלוגו/כותרת נשמרים במסמך ייעודי הנכתב *רק כשמשנים מיתוג*, ולא בכל עריכה.
   כך עריכות רגילות (שכותבות meta בכל שמירה) לא דורסות עוד את הלוגו, וה-data URL
   הכבד של הלוגו אינו מנפח את meta לכיוון תקרת ה-1MB. */
function metaForWrite(){
  const s=Object.assign({}, DB.settings); delete s.appLogo; // הלוגו נשמר ב-app/branding בלבד
  return { activeYear:DB.activeYear, years:DB.years.slice(), municipality:DB.municipality, historical:DB.historical, historicalGans:DB.historicalGans, settings:s, assignments:DB.assignments };
}
function brandingFromSettings(){

function clashDesc(c){
  const eduTxt = eduLabel(c)==='ח"מ' ? 'חינוך מיוחד' : 'חינוך רגיל';
  const nm=[c.lastName,c.firstName].filter(Boolean).join(" ")||'ללא שם';
  return nm+' · '+eduTxt+(c.ganId?(' · '+ganName(c.ganId)):'');
}

/* ============================================================
   מעבר שנה — לוגיקת קידום (סעיף מעבר שנה)
   ============================================================ */
/* גיל של גן — תומך בגנים דו-גלאיים "3/4" / "4/5": האם הגן מכיל את הגיל הנתון */
function ganMatchesAge(gan, age){ return String(gan.age||"").split("/").map(x=>x.trim()).includes(String(age)); }
/* הגן המתקדם באותו קמפוס לגיל הנתון — רק אם יש בדיוק גן פעיל אחד מתאים (אחרת null → ללא גן) */
function nextGanInCampus(src, newAge){
  const srcGan=ganById(src.ganId);
  const campus=(src.campus || (srcGan&&srcGan.campus) || "");
  const edu=eduLabel(src);
  const cands=DB.gans.filter(g=> g.active!==false && (g.campus||"")===campus && eduLabel(g)===edu && ganMatchesAge(g,newAge));
  return cands.length===1 ? cands[0] : null;
}
/* השנה שאחרי (לפי סדר DB.years — סדר כרונולוגי של הוספה) */
function nextYearOf(y){ const i=DB.years.indexOf(y); return (i>=0 && i<DB.years.length-1) ? DB.years[i+1] : null; }

/* בניית רשומת התלמידה לשנת היעד לפי כללי המעבר.
   forceRetain=true → השארות: אותו גן, אותו גיל, בלי קידום.
   מחזיר null אם הילדה מסיימת (גן חובה / גיל 5+) ואינה בהשארות. */
function buildPromoted(src, toYear, forceRetain){
  const retain = forceRetain || !!src.retentionNext;
  const curAge = parseInt(src.age,10);
  if(!retain){
    // מסיימת: גיל 5+ (גן חובה) — לא עוברת
    if(!isNaN(curAge) && curAge>=5) return null;
  }
  const n=JSON.parse(JSON.stringify(src));
  n.id=uid(); n.year=toYear; n.createdAt=new Date().toISOString();
  n.period="א"; n.finished=false;
  n.placed=false;                 // לא מסומנת משובצת
  n.absorbedMunicipality=false;   // לא קלוט בעירייה (יעודכן בהמשך בעדכון קבוצתי)
  n.insurancePaid=false;          // ביטוח — מחדש כל שנה
  n.retentionNext=false;          // דגל ההשארות לא ממשיך אוטומטית הלאה
  // גן + גיל
  if(retain){
    n.ganId=src.ganId; n.age=src.age; n.campus=src.campus;
  } else if(!isNaN(curAge)){
    const newAge=curAge+1;
    const ng=nextGanInCampus(src,newAge);
    n.age=String(newAge);
    n.ganId = ng? ng.id : "";               // ללא גן אם אין התאמה יחידה (החלטה: להשאיר ללא גן)
    n.campus = ng? (ng.campus||"") : "";
  } else {
    n.ganId=""; n.campus="";                // אין גיל — עובר ללא גן
  }
  // מסמכים — רק צילום ת"ז (סימון + קובץ) עובר; נספח/תקנון מתאפסים
  const idFile = (src.docFiles && src.docFiles.idCopy) ? JSON.parse(JSON.stringify(src.docFiles.idCopy)) : null;
  n.docs={ nispach:false, idCopy: !!(src.docs&&src.docs.idCopy), takanon:false };
  n.docFiles = idFile ? { idCopy:idFile } : {};
  // תוכניות/מועדונים + תשלומי קייטנה — ריק
  n.programs={ tzaharon:false, campHanukkah:false, campNisan:false, campEndYear:false };
  n.programsPaid={ tzaharon:false, campHanukkah:false, campNisan:false, campEndYear:false };
  // סיוע והעשרה — ריק
  n.support={ shiluv:false, salIshi:false, behavior:false, prepA:false };
  // שונות: גרושים/חוץ/אחר — הסימון עובר; מסמכים וחתימות מחדש; השארות (של השנה) לא עוברת
  const sp=src.special||{};
  n.special={
    divorced: !!sp.divorced,
    approvalFather:false, approvalMother:false, idFather:false, idMother:false,
    approvalDoc:false, approvalFatherSig:false, approvalMotherSig:false,
    outOfCity: !!sp.outOfCity, paymentArrangement:false,
    retention:false, retentionDoc:false,
    other: !!sp.other, otherText: sp.other ? (sp.otherText||"") : ""
  };
  // דרייב — תיקייה חדשה לשנה החדשה (תיווצר עם הצורך)
  n.driveFolder=""; n.driveFolderId="";
  // הערות — נקי
  n.notes="";
  return n;
}
/* העברה מיידית של ילדה שסומנה "השארות לשנה הבאה" — לשנה הבאה, באותו גן, אם עוד לא קיימת שם.
   מחזיר {ok, year, reason}. אינו שומר — הקורא אחראי ל-save(). */
function ensureRetentionTransfer(src){
  const toYear=nextYearOf(src.year);
  if(!toYear) return { ok:false, reason:"אין שנה הבאה מוגדרת בהגדרות" };
  if(tzClashInYear(src.tz, toYear, null)) return { ok:false, reason:"כבר קיימת בשנה הבאה" };
  const n=buildPromoted(src, toYear, true);
  if(!n) return { ok:false, reason:"לא נוצרה רשומה" };
  DB.students.push(n);
  return { ok:true, year:toYear };
}

/* ---------- אייקון אפליקציה (PWA) שנוצר מהלוגו — סעיף "התקנה בטלפון" ---------- */
let _manifestUrl=null;
function iconFromEmoji(emoji,size){
  try{
    const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
    const g=(getComputedStyle(document.documentElement).getPropertyValue('--accent')||'').trim()||'#4a9d5b';
    const r=size*0.22;
    x.fillStyle=g; x.beginPath();
    x.moveTo(r,0); x.arcTo(size,0,size,size,r); x.arcTo(size,size,0,size,r); x.arcTo(0,size,0,0,r); x.arcTo(0,0,size,0,r); x.closePath(); x.fill();
    x.font=Math.floor(size*0.6)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
    x.textAlign='center'; x.textBaseline='middle';
    x.fillText(emoji||'🎒', size/2, size/2+size*0.03);
    return c.toDataURL('image/png');
  }catch(e){ return null; }
}
/* יוצר אייקון אפליקציה מרובע מתוך תמונת לוגו: רקע בצבע המותג + הלוגו ממורכז (contain).
   מתאים גם ל-maskable (מילוי מלא של הריבוע, הלוגו באזור הבטוח המרכזי). */
function iconFromImage(src, size){
  return new Promise(resolve=>{
    try{
      const img=new Image();
      img.onload=()=>{ try{
        const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
        const accent=(getComputedStyle(document.documentElement).getPropertyValue('--accent')||'').trim()||'#4a9d5b';
        x.fillStyle=accent; x.fillRect(0,0,size,size);
        const pad=size*0.12, box=size-pad*2;
        const scale=Math.min(box/img.width, box/img.height);
        const w=img.width*scale, h=img.height*scale;
        x.drawImage(img, (size-w)/2, (size-h)/2, w, h);
        resolve(c.toDataURL('image/png'));
      }catch(_){ resolve(null); } };
      img.onerror=()=>resolve(null);
      img.src=src;
    }catch(_){ resolve(null); }
  });
}
let _lastIconKey="";
async function updatePwaIcons(){
  try{
    const logo=appLogo(), title=appTitle(), isImg=/^(https?:|data:)/i.test(logo);
    const key=logo+"|"+title; if(key===_lastIconKey) return; _lastIconKey=key;
    const i192 = isImg? await iconFromImage(logo,192) : iconFromEmoji(logo,192);
    if(!i192){ _lastIconKey=""; return; }
    const ai=$("#appleIcon"); if(ai) ai.href=i192;   // אייקון מסך-הבית ב-iOS
    const fi=$("#faviconLink"); if(fi) fi.href=i192;  // פאביקון בלשונית הדפדפן
    const at=document.querySelector('meta[name="apple-mobile-web-app-title"]'); if(at) at.content=title;
    // ה-manifest נשאר סטטי (manifest.webmanifest + icon-192/512.png) — נדרש כדי שאנדרואיד יתקין
    // אפליקציה אמיתית (WebAPK) שנכנסת לרשימת האפליקציות, ולא רק קיצור דרך במסך הבית.
    // הערה: manifest מסוג blob/data שובר את מנגנון ה-WebAPK ולכן אינו בשימוש.
  }catch(e){ console.error(e); }
}

/* ---------- הרשאת עריכה לפי חינוך (הסתרה בממשק — סעיף 7) ----------
   DB.settings.editScopes[email] = "רגיל" | 'ח"מ' → המשתמש רשאי לערוך רק חינוך זה
   (רואה הכל, אך אינו יכול לשמור/למחוק בחינוך השני);
   = "צופה" → צפייה בלבד, ללא עריכה כלל. ריק/חסר = עריכה מלאה. מנהל מערכת עורך הכל. */
function myEditScope(){

}

/* ---------- גישה מותרת (בעיקר לאכיפת התחברות Google לפי מיילים מוגדרים) ----------
   המיילים המוכרים למערכת = מנהלים ∪ allowedEmails ∪ מי שכבר ערך נתונים (userActivity).
   מערכת "טרייה" ללא הגדרות — פתוחה (איתחול), כמו isAdmin. */
function knownEmails(){
  const s=DB.settings||{}; const set=new Set();
  (s.admins||[]).forEach(e=>set.add(String(e).toLowerCase()));
  (s.allowedEmails||[]).forEach(e=>set.add(String(e).toLowerCase()));
  Object.keys(s.userActivity||{}).forEach(e=>set.add(String(e).toLowerCase()));
  return set;
}
function accessConfigured(){ const s=DB.settings||{}; return !!((s.admins&&s.admins.length)||(s.allowedEmails&&s.allowedEmails.length)||(s.userActivity&&Object.keys(s.userActivity).length)); }
function emailAllowed(email){ if(!accessConfigured()) return true; return knownEmails().has(String(email||"").toLowerCase()); }
let _accessDenied=false;
/* אוכף רשימת-מורשים לכל משתמש מחובר. הכניסה למערכת היא Google בלבד, וכל כתובת
   חייבת להופיע ברשימת המורשים (מנהלים ∪ allowedEmails ∪ מי שכבר ערך). */
function enforceAccess(){
  if(!currentUser) return true;
  if(emailAllowed(currentUser.email)) return true;
  if(_accessDenied) return false;
  _accessDenied=true;
  const em=currentUser.email||"";
  toast("אין הרשאה — האימייל אינו מורשה");
  signOut(auth).catch(()=>{});
  setTimeout(()=>{ const e=$("#lg-err"); if(e){ e.style.display="block"; e.textContent="האימייל "+em+" אינו מורשה במערכת. פנה/י למנהל להוספתו."; } }, 500);
  return false;
}

/* ---------- ניהול משתמשים דרך גשר ה-Apps Script ----------
   מאפשר למנהל ליצור/למחוק/לאפס-סיסמה/לרשום משתמשי התחברות מתוך ההגדרות.
   הוספת משתמש עובדת דרך מפתח ה-Web (בלי הגדרות נוספות); רשימה/מחיקה/איפוס
   דורשים הגדרת Service Account בגשר (ראה SETUP.md). ממיר שגיאות להודעות בעברית. */
async function adminUsersCall(op, payload){
  if(!DRIVE_READY) throw new Error("bridge-unavailable");
  const action = { create:"userCreate", list:"userList", "delete":"userDelete", setPassword:"userSetPassword", setName:"userSetName" }[op];
  if(!action) throw new Error("bad-op");
  return await driveCall(action, payload||{});
}
function adminUsersErrHe(err){
  const raw=(err&&err.message)||String(err||"");
  if(/EMAIL_EXISTS|already.*exists/i.test(raw)) return "כתובת האימייל כבר קיימת במערכת.";
  if(/INVALID_EMAIL|no-email/i.test(raw)) return "כתובת אימייל לא תקינה.";
  if(/WEAK_PASSWORD|weak-password/i.test(raw)) return "הסיסמה חייבת להיות באורך 6 תווים לפחות.";
  if(/not-admin/i.test(raw)) return "רק מנהל מערכת יכול לנהל משתמשים.";
  if(/admin-check-failed/i.test(raw)) return "לא ניתן לאמת הרשאת מנהל כרגע — נסה/י שוב.";
  if(/no-sa|service-account/i.test(raw)) return "רשימה/מחיקה/איפוס סיסמה דורשים הגדרת Service Account בגשר (ראה SETUP.md). הוספת משתמש עובדת בכל מקרה.";
  if(/OPERATION_NOT_ALLOWED/i.test(raw)) return "התחברות אימייל/סיסמה אינה מופעלת בפרויקט Firebase.";
  if(/unauthorized|token/i.test(raw)) return "יש להתחבר מחדש למערכת.";
  if(/bridge-unavailable|drive-not-configured/i.test(raw)) return "גשר השרת (Apps Script) עדיין לא מוגדר — ראה SETUP.md.";
  if(/network/i.test(raw)) return "אין חיבור לשרת. נסה/י שוב.";
  return raw || "שגיאה בניהול המשתמשים.";
}

function renderSettingsList(host, items, onSave, dis){
  if(!host) return;
  host.innerHTML = items.length
    ? items.map((v,i)=>`<div class="row" style="gap:6px;margin-bottom:6px;align-items:center;max-width:340px">
        <input class="sle-item" data-i="${i}" value="${esc(v)}" ${dis}>
        ${dis?'':`<button class="btn ghost sm sle-del" data-i="${i}" title="מחיקה">🗑️</button>`}</div>`).join("")
    : `<div class="hint">הרשימה ריקה — ברירת המחדל תשמש.</div>`;
  if(dis) return;
  host.querySelectorAll(".sle-item").forEach(inp=>{ inp.onchange=()=>{ const i=+inp.dataset.i, v=inp.value.trim(); const next=items.slice(); if(v) next[i]=v; else next.splice(i,1); onSave(next); }; });

/* עורך תפקידי צוות: שם + שיוך חינוך + צבע + סידור ידני (מעלה/מטה). הסדר כאן = הסדר בשיבוץ. */
function renderRolesEditor(host, dis){
  if(!host) return;
  const meta=roleMetaAll();
  const items=STAFF_ROLES.map(r=>{ const rm=meta[r]||{};
    return { name:r, edu:(rm.edu==="רגיל"||rm.edu==='ח"מ')?rm.edu:"both", color:/^#[0-9a-fA-F]{6}$/.test(rm.color||"")?rm.color:"#8a8f98" }; });
  host.innerHTML = items.length ? items.map((it,i)=>`
      <div class="rle-row" style="border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:8px;max-width:520px">
        <input class="rle-name" value="${esc(it.name)}" ${dis} style="width:100%;font-weight:600;margin-bottom:6px">
        <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap">
          <span class="hint">חינוך:</span>
          <select class="rle-edu" ${dis}>${ROLE_EDU_OPTS.map(o=>`<option value="${esc(o[0])}" ${it.edu===o[0]?'selected':''}>${esc(o[1])}</option>`).join("")}</select>
          <span class="hint" style="margin-inline-start:8px">צבע:</span>
          <input class="rle-color" type="color" value="${it.color}" ${dis} style="width:40px;height:30px;padding:2px">
          ${dis?'':`<span style="margin-inline-start:auto"></span>
          <button class="btn ghost sm rle-up" type="button" title="הזזה למעלה" ${i===0?'disabled':''}>▲</button>
          <button class="btn ghost sm rle-down" type="button" title="הזזה למטה" ${i===items.length-1?'disabled':''}>▼</button>
          <button class="btn ghost sm rle-del" type="button" title="מחיקה">🗑️</button>`}
        </div>
      </div>`).join("") : `<div class="hint">הרשימה ריקה — ברירת המחדל תשמש.</div>`;
  if(dis) return;
  const read=()=>[...host.querySelectorAll(".rle-row")].map(row=>({
    name:row.querySelector(".rle-name").value.trim(),
    edu:row.querySelector(".rle-edu").value,
    color:row.querySelector(".rle-color").value })).filter(x=>x.name);
  const persist=next=>{
    DB.settings.staffRoles=[...new Set(next.map(x=>x.name))];
    const mm={}; next.forEach(x=>{ mm[x.name]={edu:x.edu,color:x.color}; }); DB.settings.roleMeta=mm;
    save(); route(); toast("נשמר");
  };
  host.querySelectorAll(".rle-name,.rle-edu,.rle-color").forEach(el=> el.onchange=()=>persist(read()));
  host.querySelectorAll(".rle-del").forEach((b,i)=> b.onclick=()=>{ const n=read(); n.splice(i,1); persist(n); });
  host.querySelectorAll(".rle-up").forEach((b,i)=> b.onclick=()=>{ const n=read(); if(i>0){ [n[i-1],n[i]]=[n[i],n[i-1]]; persist(n); } });
  host.querySelectorAll(".rle-down").forEach((b,i)=> b.onclick=()=>{ const n=read(); if(i<n.length-1){ [n[i+1],n[i]]=[n[i],n[i+1]]; persist(n); } });
}

   התחברות (Firebase Auth) + סנכרון נתונים (Firestore)

let pendingRender=false;
function firebaseErrHe(code){
  const m={
    "auth/invalid-email":"כתובת אימייל לא תקינה",
    "auth/user-not-found":"משתמש לא נמצא",
    "auth/wrong-password":"סיסמה שגויה",
    "auth/invalid-credential":"אימייל או סיסמה שגויים",
    "auth/missing-password":"יש להזין סיסמה",
    "auth/too-many-requests":"יותר מדי ניסיונות — נסה/י שוב מאוחר יותר",
    "auth/network-request-failed":"בעיית רשת — בדוק/י חיבור לאינטרנט"
  };
  return m[code]||("שגיאה בהתחברות ("+code+")");
}
function startDataSync(){
  if(dataUnsub) return;
  document.body.classList.remove("locked");
  cloudDocs=new Map();
  dataUnsub = onSnapshot(collection(db,"app"), { includeMetadataChanges:true }, snap=>{
    const md=snap.metadata; // עדכון חיווי הסנכרון לפי מצב הכתיבות מול השרת
    lastSyncError=""; // התקבל סנאפשוט — הקריאה עובדת
    if(!md.fromCache) serverConfirmed=true; // אושר מגע עם השרת — מותר לכתוב
    setSyncStatus(md.hasPendingWrites ? "pending" : (md.fromCache ? "offline" : "synced"));
    const changes = snap.docChanges();
    if(!changes.length && cloudDocs.size) return; // שינוי מטא-דאטה בלבד (סטטוס) על נתונים שכבר נטענו — אין צורך לבנות מחדש
    changes.forEach(ch=>{
      if(ch.type==="removed"){ cloudDocs.delete(ch.doc.id); knownStudentDocs.delete(ch.doc.id); }
      else { cloudDocs.set(ch.doc.id, ch.doc.data()); if(ch.doc.id.startsWith("students_")) knownStudentDocs.add(ch.doc.id); }
    });
    if(savePending) return; // בזמן שמירה מקומית — אל תדרוס שינויים שטרם נכתבו
    rebuildDB(cloudDocs);
    maybeMigrateBranding();
    if(!md.fromCache && !enforceAccess()) return; // חסימת התחברות Google לא-מורשית (רק לאחר אישור מהשרת)
    // איתחול meta רק כשהשרת אישר שהוא באמת ריק (לא ממטמון אופליין) —
    // כדי שדפדפן שאינו מצליח להגיע ל-Firestore לא ידחוף DB ריק וידרוס נתונים קיימים.
    if(!cloudDocs.has("meta") && !md.fromCache) save();
    if($("#overlay").classList.contains("show")){ pendingRender=true; }
    else route();
  }, err=>{ console.error(err); lastSyncError=(err&&(err.code||err.message))||"unknown"; setSyncStatus("error"); toast("שגיאת גישה לנתונים — ודא/י הרשאות (Firestore rules)"); });
  // מעבר אוטומטי למצב חלופי (REST) אם חיבור ה-SDK לא הצליח למשוך נתונים תוך ~12 שניות
  setTimeout(()=>{ if(currentUser && !serverConfirmed && !restMode) loadViaRest(); }, 12000);
}
function stopDataSync(){ _accessDenied=false; if(dataUnsub){ dataUnsub(); dataUnsub=null; } restMode=false; serverConfirmed=false; knownStudentDocs.clear(); cloudDocs=new Map(); DB=blankDB(); const el=$("#syncStatus"); if(el) el.style.display="none"; clearTimeout(_offlineTimer); _offlineTimer=null; clearTimeout(_pendingWatch); _pendingWatch=null; _syncState=""; hideOfflineBanner(); }

  try{ history.replaceState({rgTab:active, rgBase:true},""); }catch(_){} // מצב בסיס לניהול כפתור "חזור" בנייד
  const so=$("#signOutBtn"); if(so){ so.onclick=doSignOut; so.style.display="none"; }
  if(!CONFIG_READY){ renderSetupNeeded(); return; }
  try{
    app=initializeApp(firebaseConfig);
    auth=getAuth(app);
    // experimentalAutoDetectLongPolling: מעבר אוטומטי ל-long-polling כשרשת/פרוקסי חוסמים את
    // חיבור ה-streaming של Firestore — מאפשר סנכרון גם ברשתות ארגוניות שבהן התוכנה נטענת אך הנתונים לא הסתנכרנו.
    // experimentalForceLongPolling: מכריח long-polling (בקשות HTTPS רגילות) לקריאה *ולכתיבה* —
    // עוקף רשתות/פרוקסי שחוסמים את חיבור ה-streaming של Firestore (מצב שבו קריאה עוברת אך כתיבה נתקעת).
    try{ db=initializeFirestore(app,{ localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }), experimentalForceLongPolling:true }); }
    catch(e){ db=initializeFirestore(app,{ experimentalForceLongPolling:true }); }
  }catch(e){ console.error(e); renderSetupNeeded(String(e.message||e)); return; }
  onAuthStateChanged(auth, user=>{
    currentUser=user;
    const b=$("#signOutBtn"); if(b) b.style.display=user?"flex":"none";
    if(user){ startDataSync(); }
    else { closeDrawer(); stopDataSync(); renderLogin(); }
  });
}

/* ============================================================
   חיבור Google Drive — דרך "גשר" (Google Apps Script) הרץ בחשבון הארגון.
   כל משתמש מחובר לתוכנה יכול ליצור תיקיות/להעלות/לצפות/להוריד — ללא חיבור Google אישי.
   ============================================================ */
async function driveIdToken(force){ if(!currentUser) throw new Error("not-logged-in"); return await currentUser.getIdToken(!!force); }
async function driveCall(action, payload){
  if(!DRIVE_READY) throw new Error("drive-not-configured");
  let force=false;
  for(let attempt=0; attempt<2; attempt++){
    const idToken=await driveIdToken(force);
    const json=JSON.stringify(Object.assign({action, idToken}, payload||{}));
    // Apps Script לעיתים משמיט את גוף בקשת ה-POST החוצה-מקור (בגלל הפניה פנימית),
    // ואז הטוקן לא מגיע. לכן בקשות קטנות נשלחות בשאילתת ה-URL ששורדת הפניות,
    // ורק העלאות גדולות (base64) נשלחות בגוף הבקשה.
    let url=APPS_SCRIPT_URL, opts;
    if(json.length < 6000){ url=APPS_SCRIPT_URL+"?data="+encodeURIComponent(json); opts={ method:"POST" }; }
    else { opts={ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: json }; }
    let r;
    try{ r=await fetch(url, opts); }
    catch(e){ throw new Error("network"); }
    let data; try{ data=await r.json(); }catch(e){ throw new Error("bad-response"); }
    if(data && data.ok===false){
      // טוקן פג תוקף / לא תקף — רענון כפוי של הטוקן וניסיון חוזר אחד (מונע "בעיית הרשאה")
      if((data.error==='unauthorized' || data.error==='token') && !force){ force=true; continue; }
      throw new Error(data.error||"drive-error");
    }
    if(!data) throw new Error("drive-error");
    return data;
  }
  throw new Error("drive-error");
}
async function drivePing(){ const res=await driveCall("ping",{}); if(res.rootLink){ DB.settings.drive=DB.settings.drive||{}; DB.settings.drive.rootLink=res.rootLink; save(); } return res; }
async function driveEnsureChildFolder(student){
  if(student.driveFolderId) return student.driveFolderId; // תיקייה קיימת — לא ליצור מחדש (שומר על מבנה קודם)
  const nm=([student.lastName,student.firstName].filter(Boolean).join(" ")+(student.tz?(" · "+student.tz):"")) || ("ילדה "+student.id);
  const gan=student.ganId?ganName(student.ganId):""; // תיקיית גן בתוך השנה (מבנה: חינוך → שנה → גן → ילדה)
  const res=await driveCall("childFolder", { year:String(student.year), name:nm, edu:eduLabel(student), gan }); // חלוקה לפי חינוך (סעיף 12)
  student.driveFolderId=res.folderId; student.driveFolder=res.folderLink;
  const i=DB.students.findIndex(x=>x.id===student.id); if(i>=0){ DB.students[i].driveFolderId=res.folderId; DB.students[i].driveFolder=res.folderLink; }
  DB.settings.drive=DB.settings.drive||{}; if(res.rootLink) DB.settings.drive.rootLink=res.rootLink;
  save();
  return res.folderId;
}

/* סוגי מסמכים לזיהוי מתוך שם הקובץ — הסדר קובע עדיפות (ספציפי → כללי) */
const DOC_IMPORT_TYPES = [
  { key:"nispach", label:"נספח",              re:/נספח/ },
  { key:"takanon", label:"תקנון",             re:/תקנון/ },
  { key:"idCopy",  label:"צילום תעודת זהות",  re:/זהות|תעודת|צילום|ת\s*["'`.]?\s*ז/ }

function detectDocType(name){ for(const t of DOC_IMPORT_TYPES){ if(t.re.test(name)) return t; } return { key:"other", label:"אחר", re:null }; }

function stripDocWords(s){
  return String(s||"")
    .replace(/\.[a-z0-9]{2,5}$/i,"")                 // סיומת קובץ
    .replace(/צילום|תעודת|זהות|נספח|תקנון/g," ")
    .replace(/ת\s*["'`.]?\s*ז/g," ")                 // ת"ז / תז / ת.ז
    .replace(/\d{4,}/g," ")                           // מספרי ת"ז וכד'

function heKey(s){ return String(s||"").replace(/[^א-ת]/g,""); }

function matchStudentInGan(ganId, fileName){
  const fk=heKey(stripDocWords(fileName)); if(!fk) return null;
  const kids=studentsOfYear().filter(s=>s.ganId===ganId && !s.finished);
  return kids.find(s=>heKey(s.lastName+s.firstName)===fk)
      || kids.find(s=>heKey(s.firstName+s.lastName)===fk)
      || kids.find(s=>{ const k=heKey(s.lastName+s.firstName); return k && (fk.indexOf(k)>=0 || k.indexOf(fk)>=0); })
      || null;
}

function fileToB64(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>{ const s=String(r.result); resolve(s.slice(s.indexOf(",")+1)); }; r.onerror=()=>reject(new Error("read")); r.readAsDataURL(file); }); }

  const bin=atob(b64||""); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);

  a.href=URL.createObjectURL(blob); a.download=name||"file"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);

function driveErrHe(e){

const SHEET_TITLE = "רשת הגנים מודיעין עילית — נתונים (שיקוף)";
function buildSheetPayload(){
  const yn=v=>v?"כן":"לא";
  const stuHeaders=["שנה","שם משפחה","שם פרטי",'ת"ז',"גן","קמפוס","גיל","מועד","חינוך","משובצת","קלוט בעירייה","נרשמה על ידינו","ביטוח שולם","טלפון בית","נייד אב","נייד אם",'דוא"ל',"רחוב","בניין","עיר","סטטוס","הערות"];
  const stuRows=DB.students.map(s=>[s.year,s.lastName,s.firstName,s.tz,ganName(s.ganId),ganCampus(s.ganId)||s.campus||"",s.age,s.period,eduLabel(s),yn(s.placed!==false),yn(s.absorbedMunicipality),yn(s.registeredByUs),yn(s.insurancePaid),s.phone,s.dadMobile||"",s.momMobile||s.mobile||"",s.email||"",s.street,s.building,s.city,(s.finished?"סיימה":"פעילה"),s.notes]);
  const ganHeaders=["שם הגן","סמל פנימי","סמל גן","גיל","חינוך","גננת","קמפוס","כתובת","בניין","אזור","טל' גן","נייד גננת","קיבולת","רשומות (שנה פעילה)","פעיל"];
  const ganRows=DB.gans.map(g=>[g.ganName,g.internalSymbol,g.ganSymbol,g.age,eduLabel(g),g.teacherName,g.campus,g.address,g.building,g.zone,g.phoneGan,g.teacherMobile,g.capacity,studentsOfYear().filter(s=>s.ganId===g.id&&!s.finished).length,yn(g.active)]);
  const staffHeaders=["שם משפחה","שם פרטי",'ת"ז',"תפקיד","חינוך","טלפון","נייד","מייל","עיר","הערות"];
  const staffRows=DB.staff.map(m=>[m.lastName,m.firstName,m.tz,m.role,eduLabel(m),m.phone,m.mobile,m.email,m.city,m.notes]);
  const asgHeaders=["שנה","הקשר","גן","תפקיד","שם העובד/ת"];

  Object.keys(A).forEach(year=>{ const yc=A[year]||{}; Object.keys(yc).forEach(ctx=>{ const cg=yc[ctx]||{}; Object.keys(cg).forEach(ganId=>{ const entry=cg[ganId]||{};
    Object.keys(entry).forEach(role=>{ const v=entry[role]; if(!v||!v.staffId) return; const m=DB.staff.find(x=>x.id===v.staffId); const nm=m?[m.lastName,m.firstName].filter(Boolean).join(" "):""; asgRows.push([year,ctxLabel(ctx),ganName(ganId),role,nm]); });
  }); }); });
  return { title:SHEET_TITLE, sheets:[
    { name:"תלמידות", headers:stuHeaders, rows:stuRows },
    { name:"גנים",     headers:ganHeaders, rows:ganRows },
    { name:"צוות",     headers:staffHeaders, rows:staffRows },
    { name:"שיבוץ",    headers:asgHeaders, rows:asgRows }
  ] };
}
let _sheetSyncing=false, _sheetAutoTimer=null;

/* ---------- עדכון קבוצתי (סימון מרובה + החלה על קבוצה) ---------- */
let bulkMode=false;               // מצב בחירה מרובה פעיל
const bulkSel=new Set();          // מזהי התלמידות המסומנות
let bulkField="insurancePaid";    // השדה שנבחר לעדכון
/* שדות הניתנים לעדכון קבוצתי — לכל שדה set(student, value:boolean) */
const BULK_FIELDS = [
  { key:"insurancePaid",      label:"תשלום ביטוח תלמידים",           set:(s,v)=>{ s.insurancePaid=v; } },
  { key:"placed",             label:"משובצת (שיבוץ סופי)",            set:(s,v)=>{ s.placed=v; } },

  { key:"prog.tzaharon",      label:"רישום צהרון",                    set:(s,v)=>{ s.programs=s.programs||{}; s.programs.tzaharon=v; } },
  { key:"prog.campHanukkah",  label:"רישום קייטנת חנוכה",             set:(s,v)=>{ s.programs=s.programs||{}; s.programs.campHanukkah=v; } },
  { key:"prog.campNisan",     label:"רישום קייטנת ניסן",              set:(s,v)=>{ s.programs=s.programs||{}; s.programs.campNisan=v; } },
  { key:"prog.campEndYear",   label:"רישום קייטנת סוף שנה",           set:(s,v)=>{ s.programs=s.programs||{}; s.programs.campEndYear=v; } },
  { key:"paid.tzaharon",      label:"תשלום צהרון",                    set:(s,v)=>{ s.programsPaid=s.programsPaid||{}; s.programsPaid.tzaharon=v; } },
  { key:"paid.campHanukkah",  label:"תשלום קייטנת חנוכה",             set:(s,v)=>{ s.programsPaid=s.programsPaid||{}; s.programsPaid.campHanukkah=v; } },
  { key:"paid.campNisan",     label:"תשלום קייטנת ניסן",              set:(s,v)=>{ s.programsPaid=s.programsPaid||{}; s.programsPaid.campNisan=v; } },
  { key:"paid.campEndYear",   label:"תשלום קייטנת סוף שנה",           set:(s,v)=>{ s.programsPaid=s.programsPaid||{}; s.programsPaid.campEndYear=v; } },
  { key:"retentionNext",      label:"השארות לשנה הבאה (מעביר אוטומטית)", set:(s,v)=>{ s.retentionNext=v; }, retention:true }
];
/* החלת עדכון קבוצתי על התלמידות המסומנות */
function applyBulk(fieldKey, val){
  const f=BULK_FIELDS.find(x=>x.key===fieldKey); if(!f){ toast("בחר/י שדה"); return; }
  const ids=[...bulkSel]; if(!ids.length){ toast("לא סומנו תלמידות"); return; }
  let n=0, transferred=0, failed=0, blocked=0;
  ids.forEach(id=>{ const s=DB.students.find(x=>x.id===id); if(!s) return;
    if(!canEditRec(s)){ blocked++; return; } // הרשאת עריכה לפי חינוך
    const before = f.retention ? !!s.retentionNext : null;
    f.set(s, val); n++;
    if(f.retention && val && !before){ const r=ensureRetentionTransfer(s); r.ok?transferred++:failed++; }
  });
  save(); bulkSel.clear(); renderStuTable();
  toast(`עודכנו ${n} תלמידות · ${f.label}: ${val?'כן':'לא'}${transferred?` · ${transferred} הועברו להשארות`:''}${failed?` · ${failed} לא הועברו`:''}${blocked?` · ${blocked} דולגו (אין הרשאת חינוך)`:''}`);
}

/* המרת מספר (1..999) לגימטריה עברית עם גרש/גרשיים, כולל ט״ו/ט״ז */
function hebGematria(n){
  n=n%1000; if(n<=0) return "";
  const ones=["","א","ב","ג","ד","ה","ו","ז","ח","ט"];
  const tens=["","י","כ","ל","מ","נ","ס","ע","פ","צ"];
  const huns=["","ק","ר","ש","ת","תק","תר","תש","תת","תתק"];
  let s=huns[Math.floor(n/100)];
  const r=n%100;
  if(r===15) s+="טו";        // נמנעים מ-יה (שם ה')
  else if(r===16) s+="טז";   // נמנעים מ-יו
  else { s+=tens[Math.floor(r/10)]+ones[r%10]; }
  if(s.length===1) return s+"׳";               // גרש לאות בודדת
  return s.slice(0,-1)+"״"+s.slice(-1);         // גרשיים לפני האות האחרונה
}
/* שעון חי לעמוד הבית — תאריך עברי + לועזי + שעה, מתעדכן כל שנייה.
   מנקה את עצמו אוטומטית כשעוזבים את עמוד הבית (האלמנט נעלם). */
let _clockTimer=null;
function startHomeClock(){
  if(_clockTimer){ clearInterval(_clockTimer); _clockTimer=null; }
  const upd=()=>{
    const el=$("#homeClock");
    if(!el){ if(_clockTimer){ clearInterval(_clockTimer); _clockTimer=null; } return; }
    const now=new Date();
    // תאריך עברי בגימטריה (ה׳ באלול תשפ״ו) — ממירים בעצמנו (Intl לא אמין לספרות עבריות)
    let heb="";
    try{
      const parts=new Intl.DateTimeFormat("he-IL-u-ca-hebrew",{ weekday:"long", day:"numeric", month:"long", year:"numeric" }).formatToParts(now);
      const get=t=>{ const p=parts.find(x=>x.type===t); return p?p.value:""; };
      const wd=get("weekday"), month=get("month");
      const day=parseInt(get("day"),10), year=parseInt(get("year"),10);
      const dG=hebGematria(day), yG=hebGematria(year%1000);   // שנה בלי האלפים (5786 → 786 → תשפ״ו)
      if(wd && dG && month && yG) heb=`${wd}, ${dG} ${month} ${yG}`;
    }catch(e){}
    if(!heb){ try{ heb=now.toLocaleDateString("he-IL-u-ca-hebrew",{ weekday:"long", day:"numeric", month:"long", year:"numeric" }); }catch(e){} }
    const greg=now.toLocaleDateString("he-IL",{ day:"2-digit", month:"2-digit", year:"numeric" });
    const time=now.toLocaleTimeString("he-IL",{ hour:"2-digit", minute:"2-digit", second:"2-digit" });
    el.textContent=`📅 ${heb?heb+" · ":""}${greg} · 🕐 ${time}`;
  };
  upd(); _clockTimer=setInterval(upd,1000);
}

/* אוכלוסיית הבסיס לסיכום: כל הסינונים למעט "קלוט" (muni) — כי הוא-הוא המדד המוצג בפס הסיכום */
function studentsScopeBase(){
  const f=stuFilter, q=f.q.trim().toLowerCase();
  const eduFilter = activeEdu || f.edu;
  return studentsOfYear().filter(s=>{
    if(f.status==='active' && s.finished) return false;
    if(f.status==='finished' && !s.finished) return false;
    if(q){ const hay=(s.firstName+" "+s.lastName+" "+s.tz).toLowerCase(); if(!hay.includes(q)) return false; }
    if(f.gan==='__none__'){ if(s.ganId) return false; }   // ללא גן — ילדות שהוצאו מהגן (ganId ריק)
    else if(f.gan && s.ganId!==f.gan) return false;
    if(f.age && f.age.length && !f.age.includes(String(s.age))) return false;
    if(f.city && s.city!==f.city) return false;
    if(f.campus && s.campus!==f.campus) return false;
    if(f.period && s.period!==f.period) return false;
    if(eduFilter && eduLabel(s)!==eduFilter) return false;
    return true;
  });
}
function filteredStudents(){
  const f=stuFilter;
  let list=studentsScopeBase();
  if(f.muni==='yes') list=list.filter(s=>s.absorbedMunicipality);
  if(f.muni==='no')  list=list.filter(s=>!s.absorbedMunicipality);
  if(f.flag && STU_FLAGS[f.flag]) list=list.filter(STU_FLAGS[f.flag].test);
  if(f.placed==='yes') list=list.filter(s=>s.placed!==false);
  if(f.placed==='no')  list=list.filter(s=>s.placed===false);
  return sortStudents(list);
}
function sortStudents(list){
  const k=stuSort.key, d=stuSort.dir;
  const cmpTxt=(a,b)=>String(a||"").localeCompare(String(b||""),"he");
  const cmpNum=(a,b)=>(+a||0)-(+b||0);
  const val={
    name:s=>[s.lastName,s.firstName].filter(Boolean).join(" "),
    tz:s=>s.tz, gan:s=>ganName(s.ganId), age:s=>s.age, city:s=>s.city,
    period:s=>PERIODS.indexOf(s.period), edu:s=>eduLabel(s)
  };
  const getter=val[k]||val.name;
  const numeric = (k==='age'||k==='period');
  return list.slice().sort((a,b)=>{ const r= numeric?cmpNum(getter(a),getter(b)):cmpTxt(getter(a),getter(b)); return r*d || cmpTxt(val.name(a),val.name(b)); });
}

/* פס סיכום חכם מעל הטבלה — מתעדכן לפי הסינון (כולל הגן הנבחר), ומתעלם מסינון "קלוט"
   כדי להראות תמיד את הפילוח המלא. צבעים: לא-קלוט אדום כשיש כאלה (ירוק כשאין),
   ורשומות אדום כשעוברים את קיבולת הגן הנבחר (כמו בטאב הגנים). */
function renderStuSummary(){
  const el=$("#stuSummary"); if(!el) return;
  const base=studentsScopeBase();
  const total=base.length;
  const absorbed=base.filter(s=>s.absorbedMunicipality).length;
  const notAbsorbed=total-absorbed;
  const placed=base.filter(s=>s.placed!==false).length;   // משובצות סופית
  const waiting=total-placed;                              // ממתינות לשיבוץ
  const g=stuFilter.gan && DB.gans.find(x=>x.id===stuFilter.gan);
  const capTxt = g && g.capacity ? ` <small>/ ${esc(g.capacity)}</small>` : "";
  const regColor = (g && g.capacity) ? capColor(capState(total, g.capacity)) : "";
  const tile=(k,v,color,title)=>`<div class="stat"${title?` title="${esc(title)}"`:''}><div class="k">${k}</div><div class="v"${color?` style="color:${color}"`:''}>${v}</div></div>`;
  // משבצת מותנית: רק כשמסננים לפי מאפיין (השארות/צהרון/קייטנה) מוצג הסיכום שלו
  const fd=stuFilter.flag && STU_FLAGS[stuFilter.flag];
  const flagTile = fd ? tile(fd.label, base.filter(fd.test).length, 'var(--accent-strong)') : "";
  el.innerHTML=`<div class="stats">
    ${tile("רשומות"+(g?" בגן":""), total+capTxt, regColor)}
    ${tile("משובצות", placed, "var(--good)", "שיבוץ סופי בגן")}
    ${tile("ממתינות לשיבוץ", waiting, waiting>0?'var(--warn)':'var(--good)', "רשומות לגן אך טרם שובצו סופית")}
    ${tile("קלוט בעירייה", absorbed, absorbed===total&&total?'var(--good)':'')}
    ${tile("לא קלוט", notAbsorbed, notAbsorbed>0?'var(--bad)':'var(--good)')}
    ${flagTile}
  </div>`;
}

  /* פס פעולות רשימת הגן — חזרה/הדפסה/שיתוף ישירות מתוך רשימת התלמידות המסוננת לגן */
  if(selGan){ const op=()=>!!$("#stuGanOnepage")?.checked;
    const bk=$("#stuGanBack"); if(bk) bk.onclick=()=>{ stuFilter.gan=""; navToTab('gans'); };
    const pb=$("#stuGanPrint"); if(pb) pb.onclick=()=>makeGanRoster(selGan.id,{ onePage:op() });
    const sb=$("#stuGanShare"); if(sb) sb.onclick=()=>makeGanRoster(selGan.id,{ onePage:op(), share:true }); }
  // לחיצה על שורה (מחוץ לכפתורים/תיבות סימון) פותחת את התיק (סעיף 8.4.3)
  host.querySelectorAll("tr.clickable").forEach(tr=> tr.onclick=e=>{
    if(e.target.closest("button,input,a,.stu-place")) return;
    const s=DB.students.find(x=>x.id===tr.dataset.sid); if(s) openStudent(JSON.parse(JSON.stringify(s)));
  });
  /* החלפת סטטוס שיבוץ בלחיצה אחת מהרשימה (משובצת ⇄ ממתינה) */
  host.querySelectorAll(".stu-place").forEach(b=> b.onclick=()=>{ const st=DB.students.find(x=>x.id===b.dataset.id); if(!st) return; if(!canEditRec(st)){ toast("אין הרשאת עריכה בחינוך זה"); return; } st.placed = (st.placed===false); save(); renderStuTable(); toast(st.placed?"סומן: משובצת":"סומן: ממתינה לשיבוץ"); });
  host.querySelectorAll("[data-sort]").forEach(t=> t.onclick=()=>{ const k=t.dataset.sort; if(stuSort.key===k) stuSort.dir*=-1; else { stuSort.key=k; stuSort.dir=1; } renderStuTable(); });
  /* עדכון קבוצתי — סימון שורות + בחירת הכל */
  host.querySelectorAll(".bulk-cb").forEach(cb=> cb.onchange=()=>{ cb.checked?bulkSel.add(cb.dataset.id):bulkSel.delete(cb.dataset.id); renderStuTable(); });

   שלו לניווט — במקום history.back() (שיוצר popstate אסינכרוני שמבטל את הניווט). */
function viewGanStudents(ganId){

  if(modalHistoryOpen){
    if(ov) ov.classList.remove("show"); document.body.style.overflow="";

/* טופס תיק ילדה */
function openStudent(s){

      <div><label>נייד אב</label><div class="fieldwrap"><input id="s-dadMobile" value="${esc(s.dadMobile)}" inputmode="tel"><button type="button" class="act" data-call="s-dadMobile" title="חיוג">📞</button></div></div>
      <div><label>נייד אם</label><div class="fieldwrap"><input id="s-momMobile" value="${esc(s.momMobile || ((!s.dadMobile && !s.momMobile) ? (s.mobile||"") : ""))}" inputmode="tel"><button type="button" class="act" data-call="s-momMobile" title="חיוג">📞</button></div></div>
      <div><label>דוא"ל</label><div class="fieldwrap"><input id="s-email" value="${esc(s.email)}" inputmode="email" dir="ltr" style="text-align:right"><button type="button" class="act" data-mail="s-email" title="שליחת מייל">✉️</button></div></div>

    <div class="grid g3">

        <div class="hint">נקבע אוטומטית לפי הקמפוס של הגן (בלשונית גנים).</div></div>
      <div><label>גן משובצת</label><select id="s-ganId"><option value="">— בחר/י גן —</option>${gans.map(g=>`<option value="${g.id}" ${s.ganId===g.id?'selected':''}>${esc(ganName(g.id))} ${g.ganSymbol?('· '+esc(g.ganSymbol)):''}</option>`).join("")}</select></div>

      <div><label>מועד רישום</label><select id="s-period">${PERIODS.map(p=>`<option ${s.period===p?'selected':''}>${p}</option>`).join("")}</select></div>
      <div><label>חינוך</label><select id="s-education">${EDU_TYPES.map(t=>`<option ${eduLabel(s)===t?'selected':''}>${esc(t)}</option>`).join("")}</select></div>

      <label class="check"><input type="checkbox" id="s-registeredByUs" ${s.registeredByUs?'checked':''}> נרשמה על ידינו</label>
      <label class="check"><input type="checkbox" id="s-absorbedMunicipality" ${s.absorbedMunicipality?'checked':''}> קלוט בעירייה</label>

  </fieldset>

  </fieldset>
  <fieldset><legend>סיוע והעשרה</legend>
    <div class="hint" style="margin-bottom:8px">סימון סוג הסיוע שהילדה מקבלת — לפי הסימון יוצגו הילדות בשיבוץ העובדת המתאימה (שילוב / רפואית–סל אישי / מנתחת התנהגות / הכנה לכיתה א׳). אפשר לצרף מסמך לכל סוג — נשמר בדרייב עם שם הילדה וּת"ז.</div>
    <div class="doc-rows" id="support-rows"></div>
  </fieldset>
  <fieldset><legend>שונות</legend>
    <div class="hint" style="margin-bottom:8px">בסימון "גרושים" / "ילדת חוץ" / "השארות" / "אחר" נפתחות מיד מתחת האפשרויות הנוספות — כולל צירוף מסמך 📎 (נשמר בדרייב עם שם: סוג המסמך · שם הילדה · ת"ז).</div>
    <div id="special-blocks" style="display:flex;flex-direction:column;gap:8px"></div>
  </fieldset>
  <fieldset><legend>תיקיית דרייב</legend>
    <div class="grid g2">
      <div><label>קישור לתיקיית התלמידה בדרייב</label><input id="s-driveFolder" value="${esc(s.driveFolder)}" placeholder="${DRIVE_READY?'ייווצר אוטומטית בלחיצה על הכפתור למטה':'הדבק/י כאן קישור לתיקייה'}"></div>
      <div><label>שם תיקייה מומלץ</label><input id="s-folderSuggest" value="${esc(folderSuggest)}" readonly>
        <div class="hint">מבנה: שנה / שם משפחה שם · ת"ז · <button class="btn ghost sm" id="copyFolder" type="button">העתק שם</button></div></div>

    <div><label>הערות</label><textarea id="s-notes" rows="2">${esc(s.notes)}</textarea></div>
    <label class="check" style="margin-top:10px;background:var(--warn-soft);border-color:var(--warn)"><input type="checkbox" id="s-finished" ${s.finished?'checked':''}> ✔️ סיימה עם הגן (בסימון זה יוצאת מהרשימה)</label>

  /* צירוף קבצים פיזיים לתיקיית הדרייב, עם שם אוטומטי: סוג · שם הילדה · ת"ז (סעיפים 11–12) */
  function docFileBaseName(label){
    const nm=[s.lastName,s.firstName].filter(Boolean).join(" ")||"ללא שם";
    return `${label} · ${nm}${s.tz?(" · "+s.tz):""}`;
  }
  const SPECIAL_DOC_KEYS=["approvalFather","approvalMother","paymentArrangement","retentionDoc","other","idFather","idMother","approvalDoc"];
  const SUPPORT_DOC_KEYS=SUPPORT_TYPES.map(t=>t[0]);
  async function uploadDocFile(file, key, label){
    persistCurrent(); await driveEnsureChildFolder(s);
    const res=await driveUploadNamed(file, s.driveFolderId, docFileBaseName(label));
    s.docFiles=s.docFiles||{}; s.docFiles[key]={ id:res.fileId||res.id||"", name:res.name||file.name, link:res.link||res.webViewLink||"" };
    if(["nispach","idCopy","takanon"].includes(key)) s.docs[key]=true;
    if(SPECIAL_DOC_KEYS.includes(key)){ s.special=s.special||{}; s.special[key]=true; }
    if(SUPPORT_DOC_KEYS.includes(key)){ s.support=s.support||{}; s.support[key]=true; }
  }
  function docAttachHtml(key,label){
    const f=(s.docFiles||{})[key];
    const attached = f? `<a class="btn ghost sm" href="${esc(f.link||'#')}" target="_blank" title="פתח קובץ">📄 ${esc(f.name||'קובץ')}</a>` : "";
    const btn = DRIVE_READY? `<label class="btn ghost sm" style="display:inline-flex;align-items:center;gap:4px" title="צרף קובץ">📎<input type="file" class="doc-file" data-k="${esc(key)}" data-label="${esc(label)}" hidden></label>` : "";
    return attached+btn;
  }
  function wireDocFiles(host, after){
    host.querySelectorAll(".doc-file").forEach(inp=> inp.onchange=async ()=>{
      const file=inp.files[0]; if(!file) return;
      try{
        toast("מעלה מסמך…");
        await uploadDocFile(file, inp.dataset.k, inp.dataset.label||inp.dataset.k);
        if(after) after();      // רינדור מחדש כדי שה-DOM ישקף את הסימון/הקישור החדשים
        persistCurrent(); save(); // ואז שמירה (collect קורא מה-DOM המעודכן)
        toast("המסמך צורף ✓");
      }catch(e){ console.error(e); toast(driveErrHe(e)); }
      inp.value="";
    });
  }
  function renderDocRows(){
    const host=$("#doc-rows"); if(!host) return;
    host.innerHTML = STUDENT_DOCS.map(([k,lbl])=>`
      <div class="doc-row">
        <label class="lbl"><input type="checkbox" class="d-chk" data-k="${k}" ${(s.docs&&s.docs[k])?'checked':''}> ${esc(lbl)}</label>
        ${docAttachHtml(k,lbl)}
      </div>`).join("");
    host.querySelectorAll(".d-chk").forEach(cb=> cb.onchange=()=>{ s.docs[cb.dataset.k]=cb.checked; });
    wireDocFiles(host, renderDocRows);
  }
  renderDocRows();

  /* שונות — כל אפשרות משנית נפתחת מיד מתחת לסימון שלה, עם צירוף מסמך (סעיפי התיקון) */
  function syncSpecial(){
    const set=(id,key)=>{ const el=$("#"+id); if(el) s.special[key]=el.checked; };
    set("sp-divorced","divorced"); set("sp-outOfCity","outOfCity"); set("sp-retention","retention"); set("sp-other","other");
    set("sp-idFather","idFather"); set("sp-idMother","idMother"); set("sp-approvalDoc","approvalDoc");
    set("sp-approvalFatherSig","approvalFatherSig"); set("sp-approvalMotherSig","approvalMotherSig");
    set("sp-paymentArrangement","paymentArrangement"); set("sp-retentionDoc","retentionDoc");
    const ot=$("#sp-otherText"); if(ot) s.special.otherText=ot.value;
  }
  function renderSpecialBlocks(){
    const host=$("#special-blocks"); if(!host) return;
    const sp=s.special;
    const parent=(id,key,label)=>`<div class="doc-row"><label class="lbl"><input type="checkbox" id="${id}" ${sp[key]?'checked':''}> ${esc(label)}</label></div>`;
    const sub=(id,key,label,fileKey)=>`<div class="doc-row" style="margin-inline-start:20px;background:var(--surface)"><label class="lbl"><input type="checkbox" id="${id}" ${sp[key]?'checked':''}> ${esc(label)}</label>${docAttachHtml(fileKey,label)}</div>`;
    let h="";
    h+=parent("sp-divorced","divorced","הורים גרושים");
    if(sp.divorced){
      h+=sub("sp-idFather","idFather",'צילום תעודת זהות האב',"idFather");
      h+=sub("sp-idMother","idMother",'צילום תעודת זהות האם',"idMother");
      /* מסמך אישור + שני ריבועי חתימה (אב/אם) — סעיף 7 */
      h+=`<div class="doc-row" style="margin-inline-start:20px;background:var(--surface);flex-wrap:wrap">
        <label class="lbl"><input type="checkbox" id="sp-approvalDoc" ${sp.approvalDoc?'checked':''}> מסמך אישור</label>
        ${docAttachHtml("approvalDoc","מסמך אישור")}
        <span style="flex-basis:100%;height:0"></span>
        <label class="check" style="margin-inline-start:24px"><input type="checkbox" id="sp-approvalFatherSig" ${sp.approvalFatherSig?'checked':''}> ✍️ חתימת האב</label>
        <label class="check"><input type="checkbox" id="sp-approvalMotherSig" ${sp.approvalMotherSig?'checked':''}> ✍️ חתימת האם</label>

function normHeader(h){ return String(h||"").replace(/["'.׳״]/g,"").replace(/\s+/g,"").trim(); }
function truthyCell(v){ return /^(כן|yes|true|1|✓|v|קלוט|נרשמה|כ)$/i.test(String(v??"").trim()); }
function normEduVal(v){ const t=String(v??"").replace(/\s/g,""); if(!t) return "רגיל"; return /(מיוחד|חינוךמיוחד|ח"?מ|חמ|special)/i.test(t)?'ח"מ':"רגיל"; }
function normPeriodVal(v){ const t=String(v??"").trim(); return PERIODS.includes(t)?t:"א"; }
function normDateVal(v){
  let t=String(v??"").trim(); if(!t) return "";
  t=t.replace(/[T ]\d{1,2}:\d{2}(:\d{2})?.*$/,"").trim(); // הסרת חלק שעה (למשל "01/09/2021 00:00")
  // מספר סידורי של אקסל (ימים מ-1899-12-30) — מתקבל כשתא התאריך היה מעוצב כמספר
  if(/^\d{4,6}(\.\d+)?$/.test(t)){
    const serial=parseInt(t,10);
    if(serial>=3653 && serial<=60000){ // ~1910..2064 — טווח סביר לתאריך לידה
      const d=new Date(Math.round((serial-25569)*86400000)); // 25569 = ימים בין 1899-12-30 ל-1970-01-01
      if(!isNaN(d)) return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
    }
  }
  let m=t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/); // dd/mm/yyyy (פורמט ישראלי)
  if(m){ let d=m[1],mo=m[2],y=m[3]; if(y.length===2)y="20"+y; return `${y.padStart(4,"0")}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`; }
  m=t.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/); // yyyy-mm-dd
  if(m){ return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`; }
  return t;
}
/* בדיקת תקינות פורמט ISO של תאריך (YYYY-MM-DD) — לשימוש בטופס ובתיקון */
function isISODate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s||"")); }
/* עיצוב תאריך לתצוגה/ייצוא: מנרמל (כולל מספר סידורי של אקסל) ומציג כ-DD/MM/YYYY.

function fmtDate(v){ const iso=normDateVal(v); const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso); return m?`${m[3]}/${m[2]}/${m[1]}`:String(v??""); }
/* תיקון תאריכי לידה שיובאו — נרמול מחדש של הערכים הקיימים בכל התלמידות,

function fixImportedDobs(){

  DB.students.forEach(s=>{

    if(!before){ empty++; return; }

    if(after!==before) s.dob=after;
    if(isISODate(s.dob)){ ok++; if(after!==before) changed++; } else stillBad++;
  });
  if(changed) save();
  modal(`<h3>תיקון תאריכי לידה</h3>
    <div class="note">

      ${empty?`<b>${empty}</b> תלמידות ללא תאריך כלל בקובץ — יש להזין ידנית (אין צורך לייבא הכול מחדש).`:'אין תלמידות ללא תאריך.'}

function flagsFromNotes(notes){
  const n=String(notes||"").replace(/[\/\\]/g," ");
  return {

    retention: /השאר/.test(n)

}

function applyNoteFlags(){

    s.special = s.special || {};
    const fl=flagsFromNotes(s.notes);
    if(fl.outOfCity && !s.special.outOfCity){ s.special.outOfCity=true; oc++; }
    if(fl.retention && !s.special.retention){ s.special.retention=true; rt++; }
  });
