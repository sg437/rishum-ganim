# שומר סודות — מוודא שלא נדחף לקוד מפתח שאינו אמור להיות בדפדפן.
# הסיכון האמיתי כאן אינו מפתח Firebase (מזהה ציבורי), אלא מפתח Gemini/Claude
# או מפתח מפות שמקומם ב-Script Properties של הגשר בלבד.
name: שומר סודות

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: סריקה
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/check-secrets.sh
