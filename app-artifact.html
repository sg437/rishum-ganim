        return `<div style="margin:2px 0">${roleChip(meta.role)} <b>${esc(cur.name||"")}</b>${cur.phone?` · ${esc(cur.phone)}`:""}${extra?` · <span style="color:var(--muted)">${esc(asgExtraLabel(meta.role))}: ${esc(extra)}</span>`:""}${kids?`<div style="margin-inline-start:14px;color:var(--accent-strong);font-size:.85rem">👧 ${esc(kids)}</div>`:""}</div>`;
      }).filter(Boolean).join("");
      return `<tr>
        <td><b>${esc(ganName(g.id))}</b></td>
        <td>${esc(g.ganSymbol||g.internalSymbol)||'—'}</td>
        <td>${esc(g.age)||'—'}</td>
        <td>${eduBadge(g)}</td>
        <td>${items||'<span style="color:var(--muted)">— לא שובץ —</span>'}</td>
        <td class="actions"><button class="btn ghost sm" data-asg2="${g.id}">עריכה</button></td></tr>`;
    }).join("")}
  </tbody></table></div><div class="hint">${gans.length} גנים · הקשר: ${esc(ctxLabel(asgContext))}</div>`;
  host.querySelectorAll("[data-asg2]").forEach(b=> b.onclick=()=>openGanAssign(b.dataset.asg2));
}
/* מודל שיבוץ צוות לגן בודד — סעיפים 5, 7 */
/* גן חובה — גיל 5 (בגני חובה אין "סייעת ב'") — סעיף 14 */
function isMandatoryGan(g){ return String(g&&g.age||"").trim()==="5"; }
function openGanAssign(ganId){
  const g=ganById(ganId); if(!g) return;
  const a=ganAsg(ganId);
  const ganEdu=eduLabel(g);
  const reg=studentsOfYear().filter(s=>s.ganId===g.id && !s.finished).length;
  /* אינדקס שיבוצי צוות בגנים אחרים (אותה שנה + אותו הקשר) — למניעת שיבוץ כפול (סעיף 1) */
  const idx=staffAsgIndex(asgContext, ganId);
  /* "סייעת ב'" נפתחת רק כשהגן הגיע ל-30 בנות; אם כבר קיים שיבוץ כזה נשמור אותו לעריכה (סעיף 2).
     בגני חובה (גיל 5) אין "סייעת ב'" כלל (סעיף 14). */
  const mandatory = isMandatoryGan(g);
  const bAssigned = !!(a[ASSISTANT_B_ROLE] && (a[ASSISTANT_B_ROLE].staffId||a[ASSISTANT_B_ROLE].name));
  const bEligible = reg>=ASSISTANT_B_MIN && !mandatory;
  const roles = assignRoles()   // לפי הסדר שנקבע בהגדרות
    .filter(m=> m.role!==ASSISTANT_B_ROLE || ((bEligible || bAssigned) && !mandatory))
    .filter(m=> roleFitsEdu(m.role, ganEdu)); // רק תפקידים המשויכים לחינוך הגן
  /* בניית רשימת עובדות לבחירה — משלים אוטומטי מקובץ, עם הפרדה לפי חינוך הגן (רגיל/מיוחד) */
  const byNameHe=(x,y)=>staffName(x).localeCompare(staffName(y),"he");
  const staffEduMatch=m=> eduLabel(m)===ganEdu;   // רק צוות מאותו חינוך של הגן — לא לערבב רגיל/מיוחד
  function staffPool(role, q){
    const ql=String(q||"").trim();
    const ok=m=> staffIsActive(m) && staffEduMatch(m) && (!ql || (staffName(m)+" "+(m.mobile||"")+" "+(m.phone||"")+" "+(m.role||"")).includes(ql));
    return { here:DB.staff.filter(m=>ok(m)&&m.role===role).sort(byNameHe),
             other:DB.staff.filter(m=>ok(m)&&m.role!==role).sort(byNameHe) };
  }
  /* HTML של רשימה נפתחת מקובצת: קודם התפקיד המבוקש, ואז "שאר הצוות" */
  function dropHtml(role, q){
    const {here,other}=staffPool(role,q);
    const item=(m,showRole)=>{ const elsewhere=idx[m.id]?ganName(idx[m.id][0].ganId):"";
      return `<div class="asg-opt" data-id="${esc(m.id)}"><b>${esc(staffName(m))}</b>${showRole?` · <span style="color:var(--muted)">[${esc(m.role||'ללא תפקיד')}]</span>`:''}${(m.mobile||m.phone)?` · ${esc(m.mobile||m.phone)}`:''}${elsewhere?` <span style="color:var(--warn)">· כבר משובצת ב${esc(elsewhere)}</span>`:''}</div>`; };
    let h="";
    if(here.length) h+=`<div class="asg-grp">${esc(role)}</div>`+here.map(m=>item(m,false)).join("");
    if(other.length) h+=`<div class="asg-grp">שאר הצוות</div>`+other.map(m=>item(m,true)).join("");
    if(!h) h=`<div class="asg-empty">אין תוצאות בחינוך ${ganEdu==='ח"מ'?'המיוחד':'הרגיל'}</div>`;
    return h;
  }
  function resolveStaff(role, text){ const t=String(text||"").trim(); if(!t) return null;
    const pool=DB.staff.filter(m=>staffEduMatch(m));
    return pool.find(m=>m.role===role && staffName(m)===t) || pool.find(m=>staffName(m)===t) || null; }
  /* בניית תיבות הימים לתפקיד "לפי ימים" — משבצת רק ימים פנויים לעובד/ת שנבחרה (סעיף 1) */
  function daysBoxHtml(selectedStaffId, wantDays){
    const taken = selectedStaffId ? staffTakenDays(idx, selectedStaffId) : {};
    return WEEK_DAYS.map(d=>{
      const isTaken = !!taken[d];
      const checked = wantDays.includes(d) && !isTaken;
      return `<label class="check" style="${isTaken?'opacity:.55':''}" ${isTaken?`title="כבר משובצת ב${esc(taken[d])} ביום ${esc(d)}"`:''}>`+
        `<input type="checkbox" class="asg-day" value="${esc(d)}" ${checked?'checked':''} ${isTaken?'disabled':''}> ${esc(d)}${isTaken?' 🔒':''}</label>`;
    }).join("");
  }
  const fixed=[["סמל פנימי",g.internalSymbol],["סמל גן",g.ganSymbol],["גיל",g.age],["חינוך",eduLabel(g)],
    ["כתובת",[g.address,g.building].filter(Boolean).join(" ")],["אזור",g.zone],["טל' גן",g.phoneGan],["קיבולת",g.capacity],["רשומות",reg]];
  const bHint = mandatory
    ? `<div class="hint" style="margin-bottom:10px;color:var(--muted)">💡 גן חובה (גיל 5) — אין שיבוץ "${esc(ASSISTANT_B_ROLE)}".</div>`
    : ((!bEligible && !bAssigned)
      ? `<div class="hint" style="margin-bottom:10px;color:var(--muted)">💡 שיבוץ "${esc(ASSISTANT_B_ROLE)}" ייפתח כשהגן יגיע ל-${ASSISTANT_B_MIN} בנות (כרגע ${reg}).</div>` : "");
  modal(`
    <style>
      .asg-drop{position:absolute;z-index:60;inset-inline:0;top:100%;margin-top:2px;max-height:240px;overflow:auto;background:var(--card,#fff);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
      .asg-grp{position:sticky;top:0;background:var(--surface,#f2f2f2);color:var(--accent-strong);font-weight:700;font-size:.8rem;padding:4px 10px;border-bottom:1px solid var(--border)}
      .asg-opt{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.9rem}
      .asg-opt:hover{background:var(--accent-soft)}
      .asg-empty{padding:10px;color:var(--muted);font-size:.85rem}
    </style>
    <h3>שיבוץ — ${esc(ganName(g.id))} <span style="color:var(--muted);font-weight:400">· ${esc(ctxLabel(asgContext))}</span></h3>
    <div class="hint" style="margin-bottom:10px">${fixed.filter(f=>f[1]!==""&&f[1]!=null).map(f=>`${esc(f[0])}: <b>${esc(f[1])}</b>`).join(" · ")}</div>
    ${bHint}
    <div class="grid" style="gap:12px">
      ${roles.map(meta=>{
        const role=meta.role, cur=a[role]||{}, days=cur.days||[];
        const isDays = meta.extra==="days";
        const supKey = supportKeyForRole(role);          // תפקיד סיוע → מפתח הסיוע
        const multiGan = !!supKey;                        // עובדות סיוע יכולות להיות בכמה גנים
        const curStaff = cur.staffId ? DB.staff.find(x=>x.id===cur.staffId) : null;
        const display = curStaff ? staffName(curStaff) : (cur.name||"");
        const datesOn = (cur.durType==='dates'||cur.durType==='months');
        let extraHtml="";
        if(isDays){
          extraHtml=`<div class="field" style="min-width:230px;flex:1"><label>ימים</label>
            <div class="checks asg-days-box" style="grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px">
              ${daysBoxHtml(cur.staffId||"", days)}
            </div></div>`;
        } else if(meta.extra==="duration"){
          extraHtml=`<div class="field" style="min-width:150px"><label>תקופה</label>
              <select class="asg-durtype">
                <option value="" ${!cur.durType?'selected':''}>—</option>
                <option value="year" ${cur.durType==='year'?'selected':''}>שנה</option>
                <option value="dates" ${datesOn?'selected':''}>מתאריך עד תאריך</option>
              </select></div>
            <div class="field asg-dates-wrap" style="min-width:150px;${datesOn?'':'display:none'}"><label>מתאריך</label>
              <input type="date" class="asg-durfrom" value="${esc(cur.durFrom||'')}"></div>
            <div class="field asg-dates-wrap" style="min-width:150px;${datesOn?'':'display:none'}"><label>עד תאריך</label>
              <input type="date" class="asg-durto" value="${esc(cur.durTo||'')}"></div>`;
        }
        /* תיבת בחירת ילדות משויכות לתפקידי סיוע — רק ילדות בגן זה המסומנות באותו סיוע */
        let kidsHtml="";
        if(supKey){
          const supLbl=(SUPPORT_TYPES.find(t=>t[0]===supKey)||[])[1]||"";
          const kids=studentsOfYear().filter(s=>s.ganId===g.id && !s.finished && s.support && s.support[supKey]);
          const chosen=new Set(cur.students||[]);
          kidsHtml=`<div class="field" style="flex:1 1 100%;min-width:230px"><label>ילדות משויכות · ${esc(supLbl)}</label>
            ${kids.length? `<div class="checks asg-kids-box" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px">
              ${kids.map(s=>`<label class="check"><input type="checkbox" class="asg-kid" value="${esc(s.id)}" ${chosen.has(s.id)?'checked':''}> ${esc(s.lastName)} ${esc(s.firstName)}</label>`).join("")}
            </div>` : `<div class="hint">אין בגן זה ילדות המסומנות "${esc(supLbl)}". יש לסמן זאת בתיק הילדה (שונות → סיוע/העשרה).</div>`}
          </div>`;
        }
        return `<div class="panel" style="padding:10px;margin:0" data-role="${esc(role)}" data-days="${isDays?1:0}" data-multi="${multiGan?1:0}">
          <div class="row" style="gap:8px;align-items:flex-end;flex-wrap:wrap">
            <div class="field asg-pick" style="min-width:200px;flex:1;position:relative"><label>${roleChip(role)}</label>
              <input class="asg-combo" value="${esc(display)}" placeholder="הקלד/י שם או בחר/י ▾" autocomplete="off">
              <div class="asg-drop" style="display:none"></div>
              <input type="hidden" class="asg-staffid" value="${esc(cur.staffId||'')}"></div>
            <div class="field" style="min-width:130px"><label>טלפון</label><input class="asg-phone" value="${esc(cur.phone||"")}" inputmode="tel"></div>
            ${extraHtml}
            <button class="btn ghost sm asg-clear" type="button" title="הסרת השיבוץ בשורה זו">🗑️ הסר</button>
          </div>
          ${kidsHtml}
        </div>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn" id="asg-save" style="margin-inline-start:auto">💾 שמירה</button>
      <button class="btn ghost" id="asg-cancel">ביטול</button>
    </div>`);
  $("#modal").querySelectorAll("[data-role]").forEach(box=>{
    const combo=box.querySelector(".asg-combo"), sid=box.querySelector(".asg-staffid"), ph=box.querySelector(".asg-phone"), drop=box.querySelector(".asg-drop");
    let lastId=sid.value||"";
    const setStaff=st=>{
      sid.value=st.id; combo.value=staffName(st); if(st.mobile||st.phone) ph.value=st.mobile||st.phone;
      if(box.dataset.days==='1'){ const dbox=box.querySelector(".asg-days-box"); if(dbox){
        const checked=[...dbox.querySelectorAll(".asg-day:checked")].map(x=>x.value);
        dbox.innerHTML=daysBoxHtml(st.id, checked); } }
      if(st.id!==lastId && box.dataset.multi!=='1' && box.dataset.days!=='1' && idx[st.id]){
        toast("שים/י לב: "+staffName(st)+" כבר משובצת ב"+ganName(idx[st.id][0].ganId)); }
      lastId=st.id;
    };
    const openDrop=q=>{ // בונה ומציג את הרשימה המקובצת, ומחווט בחירה
      drop.innerHTML=dropHtml(box.dataset.role, q); drop.style.display="block";
      drop.querySelectorAll(".asg-opt").forEach(el=> el.onmousedown=e=>{ e.preventDefault(); const st=DB.staff.find(x=>x.id===el.dataset.id); if(st){ setStaff(st); drop.style.display="none"; } });
    };
    combo.onfocus=()=>openDrop("");
    combo.oninput=()=>{ openDrop(combo.value); // סינון חי
      const st=resolveStaff(box.dataset.role, combo.value); if(st){ sid.value=st.id; } else { sid.value=""; lastId=""; } };
    combo.onblur=()=>setTimeout(()=>{ drop.style.display="none"; }, 150);
    /* הסרת שיבוץ בשורה */
    const clr=box.querySelector(".asg-clear");
    if(clr) clr.onclick=()=>{ combo.value=""; sid.value=""; ph.value=""; lastId=""; drop.style.display="none";
      box.querySelectorAll(".asg-kid:checked,.asg-day:checked").forEach(c=>c.checked=false); };
    /* תקופה: הצגת שדות התאריכים כשנבחר "מתאריך עד תאריך" */
    const dt=box.querySelector(".asg-durtype");
    if(dt) dt.onchange=()=>{ box.querySelectorAll(".asg-dates-wrap").forEach(w=> w.style.display = dt.value==='dates'?'':'none'); };
  });
  $("#asg-cancel").onclick=closeModal;
  $("#asg-save").onclick=()=>{
    const cmap=asgCtxMap();
    const existing=cmap[ganId]||{};
    const rendered=new Set([...$("#modal").querySelectorAll("[data-role]")].map(b=>b.dataset.role));
    const entry={};
    /* שמירת תפקידים שלא הוצגו במסך (למשל "סייעת ב'" שהוסתרה כשהגן מתחת ל-30) כדי לא לאבד נתונים */
    Object.keys(existing).forEach(r=>{ if(!rendered.has(r)) entry[r]=existing[r]; });
    $("#modal").querySelectorAll("[data-role]").forEach(box=>{
      const role=box.dataset.role;
      const combo=box.querySelector(".asg-combo"), sid=box.querySelector(".asg-staffid"), ph=box.querySelector(".asg-phone");
      const st=sid.value? DB.staff.find(x=>x.id===sid.value) : null;
      const val={ staffId:sid.value||"", name:(st?staffName(st):combo.value.trim()), phone:ph.value.trim() };
      const days=[...box.querySelectorAll(".asg-day:checked")].map(x=>x.value); if(days.length) val.days=days;
      const kids=[...box.querySelectorAll(".asg-kid:checked")].map(x=>x.value); if(kids.length) val.students=kids;
      const dt=box.querySelector(".asg-durtype");
      if(dt&&dt.value){ val.durType=dt.value; if(dt.value==='dates'){ const df=box.querySelector(".asg-durfrom"), dto=box.querySelector(".asg-durto"); if(df&&df.value) val.durFrom=df.value; if(dto&&dto.value) val.durTo=dto.value; } }
      if(val.staffId||val.name||val.phone||val.days||val.durType||val.students) entry[role]=val;
    });
    if(Object.keys(entry).length) cmap[ganId]=entry; else delete cmap[ganId];
    save(); closeModal(); route(); toast("השיבוץ נשמר");
  };
}
/* ייצוא/הדפסה של שיבוץ (סעיפים 8, 18) */
function openAsgExport(){
  modal(`
    <h3>ייצוא / הדפסה — שיבוץ ${esc(DB.activeYear)} · ${esc(ctxLabel(asgContext))}</h3>
    <div class="note">מיוצא השיבוץ של ההקשר הנבחר (${esc(ctxLabel(asgContext))}) לפי סינון החינוך הפעיל${activeEdu?` (חינוך ${activeEdu==='ח"מ'?'מיוחד':'רגיל'})`:' (כל החינוך)'}. אפשר לכלול/להשמיט מספרי טלפון.</div>
    <fieldset style="margin-top:10px"><legend>אפשרויות</legend>
      <div class="checks">
        <label class="check"><input type="checkbox" id="ax-phones" checked> כלול מספרי טלפון</label>
        <label class="check"><input type="checkbox" id="ax-fixed" checked> כלול נתוני גן קבועים (סמל, גיל, כתובת…)</label>
      </div>
    </fieldset>
    <div class="foot">
      <button class="btn" id="ax-csv" type="button">⬇️ ייצוא לאקסל (CSV)</button>
      <button class="btn ghost" id="ax-pdf" type="button">🖨️ הדפסה / PDF</button>
      <button class="btn ghost" id="ax-cancel" type="button" style="margin-inline-start:auto">סגירה</button>
    </div>`);
  $("#ax-cancel").onclick=closeModal;
  const build=()=>{
    const phones=$("#ax-phones").checked, fixed=$("#ax-fixed").checked;
    const gans=eduScope(DB.gans.slice()).sort((a,b)=>ganName(a.id).localeCompare(ganName(b.id),"he"));
    const headers=["שם הגן"]; if(fixed) headers.push("סמל פנימי","סמל גן","גיל","חינוך","כתובת","אזור","טל' גן","קיבולת","רשומות","סטטוס");
    assignRoles().forEach(meta=>{ headers.push(meta.role); if(phones) headers.push(meta.role+" — טלפון"); if(meta.extra) headers.push(meta.role+" — "+asgExtraLabel(meta.role)); });
    const rows=gans.map(g=>{
      const reg=studentsOfYear().filter(s=>s.ganId===g.id && !s.finished).length;
      const a=ganAsg(g.id); const row=[ganName(g.id)];
      if(fixed) row.push(g.internalSymbol,g.ganSymbol,g.age,eduLabel(g),[g.address,g.building].filter(Boolean).join(" "),g.zone,g.phoneGan,g.capacity,reg,g.active?"פעיל":"כבוי");
      assignRoles().forEach(meta=>{ const c=a[meta.role]||{}; row.push(c.name||""); if(phones) row.push(c.phone||""); if(meta.extra) row.push(asgExtraText(meta.role,c)); });
      return row;
    });
    return { headers, rows };
  };
  const ctxFile=ctxLabel(asgContext).replace(/\s+/g,"-");
  $("#ax-csv").onclick=()=>{
    const {headers,rows}=build(); if(!rows.length){ toast("אין גנים לייצוא"); return; }
    const csv=[headers.join(",")].concat(rows.map(r=>r.map(csvCell).join(","))).join("\r\n");
    downloadBlob(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}), `שיבוץ_${ctxFile}_${DB.activeYear}${activeEdu==='ח"מ'?'_מיוחד':(activeEdu?'_רגיל':'')}.csv`); toast("קובץ אקסל נוצר");
  };
  $("#ax-pdf").onclick=()=>{
    const {headers,rows}=build(); if(!rows.length){ toast("אין נתונים"); return; }
    printTable(`שיבוץ צוות · ${DB.activeYear} · ${ctxLabel(asgContext)}${activeEdu?` · חינוך ${activeEdu==='ח"מ'?'מיוחד':'רגיל'}`:''}`, headers, rows);
  };
}

function csvCell(v){ v=String(v??""); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function downloadBlob(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }
/* פענוח קובץ טקסט עם זיהוי קידוד — תומך UTF-8 (עם/בלי BOM) וגם Windows-1255
   (הקידוד שאקסל בעברית שומר בו כברירת מחדל, מה שמקלקל את הכותרות אם קוראים כ-UTF-8) */
function decodeFileText(buf){
  const bytes=new Uint8Array(buf);
  if(bytes.length>=3 && bytes[0]===0xEF && bytes[1]===0xBB && bytes[2]===0xBF)
    return new TextDecoder("utf-8").decode(bytes.subarray(3)); // UTF-8 עם BOM
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(bytes); } // UTF-8 תקין
  catch(_){ try{ return new TextDecoder("windows-1255").decode(bytes); } // נפילה לעברית ANSI (אקסל)
            catch(__){ return new TextDecoder("utf-8").decode(bytes); } }
}
function readFileSmart(file,cb){ const r=new FileReader(); r.onload=()=>cb(decodeFileText(r.result)); r.readAsArrayBuffer(file); }

const HIST_GAN_HEADER_MAP = {
  "גן":"gan","שםהגן":"gan","שםגן":"gan","גננת":"gan","שםהגננת":"gan",
  "כתובת":"address","כתובתהגן":"address","רחוב":"address","כתובתגן":"address",
  "קמפוס":"campus","קמפוסגנים":"campus","קמפוסהגן":"campus",
  "גיל":"age","גילהגן":"age",
  "מועדא":"a","א":"a","מועדא׳":"a",
  "מועדב":"b","ב":"b","מועדב׳":"b",
  "מועדג":"c","ג":"c","מועדג׳":"c",
  "סופי":"f","מועדסופי":"f",
  "סהכ":"total","סךהכל":"total","total":"total"
};
function histGanTotal(r){ return (+r.a||0)+(+r.b||0)+(+r.c||0)+(+r.f||0); }
/* פענוח טבלת גנים היסטורית: כותרות גן/גיל/מועדים */
function parseHistGans(text){
  const rows=parseTable(text); if(!rows.length) return [];
  const header=rows[0].map(normHeader); const hi={};
  header.forEach((h,i)=>{ const k=HIST_GAN_HEADER_MAP[h]; if(k && hi[k]==null) hi[k]=i; });
  if(hi.gan==null) return []; // חובה עמודת "גן"
  const out=[];
  for(let r=1;r<rows.length;r++){ const c=rows[r];
    const gan=String(c[hi.gan]??"").trim(); if(!gan) continue;
    out.push({ gan,
      address: hi.address!=null?String(c[hi.address]??"").trim():"",
      campus: hi.campus!=null?String(c[hi.campus]??"").trim():"",
      age: hi.age!=null?String(c[hi.age]??"").trim():"",
      a: hi.a!=null?(+digits(c[hi.a])||0):0,
      b: hi.b!=null?(+digits(c[hi.b])||0):0,
      c: hi.c!=null?(+digits(c[hi.c])||0):0,
      f: hi.f!=null?(+digits(c[hi.f])||0):0 });
  }
  return out;
}

      <div class="field" style="min-width:150px"><label>סיסמה ראשונית (6 תווים+)</label><input id="nu-pass" type="text" autocomplete="new-password" placeholder="לפחות 6 תווים"></div>
      <button class="btn" id="nu-create" style="align-self:end">➕ צור משתמש</button>

    <div id="nu-msg" class="note" style="display:none;margin-top:10px"></div>

  renderAuthBox();

  // ניהול משתמשים (למנהל בלבד) — דרך Cloud Function adminUsers
  if(admin){
    const usersBox=$("#users-box");
    const nuMsg=$("#nu-msg");
    const showNuMsg=(text, ok)=>{ if(!nuMsg)return; nuMsg.style.display="block"; nuMsg.textContent=text;
      nuMsg.style.background = ok? "var(--good-soft)":"var(--bad-soft)";
      nuMsg.style.color = ok? "var(--good)":"var(--bad)";
      nuMsg.style.borderColor = ok? "var(--good)":"var(--bad)"; };
    const fmtWhen=v=>{ if(!v)return "—"; const d=new Date(v); return isNaN(d)? "—" : d.toLocaleDateString("he-IL"); };
    const meEmail=(currentUser&&currentUser.email||"").toLowerCase();
    const activity=(DB.settings&&DB.settings.userActivity)||{};
    const renderUsers=list=>{
      if(!list || !list.length){ usersBox.innerHTML=`<div class="hint">אין משתמשים להצגה.</div>`; return; }
      usersBox.innerHTML=`<div class="table-wrap"><table style="min-width:660px"><thead><tr>
        <th>שם</th><th>אימייל</th><th>נוצר</th><th>עריכה אחרונה בנתונים</th><th>כניסה אחרונה</th><th style="text-align:end">פעולות</th></tr></thead><tbody>${
        list.map(u=>`<tr>
          <td>${u.name?esc(u.name):'<span style="color:var(--muted)">—</span>'}</td>
          <td dir="ltr" style="text-align:right">${esc(u.email||"—")}${(u.email||"").toLowerCase()===meEmail?' <span class="pill neutral">זה אני</span>':''}</td>
          <td>${fmtWhen(u.created)}</td>
          <td>${fmtWhen(activity[(u.email||"").toLowerCase()])}</td>
          <td>${fmtWhen(u.lastSignIn)}</td>
          <td style="text-align:end;white-space:nowrap">
            <button class="btn ghost sm" data-nm="${esc(u.uid)}" data-em="${esc(u.email||"")}" data-cur="${esc(u.name||"")}">✏️ שם</button>
            <button class="btn ghost sm" data-pw="${esc(u.uid)}" data-em="${esc(u.email||"")}">🔑 סיסמה</button>
            <button class="btn danger sm" data-del="${esc(u.uid)}" data-em="${esc(u.email||"")}" ${(u.email||"").toLowerCase()===meEmail?"disabled title=\"אי אפשר למחוק את עצמך\"":""}>🗑️ מחיקה</button>
          </td></tr>`).join("")}</tbody></table></div>`;
      usersBox.querySelectorAll("[data-nm]").forEach(b=>b.onclick=async ()=>{
        const uid=b.dataset.nm, em=b.dataset.em, cur=b.dataset.cur||"";
        const nm=prompt(`שם עבור ${em}:`, cur);
        if(nm===null) return;
        try{ await adminUsersCall("setName",{uid, name:String(nm).trim()}); showNuMsg(`השם של ${em} עודכן.`, true); loadUsers(); }
        catch(e){ showNuMsg(adminUsersErrHe(e), false); }
      });
      usersBox.querySelectorAll("[data-del]").forEach(b=>b.onclick=async ()=>{
        const uid=b.dataset.del, em=b.dataset.em;
        if(!confirm(`למחוק את המשתמש ${em}? הפעולה בלתי הפיכה והוא לא יוכל יותר להתחבר.`)) return;
        b.disabled=true;
        try{ await adminUsersCall("delete",{uid}); toast("המשתמש נמחק"); loadUsers(); }
        catch(e){ b.disabled=false; showNuMsg(adminUsersErrHe(e), false); }
      });
      usersBox.querySelectorAll("[data-pw]").forEach(b=>b.onclick=async ()=>{
        const uid=b.dataset.pw, em=b.dataset.em;
        const p=prompt(`סיסמה חדשה עבור ${em} (6 תווים לפחות):`);
        if(p===null) return;
        if(String(p).length<6){ showNuMsg("הסיסמה חייבת להיות באורך 6 תווים לפחות.", false); return; }
        try{ await adminUsersCall("setPassword",{uid, password:p}); showNuMsg(`הסיסמה של ${em} עודכנה.`, true); }
        catch(e){ showNuMsg(adminUsersErrHe(e), false); }
      });
    };
    const loadUsers=async ()=>{
      usersBox.innerHTML=`<div class="hint">טוען רשימת משתמשים…</div>`;
      try{ const res=await adminUsersCall("list");
        if(res && res.saConfigured===false){
          usersBox.innerHTML=`<div class="hint">רשימת המשתמשים, מחיקה ואיפוס סיסמה יופיעו כאן לאחר הגדרת <b>Service Account</b> בגשר (ראה SETUP.md — "ניהול משתמשים"), או תמיד בקונסולת Firebase → Authentication. <b>הוספת משתמש חדש עובדת כאן כרגיל.</b></div>`;
          return;
        }
        renderUsers((res&&res.users)||[]);
      }
      catch(e){ usersBox.innerHTML=`<div class="hint" style="color:var(--bad)">${esc(adminUsersErrHe(e))}</div>`; }
    };
    $("#nu-create").onclick=async ()=>{
      const name=($("#nu-name").value||"").trim(), email=($("#nu-email").value||"").trim(), password=$("#nu-pass").value||"";
      if(!email){ showNuMsg("יש להזין אימייל.", false); return; }
      if(password.length<6){ showNuMsg("הסיסמה חייבת להיות באורך 6 תווים לפחות.", false); return; }
      const btn=$("#nu-create"); btn.disabled=true;
      try{ await adminUsersCall("create",{email, password, name});
        showNuMsg(`נוצר משתמש ${email}${name?` (${name})`:""}. אפשר למסור לו את האימייל והסיסמה להתחברות.`, true);
        $("#nu-name").value=""; $("#nu-email").value=""; $("#nu-pass").value=""; loadUsers();
      }catch(e){ showNuMsg(adminUsersErrHe(e), false); }
      finally{ btn.disabled=false; }
    };
    $("#nu-refresh").onclick=loadUsers;
    loadUsers(); // טעינה ראשונית (תציג הודעה ידידותית אם הפונקציה עדיין לא פרוסה)
  }

  // גילי ילדים ותפקידי צוות (עריכה למנהל בלבד)
  const saveAges  = next => { DB.settings.childAges  = cleanList(next)||[]; save(); route(); toast("נשמר"); };
  const saveRoles = next => { DB.settings.staffRoles = cleanList(next)||[]; save(); route(); toast("נשמר"); };
  const saveCampuses = next => { DB.settings.campuses = cleanList(next)||[]; save(); route(); toast("נשמר"); };
  renderSettingsList($("#ages-box"),  CHILD_AGES.slice(),  saveAges,  dis);
  renderRolesEditor($("#roles-box"), dis);
  renderSettingsList($("#campus-box"), CAMPUSES.slice(), saveCampuses, dis);
  if(admin){
    $("#addAge").onclick=()=>{ const v=$("#new-age").value.trim(); if(!v)return; if(CHILD_AGES.includes(v)){toast("כבר קיים");return;} saveAges(CHILD_AGES.concat(v)); };
    $("#resetAges").onclick=()=>{ delete DB.settings.childAges; save(); route(); toast("אופס לברירת מחדל"); };
    $("#addRole").onclick=()=>{ const v=$("#new-role").value.trim(); if(!v)return; if(STAFF_ROLES.includes(v)){toast("כבר קיים");return;} saveRoles(STAFF_ROLES.concat(v)); };
    $("#resetRoles").onclick=()=>{ delete DB.settings.staffRoles; save(); route(); toast("אופס לברירת מחדל"); };
    $("#addCampus").onclick=()=>{ const v=$("#new-campus").value.trim(); if(!v)return; if(CAMPUSES.includes(v)){toast("כבר קיים");return;} saveCampuses(CAMPUSES.concat(v)); };
    $("#syncCampus").onclick=()=>{ let n=0; DB.students.forEach(s=>{ if(!s.ganId) return; const c=ganCampus(s.ganId); if(s.campus!==c){ s.campus=c; n++; } }); if(n) save(); route(); toast(n?`עודכנו ${n} תלמידות`:"הכל כבר מעודכן לפי הגנים"); };
  }

  // מיתוג (כותרת + לוגו)
  if(admin){
    $("#saveBrand").onclick=()=>{ DB.settings.appTitle=$("#br-title").value.trim(); DB.settings.appLogo=$("#br-logo").value.trim(); save(); applyBranding(); toast("המיתוג נשמר"); };
    $("#resetBrand").onclick=()=>{ delete DB.settings.appTitle; delete DB.settings.appLogo; save(); route(); toast("הוחזר לברירת מחדל"); };
  }

  // מנהלי מערכת
  const ab=$("#admins-box");
  const admins=(DB.settings.admins||[]);
  ab.innerHTML = admins.length
    ? `<div class="row" style="gap:8px">${admins.map(e=>`<span class="pill ok" style="padding:6px 12px">${esc(e)} ${admin?`<button class="btn ghost sm" data-delA="${esc(e)}" style="padding:0 6px;margin-inline-start:6px">✕</button>`:''}</span>`).join("")}</div>`
    : `<div class="hint">אין עדיין מנהלים מוגדרים — כל משתמש מחובר יכול לשנות הגדרות. מומלץ להוסיף את עצמך כמנהל.</div>`;
  if(admin){
    ab.querySelectorAll("[data-delA]").forEach(b=>b.onclick=()=>{ const e=b.dataset.dela;
      if(admins.length===1 && !confirm("זהו המנהל האחרון. לאחר הסרתו כל משתמש יוכל לשנות הגדרות. להמשיך?")) return;
      DB.settings.admins=admins.filter(x=>x!==e); save(); route(); toast("הוסר מנהל"); });
    $("#addAdmin").onclick=()=>{ const e=$("#new-admin").value.trim().toLowerCase(); if(!e)return;
      if(admins.map(x=>x.toLowerCase()).includes(e)){ toast("כבר ברשימה"); return; }
      DB.settings.admins=admins.concat(e); save(); route(); toast("נוסף מנהל"); };
  }

  // years
  const yb=$("#years-box");
  yb.innerHTML=`<div class="row" style="gap:8px">${DB.years.map(y=>`<span class="pill ${y===DB.activeYear?'ok':'neutral'}" style="padding:6px 12px">${esc(y)} ${(admin&&DB.years.length>1)?`<button class="btn ghost sm" data-dely="${esc(y)}" style="padding:0 6px;margin-inline-start:6px">✕</button>`:''}</span>`).join("")}</div>`;
  yb.querySelectorAll("[data-dely]").forEach(b=>b.onclick=()=>{ const y=b.dataset.dely;
    if(studentsOfYear(y).length && !confirm(`בשנת ${y} יש תלמידות. למחוק את השנה ואת התלמידות שבה?`)) return;
    DB.years=DB.years.filter(x=>x!==y); DB.students=DB.students.filter(s=>s.year!==y);
    if(DB.activeYear===y){ DB.activeYear=DB.years[0]; setYearPref(DB.activeYear); } save(); route(); });
  if(admin) $("#addYear").onclick=()=>{ const y=$("#new-year").value.trim(); if(!y)return; if(DB.years.includes(y)){toast("שנה קיימת");return;} DB.years.push(y); save(); route(); toast("נוספה שנה"); };

  if(admin) $("#doPromote").onclick=async ()=>{
    const from=$("#pr-from").value, to=$("#pr-to").value;
    const copyId = DRIVE_READY && !!($("#pr-copyId")&&$("#pr-copyId").checked);
    if(from===to){ toast("בחר/י שנת מקור ושנת יעד שונות"); return; }
    const src=DB.students.filter(s=>s.year===from);
    if(!src.length){ toast("אין תלמידות בשנת המקור"); return; }
    const existing=new Set(DB.students.filter(s=>s.year===to).map(s=>digits(s.tz)).filter(Boolean));
    let added=0, skippedGrad=0, noGan=0;
    const toCopy=[]; // {id: מזהה התלמידה החדשה, src: מזהה קובץ ת"ז המקורי}
    src.forEach(s=>{ if(s.tz && existing.has(digits(s.tz))) return; // כבר קיימת ביעד (למשל הועברה בהשארות)
      const n=buildPromoted(s, to); // כללי המעבר המלאים (גן מתקדם, איפוסים, שונות)
      if(!n){ skippedGrad++; return; } // מסיימת (גן חובה) שאינה בהשארות
      if(!n.ganId) noGan++;
      if(copyId && s.docFiles && s.docFiles.idCopy && s.docFiles.idCopy.id) toCopy.push({ id:n.id, src:s.docFiles.idCopy.id });
      DB.students.push(n); added++; });
    save(); route(); toast(`הועברו ${added} תלמידות לשנת ${to}${skippedGrad?` · ${skippedGrad} מסיימות דולגו`:''}${noGan?` · ${noGan} ללא גן (לשיבוץ)`:''}`);

    // מעבר אסינכרוני: העתקה פיזית של קובצי ת"ז לתיקיות השנה החדשה (לא חוסם את הקידום)
    if(copyId && toCopy.length){
      const st=$("#pr-status");
      let done=0, failed=0;
      for(const c of toCopy){
        const n=DB.students.find(x=>x.id===c.id); if(!n) continue;
        if(st) st.textContent=`מעתיק קובצי ת"ז לתיקיות השנה החדשה… ${done+failed}/${toCopy.length}`;
        try{
          await driveEnsureChildFolder(n);
          const nm='צילום תעודת זהות · '+([n.lastName,n.firstName].filter(Boolean).join(" "))+(n.tz?(" · "+n.tz):"");
          const res=await driveCopyFile(c.src, n.driveFolderId, nm);
          const cur=DB.students.find(x=>x.id===c.id);
          if(cur){ cur.docFiles=cur.docFiles||{}; cur.docFiles.idCopy={ id:res.id||"", name:res.name||nm, link:res.link||"" }; }
          done++;
        }catch(e){ console.error(e); failed++; }
      }
      save();
      if(st) st.textContent="";
      toast(`הועתקו ${done} קובצי ת"ז לתיקיות השנה${failed?` · ${failed} נכשלו (נשמר קישור לשנה הקודמת)`:''}`);
    }
  };

  // historical — נעול כברירת מחדל כדי לא לשנות בטעות מספרי תלמידים שהוזנו (סעיף 14)
  const hb=$("#hist-box");
  const histFinal=h=>(+h.periodA||0)+(+h.periodB||0)+(+h.periodC||0); // סופי = סכום א׳+ב׳+ג׳
  let histUnlocked=false;
  const drawHist=()=>{
    const editable = admin && histUnlocked;
    const ro = editable? "" : "readonly";
    hb.innerHTML=`
    <div class="row" style="margin-bottom:8px;align-items:center">
      <div class="note" style="flex:1">🔒 המספרים נעולים כדי לא לשנות בטעות נתונים שכבר הוזנו משנים קודמות.${admin?' לחצ/י "אפשר עריכה" כדי לעדכן.':' רק מנהל מערכת יכול לפתוח לעריכה.'}</div>
      ${admin?`<button class="btn ghost sm" id="hist-lock" style="align-self:center">${editable?'🔓 נעל שוב':'✏️ אפשר עריכה'}</button>`:''}
    </div>
    <div class="table-wrap"><table><thead><tr><th>שנה</th><th>מועד א׳</th><th>מועד ב׳</th><th>מועד ג׳</th><th>סופי (סיכום)</th>${editable?'<th></th>':''}</tr></thead><tbody>
      ${DB.years.map(y=>{const h=DB.historical[y]||{};return `<tr>
        <td><b>${esc(y)}</b></td>
        <td><input class="hist-p" data-h="${esc(y)}|periodA" value="${esc(h.periodA??"")}" inputmode="numeric" style="width:80px" ${ro}></td>
        <td><input class="hist-p" data-h="${esc(y)}|periodB" value="${esc(h.periodB??"")}" inputmode="numeric" style="width:80px" ${ro}></td>
        <td><input class="hist-p" data-h="${esc(y)}|periodC" value="${esc(h.periodC??"")}" inputmode="numeric" style="width:80px" ${ro}></td>
        <td><input data-final value="${histFinal(h)||""}" style="width:80px;font-weight:800;background:var(--surface)" readonly title="סכום מועדים א׳+ב׳+ג׳ (מחושב אוטומטית)"></td>
        ${editable?`<td class="actions"><button class="btn ghost sm" data-livey="${esc(y)}">מלא מנתוני המערכת</button></td>`:''}</tr>`;}).join("")}
    </tbody></table></div><div class="hint">עמודת "סופי" מחושבת אוטומטית כסכום מועדים א׳+ב׳+ג׳.</div>`;
    const lk=$("#hist-lock"); if(lk) lk.onclick=()=>{ histUnlocked=!histUnlocked; drawHist(); };
    if(editable){
      hb.querySelectorAll("input.hist-p").forEach(inp=> inp.oninput=inp.onchange=()=>{
        const [y,k]=inp.dataset.h.split("|"); DB.historical[y]=DB.historical[y]||{};
        const v=inp.value.trim(); if(v==="") delete DB.historical[y][k]; else DB.historical[y][k]=+v;
        const h=DB.historical[y]; const f=histFinal(h);
        const cell=inp.closest("tr").querySelector("[data-final]"); if(cell) cell.value=f||"";
        if(f>0) h.final=f; else delete h.final; save(); });
      hb.querySelectorAll("[data-livey]").forEach(b=>b.onclick=()=>{ const y=b.dataset.livey;
        const ys=DB.students.filter(s=>s.year===y);
        const pa=ys.filter(s=>s.period==='א').length, pb=ys.filter(s=>s.period==='ב').length, pc=ys.filter(s=>s.period==='ג').length;
        DB.historical[y]={ periodA:pa, periodB:pb, periodC:pc, final:pa+pb+pc };
        save(); drawHist(); toast("מולא מנתוני המערכת"); });
    }
  };
  drawHist();
  renderHistGans($("#hist-gans-box"), admin);

  if(admin) $("#saveTzMin").onclick=()=>{ const raw=$("#tzmin").value.trim(); const v=+raw; if(!raw){ delete DB.settings.tzaharonMin; save(); toast("נוקה"); } else if(v>=0){ DB.settings.tzaharonMin=v; save(); toast("נשמר"); } };

  $("#exportAll").onclick=()=>{ downloadBlob(new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}), `גיבוי-רישום-${new Date().toISOString().slice(0,10)}.json`); };
  $("#importAll").onchange=e=>{ const f=e.target.files[0]; if(!f)return;
    readFileSmart(f, txt=>{ try{ const d=JSON.parse(txt); if(!d.students){throw 0;} if(confirm("שחזור יחליף את כל הנתונים הקיימים. להמשיך?")){ DB=Object.assign(blankDB(),d); save(); route(); toast("שוחזר בהצלחה"); } }catch(_){ toast("קובץ לא תקין"); } });
  };
}

/* ============================================================
   מודל / כללי
   ============================================================ */
/* ניהול כפתור "חזור" בנייד (PWA): חזור סוגר חלון פתוח או חוזר ללשונית הקודמת,
   במקום לצאת מהאפליקציה. מבוסס על History API. */
let modalHistoryOpen=false; // האם נדחף מצב היסטוריה עבור חלון פתוח
let inPopstate=false;       // האם אנו כרגע בתוך טיפול ב-popstate (למניעת לולאה)
function modal(html){
  $("#modal").innerHTML=html; $("#overlay").classList.add("show"); document.body.style.overflow="hidden";
  if(!modalHistoryOpen){ modalHistoryOpen=true; try{ history.pushState({rgModal:true},""); }catch(_){} }
}
function closeModal(){
  $("#overlay").classList.remove("show"); document.body.style.overflow="";
  if(modalHistoryOpen){ modalHistoryOpen=false; if(!inPopstate){ try{ history.back(); }catch(_){} } } // אזן את מחסנית ההיסטוריה שנדחפה בפתיחה
  if(pendingRender){ pendingRender=false; route(); }
}
function navToTab(tab){ if(tab===active) return; active=tab; try{ history.pushState({rgTab:tab},""); }catch(_){} route(); window.scrollTo(0,0); }
window.addEventListener("popstate", e=>{
  inPopstate=true;
  if($("#overlay").classList.contains("show")){ closeModal(); } // חזור סוגר חלון פתוח ולא יוצא
  else { const st=e.state; if(st && st.rgTab && st.rgTab!==active){ active=st.rgTab; route(); window.scrollTo(0,0); } }
  inPopstate=false;
});
$("#overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

$("#tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b){ navToTab(b.dataset.tab); } });
$("#yearSelect").addEventListener("change",e=>{ DB.activeYear=e.target.value; setYearPref(DB.activeYear); route(); }); // העדפה מקומית — ללא כתיבה לענן

/* theme */
(function(){ const KEY="rg-theme"; const saved=localStorage.getItem(KEY); if(saved)document.documentElement.dataset.theme=saved;
  $("#themeBtn").onclick=()=>{ const cur=document.documentElement.dataset.theme|| (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
    const next=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=next; localStorage.setItem(KEY,next); }; })();

boot();
</script>
