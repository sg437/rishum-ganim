<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4a9d5b">
<title>מערכת רישום וקליטת תלמידות</title>
<!-- PWA — התקנה כאפליקציה בטלפון עם אייקון מהלוגו (מתעדכן דינמית) -->
<link rel="manifest" id="manifestLink">
<link rel="icon" id="faviconLink" type="image/png">
<link rel="apple-touch-icon" id="appleIcon">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="רישום תלמידות">
<style>
:root{
  --bg:#eaf4ec;--surface:#fff;--surface-2:#f1f8f2;--ink:#12251a;--ink-soft:#3d5546;
  --muted:#6a8072;--border:#d5e7d9;--accent:#4a9d5b;--accent-strong:#357a44;--accent-soft:#d8eede;
  --brass:#9c6f2c;--good:#2c7a52;--good-soft:#d7ecdf;--warn:#a15b12;--warn-soft:#f6e6d2;
  --bad:#a5342b;--bad-soft:#f5dcd9;
  --shadow:0 1px 2px rgba(16,43,24,.06),0 10px 30px rgba(16,43,24,.08);--radius:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0a1710;--surface:#0f2117;--surface-2:#163021;--ink:#e9f4ec;
  --ink-soft:#b2ccb8;--muted:#7d977f;--border:#22402c;--accent:#4cbf6a;--accent-strong:#6ad684;--accent-soft:#103322;
  --brass:#cc9c56;--good:#54b888;--good-soft:#123527;--warn:#d9a25a;--warn-soft:#3a2c15;
  --bad:#e07b6f;--bad-soft:#3a1c18;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4)}}
:root[data-theme="light"]{--bg:#eaf4ec;--surface:#fff;--surface-2:#f1f8f2;--ink:#12251a;--ink-soft:#3d5546;--muted:#6a8072;--border:#d5e7d9;--accent:#4a9d5b;--accent-strong:#357a44;--accent-soft:#d8eede;--good:#2c7a52;--good-soft:#d7ecdf;--warn:#a15b12;--warn-soft:#f6e6d2;--bad:#a5342b;--bad-soft:#f5dcd9}
:root[data-theme="dark"]{--bg:#0a1710;--surface:#0f2117;--surface-2:#163021;--ink:#e9f4ec;--ink-soft:#b2ccb8;--muted:#7d977f;--border:#22402c;--accent:#4cbf6a;--accent-strong:#6ad684;--accent-soft:#103322;--good:#54b888;--good-soft:#123527;--warn:#d9a25a;--warn-soft:#3a2c15;--bad:#e07b6f;--bad-soft:#3a1c18}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;line-height:1.55;
  font-family:"Assistant","Heebo","Segoe UI","Arial Hebrew",system-ui,sans-serif;font-size:15px}
h1,h2,h3{margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;font-weight:700}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--border);
  border-radius:9px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
label{font-size:.82rem;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:4px}
a{color:var(--accent)}

/* header */
header.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);
  box-shadow:var(--shadow)}
.top-inner{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.12rem}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1.2rem}
.top-spacer{flex:1}
.year-pick{display:flex;align-items:center;gap:6px;background:var(--accent-soft);padding:5px 10px;border-radius:999px;font-weight:800;color:var(--accent-strong)}
.year-pick select{width:auto;background:transparent;border:0;font-weight:800;color:var(--accent-strong);padding:2px 4px}
.brand .logo img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.edu-pick{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);padding:3px;border-radius:999px}
.edu-pick button{background:transparent;color:var(--ink-soft);padding:5px 12px;border-radius:999px;font-size:.85rem;font-weight:800}
.edu-pick button.active{background:var(--accent);color:#fff}
.doc-row{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:7px 10px;flex-wrap:wrap}
.doc-row .lbl{display:flex;align-items:center;gap:8px;font-weight:600;flex:1;min-width:150px;cursor:pointer}
.doc-row .lbl input{width:auto;margin:0}
.doc-rows{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(max-width:640px){.doc-rows{grid-template-columns:1fr}}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--accent-strong)}
th.sortable .arr{font-size:.7rem;opacity:.7;margin-inline-start:3px}
.icon-btn{background:var(--surface-2);border:1px solid var(--border);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:1.05rem}

/* nav */
nav.tabs{max-width:1200px;margin:0 auto;padding:8px 16px 0;display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{background:transparent;color:var(--ink-soft);padding:9px 15px;border-radius:10px 10px 0 0;border:1px solid transparent;border-bottom:0;font-weight:700}
nav.tabs button.active{background:var(--surface);color:var(--accent-strong);border-color:var(--border);box-shadow:0 -2px 0 var(--accent) inset}
nav.tabs .count{background:var(--accent-soft);color:var(--accent-strong);border-radius:999px;padding:0 7px;font-size:.75rem;margin-inline-start:6px}

main{max-width:1200px;margin:0 auto;padding:18px 16px 80px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
.panel h2{font-size:1.15rem;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:.86rem;margin-bottom:14px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}

.btn{background:var(--accent);color:#fff;padding:9px 16px}
.btn:hover{background:var(--accent-strong)}
.btn.ghost{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent-strong)}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:#fff}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar .field{min-width:130px}
.toolbar .field.grow{flex:1;min-width:180px}
.toolbar .field label{margin-bottom:3px}

/* table */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:720px}
th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--surface-2);font-weight:800;color:var(--ink-soft);position:sticky;top:0}
tbody tr:hover{background:var(--surface-2)}
td.actions{white-space:nowrap}
.empty{padding:34px;text-align:center;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:800}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.dot-list{display:flex;gap:3px}
.doc-dot{width:16px;height:16px;border-radius:50%;font-size:10px;display:grid;place-items:center;font-weight:800}
.doc-dot.on{background:var(--good);color:#fff}
.doc-dot.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:linear-gradient(200deg,var(--surface-2),var(--surface));border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.stat .k{font-size:.78rem;color:var(--muted);font-weight:700}
.stat .v{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:.9rem;color:var(--muted);font-weight:700}
.stat.hero{background:radial-gradient(120% 140% at 88% -20%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 60%),linear-gradient(200deg,var(--surface-2),var(--surface))}

.bar{height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* עוגות (pie / donut) + מקרא */
.pie-block{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pie-svg{flex:0 0 auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.08))}
.pie-legend{flex:1 1 200px;min-width:180px;display:flex;flex-direction:column;gap:2px}
.pie-leg-row{display:flex;align-items:center;gap:9px;font-size:.9rem;padding:5px 2px;border-bottom:1px dashed var(--border)}
.pie-leg-row:last-child{border-bottom:0}
.pie-dot{width:13px;height:13px;border-radius:4px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.08) inset}
.pie-leg-label{font-weight:700;color:var(--ink-soft);flex:1;overflow:hidden;text-overflow:ellipsis}
.pie-leg-val{font-weight:800;white-space:nowrap}
.pie-leg-val small{color:var(--muted);font-weight:700;margin-inline-start:4px}
.pie-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.pie-card{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.pie-card h4{font-size:1rem;margin-bottom:10px;color:var(--accent-strong)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,18,22,.55);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:24px 14px;overflow:auto}
.overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);width:min(760px,100%);padding:20px 22px}
.modal h3{font-size:1.2rem;margin-bottom:14px}
.modal .foot{display:flex;gap:10px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
fieldset{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:0 0 12px}
legend{font-weight:800;color:var(--accent-strong);padding:0 6px;font-size:.9rem}
.check{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;cursor:pointer}
.check input{width:auto;margin:0}
.checks{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(max-width:640px){.checks{grid-template-columns:1fr}}
.hidden{display:none!important}
body.locked nav.tabs,body.locked .year-pick,body.locked #themeBtn,body.locked #lockBtn{display:none!important}
.login-card{max-width:420px;margin:6vh auto}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}
.note{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn);
  border-radius:10px;padding:9px 12px;font-size:.84rem;font-weight:600}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:12px;font-weight:700;box-shadow:var(--shadow);z-index:90;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(50%) translateY(-4px)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}

@media print{
  header.top,nav.tabs,.toolbar,.no-print{display:none!important}
  body{background:#fff}
  main{padding:0}
  .panel{box-shadow:none;border:0}
  th{position:static}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand" id="brandBox"><span class="logo">🎒</span> מערכת רישום וקליטת תלמידות</div>
    <div class="top-spacer"></div>
    <div class="edu-pick" id="eduPick"></div>
    <div class="year-pick">שנה: <select id="yearSelect"></select></div>
    <span id="syncStatus" style="display:none;font-size:.78rem;font-weight:800;white-space:nowrap;align-self:center"></span>
    <button class="icon-btn" id="lockBtn" title="נעילה" style="display:none">🔒</button>
    <button class="icon-btn" id="themeBtn" title="מצב תצוגה">🌓</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<div id="offlineBanner" style="display:none"></div>
<main id="view"></main>

<!-- modal host -->
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ============================================================
   מערכת רישום וקליטת תלמידות — גרסת דמו (עצמאית)
   הנתונים נשמרים במכשיר זה בלבד (localStorage) ואינם מסתנכרנים, וללא התחברות.
   הגרסה המלאה (ענן Firestore + התחברות) נמצאת ב-index.html.
   ============================================================ */
const CONFIG_READY = true;                 // דמו — אין צורך בהגדרת ענן
const APPS_SCRIPT_URL = "";                // דמו — גשר Drive מושבת
const DRIVE_READY = false;                 // דמו — חיבור דרייב מושבת
const LS_KEY = "rishum-ganim-demo";        // מפתח האחסון המקומי בדפדפן
const PERIODS = ["א","ב","ג","סופי"]; // מועדי רישום
const EDU_TYPES = ["רגיל",'ח"מ']; // סוג חינוך: רגיל / חינוך מיוחד
const DEFAULT_YEARS = ['תשפ"ה','תשפ"ו','תשפ"ז','תשפ"ח'];
const DEFAULT_STAFF_ROLES = ["גננת","סייעת","סייעת ב'","סייעת רפואית","סייעת רפואית משלימה","סייעת רפואית ממלאת מקום","סייעת צמודה","גננת משלימה","סייעת משלימה","העשרה","גננת שילוב","מנתחת התנהגות",'הכנה לכיתה א׳',"סייעת תגבור","פרא רפואי","גננת ממלאת מקום","סייעת ממלאת מקום"]; // תפקידי צוות (סעיף 2)
const DEFAULT_CHILD_AGES = ["2","3","4","5","6"]; // גיל ילדה בודדת (סעיף 6)
/* רשימות הניתנות לעריכה בהגדרות (מגובות ב-DB.settings); מסונכרנות ב-syncSettingsLists() */
let STAFF_ROLES = DEFAULT_STAFF_ROLES.slice();
let CHILD_AGES = DEFAULT_CHILD_AGES.slice();
let CAMPUSES = [];   // רשימת קמפוסים מוגדרת בהגדרות (מקור לבחירה בגנים)
const GAN_AGES = ["3","4","5","3/4","4/5"]; // גיל הגן — כולל גנים דו-גלאיים 3/4, 4/5 (סעיף 6)
const WEEK_DAYS = ["ראשון","שני","שלישי","רביעי","חמישי","שישי"]; // ימי שיבוץ למשלימה (סעיף 7)
/* תפקידי שיבוץ + שדות נוספים לכל תפקיד (סעיף 7):
   extra:"days" — בחירת ימים (משלימה) · extra:"duration" — שנה / מספר חודשים (ממלאת מקום) */
const ASSIGN_ROLES = [
  {role:"גננת"},
  {role:"סייעת"},
  {role:"סייעת ב'"},
  {role:"סייעת רפואית"},
  {role:"סייעת רפואית משלימה", extra:"days"},
  {role:"סייעת רפואית ממלאת מקום", extra:"duration"},
  {role:"סייעת צמודה"},
  {role:"גננת משלימה", extra:"days"},
  {role:"סייעת משלימה", extra:"days"},
  {role:"העשרה", extra:"days"},
  {role:"גננת שילוב", extra:"days"},
  {role:"מנתחת התנהגות", extra:"days"},
  {role:'הכנה לכיתה א׳', extra:"days"},
  {role:"סייעת תגבור", extra:"days"},
  {role:"פרא רפואי", extra:"days"},
  {role:"גננת ממלאת מקום", extra:"duration"},
  {role:"סייעת ממלאת מקום", extra:"duration"}
];
/* שדה "נוסף" לכל תפקיד לפי שם (ימים/תקופה) — לשמירה על המטא-דאטה גם כשהסדר נקבע בהגדרות */
const EXTRA_BY_ROLE = Object.fromEntries(ASSIGN_ROLES.map(m=>[m.role, m.extra||""]));
/* תפקידי השיבוץ לפי הסדר שנקבע בהגדרות (STAFF_ROLES) — כך שסדר ההגדרות = סדר השיבוץ.
   תפקידי שיבוץ מובנים שאינם ברשימת ההגדרות (למשל אחרי עדכון) מתווספים בסוף כדי שלא ייעלמו. */
function assignRoles(){
  const order=STAFF_ROLES.slice();
  ASSIGN_ROLES.forEach(m=>{ if(!order.includes(m.role)) order.push(m.role); });
  return order.map(role=>({ role, extra: EXTRA_BY_ROLE[role]||"" }));
}
const ASSISTANT_B_ROLE = "סייעת ב'";   // תפקיד שנפתח רק כשהגן הגיע לסף בנות (סעיף חדש 2)
const ASSISTANT_B_MIN  = 30;           // מספר בנות מינימלי בגן כדי לאפשר שיבוץ "סייעת ב'"
/* הקשרי שיבוץ — פעילות הגן / צהרונים / קייטנות (סעיף 8) */
const ASSIGN_CONTEXTS = [
  {id:"activity",     label:"פעילות הגן"},
  {id:"tzaharon",     label:"צהרונים"},
  {id:"campHanukkah", label:"קייטנת חנוכה"},
  {id:"campNisan",    label:"קייטנת ניסן"},
  {id:"campEndYear",  label:"קייטנת סוף שנה"}
];
/* תוכניות/מועדונים לרישום ילדה (סעיף 9) */
const PROGRAMS = [
  ["tzaharon","צהרון"],
  ["campHanukkah","קייטנת חנוכה"],
  ["campNisan","קייטנת ניסן"],
  ["campEndYear","קייטנת סוף שנה"]
];
/* מסמכי התלמידה — מפתח, כותרת (סעיפים 11–12) */
const STUDENT_DOCS = [
  ["nispach","נספח"],
  ["idCopy",'צילום תעודת זהות'],
  ["takanon","תקנון"]
];

/* סוגי סיוע/העשרה לילדה — מפתח, כותרת (סעיף 15) */
const SUPPORT_TYPES = [
  ["shiluv","שילוב"],
  ["salIshi","סל אישי"],
  ["behavior","מנתחת התנהגות"],
  ["prepA",'הכנה לכיתה א׳']
];
/* תפקידי שיבוץ שמשייכים ילדות לעובד/ת (סעיפים 15, 21) → מפתח הסיוע התואם */
const SUPPORT_ROLE_MAP = {
  "גננת שילוב":"shiluv",
  "סייעת רפואית":"salIshi",
  "סייעת רפואית משלימה":"salIshi",
  "סייעת רפואית ממלאת מקום":"salIshi",
  "מנתחת התנהגות":"behavior",
  "הכנה לכיתה א׳":"prepA",
  "הכנה לכיתה א'":"prepA"
};
function supportKeyForRole(role){ return SUPPORT_ROLE_MAP[role] || (role && role.indexOf("שילוב")>=0 ? "shiluv" : ""); }

/* ===== מטא-נתונים לתפקידי צוות: שיוך חינוך + צבע (סעיפים 4, 9) =====
   נשמר ב-DB.settings.roleMeta = { [role]: { edu:"both"|"רגיל"|'ח"מ', color:"#rrggbb" } } */
const ROLE_EDU_OPTS = [["both","רגיל + מיוחד"],["רגיל","חינוך רגיל"],['ח"מ',"חינוך מיוחד"]];

function hexToRgba(hex, a){ hex=String(hex||"").replace('#',''); if(hex.length===3) hex=hex.split('').map(x=>x+x).join(''); const n=parseInt(hex||"0",16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
function ganById(id){ return DB.gans.find(g=>g.id===id); }
function ganName(id){ const g=ganById(id); return g? (g.ganName || g.teacherName || ("גן "+ (g.ganSymbol||g.internalSymbol||""))) : "—"; }
/* שם איש/אשת צוות: משפחה + פרטי, עם נפילה לשם ישן (סעיף 1) */
function staffName(m){ if(!m) return ""; return [m.lastName,m.firstName].filter(Boolean).join(" ") || m.name || ""; }
function studentsOfYear(y=DB.activeYear){ return DB.students.filter(s=>s.year===y); }
function digits(s){ return String(s||"").replace(/\D/g,""); }
/* תיקון טלפון בייבוא: מספר נייד שאיבד את ה-0 המוביל (מתחיל ב-5) — מוסיפים 0 (סעיף 4) */
function fixPhone(v){ v=String(v||"").trim(); if(!v) return ""; const d=v.replace(/\D/g,""); if(d && d[0]==='5' && d.length===9) return "0"+d; return v; }
/* מפתח כתובת לזיהוי אחים/אחיות (רחוב+בניין+עיר) — סעיף 2 */
function addrKey(o){ return [o.street,o.building,o.city].map(x=>String(x||"").trim().toLowerCase()).join("|"); }
function nameKey(v){ return String(v||"").trim().toLowerCase(); }
/* איתור אחים/אחיות: אותו שם משפחה + אותה כתובת, בשנה הפעילה (סעיף 2) */
function findSiblings(ref){
  const ln=nameKey(ref.lastName), ak=addrKey(ref);
  if(!ln || !ak.replace(/\|/g,"")) return { list:[], missing:!ln||!ak.replace(/\|/g,"") };
  const list=studentsOfYear().filter(o=> o.id!==ref.id && nameKey(o.lastName)===ln && addrKey(o)===ak);
  return { list, missing:false };
}
function eduLabel(x){ return x && x.education ? x.education : "רגיל"; } // ברירת מחדל: חינוך רגיל
function eduBadge(x){ const e=eduLabel(x); return e==='ח"מ'?'<span class="pill warn">ח"מ</span>':'<span class="pill neutral">רגיל</span>'; }
/* איתור כפילות ת"ז באותה שנה — כולל בין סוגי חינוך שונים (מניעת רישום כפול). מחזיר את הרשומה הקיימת או null */
function tzClashInYear(tz, year, exceptId){
  const d=digits(tz); if(!d) return null;
  return DB.students.find(x=> x.id!==exceptId && x.year===year && digits(x.tz)===d) || null;
}
/* תיאור קצר של הרשומה הקיימת — שם · חינוך · גן */
function clashDesc(c){
  const eduTxt = eduLabel(c)==='ח"מ' ? 'חינוך מיוחד' : 'חינוך רגיל';
  const nm=[c.lastName,c.firstName].filter(Boolean).join(" ")||'ללא שם';
  return nm+' · '+eduTxt+(c.ganId?(' · '+ganName(c.ganId)):'');
}

/* ============================================================
   מעבר שנה — לוגיקת קידום (סעיף מעבר שנה)
   ============================================================ */
/* גיל של גן — תומך בגנים דו-גלאיים "3/4" / "4/5": האם הגן מכיל את הגיל הנתון */
function ganMatchesAge(gan, age){ return String(gan.age||"").split("/").map(x=>x.trim()).includes(String(age)); }
/* הגן המתקדם באותו קמפוס לגיל הנתון — רק אם יש בדיוק גן פעיל אחד מתאים (אחרת null → ללא גן) */
function nextGanInCampus(src, newAge){
  const srcGan=ganById(src.ganId);
  const campus=(src.campus || (srcGan&&srcGan.campus) || "");
  const edu=eduLabel(src);
  const cands=DB.gans.filter(g=> g.active!==false && (g.campus||"")===campus && eduLabel(g)===edu && ganMatchesAge(g,newAge));
  return cands.length===1 ? cands[0] : null;
}
/* השנה שאחרי (לפי סדר DB.years — סדר כרונולוגי של הוספה) */
function nextYearOf(y){ const i=DB.years.indexOf(y); return (i>=0 && i<DB.years.length-1) ? DB.years[i+1] : null; }

/* בניית רשומת התלמידה לשנת היעד לפי כללי המעבר.
   forceRetain=true → השארות: אותו גן, אותו גיל, בלי קידום.
   מחזיר null אם הילדה מסיימת (גן חובה / גיל 5+) ואינה בהשארות. */
function buildPromoted(src, toYear, forceRetain){
  const retain = forceRetain || !!src.retentionNext;
  const curAge = parseInt(src.age,10);
  if(!retain){
    // מסיימת: גיל 5+ (גן חובה) — לא עוברת
    if(!isNaN(curAge) && curAge>=5) return null;
  }
  const n=JSON.parse(JSON.stringify(src));
  n.id=uid(); n.year=toYear; n.createdAt=new Date().toISOString();
  n.period="א"; n.finished=false;
  n.placed=false;                 // לא מסומנת משובצת
  n.absorbedMunicipality=false;   // לא קלוט בעירייה (יעודכן בהמשך בעדכון קבוצתי)
  n.insurancePaid=false;          // ביטוח — מחדש כל שנה
  n.retentionNext=false;          // דגל ההשארות לא ממשיך אוטומטית הלאה
  // גן + גיל
  if(retain){
    n.ganId=src.ganId; n.age=src.age; n.campus=src.campus;
  } else if(!isNaN(curAge)){
    const newAge=curAge+1;
    const ng=nextGanInCampus(src,newAge);
    n.age=String(newAge);
    n.ganId = ng? ng.id : "";               // ללא גן אם אין התאמה יחידה (החלטה: להשאיר ללא גן)
    n.campus = ng? (ng.campus||"") : "";
  } else {
    n.ganId=""; n.campus="";                // אין גיל — עובר ללא גן
  }
  // מסמכים — רק צילום ת"ז (סימון + קובץ) עובר; נספח/תקנון מתאפסים
  const idFile = (src.docFiles && src.docFiles.idCopy) ? JSON.parse(JSON.stringify(src.docFiles.idCopy)) : null;
  n.docs={ nispach:false, idCopy: !!(src.docs&&src.docs.idCopy), takanon:false };
  n.docFiles = idFile ? { idCopy:idFile } : {};
  // תוכניות/מועדונים + תשלומי קייטנה — ריק
  n.programs={ tzaharon:false, campHanukkah:false, campNisan:false, campEndYear:false };
  n.programsPaid={ tzaharon:false, campHanukkah:false, campNisan:false, campEndYear:false };
  // סיוע והעשרה — ריק
  n.support={ shiluv:false, salIshi:false, behavior:false, prepA:false };
  // שונות: גרושים/חוץ/אחר — הסימון עובר; מסמכים וחתימות מחדש; השארות (של השנה) לא עוברת
  const sp=src.special||{};
  n.special={
    divorced: !!sp.divorced,
    approvalFather:false, approvalMother:false, idFather:false, idMother:false,
    approvalDoc:false, approvalFatherSig:false, approvalMotherSig:false,
    outOfCity: !!sp.outOfCity, paymentArrangement:false,
    retention:false, retentionDoc:false,
    other: !!sp.other, otherText: sp.other ? (sp.otherText||"") : ""
  };
  // דרייב — תיקייה חדשה לשנה החדשה (תיווצר עם הצורך)
  n.driveFolder=""; n.driveFolderId="";
  // הערות — נקי
  n.notes="";
  return n;
}
/* העברה מיידית של ילדה שסומנה "השארות לשנה הבאה" — לשנה הבאה, באותו גן, אם עוד לא קיימת שם.
   מחזיר {ok, year, reason}. אינו שומר — הקורא אחראי ל-save(). */
function ensureRetentionTransfer(src){
  const toYear=nextYearOf(src.year);
  if(!toYear) return { ok:false, reason:"אין שנה הבאה מוגדרת בהגדרות" };
  if(tzClashInYear(src.tz, toYear, null)) return { ok:false, reason:"כבר קיימת בשנה הבאה" };
  const n=buildPromoted(src, toYear, true);
  if(!n) return { ok:false, reason:"לא נוצרה רשומה" };
  DB.students.push(n);
  return { ok:true, year:toYear };
}

/* ---------- אייקון אפליקציה (PWA) שנוצר מהלוגו — סעיף "התקנה בטלפון" ---------- */
let _manifestUrl=null;
function iconFromEmoji(emoji,size){
  try{
    const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
    const g=(getComputedStyle(document.documentElement).getPropertyValue('--accent')||'').trim()||'#4a9d5b';
    const r=size*0.22;
    x.fillStyle=g; x.beginPath();
    x.moveTo(r,0); x.arcTo(size,0,size,size,r); x.arcTo(size,size,0,size,r); x.arcTo(0,size,0,0,r); x.arcTo(0,0,size,0,r); x.closePath(); x.fill();
    x.font=Math.floor(size*0.6)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
    x.textAlign='center'; x.textBaseline='middle';
    x.fillText(emoji||'🎒', size/2, size/2+size*0.03);
    return c.toDataURL('image/png');
  }catch(e){ return null; }
}
function updatePwaIcons(){
  try{
    const logo=appLogo(), isImg=/^(https?:|data:)/i.test(logo);
    const i512 = isImg? logo : iconFromEmoji(logo,512);
    const i192 = isImg? logo : iconFromEmoji(logo,192);
    if(!i192) return;
    const ai=$("#appleIcon"); if(ai) ai.href=i192;
    const fi=$("#faviconLink"); if(fi) fi.href=i192;
    const at=document.querySelector('meta[name="apple-mobile-web-app-title"]'); if(at) at.content=appTitle();
    const scope=location.pathname.replace(/[^/]*$/,'');
    const manifest={
      id:scope, name:appTitle(), short_name:(appTitle()||'רישום').slice(0,12),
      start_url:location.pathname+location.search, scope,
      display:'standalone', display_override:['standalone'], categories:['education','productivity'],
      background_color:'#eaf4ec', theme_color:'#4a9d5b', lang:'he', dir:'rtl',
      icons:[ {src:i192,sizes:'192x192',type:'image/png',purpose:'any maskable'},
              {src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'} ]
    };
    const ml=$("#manifestLink");
    if(ml){ if(_manifestUrl) try{ URL.revokeObjectURL(_manifestUrl); }catch(e){}
      _manifestUrl=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'}));
      ml.href=_manifestUrl; }
  }catch(e){ console.error(e); }
}

/* ---------- ניהול משתמשים דרך גשר ה-Apps Script ----------
   מאפשר למנהל ליצור/למחוק/לאפס-סיסמה/לרשום משתמשי התחברות מתוך ההגדרות.
   הוספת משתמש עובדת דרך מפתח ה-Web (בלי הגדרות נוספות); רשימה/מחיקה/איפוס
   דורשים הגדרת Service Account בגשר (ראה SETUP.md). ממיר שגיאות להודעות בעברית. */
async function adminUsersCall(op, payload){

  const action = { create:"userCreate", list:"userList", "delete":"userDelete", setPassword:"userSetPassword", setName:"userSetName" }[op];
  if(!action) throw new Error("bad-op");

}
function adminUsersErrHe(err){
  const raw=(err&&err.message)||String(err||"");
  if(/EMAIL_EXISTS|already.*exists/i.test(raw)) return "כתובת האימייל כבר קיימת במערכת.";
  if(/INVALID_EMAIL|no-email/i.test(raw)) return "כתובת אימייל לא תקינה.";
  if(/WEAK_PASSWORD|weak-password/i.test(raw)) return "הסיסמה חייבת להיות באורך 6 תווים לפחות.";
  if(/not-admin/i.test(raw)) return "רק מנהל מערכת יכול לנהל משתמשים.";
  if(/admin-check-failed/i.test(raw)) return "לא ניתן לאמת הרשאת מנהל כרגע — נסה/י שוב.";
  if(/no-sa|service-account/i.test(raw)) return "רשימה/מחיקה/איפוס סיסמה דורשים הגדרת Service Account בגשר (ראה SETUP.md). הוספת משתמש עובדת בכל מקרה.";
  if(/OPERATION_NOT_ALLOWED/i.test(raw)) return "התחברות אימייל/סיסמה אינה מופעלת בפרויקט Firebase.";
  if(/unauthorized|token/i.test(raw)) return "יש להתחבר מחדש למערכת.";
  if(/bridge-unavailable|drive-not-configured/i.test(raw)) return "גשר השרת (Apps Script) עדיין לא מוגדר — ראה SETUP.md.";
  if(/network/i.test(raw)) return "אין חיבור לשרת. נסה/י שוב.";
  return raw || "שגיאה בניהול המשתמשים.";
}

/* ============================================================
   חיבור Google Drive — דרך "גשר" (Google Apps Script) הרץ בחשבון הארגון.
   כל משתמש מחובר לתוכנה יכול ליצור תיקיות/להעלות/לצפות/להוריד — ללא חיבור Google אישי.
   ============================================================ */
async function driveIdToken(force){ if(!currentUser) throw new Error("not-logged-in"); return await currentUser.getIdToken(!!force); }
async function driveCall(action, payload){
  if(!DRIVE_READY) throw new Error("drive-not-configured");
  let force=false;
  for(let attempt=0; attempt<2; attempt++){
    const idToken=await driveIdToken(force);
    const json=JSON.stringify(Object.assign({action, idToken}, payload||{}));
    // Apps Script לעיתים משמיט את גוף בקשת ה-POST החוצה-מקור (בגלל הפניה פנימית),
    // ואז הטוקן לא מגיע. לכן בקשות קטנות נשלחות בשאילתת ה-URL ששורדת הפניות,
    // ורק העלאות גדולות (base64) נשלחות בגוף הבקשה.
    let url=APPS_SCRIPT_URL, opts;
    if(json.length < 6000){ url=APPS_SCRIPT_URL+"?data="+encodeURIComponent(json); opts={ method:"POST" }; }
    else { opts={ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: json }; }
    let r;
    try{ r=await fetch(url, opts); }
    catch(e){ throw new Error("network"); }
    let data; try{ data=await r.json(); }catch(e){ throw new Error("bad-response"); }
    if(data && data.ok===false){
      // טוקן פג תוקף / לא תקף — רענון כפוי של הטוקן וניסיון חוזר אחד (מונע "בעיית הרשאה")
      if((data.error==='unauthorized' || data.error==='token') && !force){ force=true; continue; }
      throw new Error(data.error||"drive-error");
    }
    if(!data) throw new Error("drive-error");
    return data;
  }
  throw new Error("drive-error");
}

async function driveEnsureChildFolder(student){
  if(student.driveFolderId) return student.driveFolderId; // תיקייה קיימת — לא ליצור מחדש (שומר על מבנה קודם)
  const nm=([student.lastName,student.firstName].filter(Boolean).join(" ")+(student.tz?(" · "+student.tz):"")) || ("ילדה "+student.id);
  const res=await driveCall("childFolder", { year:String(student.year), name:nm, edu:eduLabel(student) }); // חלוקה לפי חינוך (סעיף 12)

  DB.settings.drive=DB.settings.drive||{}; if(res.rootLink) DB.settings.drive.rootLink=res.rootLink;
  save();
  return res.folderId;
}

  DB.settings.drive=DB.settings.drive||{}; if(res.rootLink) DB.settings.drive.rootLink=res.rootLink;

function fileToB64(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>{ const s=String(r.result); resolve(s.slice(s.indexOf(",")+1)); }; r.onerror=()=>reject(new Error("read")); r.readAsDataURL(file); }); }
async function driveUploadFile(file, folderId){
  const dataB64=await fileToB64(file);
  return await driveCall("upload", { folderId, name:file.name, mimeType:file.type||"application/octet-stream", dataB64 });
}
/* העלאה עם שם קובץ קבוע (שומר על סיומת המקור) — סעיף 11 */
function fileExt(name){ const m=String(name||"").match(/\.[A-Za-z0-9]{1,8}$/); return m?m[0]:""; }
async function driveUploadNamed(file, folderId, baseName){
  const dataB64=await fileToB64(file);
  const name=String(baseName||"קובץ").replace(/[\/\\:*?"<>|]/g,"-") + fileExt(file.name);
  return await driveCall("upload", { folderId, name, mimeType:file.type||"application/octet-stream", dataB64 });
}
async function driveShare(email, role){ return await driveCall("share", { email, role:role||"reader" }); }
async function driveShareList(){ return await driveCall("shareList", {}); }
async function driveShareRemove(email){ return await driveCall("shareRemove", { email }); }
/* העתקת קובץ קיים לתיקייה אחרת (למשל צילום ת"ז לתיקיית השנה החדשה) — סעיף 5 */
async function driveCopyFile(fileId, folderId, name){ return await driveCall("copy", { fileId, folderId, name }); }
function b64ToBlobDownload(name, mimeType, b64){
  const bin=atob(b64||""); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  const blob=new Blob([arr],{type:mimeType||"application/octet-stream"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name||"file"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
async function downloadDriveFile(fileId, fallbackName){ try{ const res=await driveCall("download",{fileId}); b64ToBlobDownload(res.name||fallbackName, res.mimeType, res.dataB64); }catch(e){ toast(driveErrHe(e)); } }
function driveErrHe(e){
  const m=String((e&&e.message)||e||"");
  if(m.includes("not-logged-in")) return "יש להתחבר למערכת קודם";
  if(m.includes("drive-not-configured")) return "הגשר לדרייב לא הוגדר (ראה SETUP.md)";
  if(m.includes("network")||m.includes("bad-response")) return "לא הצלחתי להגיע לגשר הדרייב — בדוק/י את הכתובת/החיבור";
  if(m.includes("unauthorized")||m.includes("token")) return "בעיית הרשאה — התחבר/י מחדש למערכת";
  return "שגיאת דרייב — נסה/י שוב";
}

  { key:"retentionNext",      label:"השארות לשנה הבאה (מעביר אוטומטית)", set:(s,v)=>{ s.retentionNext=v; }, retention:true }
];
/* החלת עדכון קבוצתי על התלמידות המסומנות */
function applyBulk(fieldKey, val){
  const f=BULK_FIELDS.find(x=>x.key===fieldKey); if(!f){ toast("בחר/י שדה"); return; }
  const ids=[...bulkSel]; if(!ids.length){ toast("לא סומנו תלמידות"); return; }
  let n=0, transferred=0, failed=0;
  ids.forEach(id=>{ const s=DB.students.find(x=>x.id===id); if(!s) return;
    const before = f.retention ? !!s.retentionNext : null;
    f.set(s, val); n++;
    if(f.retention && val && !before){ const r=ensureRetentionTransfer(s); r.ok?transferred++:failed++; }
  });
  save(); bulkSel.clear(); renderStuTable();
  toast(`עודכנו ${n} תלמידות · ${f.label}: ${val?'כן':'לא'}${transferred?` · ${transferred} הועברו להשארות`:''}${failed?` · ${failed} לא הועברו`:''}`);
}

/* אוכלוסיית הבסיס לסיכום: כל הסינונים למעט "קלוט" (muni) — כי הוא-הוא המדד המוצג בפס הסיכום */
function studentsScopeBase(){
  const f=stuFilter, q=f.q.trim().toLowerCase();
  const eduFilter = activeEdu || f.edu;
  return studentsOfYear().filter(s=>{
    if(f.status==='active' && s.finished) return false;
    if(f.status==='finished' && !s.finished) return false;
    if(q){ const hay=(s.firstName+" "+s.lastName+" "+s.tz).toLowerCase(); if(!hay.includes(q)) return false; }
    if(f.gan==='__none__'){ if(s.ganId) return false; }   // ללא גן — ילדות שהוצאו מהגן (ganId ריק)
    else if(f.gan && s.ganId!==f.gan) return false;
    if(f.age && f.age.length && !f.age.includes(String(s.age))) return false;
    if(f.city && s.city!==f.city) return false;
    if(f.campus && s.campus!==f.campus) return false;
    if(f.period && s.period!==f.period) return false;
    if(eduFilter && eduLabel(s)!==eduFilter) return false;
    return true;
  });
}
function filteredStudents(){
  const f=stuFilter;
  let list=studentsScopeBase();
  if(f.muni==='yes') list=list.filter(s=>s.absorbedMunicipality);
  if(f.muni==='no')  list=list.filter(s=>!s.absorbedMunicipality);
  if(f.flag && STU_FLAGS[f.flag]) list=list.filter(STU_FLAGS[f.flag].test);
  if(f.placed==='yes') list=list.filter(s=>s.placed!==false);
  if(f.placed==='no')  list=list.filter(s=>s.placed===false);
  return sortStudents(list);
}
function sortStudents(list){
  const k=stuSort.key, d=stuSort.dir;
  const cmpTxt=(a,b)=>String(a||"").localeCompare(String(b||""),"he");
  const cmpNum=(a,b)=>(+a||0)-(+b||0);
  const val={
    name:s=>[s.lastName,s.firstName].filter(Boolean).join(" "),
    tz:s=>s.tz, gan:s=>ganName(s.ganId), age:s=>s.age, city:s=>s.city,
    period:s=>PERIODS.indexOf(s.period), edu:s=>eduLabel(s)
  };
  const getter=val[k]||val.name;
  const numeric = (k==='age'||k==='period');
  return list.slice().sort((a,b)=>{ const r= numeric?cmpNum(getter(a),getter(b)):cmpTxt(getter(a),getter(b)); return r*d || cmpTxt(val.name(a),val.name(b)); });
}

function docDots(s){
  const d=s.docs;
  const mk=(on,t)=>`<span class="doc-dot ${on?'on':'off'}" title="${t}">${on?'✓':'·'}</span>`;
  return `<span class="dot-list">${mk(d.nispach,'נספח')}${mk(d.idCopy,'צילום ת"ז')}${mk(d.takanon,'תקנון')}</span>`;
}
function specialBadges(s){
  const b=[]; const sp=s.special||{};
  if(sp.divorced) b.push('<span class="pill warn">גרושים</span>');
  if(sp.outOfCity) b.push('<span class="pill warn">ילדת חוץ</span>');
  if(sp.retention) b.push('<span class="pill warn">השארות</span>');
  if(sp.other) b.push('<span class="pill warn">'+(sp.otherText?esc(sp.otherText):'אחר')+'</span>');
  const sup=s.support||{}; // תגי סיוע (סעיף 15)
  SUPPORT_TYPES.forEach(([k,lbl])=>{ if(sup[k]) b.push(`<span class="pill" style="background:var(--accent-soft);color:var(--accent-strong)">${esc(lbl)}</span>`); });
  return b.join(" ");
}
function programBadges(s){
  const p=s.programs||{}; const b=[];
  PROGRAMS.forEach(([k,lbl])=>{ if(p[k]) b.push(`<span class="pill ok" style="background:var(--accent-soft);color:var(--accent-strong)">${esc(lbl)}</span>`); });
  return b.join(" ");
}

/* פס סיכום חכם מעל הטבלה — מתעדכן לפי הסינון (כולל הגן הנבחר), ומתעלם מסינון "קלוט"
   כדי להראות תמיד את הפילוח המלא. צבעים: לא-קלוט אדום כשיש כאלה (ירוק כשאין),
   ורשומות אדום כשעוברים את קיבולת הגן הנבחר (כמו בטאב הגנים). */
function renderStuSummary(){
  const el=$("#stuSummary"); if(!el) return;
  const base=studentsScopeBase();
  const total=base.length;
  const absorbed=base.filter(s=>s.absorbedMunicipality).length;
  const notAbsorbed=total-absorbed;
  const placed=base.filter(s=>s.placed!==false).length;   // משובצות סופית
  const waiting=total-placed;                              // ממתינות לשיבוץ
  const g=stuFilter.gan && DB.gans.find(x=>x.id===stuFilter.gan);
  const capTxt = g && g.capacity ? ` <small>/ ${esc(g.capacity)}</small>` : "";
  const regColor = (g && g.capacity) ? (total>+g.capacity?'var(--bad)':'var(--good)') : "";
  const tile=(k,v,color,title)=>`<div class="stat"${title?` title="${esc(title)}"`:''}><div class="k">${k}</div><div class="v"${color?` style="color:${color}"`:''}>${v}</div></div>`;
  // משבצת מותנית: רק כשמסננים לפי מאפיין (השארות/צהרון/קייטנה) מוצג הסיכום שלו
  const fd=stuFilter.flag && STU_FLAGS[stuFilter.flag];
  const flagTile = fd ? tile(fd.label, base.filter(fd.test).length, 'var(--accent-strong)') : "";
  el.innerHTML=`<div class="stats">
    ${tile("רשומות"+(g?" בגן":""), total+capTxt, regColor)}
    ${tile("משובצות", placed, "var(--good)", "שיבוץ סופי בגן")}
    ${tile("ממתינות לשיבוץ", waiting, waiting>0?'var(--warn)':'var(--good)', "רשומות לגן אך טרם שובצו סופית")}
    ${tile("קלוט בעירייה", absorbed, absorbed===total&&total?'var(--good)':'')}
    ${tile("לא קלוט", notAbsorbed, notAbsorbed>0?'var(--bad)':'var(--good)')}
    ${flagTile}
  </div>`;
}
function renderBulkBar(list){
  const bar=$("#bulkBar"); if(!bar) return;
  if(!bulkMode){ bar.innerHTML=""; return; }
  bar.innerHTML=`<div class="panel" style="padding:12px;margin:4px 0 12px;background:var(--surface-2)">
    <div class="row" style="gap:10px;align-items:end;flex-wrap:wrap">
      <div class="field"><label>שדה לעדכון</label><select id="bulk-field">${BULK_FIELDS.map(f=>`<option value="${f.key}" ${bulkField===f.key?'selected':''}>${esc(f.label)}</option>`).join("")}</select></div>
      <button class="btn" id="bulk-yes">✔️ סמן כן (${bulkSel.size})</button>
      <button class="btn ghost" id="bulk-no">✖️ סמן לא (${bulkSel.size})</button>
      <button class="btn ghost" id="bulk-selall">בחר/י הכל (${list.length})</button>
      <button class="btn ghost" id="bulk-clear">נקה בחירה</button>
    </div>
    <div class="hint" style="margin-top:6px">סמן/י ילדות בעמודה השמאלית, בחר/י שדה וערך, ולחצ/י "סמן כן/לא". הבחירה חלה על השנה והסינון הנוכחיים.</div>
  </div>`;
  $("#bulk-field").onchange=e=>{ bulkField=e.target.value; };
  $("#bulk-yes").onclick=()=> applyBulk($("#bulk-field").value, true);
  $("#bulk-no").onclick =()=> applyBulk($("#bulk-field").value, false);
  $("#bulk-clear").onclick=()=>{ bulkSel.clear(); renderStuTable(); };
  $("#bulk-selall").onclick=()=>{ const all=list.every(s=>bulkSel.has(s.id)); if(all) list.forEach(s=>bulkSel.delete(s.id)); else list.forEach(s=>bulkSel.add(s.id)); renderStuTable(); };
}

    ${th("name",'שם מלא')}${th("tz",'ת"ז')}${th("gan",'גן')}<th title="שיבוץ סופי בגן — לחיצה משנה בין 'משובצת' ל'ממתינה'">שיבוץ</th>${th("age",'גיל')}${th("city",'עיר')}${th("period",'מועד')}${th("edu",'חינוך')}

      <td class="actions">

      </td></tr>`).join("")}
  </tbody></table></div>
  <div class="hint">מוצגות ${list.length} תלמידות (${esc(statusLbl)}).</div>`;
  host.querySelectorAll("[data-edit]").forEach(b=> b.onclick=()=>{ const s=DB.students.find(x=>x.id===b.dataset.edit); openStudent(JSON.parse(JSON.stringify(s))); });
  /* החלפת סטטוס שיבוץ בלחיצה אחת מהרשימה (משובצת ⇄ ממתינה) */
  host.querySelectorAll(".stu-place").forEach(b=> b.onclick=()=>{ const st=DB.students.find(x=>x.id===b.dataset.id); if(!st) return; st.placed = (st.placed===false); save(); renderStuTable(); toast(st.placed?"סומן: משובצת":"סומן: ממתינה לשיבוץ"); });
  host.querySelectorAll("[data-sort]").forEach(t=> t.onclick=()=>{ const k=t.dataset.sort; if(stuSort.key===k) stuSort.dir*=-1; else { stuSort.key=k; stuSort.dir=1; } renderStuTable(); });
  /* עדכון קבוצתי — סימון שורות + בחירת הכל */
  host.querySelectorAll(".bulk-cb").forEach(cb=> cb.onchange=()=>{ cb.checked?bulkSel.add(cb.dataset.id):bulkSel.delete(cb.dataset.id); renderStuTable(); });
  const bAll=$("#bulk-all"); if(bAll) bAll.onchange=()=>{ if(bAll.checked) list.forEach(s=>bulkSel.add(s.id)); else list.forEach(s=>bulkSel.delete(s.id)); renderStuTable(); };
}

    <div class="doc-rows" id="support-rows"></div>
  </fieldset>
  <fieldset><legend>שונות</legend>

        <div class="hint">מבנה: שנה / שם משפחה שם · ת"ז · <button class="btn ghost sm" id="copyFolder" type="button">העתק שם</button></div></div>
    </div>
    <div id="s-drive-actions" style="margin-top:10px"></div>
  </fieldset>
  <fieldset><legend>הערות וסיום</legend>
    <div><label>הערות</label><textarea id="s-notes" rows="2">${esc(s.notes)}</textarea></div>
    <label class="check" style="margin-top:10px;background:var(--warn-soft);border-color:var(--warn)"><input type="checkbox" id="s-finished" ${s.finished?'checked':''}> ✔️ סיימה עם הגן (בסימון זה יוצאת מהרשימה)</label>

    <button class="btn ghost" id="cancelStu">ביטול</button>
  </div>`);

  /* צירוף קבצים פיזיים לתיקיית הדרייב, עם שם אוטומטי: סוג · שם הילדה · ת"ז (סעיפים 11–12) */
  function docFileBaseName(label){
    const nm=[s.lastName,s.firstName].filter(Boolean).join(" ")||"ללא שם";
    return `${label} · ${nm}${s.tz?(" · "+s.tz):""}`;
  }
  const SPECIAL_DOC_KEYS=["approvalFather","approvalMother","paymentArrangement","retentionDoc","other","idFather","idMother","approvalDoc"];
  const SUPPORT_DOC_KEYS=SUPPORT_TYPES.map(t=>t[0]);
  async function uploadDocFile(file, key, label){
    persistCurrent(); await driveEnsureChildFolder(s);
    const res=await driveUploadNamed(file, s.driveFolderId, docFileBaseName(label));
    s.docFiles=s.docFiles||{}; s.docFiles[key]={ id:res.fileId||res.id||"", name:res.name||file.name, link:res.link||res.webViewLink||"" };
    if(["nispach","idCopy","takanon"].includes(key)) s.docs[key]=true;
    if(SPECIAL_DOC_KEYS.includes(key)){ s.special=s.special||{}; s.special[key]=true; }
    if(SUPPORT_DOC_KEYS.includes(key)){ s.support=s.support||{}; s.support[key]=true; }
  }
  function docAttachHtml(key,label){
    const f=(s.docFiles||{})[key];
    const attached = f? `<a class="btn ghost sm" href="${esc(f.link||'#')}" target="_blank" title="פתח קובץ">📄 ${esc(f.name||'קובץ')}</a>` : "";
    const btn = DRIVE_READY? `<label class="btn ghost sm" style="display:inline-flex;align-items:center;gap:4px" title="צרף קובץ">📎<input type="file" class="doc-file" data-k="${esc(key)}" data-label="${esc(label)}" hidden></label>` : "";
    return attached+btn;
  }
  function wireDocFiles(host, after){
    host.querySelectorAll(".doc-file").forEach(inp=> inp.onchange=async ()=>{
      const file=inp.files[0]; if(!file) return;
      try{
        toast("מעלה מסמך…");
        await uploadDocFile(file, inp.dataset.k, inp.dataset.label||inp.dataset.k);
        if(after) after();      // רינדור מחדש כדי שה-DOM ישקף את הסימון/הקישור החדשים
        persistCurrent(); save(); // ואז שמירה (collect קורא מה-DOM המעודכן)
        toast("המסמך צורף ✓");
      }catch(e){ console.error(e); toast(driveErrHe(e)); }
      inp.value="";
    });
  }
  function renderDocRows(){
    const host=$("#doc-rows"); if(!host) return;
    host.innerHTML = STUDENT_DOCS.map(([k,lbl])=>`
      <div class="doc-row">
        <label class="lbl"><input type="checkbox" class="d-chk" data-k="${k}" ${(s.docs&&s.docs[k])?'checked':''}> ${esc(lbl)}</label>
        ${docAttachHtml(k,lbl)}
      </div>`).join("");
    host.querySelectorAll(".d-chk").forEach(cb=> cb.onchange=()=>{ s.docs[cb.dataset.k]=cb.checked; });
    wireDocFiles(host, renderDocRows);
  }
  renderDocRows();

  /* שונות — כל אפשרות משנית נפתחת מיד מתחת לסימון שלה, עם צירוף מסמך (סעיפי התיקון) */
  function syncSpecial(){
    const set=(id,key)=>{ const el=$("#"+id); if(el) s.special[key]=el.checked; };
    set("sp-divorced","divorced"); set("sp-outOfCity","outOfCity"); set("sp-retention","retention"); set("sp-other","other");
    set("sp-idFather","idFather"); set("sp-idMother","idMother"); set("sp-approvalDoc","approvalDoc");
    set("sp-approvalFatherSig","approvalFatherSig"); set("sp-approvalMotherSig","approvalMotherSig");
    set("sp-paymentArrangement","paymentArrangement"); set("sp-retentionDoc","retentionDoc");
    const ot=$("#sp-otherText"); if(ot) s.special.otherText=ot.value;
  }
  function renderSpecialBlocks(){
    const host=$("#special-blocks"); if(!host) return;
    const sp=s.special;

const IMPORT_HEADER_MAP = {

function normHeader(h){ return String(h||"").replace(/["'.׳״]/g,"").replace(/\s+/g,"").trim(); }
function truthyCell(v){ return /^(כן|yes|true|1|✓|v|קלוט|נרשמה|כ)$/i.test(String(v??"").trim()); }
function normEduVal(v){ const t=String(v??"").replace(/\s/g,""); if(!t) return "רגיל"; return /(מיוחד|חינוךמיוחד|ח"?מ|חמ|special)/i.test(t)?'ח"מ':"רגיל"; }
function normPeriodVal(v){ const t=String(v??"").trim(); return PERIODS.includes(t)?t:"א"; }
function normDateVal(v){
  let t=String(v??"").trim(); if(!t) return "";
  t=t.replace(/[T ]\d{1,2}:\d{2}(:\d{2})?.*$/,"").trim(); // הסרת חלק שעה (למשל "01/09/2021 00:00")
  // מספר סידורי של אקסל (ימים מ-1899-12-30) — מתקבל כשתא התאריך היה מעוצב כמספר
  if(/^\d{4,6}(\.\d+)?$/.test(t)){
    const serial=parseInt(t,10);
    if(serial>=3653 && serial<=60000){ // ~1910..2064 — טווח סביר לתאריך לידה
      const d=new Date(Math.round((serial-25569)*86400000)); // 25569 = ימים בין 1899-12-30 ל-1970-01-01
      if(!isNaN(d)) return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
    }
  }
  let m=t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/); // dd/mm/yyyy (פורמט ישראלי)
  if(m){ let d=m[1],mo=m[2],y=m[3]; if(y.length===2)y="20"+y; return `${y.padStart(4,"0")}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`; }
  m=t.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/); // yyyy-mm-dd
  if(m){ return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`; }
  return t;
}
/* בדיקת תקינות פורמט ISO של תאריך (YYYY-MM-DD) — לשימוש בטופס ובתיקון */
function isISODate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s||"")); }
/* עיצוב תאריך לתצוגה/ייצוא: מנרמל (כולל מספר סידורי של אקסל) ומציג כ-DD/MM/YYYY.
   ריק נשאר ריק; ערך שלא זוהה כתאריך מוחזר כפי שהוא. */
function fmtDate(v){ const iso=normDateVal(v); const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso); return m?`${m[3]}/${m[2]}/${m[1]}`:String(v??""); }
/* תיקון תאריכי לידה שיובאו — נרמול מחדש של הערכים הקיימים בכל התלמידות,
   ללא צורך לייבא מחדש (כל עוד הערך הגולמי נשמר בשדה). */
function fixImportedDobs(){
  let changed=0, stillBad=0, empty=0, ok=0;
  DB.students.forEach(s=>{
    const before=String(s.dob||"");
    if(!before){ empty++; return; }
    const after=normDateVal(before);
    if(after!==before) s.dob=after;
    if(isISODate(s.dob)){ ok++; if(after!==before) changed++; } else stillBad++;
  });
  if(changed) save();
  modal(`<h3>תיקון תאריכי לידה</h3>
    <div class="note">
      תוקנו <b>${changed}</b> תאריכים לפורמט תקין.<br>
      סה"כ ${ok} תלמידות עם תאריך לידה תקין.<br>

/* זיהוי סימונים מתוך טקסט ההערות: "תושב/ת חוץ" → מחוץ לעיר · "השארות" → השארות */
function flagsFromNotes(notes){
  const n=String(notes||"").replace(/[\/\\]/g," ");
  return {
    outOfCity: /חוץ/.test(n) && /(תושב|ילד|מחוץ)/.test(n),
    retention: /השאר/.test(n)
  };
}
/* החלה רטרואקטיבית על תלמידות קיימות — עדכון הסימונים לפי ההערות (בלי לייבא מחדש) */
function applyNoteFlags(){
  let oc=0, rt=0;
  DB.students.forEach(s=>{
    s.special = s.special || {};
    const fl=flagsFromNotes(s.notes);
    if(fl.outOfCity && !s.special.outOfCity){ s.special.outOfCity=true; oc++; }
    if(fl.retention && !s.special.retention){ s.special.retention=true; rt++; }
  });
  if(oc||rt) save();
  modal(`<h3>עדכון סימונים מההערות</h3>
    <div class="note">
      סומנו <b>${oc}</b> תלמידות כ"מחוץ לעיר" (תושב/ת חוץ).<br>
      סומנו <b>${rt}</b> תלמידות כ"השארות".<br>
      ${(oc||rt)?'הסימונים עודכנו ונשמרו.':'לא נמצאו הערות חדשות לסימון.'}
    </div>
    <div class="foot"><button class="btn" id="nf-ok">סגור</button></div>`);
  $("#nf-ok").onclick=closeModal;
}
/* פענוח CSV/הדבקה — תומך בפסיקים או טאבים, מרכאות, ותאים רב-שורתיים */
function parseTable(text){
  text=String(text||"").replace(/^﻿/,"");
  const firstLine=text.split(/\r?\n/)[0]||"";
  // זיהוי מפריד: טאב / נקודה-פסיק / פסיק — לפי מה שמפצל להכי הרבה עמודות (אקסל בעברית שומר לרוב עם ; )
  const cand=[["\t",firstLine.split("\t").length],[";",firstLine.split(";").length],[",",firstLine.split(",").length]];
  const delim=cand.reduce((a,b)=> b[1]>a[1] ? b : a)[0];
  const rows=[]; let row=[], cur="", inq=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(inq){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inq=false; } else cur+=ch; }
    else { if(ch==='"' && cur===""){ inq=true; } /* מרכאה נחשבת ציטוט רק בתחילת תא */
      else if(ch===delim){ row.push(cur); cur=""; }
      else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(ch==='\r'){ /* מטופל ע"י \n */ }
      else cur+=ch; }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
/* פירוק שם למילים (מתעלם מפיסוק/מרכאות/מקפים) */
function nameTokens(s){ return String(s||"").replace(/["'.,\-–־׳״]/g," ").split(/\s+/).map(w=>w.trim()).filter(Boolean); }
/* השוואת שמות ללא תלות בסדר המילים: "מצגר רחל" == "רחל מצגר".
   דורש לפחות שתי מילים והתאמה מלאה של קבוצת המילים (למניעת התאמות שגויות). */
function sameNameUnordered(a,b){
  const ta=nameTokens(a), tb=nameTokens(b);
  if(ta.length<2 || tb.length!==ta.length) return false;
  const sa=ta.slice().sort((x,y)=>x.localeCompare(y,"he"));
  const sb=tb.slice().sort((x,y)=>x.localeCompare(y,"he"));
  return sa.every((w,i)=>w===sb[i]);
}
/* התאמת שם/סמל גן מהקובץ לגן קיים במערכת */
function matchGanText(text){
  const t=String(text||"").trim(); if(!t) return "";
  const nz=x=>String(x||"").trim();
  const g = DB.gans.find(g=>nz(g.teacherName)===t)
        || DB.gans.find(g=>nz(g.ganSymbol)===t)
        || DB.gans.find(g=>nz(g.internalSymbol)===t)
        || DB.gans.find(g=>nz(g.teacherName) && (t.includes(nz(g.teacherName)) || nz(g.teacherName).includes(t)))
        || DB.gans.find(g=>nz(g.teacherName) && sameNameUnordered(g.teacherName, t)); // שם גננת בסדר מילים הפוך
  return g? g.id : "";
}
/* בניית רשומות מהטבלה שנקראה */
function buildImportRows(rows, opts){
  if(!rows.length) return { list:[], mapped:[] };
  const header=rows[0].map(normHeader);
  const idx={}; header.forEach((h,i)=>{ const k=IMPORT_HEADER_MAP[h]; if(k && idx[k]==null) idx[k]=i; });
  const mapped=Object.keys(idx); // אילו שדות זוהו
  const existing=new Set(studentsOfYear().map(s=>digits(s.tz)).filter(Boolean));
  const seen=new Set();
  const list=[];
  for(let r=1;r<rows.length;r++){
    const cells=rows[r];
    const g=key=> idx[key]!=null ? String(cells[idx[key]]??"").trim() : "";
    const st=makeStudent();
    st.lastName=g("lastName"); st.firstName=g("firstName"); st.tz=digits(g("tz"));
    st.dob=normDateVal(g("dob")); st.motherName=g("motherName"); st.fatherName=g("fatherName");
    st.phone=fixPhone(g("phone")); st.mobile=fixPhone(g("mobile")); // תיקון 0 מוביל בנייד (סעיף 4)
    st.street=g("street"); st.building=g("building"); st.city=g("city"); st.campus=g("campus");
    st.age=g("age").replace(/[^\d]/g,""); st.period=normPeriodVal(g("period")); st.education=normEduVal(g("education"));
    st.notes=g("notes");
    const fl=flagsFromNotes(st.notes); if(fl.outOfCity) st.special.outOfCity=true; if(fl.retention) st.special.retention=true; // זיהוי "תושב/ת חוץ" / "השארות" מההערות
    const ganText=g("gan"); st.ganId=matchGanText(ganText);
    if(st.ganId && ganCampus(st.ganId)) st.campus=ganCampus(st.ganId);   // קמפוס נגזר מהגן המשובץ
    st.absorbedMunicipality = idx.absorbed!=null ? truthyCell(g("absorbed")) : !!opts.absorbed;
    st.registeredByUs        = idx.regByUs!=null ? truthyCell(g("regByUs"))  : !!opts.reg;
    if(opts.tzaharon){ st.programs=st.programs||{}; st.programs.tzaharon=true; } // רישום אוטומטי לצהרון (סעיף 11)
    if(!st.firstName && !st.lastName && !st.tz) continue; // שורה ריקה
    const fileDup = st.tz && seen.has(st.tz);   // ת"ז כפולה בתוך הקובץ עצמו (סעיף 5)
    const dup     = st.tz && existing.has(st.tz); // ת"ז שכבר קיימת במערכת
    if(st.tz) seen.add(st.tz);
    list.push({ st, ganText, ganMatched:!!st.ganId, dup, fileDup });
  }
  return { list, mapped };
}
function importTemplateCSV(){

/* זיהוי קבוצת הייבוא האחרונה — תלמידות השנה הפעילה שנוצרו בסמיכות זמן ליצירה האחרונה
   (בייבוא מרוכז כל השורות מקבלות createdAt כמעט זהה, ולכן אפשר לזהות ולבטל את הייבוא) */
function lastImportBatch(){
  const ys=studentsOfYear().filter(s=>s.createdAt && !isNaN(Date.parse(s.createdAt)));
  if(!ys.length) return [];
  const maxT=Math.max(...ys.map(s=>Date.parse(s.createdAt)));
  const WINDOW=5*60*1000; // חלון של 5 דקות אחורה מהיצירה האחרונה
  return ys.filter(s=> maxT-Date.parse(s.createdAt) <= WINDOW)
           .sort((a,b)=>Date.parse(a.createdAt)-Date.parse(b.createdAt));
}
/* ביטול הייבוא האחרון — הצגת התלמידות שייווצרו לאחרונה ומחיקתן לאחר אישור */

let ganFilter = { q:"", zone:"", status:"" };
let ganSort = { key:"name", dir:1 }; // מיון רשימת הגנים לפי עמודה
const GAN_SORT_VAL = {
  name:g=>ganName(g.id), internalSymbol:g=>g.internalSymbol, ganSymbol:g=>g.ganSymbol,
  age:g=>g.age, teacherName:g=>g.teacherName,
  address:g=>[g.address,g.building].filter(Boolean).join(" "), zone:g=>g.zone,
  capacity:g=>+g.capacity||0, reg:g=>studentsOfYear().filter(s=>s.ganId===g.id && !s.finished).length
};
function sortGans(list){
  const k=ganSort.key, d=ganSort.dir, v=GAN_SORT_VAL[k]||GAN_SORT_VAL.name;
  const numeric = k==='capacity' || k==='reg';
  return list.sort((a,b)=> numeric ? ((+v(a)||0)-(+v(b)||0))*d : String(v(a)||"").localeCompare(String(v(b)||""),"he")*d );
}
function gansScoped(){
  return sortGans(eduScope(DB.gans.slice()).filter(g=>{
    const q=ganFilter.q.trim().toLowerCase();
    if(q){ const hay=(g.ganName+" "+g.teacherName+" "+g.ganSymbol+" "+g.internalSymbol+" "+g.address+" "+g.zone).toLowerCase(); if(!hay.includes(q)) return false; }
    if(ganFilter.zone && g.zone!==ganFilter.zone) return false;
    if(ganFilter.status==='active' && !g.active) return false;
    if(ganFilter.status==='off' && g.active) return false;
    return true;
  }));
}

/* ====== ייבוא מרוכז של גנים ======
   קורא CSV/הדבקה עם אותה תשתית קריאה חסינת מפריד+קידוד של ייבוא התלמידות
   (readFileSmart + parseTable), כך שקבצי אקסל בעברית (מפריד ; / קידוד Windows-1255)
   נקראים כראוי ולא נופלים על "לא זוהתה אף עמודה". */
const GAN_HEADER_MAP = {
  "שםהגן":"ganName","גן":"ganName","שם":"ganName","שםגן":"ganName",
  "סמלפנימי":"internalSymbol","פנימי":"internalSymbol","סמלמוסד":"internalSymbol",
  "סמלהגן":"ganSymbol","סמלגן":"ganSymbol","סמל":"ganSymbol","סמלמשרד":"ganSymbol",
  "שםהגננת":"teacherName","גננת":"teacherName","שםגננת":"teacherName","מורה":"teacherName",
  "גיל":"age","קבוצתגיל":"age",
  "חינוך":"education","סוגחינוך":"education",
  "קמפוס":"campus","קמפוסגנים":"campus",
  "כתובת":"address","כתובתהגן":"address",
  "רחוב":"street",
  "מספר":"building","בניין":"building","מספרבית":"building","בית":"building","מספרבניין":"building",
  "אזור":"zone","אזורבעיר":"zone","איזור":"zone",
  "טלפון":"phoneGan","טלפוןבגן":"phoneGan","טלגן":"phoneGan","טלפוןגן":"phoneGan","טל":"phoneGan",
  "טלפוןבית":"phoneHome","טלבית":"phoneHome",
  "ניידגננת":"teacherMobile","פלאפוןגננת":"teacherMobile","סלולריגננת":"teacherMobile",
  "שםסייעת":"assistantName","סייעת":"assistantName",
  "ניידסייעת":"assistantMobile","פלאפוןסייעת":"assistantMobile",
  "קיבולת":"capacity","מקומות":"capacity","מספרמקומות":"capacity","תקן":"capacity",
  "פעיל":"active","סטטוס":"active",
  "מסמכים":"docsNote","הערות":"docsNote","הערה":"docsNote"
};
function ganExists(gn){
  return DB.gans.some(x=>
    (gn.ganSymbol && String(x.ganSymbol||"").trim()===gn.ganSymbol) ||
    (gn.internalSymbol && String(x.internalSymbol||"").trim()===gn.internalSymbol) ||
    (gn.ganName && String(x.ganName||"").trim()===gn.ganName));
}
function buildGanImportRows(rows){
  if(!rows.length) return { list:[], mapped:[] };
  const header=rows[0].map(normHeader);
  const idx={}; header.forEach((h,i)=>{ const k=GAN_HEADER_MAP[h]; if(k && idx[k]==null) idx[k]=i; });
  const mapped=Object.keys(idx);
  const seen=new Set(); const list=[];
  for(let r=1;r<rows.length;r++){
    const cells=rows[r]; const g=key=> idx[key]!=null ? String(cells[idx[key]]??"").trim() : "";
    const gn=makeGan();
    gn.ganName=g("ganName"); gn.internalSymbol=g("internalSymbol"); gn.ganSymbol=g("ganSymbol");
    gn.teacherName=g("teacherName");
    const a=g("age").replace(/\s/g,""); gn.age=GAN_AGES.includes(a)?a:a.replace(/[^\d/]/g,"");
    if(idx.education!=null) gn.education=normEduVal(g("education")); else if(activeEdu) gn.education=activeEdu;
    gn.campus=g("campus");
    gn.address=g("address"); gn.street=g("street"); gn.building=g("building"); gn.zone=g("zone");
    gn.phoneGan=g("phoneGan"); gn.phoneHome=g("phoneHome"); gn.teacherMobile=fixPhone(g("teacherMobile"));
    gn.assistantName=g("assistantName"); gn.assistantMobile=fixPhone(g("assistantMobile"));
    gn.capacity=g("capacity").replace(/[^\d]/g,""); gn.docsNote=g("docsNote");
    if(idx.active!=null){ const av=g("active").trim(); gn.active=!/^(לא|כבוי|לאפעיל|0|false|no|off|inactive)$/i.test(av); }
    if(!gn.ganName && !gn.teacherName && !gn.ganSymbol && !gn.internalSymbol) continue; // שורה ריקה
    const key=(gn.ganSymbol||"")+"|"+(gn.internalSymbol||"")+"|"+(gn.ganName||gn.teacherName||"");
    const fileDup = seen.has(key); seen.add(key);
    list.push({ gan:gn, dup:ganExists(gn), fileDup });
  }
  return { list, mapped };
}
function ganTemplateCSV(){
  const headers=["שם הגן","סמל פנימי","סמל הגן","שם הגננת","גיל","חינוך","כתובת","מספר","אזור","טלפון בגן","נייד גננת","שם סייעת","נייד סייעת","קיבולת","פעיל"];
  const example=["גן הדקל","1234","567890","מרים כהן","3","רגיל","הרב קוק","12","מרכז","02-1234567","050-1234567","שרה לוי","052-7654321","35","כן"];
  const csv=[headers.map(csvCell).join(","), example.map(csvCell).join(",")].join("\r\n");

/* הדפסה של טבלה כלשהי בחלון נפרד (ל-PDF) */
function printTable(title, headers, rows){
  const w=window.open("","_blank"); if(!w){ toast("החלון נחסם — אפשר/י חלונות קופצים"); return; }
  const style=`<style>body{font-family:Arial,"Assistant",sans-serif;direction:rtl;padding:18px;color:#12251a}
    h1{font-size:18px;margin:0 0 12px} table{border-collapse:collapse;width:100%;font-size:13px}
    th,td{border:1px solid #bcd;padding:6px 8px;text-align:right} th{background:#e6f3e9}</style>`;
  w.document.write(`<!doctype html><html dir="rtl" lang="he"><head><meta charset="utf-8"><title>${esc(title)}</title>${style}</head><body>
    <h1>${esc(title)}</h1>
    <table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c??"")}</td>`).join("")}</tr>`).join("")}</tbody></table></body></html>`);
  w.document.close(); setTimeout(()=>{ w.focus(); w.print(); }, 250);
}

/* ============================================================
   עוגות (donut) — כלי עזר לציור התפלגויות באחוזים ובצבעים
   ============================================================ */
const PIE_PALETTE = ['#4a9d5b','#e0a53a','#3f7cac','#c65d5d','#7b5ea7','#4bb1a6','#b0743e','#8a9b3e','#c977a6','#5a7a8c','#9c6f2c','#6a8f5b','#a15b12','#5b8def','#d08770','#69a297'];

/* SVG donut. items:[{label,value,color}] — center מוצג במרכז */
function donutSVG(items,{size=190,thickness=30,center=''}={}){
  const total=items.reduce((s,d)=>s+(+d.value||0),0);
  const r=(size-thickness)/2, cx=size/2, cy=size/2, C=2*Math.PI*r;
  let acc=0;
  const arcs = total<=0
    ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${thickness}"/>`
    : items.filter(d=>+d.value>0).map(d=>{
        const len=(+d.value/total)*C;
        const el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${thickness}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"><title>${esc(d.label)}: ${d.value} (${(d.value/total*100).toFixed(1)}%)</title></circle>`;
        acc+=len; return el;
      }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" style="max-width:100%;height:auto">
    ${arcs}
    <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="${(size*0.24).toFixed(0)}" font-weight="800" fill="var(--ink)">${esc(center===''?String(total):center)}</text>
    <text x="${cx}" y="${(cy+size*0.16).toFixed(0)}" text-anchor="middle" font-size="${(size*0.08).toFixed(0)}" fill="var(--muted)">סה"כ</text>
  </svg>`;
}
/* בלוק עוגה + מקרא (legend) עם אחוזים */
function pieBlock(rawItems,{size=190,thickness=30,center=''}={}){
  const items=rawItems.map((d,i)=>({...d,color:d.color||PIE_PALETTE[i%PIE_PALETTE.length]}));
  const total=items.reduce((s,d)=>s+(+d.value||0),0);
  const legend=items.map(d=>{
    const pct=total?(+d.value/total*100):0;
    return `<div class="pie-leg-row"><span class="pie-dot" style="background:${d.color}"></span><span class="pie-leg-label">${esc(d.label)}</span><span class="pie-leg-val">${d.value}<small>· ${pct.toFixed(1)}%</small></span></div>`;
  }).join("");
  return `<div class="pie-block"><div class="pie-svg">${donutSVG(items,{size,thickness,center})}</div><div class="pie-legend">${legend||'<div class="hint">אין נתונים להצגה.</div>'}</div></div>`;
}

/* מחשבון אחוזים חופשי — בחירת קמפוסים + גילי גנים + שנים, עם עוגות ותחזית (סעיף 2) */

  const campuses=[...new Set([...scopedGans.map(g=>(g.campus||'').trim()),...histCampuses].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'he'));
  const ages=[...new Set([...scopedGans.map(g=>(g.age||'').trim()),...histAges].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'he',{numeric:true}));

        </div><div class="hint">ריק = כל הקמפוסים.</div>`:'<div class="hint">לא הוגדרו קמפוסים בגנים. מלא/י "קמפוס גנים" בכרטיס הגן.</div>'}
      </fieldset>
      <fieldset><legend>גילי גנים</legend>

          ${ages.map(a=>`<label class="check"><input type="checkbox" class="fc-age" value="${esc(a)}" ${freeCalc.ganAges.includes(a)?'checked':''}> גיל ${esc(a)}</label>`).join("")}
        </div><div class="hint">ריק = כל הגילים.</div>`:'<div class="hint">לא הוגדרו גילי גנים.</div>'}
      </fieldset>
      <fieldset><legend>שנים להשוואה</legend>
        <div class="checks" style="grid-template-columns:repeat(auto-fill,minmax(90px,1fr))">
          ${DB.years.map(y=>`<label class="check"><input type="checkbox" class="fc-year" value="${esc(y)}" ${freeCalc.years.includes(y)?'checked':''}> ${esc(y)}</label>`).join("")}

function computeFreeCalc(out, scopedGans){
  const campusF=freeCalc.campuses, ageF=freeCalc.ganAges;
  const forecastN=+freeCalc.forecast>0?+freeCalc.forecast:0;
  const matchAge=a=>!ageF.length || ageF.includes((a||'').trim());
  const matchCampus=c=>!campusF.length || campusF.includes((c||'').trim());
  const sumk=(rows,k)=>rows.reduce((s,r)=>s+(+r[k]||0),0);
  // מיפוי שם גן → קמפוס, לזיהוי קמפוס בנתונים היסטוריים לפי שם הגן
  const norm=s=>String(s||'').replace(/["'.\-–־׳״]/g,'').replace(/\s+/g,'').trim().toLowerCase();
  const campusByName=new Map();
  eduScope(DB.gans).forEach(g=>{ const c=(g.campus||'').trim(); if(!c) return; [g.ganName,g.teacherName].forEach(nm=>{ if(nm&&!campusByName.has(norm(nm))) campusByName.set(norm(nm),c); }); });

  // נתונים לשנה — נתונים חיים אם קיימים, אחרת נתונים היסטוריים לפי גן
  function dataForYear(y){
    const liveStu=eduScope(studentsOfYear(y).filter(s=>!s.finished));
    if(liveStu.length){
      const gans=scopedGans.filter(g=>matchCampus(g.campus)&&matchAge(g.age));
      const ids=new Set(gans.map(g=>g.id));
      const stu=liveStu.filter(s=>ids.has(s.ganId));
      const perGan=gans.map(g=>({label:ganName(g.id),n:stu.filter(s=>s.ganId===g.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
      const byPeriod=PERIODS.map(p=>({p,n:stu.filter(s=>s.period===p).length}));
      return {year:y,source:'live',ganCount:gans.length,total:stu.length,perGan,byPeriod,hasData:gans.length>0};
    }
    const hg=(DB.historicalGans&&DB.historicalGans[y])||[];
    if(hg.length){
      const rows=hg.filter(r=>matchAge(r.age)&&matchCampus(r.campus||campusByName.get(norm(r.gan))||''));
      const perGan=rows.map(r=>({label:r.gan+(r.age?` · גיל ${esc(r.age)}`:''),n:histGanTotal(r)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
      const byPeriod=[{p:'א',n:sumk(rows,'a')},{p:'ב',n:sumk(rows,'b')},{p:'ג',n:sumk(rows,'c')},{p:'סופי',n:sumk(rows,'f')}];
      return {year:y,source:'hist',ganCount:rows.length,total:rows.reduce((s,r)=>s+histGanTotal(r),0),perGan,byPeriod,hasData:rows.length>0};
    }
    return {year:y,source:'none',ganCount:0,total:0,perGan:[],byPeriod:PERIODS.map(p=>({p,n:0})),hasData:false};
  }

  const chips=[
    campusF.length?`קמפוסים: ${campusF.map(esc).join(", ")}`:'כל הקמפוסים',
    ageF.length?`גילים: ${ageF.map(esc).join(", ")}`:'כל הגילים'
  ].join(' · ');

  const years=freeCalc.years.slice().sort((a,b)=>String(a).localeCompare(String(b),'he',{numeric:true}));
  const perYear=years.map(dataForYear);

  if(!perYear.some(y=>y.hasData)){
    out.innerHTML=`<div class="note">אין נתונים תואמים לבחירה בשנים שנבחרו — לא נמצאו גנים חיים ולא נתונים היסטוריים. שנה/י את הקמפוסים, הגילים או השנים.<br><span class="hint">נתונים היסטוריים לפי גן מזינים בלשונית "הגדרות".</span></div>`;
    return;
  }

  const yearCards=perYear.map(yd=>{
    const avgActual=yd.ganCount?yd.total/yd.ganCount:0;
    const avgForecast=forecastN?yd.total/forecastN:0;
    const badge=yd.source==='hist'?'<span class="pill neutral" style="font-size:.72rem">נתונים היסטוריים</span>':(yd.source==='live'?'<span class="pill ok" style="font-size:.72rem">נתונים חיים</span>':'');
    return `<div class="pie-card">
      <h4>שנת ${esc(yd.year)} ${badge}</h4>
      ${!yd.hasData?'<div class="empty" style="padding:20px">אין נתונים לשנה זו בבחירה הנוכחית.</div>':`
      <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin-bottom:12px">
        <div class="stat hero"><div class="k">סה"כ תלמידות</div><div class="v">${yd.total}</div></div>
        <div class="stat"><div class="k">ממוצע לגן</div><div class="v">${avgActual.toFixed(1)}<small>/ ${yd.ganCount} גנים</small></div></div>
        ${forecastN?`<div class="stat"><div class="k">תחזית: ממוצע ל-${forecastN} גנים</div><div class="v">${avgForecast.toFixed(1)}</div></div>`:''}
      </div>
      ${pieBlock(yd.perGan.map(x=>({label:x.label,value:x.n})),{size:170,thickness:26,center:String(yd.total)})}
      <div class="hint" style="margin-top:10px">מועדים: ${yd.byPeriod.map(p=>`${p.p}: <b>${p.n}</b>`).join(' · ')}</div>`}
    </div>`;
  }).join("");

  // השוואה בין שנים (אם יותר משנה אחת)
  let compare='';
  if(perYear.length>1){
    const comparePie=pieBlock(perYear.map(yd=>({label:`שנת ${yd.year}`,value:yd.total})),{size:180,thickness:28});
    let growth='';
    for(let i=1;i<perYear.length;i++){
      const a=perYear[i-1], b=perYear[i];
      const diff=b.total-a.total, pct=a.total?diff/a.total*100:0;
      growth+=`<div class="pie-leg-row"><span class="pie-leg-label">${esc(a.year)} ← ${esc(b.year)}</span><span class="pie-leg-val">${diff>=0?'+':''}${diff}<small>· ${pct>=0?'+':''}${pct.toFixed(1)}%</small></span></div>`;
    }
    compare=`<div class="pie-card" style="margin-bottom:16px">
      <h4>השוואה בין השנים · סה"כ תלמידות</h4>
      ${comparePie}
      <div class="pie-legend" style="margin-top:10px">${growth}</div>
    </div>`;
  }

  out.innerHTML=`
    <div class="note" style="background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent-strong);margin-bottom:14px">
      ${esc(chips)}${forecastN?` · תחזית ל-<b>${forecastN}</b> גנים`:''}
    </div>
    ${compare}
    <div class="pie-grid">${yearCards}</div>`;
}

/* ============================================================
   טאב עירייה — התאמה לפי ת"ז
   ============================================================ */
const MUNI_HEADER_MAP = {
  "תז":"tz","תעודתזהות":"tz","מספרזהות":"tz","זהות":"tz","מסזהות":"tz",
  "שםהאב":"fatherName","אב":"fatherName","אבא":"fatherName","שםאב":"fatherName","שםהאבא":"fatherName","שםאבא":"fatherName",
  "שםהאם":"motherName","אם":"motherName","אמא":"motherName","שםאם":"motherName","שםהאמא":"motherName","שםאמא":"motherName"
};
/* פענוח קלט העירייה: אם יש כותרת "ת"ז" — קוראים כטבלה (כולל שם אב/אם); אחרת — רשימת ת"ז חופשית */
function parseMuniInput(text){
  const rows=parseTable(text);
  const parents=new Map(); // tz -> {father,mother}
  let structured=false, tzList=[];
  if(rows.length){
    const header=rows[0].map(normHeader); const hi={};
    header.forEach((h,i)=>{ const k=MUNI_HEADER_MAP[h]; if(k && hi[k]==null) hi[k]=i; });
    if(hi.tz!=null){
      structured=true;
      for(let r=1;r<rows.length;r++){ const c=rows[r];
        const tz=digits(c[hi.tz]||""); if(!tz) continue; tzList.push(tz);
        const fa=hi.fatherName!=null?String(c[hi.fatherName]??"").trim():"";
        const mo=hi.motherName!=null?String(c[hi.motherName]??"").trim():"";
        if(fa||mo){ const cur=parents.get(tz)||{}; if(fa&&!cur.father)cur.father=fa; if(mo&&!cur.mother)cur.mother=mo; parents.set(tz,cur); }
      }
    }
  }
  if(!structured) tzList=(String(text||"").match(/\d{5,}/g)||[]);
  return { nums:[...new Set(tzList)], parents, structured };
}
function viewMunicipality(root){
  const stored = DB.municipality[DB.activeYear]||[];
  root.innerHTML=`
  <div class="panel">
    <h2>רשימת העירייה · שנת ${esc(DB.activeYear)}</h2>

    <div class="grid g2">
      <div>
        <label>הדבקת ת"ז (שורה לכל אחת) — או טבלה עם כותרות: ת"ז, שם אב, שם אם</label>
        <textarea id="muni-text" rows="8" placeholder="123456789&#10;987654321&#10;…&#10;— או —&#10;ת&quot;ז,שם אב,שם אם&#10;123456789,יעקב,רבקה">${stored.join("\n")}</textarea>
        <div class="row" style="margin-top:8px">
          <button class="btn" id="muni-run">🔗 בצע התאמה וסמן</button>
          <label class="btn ghost sm" style="display:inline-flex;align-items:center;gap:6px">📄 טעינת קובץ CSV<input type="file" id="muni-file" accept=".csv,.txt" hidden></label>
        </div>
      </div>
      <div id="muni-result"><div class="hint">התוצאה תופיע כאן לאחר ההתאמה.</div></div>
    </div>
  </div>`;
  $("#muni-file").onchange=e=>{ const f=e.target.files[0]; if(!f)return; readFileSmart(f, txt=>{ $("#muni-text").value=txt; toast('הקובץ נטען — לחצ/י "בצע התאמה"'); }); };
  $("#muni-run").onclick=()=>{
    const { nums, parents, structured } = parseMuniInput($("#muni-text").value);
    DB.municipality[DB.activeYear]=nums;
    const set=new Set(nums);
    let matched=0, already=0, filled=0;
    const rows=studentsOfYear();
    rows.forEach(s=>{ const tz=digits(s.tz); if(!tz || !set.has(tz)) return;
      if(!s.absorbedMunicipality)matched++; else already++; s.absorbedMunicipality=true;
      const pm=parents.get(tz);
      if(pm){ let did=false;
        if(pm.father && !String(s.fatherName||"").trim()){ s.fatherName=pm.father; did=true; }
        if(pm.mother && !String(s.motherName||"").trim()){ s.motherName=pm.mother; did=true; }
        if(did) filled++;
      }
    });
    save();
    const inSystem=new Set(rows.map(s=>digits(s.tz)).filter(Boolean));
    const notFound=nums.filter(n=>!inSystem.has(n));
    $("#muni-result").innerHTML=`
      <div class="stats">
        <div class="stat hero"><div class="k">סומנו כקלוטות עכשיו</div><div class="v">${matched}</div></div>
        <div class="stat"><div class="k">כבר היו מסומנות</div><div class="v">${already}</div></div>
        ${structured?`<div class="stat"><div class="k">הושלמו שמות הורים</div><div class="v">${filled}</div></div>`:''}
        <div class="stat"><div class="k">ברשימת העירייה</div><div class="v">${nums.length}</div></div>
        <div class="stat"><div class="k">בעירייה ולא במערכת</div><div class="v">${notFound.length}</div></div>

/* ============================================================
   טאב צוות — מאגר אנשי צוות הגנים (סעיף 16), עם מיון וסינון (סעיף 13)
   ============================================================ */
let staffFilter = { q:"", role:"", status:"active" }; // status: active / left / all
const staffIsActive = m => m.active!==false;              // רשומות ישנות ללא הדגל = פעילות
let staffSort = { key:"lastName", dir:1 };
function staffFiltered(){
  const q=staffFilter.q.trim().toLowerCase();
  const list=eduScope(DB.staff).filter(m=>{ // מכבד את בורר החינוך הראשי (רגיל/מיוחד)
    if(staffFilter.status==='active' && !staffIsActive(m)) return false;   // הסתרת מי שעזב/ה
    if(staffFilter.status==='left'   &&  staffIsActive(m)) return false;
    if(staffFilter.role && m.role!==staffFilter.role) return false;
    if(q){ const hay=(staffName(m)+" "+m.tz+" "+m.email+" "+m.role+" "+m.phone+" "+m.mobile+" "+m.city).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const k=staffSort.key, d=staffSort.dir;
  const roleIdx=m=>{ const i=STAFF_ROLES.indexOf(m.role); return i<0?99:i; };
  const keyVal=m=> k==='name'? staffName(m) : String(m[k]||"");
  return list.sort((a,b)=>{
    let r; if(k==='role') r=roleIdx(a)-roleIdx(b);
    else r=keyVal(a).localeCompare(keyVal(b),"he");
    return r*d || staffName(a).localeCompare(staffName(b),"he");
  });
}

function asgCtxMap(ctx=asgContext){ const y=asgYear(); return y[ctx] || (y[ctx]={}); } // ליצירה/כתיבה

function ctxLabel(id){ const c=ASSIGN_CONTEXTS.find(x=>x.id===id); return c?c.label:id; }
function asgRoleMeta(role){ return ASSIGN_ROLES.find(r=>r.role===role); }
function asgExtraLabel(role){ const ex=EXTRA_BY_ROLE[role]; return ex==="days"?"ימים":(ex==="duration"?"תקופה":""); }
function asgExtraText(role, cur){
  const ex=EXTRA_BY_ROLE[role]; if(!ex||!cur) return "";
  if(ex==="days") return (cur.days||[]).join(", ");
  if(ex==="duration"){
    if(cur.durType==="year") return "שנה";
    if(cur.durType==="dates") return (cur.durFrom||cur.durTo)?`${cur.durFrom?fmtDate(cur.durFrom):'—'} עד ${cur.durTo?fmtDate(cur.durTo):'—'}`:"טווח תאריכים";
    if(cur.durType==="months") return cur.durMonths?`${cur.durMonths} חודשים`:"מספר חודשים"; // תאימות לאחור
  }
  return "";
}
/* שמות הילדות המשויכות לעובד/ת בתפקיד סיוע (שילוב/רפואית/מנתחת/הכנה) — סעיפים 15, 21 */
function asgStudentsLabel(role, cur){
  if(!supportKeyForRole(role) || !cur || !Array.isArray(cur.students) || !cur.students.length) return "";
  return cur.students.map(id=>{ const s=DB.students.find(x=>x.id===id); return s?staffName({lastName:s.lastName,firstName:s.firstName}):""; }).filter(Boolean).join(", ");
}
/* אינדקס שיבוצי צוות לשנה+הקשר הנוכחיים לפי מזהה עובד/ת — לצורך מניעת שיבוץ כפול (סעיף 1).
   מדלג על הגן הנוכחי (exceptGanId) כדי לזהות רק שיבוצים בגנים אחרים. הכל לפי השנה הפעילה (סעיף 3). */
function staffAsgIndex(ctx=asgContext, exceptGanId=null){
  const idx={};
  const y=DB.assignments[DB.activeYear]; const c=y&&y[ctx]; if(!c) return idx;
  Object.keys(c).forEach(ganId=>{
    if(ganId===exceptGanId) return;
    const entry=c[ganId]||{};
    Object.keys(entry).forEach(role=>{
      const v=entry[role]; if(!v||!v.staffId) return;
      (idx[v.staffId]||(idx[v.staffId]=[])).push({ ganId, role, days:(v.days||[]) });
    });
  });
  return idx;
}
/* כל שיבוצי איש/אשת צוות בכל השנים/הקשרים — לתיק מלא (סעיף 22) */
function staffAssignmentsFull(staffId){
  const out=[]; const A=DB.assignments||{};
  Object.keys(A).forEach(year=>{ const yc=A[year]||{};
    Object.keys(yc).forEach(ctx=>{ const cg=yc[ctx]||{};
      Object.keys(cg).forEach(ganId=>{ const entry=cg[ganId]||{};
        Object.keys(entry).forEach(role=>{ const v=entry[role]; if(!v||v.staffId!==staffId) return;
          out.push({ year, ctx, ganId, role, days:v.days||[], durType:v.durType, durMonths:v.durMonths, durFrom:v.durFrom, durTo:v.durTo, students:v.students||[] });
        });
      });
    });
  });
  return out;
}
